上、慢性病人（心血管、呼吸道、糖尿病）、使用利尿劑、β 受體阻斷劑或抗精神病藥者、都市居民（熱島效應）、戶外勞工與軍人。</p><div class=\"stat\"><div><strong>106–167%</strong><span>65 歲以上熱相關死亡率較 1990 年代增加</span></div><div><strong>2,606</strong><span>2020 年台灣熱傷害急診人次</span></div><div><strong>2.9%</strong><span>夏季氣溫每升 1°C，心血管死亡增加</span></div><div><strong>1.37%</strong><span>同時醫療支出增加</span></div></div><p>2024 年台南市夏季超過 32°C 的時數高達 184 小時。</p>","p":"p641–642"},{"tag":"臨床做法","h":"勞力型熱中暑：先降溫，再轉送","b":"<p>鑑別方式：熱衰竭核心體溫低於 40°C、意識正常、大量出汗。勞力型熱中暑（EHS）超過 40°C、有意識障礙，好發於運動員與戶外勞工。典型型熱中暑（CHS）多見於老人，皮膚乾燥少汗，多器官衰竭風險高。</p><p>EHS 原則是「先降溫、後轉送」（Cool First, Transport Second），首選浸冰水法，<b>目標 30 分鐘內將核心體溫降到 39°C 以下</b>，可把死亡率從接近 20% 降到接近 0%。後送後監測 CK、腎功能、凝血功能，早期發現橫紋肌溶解症、急性腎損傷與 DIC。</p>","p":"p642"},{"tag":"臨床重點","h":"洪水與颱風的健康威脅分三個階段","b":"<ol><li><b>急性期</b>：溺水、創傷、骨折，基礎設施損壞使救援受阻</li><li><b>短期反應期</b>：飲用水污染引發水媒傳染病，停電使維生醫療設備失靈</li><li><b>長期恢復期</b>：潮濕引發黴菌感染、慢性呼吸道惡化、流離失所的心理創傷</li></ol><p>2024 年凱米與山陀兒颱風襲台，高雄茂林多納林道站單日雨量 1,343.5 mm，接近莫拉克颱風 2009 年的單日紀錄 1,402 mm。</p>","p":"p642"},{"tag":"台灣數字","h":"野火煙霧一年奪走 15.4 萬條人命","b":"<div class=\"stat\"><div><strong>15.4萬</strong><span>2024 年全球可歸因於野火 PM2.5 的急性死亡</span></div><div><strong>0.55%</strong><span>心血管死因風險增加</span></div><div><strong>0.64%</strong><span>呼吸道死因風險增加</span></div></div><p>過去 20 年野火風險顯著上升，124 個國家的暴露指標創新高。台灣大規模林火較少，但冬季大氣擴散條件惡化，未來秋冬 PM2.5 空氣品質不良日數可能增加 3 到 6 天。</p>","p":"p642–643"},{"tag":"台灣數字","h":"登革熱：往北走，季節變長，病毒複製變快","b":"<p>2024 年全球通報逾 1,460 萬例、死亡逾 1.2 萬例（WHO）。與 1950 年代相比，白線斑蚊與埃及斑蚊傳播登革熱的潛在效能分別提升 48.5% 與 11.6%。</p><ul><li><b>暖化北移</b>：埃及斑蚊向北擴散，2025 年初台北市與新北市本土病例顯著增加</li><li><b>流行季拉長</b>：2016 至 2025 年，台灣流行季從 4 個月延長到 7 個月</li><li><b>病毒複製加速</b>：溫度每升 1°C，外潛伏期（EIP）縮短</li></ul>","p":"p643"},{"tag":"臨床重點","h":"瘧疾與新興傳染病：暖化加上生態崩壞","b":"<p>台灣 1965 年宣布根除瘧疾，但暖化加上山區農業開發，瘧蚊適生區正逐年向高海拔移動。全球每年約 60 萬人死亡，許多已根除地區面臨捲土重來的風險。</p><p>茲卡病毒、屈公病、裂谷熱正向亞熱帶與溫帶擴張。人類破壞森林與濕地時，病原體會隨蝙蝠、囓齒類等宿主進入人類生活圈。全球 26.6% 的陸地面積面臨中等以上的流行病爆發風險，所以需要「健康一體」策略。</p>","p":"p643"},{"tag":"臨床重點","h":"颱風過後要提防類鼻疽，暖化也讓花粉變兇","b":"<p>洪水把污水、化肥與化學物質帶進水源，霍亂弧菌與沙門氏菌在溫暖停滯的水中繁殖更快。2024 年凱米颱風後，疾管署針對類鼻疽、鉤端螺旋體與腸病毒發布預警。類鼻疽在強降雨後，土壤致病菌被翻動而擴散，甚至可吸入受污染的空氣顆粒致病。</p><p>空氣方面，暖化增加地面臭氧（強氧化劑，誘發全身性發炎與損害肺功能）；氣溫升高讓植物生長季延長，CO₂ 升高讓花粉量增加且更易致敏，形成「花粉風暴」。</p>","p":"p644"},{"tag":"台灣數字","h":"作物減產加上營養稀釋，糧食安全兩面夾擊","b":"<div class=\"stat\"><div><strong>1.51億</strong><span>2022 年氣候變遷額外增加的糧食不安全人口</span></div><div><strong>20%</strong><span>溫度每升 2°C，美國玉米可能減產</span></div><div><strong>1.5億</strong><span>營養稀釋下面臨營養不良風險的人口</span></div></div><p>營養稀釋指 CO₂ 升高時植物生長加快，但蛋白質、鐵、鋅等濃度降低。全球約 30 億人依賴海鮮作為蛋白質來源，海洋熱浪、酸化與過度捕撈使漁場退縮。</p>","p":"p644"},{"tag":"臨床重點","h":"氣候難民與生態焦慮","b":"<p>預計到 2050 年，氣候變遷可能迫使多達 1.4 億人在國內遷移。敘利亞內戰就是一例：2006 至 2011 年的歷史性乾旱使百萬農民湧入城市。流離失所者面臨更高感染風險、暴力創傷與慢性病治療中斷。</p><p>2024 至 2025 年研究顯示，心理影響從急性創傷擴展到慢性焦慮。2024 年全球調查中，59% 的 Z 世代（16 至 25 歲）極度擔憂氣候變遷，75% 認為未來令人恐懼。環境悲傷（solastalgia）指因環境惡化產生的失落與孤立感。建議採「意義導向應對」，承認不安，從集體行動中找希望。</p>","p":"p645"},{"tag":"台灣數字","h":"醫療業自己就是碳排大戶","b":"<div class=\"stat\"><div><strong>4.4–4.6%</strong><span>全球醫療部門佔溫室氣體總量</span></div><div><strong>&gt;70%</strong><span>範疇三（供應鏈）佔醫院總排放</span></div></div><ul><li><b>範疇一</b>：醫療氣體、備用發電機、自營車隊，對策是減少麻醉氣體洩漏、車隊電動化</li><li><b>範疇二</b>：外購電力、蒸汽、冷氣，對策是再生能源與能效</li><li><b>範疇三</b>：藥品生產、器材運輸、醫療廢棄物，對策是綠色採購、循環經濟、減少過度檢查</li></ul>","p":"p645"},{"tag":"趨勢","h":"WHO 與台灣的綠色醫療行動","b":"<ul><li>WHO 把氣候變遷列為 2025 至 2028 年第十四個總體工作計畫（GPW 14）的六大策略目標之一</li><li>國民健康署把「氣候行動」納入健康促進醫院的標準八（Standard 8），要求定期做溫室氣體盤點（如 ISO14064-1）</li><li>衛福部輔導 26 家部立醫院與大型醫學中心規劃碳中和路徑，醫策會 2025 年起在國家醫療品質獎設淨零醫療類競賽</li><li>台北榮總以地下水與空調回收水建立生態緩衝帶（忘憂湖）</li></ul>","p":"p645–646"},{"tag":"臨床做法","h":"家醫診間的氣候實踐：問環境病史，提早介入","b":"<ul><li>整合環境病史，詢問居住條件（有無空調）、職業（戶外勞動時間）、居住區域污染</li><li>冠心病或 COPD 患者，在寒流或熱浪來襲前主動調整用藥並提醒避免戶外活動</li><li>意識障礙的患者優先測直腸溫度，以區分 EHS 與敗血性休克</li></ul><p>共同效益（Co-benefits）指同時促進健康與緩解氣候變遷的行為，例如植物性飲食，以及主動交通（能走路就不騎車，能騎車就不開車）。世界家庭醫師學會（WONCA）也倡議「為地球保留一分鐘」。</p>","p":"p646–647"},{"tag":"臨床做法","h":"永續處方：氣喘吸入器換成乾粉型，碳排減 98%","b":"<p>基層醫療碳足跡的主要來源是藥品（佔 22%）。氣喘用定量噴霧吸入劑（MDI）使用強效溫室氣體推進劑，影響很大。臨床評估後，優先考慮轉換成乾粉吸入劑（DPI），<b>每劑碳排放可減少達 98%</b>。同時指導病人正確回收剩餘藥物與醫療廢棄物。</p><p>全球氣候與健康教育聯盟（GCCHE）的氣候勝任力框架有五大領域：知識、系統思考、技術能力、溝通與領導、實踐。</p>","p":"p647"}],"recap":{"points":["地球已超越九個行星邊界中的六個，氣候變遷透過極端高溫、災害、病媒與傳染病、糧食與心理健康衝擊人類健康。","熱中暑要先降溫再轉送，登革熱等氣候敏感疾病的分布與流行季正在改變，醫師要能辨識。","醫療體系要同時減碳與調適，家庭醫師可透過環境病史、共同效益衛教與永續處方（如 MDI 改 DPI）實踐氣候勝任力。"],"quiz":[{"q":"勞力型熱中暑的急救首選與目標是什麼？","a":"浸冰水法，目標 30 分鐘內將核心體溫降到 39°C 以下，原則是先降溫、後轉送。"},{"q":"為什麼短期減緩策略特別重視控制甲烷？","a":"甲烷 GWP-20 約 81，短期增溫力強，控制甲烷排放槓桿效益極高。"}]}},"41":{"posts":[{"tag":"定義","h":"綠色家庭醫學：把生活型態醫學接進家庭醫師的日常","b":"<p>綠色家庭醫學（Green Family Medicine）以家庭醫學「全人、全家、全社區、全生命週期」照護為基礎，結合健康促進、疾病預防與生活型態醫學，由家庭醫師提供持續、整合、以病人為中心的照護。</p><p>精神是預防勝於治療，目標是讓照護從疾病治療逐步轉向健康促進與疾病預防。</p>","p":"p652"},{"tag":"核心觀念","h":"綠色處方：開的不是藥，是生活型態的改變","b":"<p>綠色處方（Green Prescription）是家庭醫師依病人的健康狀況、生活型態與需求，開立以改善生活型態為核心的處方，鼓勵病人透過行為改變促進健康。</p><p>它可用於疾病預防、慢性病管理與健康促進，不限特定疾病或族群，可依年齡、健康狀況和生活需求個別化調整，適用於健康促進、亞健康族群、慢性病患者與高齡照護。</p>","p":"p652–653"},{"tag":"必背","h":"綠色家庭醫學八大核心面向","b":"<ol><li>健康飲食</li><li>身體活動</li><li>健康睡眠</li><li>壓力管理</li><li>正向社會連結</li><li>避免危害性物質</li><li>智慧健康管理（AI）</li><li>綠色永續醫療（ESG）</li></ol><p>前六項聚焦個人生活型態，後二項導入 AI 智慧化管理與 ESG 永續醫療。</p>","p":"p653"},{"tag":"臨床做法","h":"前六大面向各自怎麼做","b":"<div class=\"tbl\"><table><tr><th>面向</th><th>重點</th></tr><tr><td>健康飲食</td><td>增加蔬果與天然食材，減少高糖、高油、高鹽與加工食品</td></tr><tr><td>身體活動</td><td>依體能安排有氧、肌力、柔軟度訓練</td></tr><tr><td>健康睡眠</td><td>規律作息、良好睡眠衛生，必要時衛教或轉介</td></tr><tr><td>壓力管理</td><td>放鬆技巧、正念、情緒調適、心理支持</td></tr><tr><td>社會連結</td><td>參與家庭、社區活動，降低孤獨感</td></tr><tr><td>避免危害物質</td><td>戒菸、檳榔、過量飲酒，降低有害環境暴露</td></tr></table></div>","p":"p653"},{"tag":"工具","h":"智慧健康管理：穿戴裝置加 AI，幫處方做追蹤","b":"<p>運用穿戴式裝置、健康 App、雲端平台與 AI，協助蒐集健康數據、追蹤綠色處方、做個人化分析。並逐步導入遠距健康照護、AI 決策輔助與視覺化管理，提升效率、便利性與持續追蹤能力，建構智慧化、個人化的數位健康照護模式。</p>","p":"p653"},{"tag":"趨勢","h":"ESG 進診間：環境、社會、治理各有任務","b":"<ul><li><b>環境（E）</b>：透過健康促進與疾病預防降低醫療利用與交通往返，減少醫療碳排，落實淨零永續</li><li><b>社會（S）</b>：結合社會處方（Social Prescribing）與社區資源，促進社會連結與健康共融</li><li><b>治理（G）</b>：建立標準化流程、品質管理與資訊安全機制</li></ul>","p":"p653–654"},{"tag":"必背","h":"開處方要符合 SMART 原則","b":"<p>開立前要整體評估病人的健康狀況、疾病風險、生活型態與需求，並與病人共同討論目標，擬出符合個人能力與生活情境的計畫，才能提高執行意願與成效。</p><ul><li><b>S</b> 具體（Specific）</li><li><b>M</b> 可衡量（Measurable）</li><li><b>A</b> 可達成（Achievable）</li><li><b>R</b> 具相關性（Relevant）</li><li><b>T</b> 具時限性（Time-bound）</li></ul>","p":"p654"},{"tag":"臨床做法","h":"綠色處方推動流程六步驟","b":"<ol><li>健康評估：飲食、活動、睡眠、心理壓力、社會支持、危害物質使用</li><li>共同目標設定</li><li>個人化處方開立</li><li>健康衛教</li><li>持續追蹤</li><li>成效評估</li></ol><p>必要時結合穿戴裝置、數位平台與 AI 分析記錄行為，並透過定期追蹤、回饋與調整處方，提高病人遵從性。</p>","p":"p654"},{"tag":"家醫角色","h":"跨專業團隊：誰負責什麼","b":"<ul><li><b>家庭醫師</b>：整體評估、醫療判斷、開立綠色處方</li><li><b>護理師或個案管理師</b>：健康追蹤、衛教、照護協調</li><li><b>營養師</b>：飲食評估與營養諮詢</li><li><b>運動專業人員</b>：運動處方與身體活動指導</li><li><b>心理師</b>：心理健康支持</li><li>並視需求連結社區資源</li></ul>","p":"p654"},{"tag":"趨勢","h":"面對高齡與慢病，綠色家醫往 AI 與永續走","b":"<p>面對高齡化社會與慢性疾病盛行，家庭醫學會持續扮演健康促進與疾病預防的角色，透過生活型態介入、跨專業合作與社區資源整合，提升民眾的健康識能與自我健康管理能力。</p><p>未來會結合 AI、穿戴式裝置與數位平台強化綠色處方的智慧化應用，並融入 ESG 精神，透過預防降低醫療碳排，兼顧健康效益、社會共融與環境永續。</p>","p":"p654–655"}],"recap":{"points":["綠色家庭醫學以家醫的全人照護為基礎，結合健康促進、疾病預防與生活型態醫學，核心工具是綠色處方。","八大面向包括飲食、活動、睡眠、壓力、社會連結、避免危害物質，加上智慧健康管理與綠色永續醫療（ESG）。","處方要符合 SMART 原則，依評估、共同設定目標、開立、衛教、追蹤、評估的流程，並靠跨專業團隊落實。"],"quiz":[{"q":"綠色家庭醫學的八大核心面向是哪些？","a":"健康飲食、身體活動、健康睡眠、壓力管理、正向社會連結、避免危害性物質、智慧健康管理、綠色永續醫療（ESG）。"},{"q":"SMART 原則的五個字母各代表什麼？","a":"具體、可衡量、可達成、具相關性、具時限性。"}]}}};

const $=s=>document.querySelector(s);
let day=1, favOnly=false, favs={};
try{favs=JSON.parse(localStorage.getItem("favs")||"{}")}catch(e){}
try{const d=+localStorage.getItem("day"); if(DAYS[d]) day=d}catch(e){}
function save(){try{localStorage.setItem("favs",JSON.stringify(favs));localStorage.setItem("day",day)}catch(e){}}
const ready=Object.keys(DAYS).length;

function chips(){
  let h=`<button class="chip fav" aria-pressed="${favOnly}" data-fav="1">★ 收藏</button>`;
  CHAPTERS.forEach((t,i)=>{const d=i+1, ok=!!DAYS[d];
    h+=`<button class="chip" aria-pressed="${!favOnly&&d===day}" ${ok?"":"disabled"} data-d="${d}" title="${t}">Day ${d}</button>`});
  $("#chips").innerHTML=h;
}
function card(p,d,i){const id=d+"-"+i;
  return `<article data-i="${i}"><div class="top"><span class="tag">${p.tag}</span><span class="num">Day ${d} · ${i+1}</span></div><h2>${p.h}</h2>${p.b}<div class="foot"><span class="src">〔${p.p}〕</span><button class="star" aria-label="收藏這則" aria-pressed="${!!favs[id]}" data-id="${id}">★</button></div></article>`}
function render(){
  chips();
  let h="";
  if(favOnly){
    const list=Object.keys(favs).filter(k=>favs[k]).map(k=>{const[d,i]=k.split("-").map(Number);return DAYS[d]&&DAYS[d].posts[i]?card(DAYS[d].posts[i],d,i):""}).join("");
    h=list||`<p class="empty">還沒有收藏。看到想複習的貼文，點右下角的星號。</p>`;
    $("#meta").textContent="收藏";
  }else{
    const D=DAYS[day];
    h=`<p class="intro"><b>Day ${day}｜第 ${day} 章 ${CHAPTERS[day-1]}</b><br>今天 ${D.posts.length} 則，約 ${Math.round(D.posts.length*0.7)} 分鐘。〔p〕是原書 PDF 頁碼。</p>`;
    h+=D.posts.map((p,i)=>card(p,day,i)).join("");
    const r=D.recap;
    h+=`<article class="recap"><div class="top"><span class="tag">今日回顧</span><span class="num">Day ${day}</span></div><h2>今天讀完了，記住這三點</h2><ol>${r.points.map(x=>`<li>${x}</li>`).join("")}</ol>${r.quiz.map((q,k)=>`<div class="q"><b>小測驗 ${k+1}：</b>${q.q}<br><button data-ans="${k}">看答案</button><div class="ans" id="ans${k}" hidden>${q.a}</div></div>`).join("")}</article>`;
  }
  $("#feed").innerHTML=h; scrollTo(0,0); prog();
}
function prog(){
  const cards=[...document.querySelectorAll("#feed article")], n=cards.length;
  let seen=0; cards.forEach(c=>{if(c.getBoundingClientRect().top<innerHeight*0.6) seen++});
  if(favOnly){$("#bar").style.width="0";return}
  $("#bar").style.width=(n?seen/n*100:0)+"%";
  $("#meta").textContent=`${Math.min(seen,n)}/${n} · 全書 ${Math.round((day-1+seen/Math.max(n,1))/CHAPTERS.length*100)}%`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.d){day=+t.dataset.d;favOnly=false;save();render()}
  else if(t.dataset.fav){favOnly=!favOnly;render()}
  else if(t.dataset.id){const id=t.dataset.id;favs[id]=!favs[id];t.setAttribute("aria-pressed",!!favs[id]);save()}
  else if(t.dataset.ans){const a=$("#ans"+t.dataset.ans);a.hidden=!a.hidden;t.textContent=a.hidden?"看答案":"收起"}
});
addEventListener("scroll",prog,{passive:true});
render();
</script>
</body>
</html>
