以上，或嬰幼兒血漿視網醇低於 0.7 µmol/L 的盛行率達 20% 以上），要依年齡常規補充。慢性肝腎病、發炎性腸病、腸胃道術後者則要個別評估。</p><p>目前沒有證據顯示補充能預防心血管疾病，過量補充甚至可能增加心血管死亡率、癌症和骨骼健康的風險。</p>","p":"p425–426"},{"tag":"必背","h":"維生素 B 缺乏症速記：腳氣病、核黃素缺乏症、糙皮病","b":"<div class=\"tbl\"><table><tr><th>維生素</th><th>疾病</th><th>重點表現</th></tr><tr><td>B1 硫胺素</td><td>腳氣病（beriberi）</td><td>乾型是周邊神經病變；濕型影響心臟，出現心跳過速、心衰竭、水腫</td></tr><tr><td>B1 硫胺素</td><td>韋尼克-科爾薩科夫症候群</td><td>眼肌麻痺、眼震、共濟失調；慢性期有記憶受損、虛談</td></tr><tr><td>B2 核黃素</td><td>核黃素缺乏症</td><td>唇乾裂、口角炎、舌炎、脂漏性皮膚炎</td></tr><tr><td>B3 菸鹼酸</td><td>糙皮病（pellagra）</td><td>3D：皮膚炎、腹瀉、失智</td></tr></table></div><p>B1 缺乏常見於只吃白米飯、酗酒未進食、長期靜脈營養的人。</p>","p":"p429"},{"tag":"檢測","h":"葉酸或 B12 缺乏？用 MMA 和同半胱胺酸分辨","b":"<p>血清葉酸正常大於 4 ng/mL，缺乏小於 2 ng/mL。B12 正常大於 300 pg/mL。數值落在邊緣時，加驗 MMA 與 homocysteine。</p><ul><li>兩者都正常：沒有 B12 或葉酸缺乏</li><li>兩者都升高：B12 缺乏，但不能排除葉酸缺乏</li><li>MMA 正常、homocysteine 升高：葉酸缺乏，沒有 B12 缺乏</li></ul>","p":"p430"},{"tag":"臨床做法","h":"B12 缺乏：吃素、胃切除、吃 metformin 的人要想到","b":"<ul><li><b>攝取不足</b>：嚴格素食者</li><li><b>吸收不足</b>：酗酒、胃萎縮、胃酸不足、切胃手術、克隆氏症</li><li><b>藥物與物質</b>：metformin、組織胺受體拮抗劑、笑氣（N2O）</li><li><b>免疫疾病</b>：甲狀腺疾病、白斑症</li></ul><p>可出現舌炎、大球性貧血、惡性貧血。即使沒有貧血，輕微缺乏也有失智與認知低下風險。神經與精神症狀比葉酸缺乏更常見，以下肢對稱性麻木最典型。B12 不足也是高同半胱胺酸血症的重要原因，在年長者尤其明顯。</p>","p":"p430"},{"tag":"考點","h":"補維生素 B 預防疾病：只有葉酸預防神經管缺損證據強","b":"<ul><li><b>葉酸</b>：Cochrane 回顧顯示孕婦補充可降低新生兒神經管缺損；對流產、唇顎裂、先天性心臟病無顯著效果。對癌症發生率、認知退化、高血壓也無明確益處。USPSTF（2023）建議可懷孕者每日 400–800 µg。</li><li><b>B6</b>：孕期補充無法預防子癇症或子癇前症。</li><li><b>B6、葉酸、B12</b>：雖能降低同半胱胺酸，但 Cochrane 回顧發現對心肌梗塞與死亡率和安慰劑無差別。</li><li><b>B12</b>：沒有證據可延緩失智，補充 B12 或葉酸也無法降低骨折機率。</li></ul>","p":"p432, p447"},{"tag":"必背","h":"維生素 C：壞血病的治療與過量的坑","b":"<p>人類缺乏合成基因，只能從飲食或補充品取得。缺乏造成壞血病（scurvy），常見於酒藥癮者、營養不良、不吃蔬果的人。典型表現有毛囊角質增生、毛囊周圍出血、毛髮捲曲、瘀血、牙齦腫大、傷口難癒。</p><p>治療是補充維生素 C。成人每天 300–1,000 mg，可補 1 個月或到症狀改善。多數症狀 24 小時內改善，瘀青與牙齦出血要數週。</p><div class=\"stat\"><div><strong>100 mg</strong><span>成人 RDA</span></div><div><strong>2,000 mg</strong><span>成人 UL</span></div></div><p>過量會代謝成草酸，形成草酸鈣結石，尿路結石或洗腎病人要小心。它的強還原力也可能讓化學法糞便潛血出現偽陰性。</p>","p":"p432–433"},{"tag":"迷思","h":"維生素 C 防感冒？Cochrane 說發生率不會降","b":"<ul><li><b>感冒</b>：一般人每天補充不會降低發生率，但可能縮短病程。</li><li><b>肺癌</b>：健康成人補充沒有降低發生率與死亡率，女性反而風險增加。</li><li><b>心血管疾病</b>：8 篇 RCT、15,445 人，無法降低風險。其中一篇就佔 14,641 人，族群以美國中老年男性為主。</li><li><b>肝臟疾病</b>：抗氧化劑無法治療或減緩病程，還可能使 γ-GT 上升。</li></ul>","p":"p433–434"},{"tag":"核心觀念","h":"維生素 D 要走兩次羥化才有活性","b":"<p>皮膚經 UVB 照射，把 7-脫氫膽固醇轉成 D3，日照充足時可提供 80–90% 的需求。食物來源有魚肝油、高油脂魚（D3）和蕈菇、酵母（D2）。</p><p>路徑：D2 或 D3 → 肝臟 25-羥化酶 → <b>25(OH)D</b>（calcidiol）→ 腎臟 1α-羥化酶 → <b>1,25(OH)2D</b>（calcitriol，活性型）。</p><p>檢測要看 25(OH)D。它半衰期 2–3 週，能穩定反映存量；活性型半衰期只有 4–6 小時，還受副甲狀腺素影響。國際建議用 LC/MS 測定。</p>","p":"p434–435"},{"tag":"必背","h":"25(OH)D 幾 ng/mL 算缺乏？成人和兒童切點不同","b":"<div class=\"tbl\"><table><tr><th>對象</th><th>缺乏</th><th>不足</th><th>足夠或過量</th></tr><tr><td>成人（IOM 2011）</td><td>&lt;20 ng/mL</td><td>20–30 ng/mL</td><td>150 ng/mL 以上為過量</td></tr><tr><td>18 歲以下（2016 全球共識）</td><td>&lt;12 ng/mL</td><td>12–20 ng/mL</td><td>≥20 ng/mL 足夠</td></tr></table></div><p>1 ng/mL 約等於 2.5 nmol/L。美國內分泌醫學會、國家骨質疏鬆基金會等建議年長者維持 30 ng/mL 以上，以減少跌倒與骨折。</p>","p":"p436"},{"tag":"台灣數字","h":"在亞熱帶的台灣，七八成國人維生素 D 不足","b":"<div class=\"stat\"><div><strong>70–80%</strong><span>國人缺乏或不足（NAHSIT 2017–2020）</span></div><div><strong>41.4%</strong><span>美國成人不足（2001–2010）</span></div><div><strong>86%</strong><span>骨鬆或骨折停經婦女的不足盛行率（2014 年台灣研究）</span></div></div><p>4 歲以上各族群攝取量都偏低，只達 AI 的約 38–57%。高風險族群包括機構住民、臥床者、老人、停經後婦女。</p>","p":"p436–437"},{"tag":"研究","h":"鈣加維生素 D 七年，骨折風險降 12%","b":"<p>美國婦女健康關懷研究（WHI）把 36,282 名 50–69 歲停經後婦女隨機分組，實驗組每天補鈣 1,000 mg 加維生素 D 400 IU。</p><div class=\"stat\"><div><strong>+1.06%</strong><span>七年後骨質密度較高</span></div><div><strong>HR 0.88</strong><span>骨折風險下降 12%</span></div></div><p>2025 年台灣骨質疏鬆共識指出，每日補充 800 IU 以上可減少跌倒和骨折。NOF 與 IOF 建議 50 歲以下每日 400–800 IU，50 歲以上 800–1,000 IU，目標血清 25(OH)D 達 30 ng/mL 以上。</p>","p":"p437"},{"tag":"臨床做法","h":"維生素 D 要不要篩檢？一般人不用，高風險族群可以","b":"<p>USPSTF（2021）認為無症狀、非孕婦的成年人常規篩檢證據不足（I）。ACOG 對孕婦的結論相同。但多數專家認為，曝曬不足、攝取不夠、吸收不佳、老人、停經後婦女、已有骨鬆或骨折者，可併入例行健檢。</p><p>補充以 D3 為主，轉換率比 D2 高。每補 100 IU，25(OH)D 約升 0.7–1.0 ng/mL，建議 3 個月後複測。</p><div class=\"tbl\"><table><tr><th>25(OH)D</th><th>UpToDate 成人建議</th></tr><tr><td>&lt;10 ng/mL</td><td>每週 50,000 IU 共 6–8 週，之後每天 800 IU</td></tr><tr><td>10–20 ng/mL</td><td>每天 800–1,000 IU</td></tr><tr><td>20–30 ng/mL</td><td>每天 600–800 IU</td></tr></table></div><p>成人 UL 為每日 4,000 IU，過量會造成高血鈣。</p>","p":"p438–439"},{"tag":"迷思","h":"維生素 E 抗氧化聽起來很好，證據卻不支持","b":"<ul><li>癌症、冠心病、肝病、失智症補充，Cochrane 回顧都沒有明顯效果。</li><li>心血管方面可能降低缺血性中風，但增加出血性中風。</li><li>會抑制血小板凝集，吃抗凝血藥的人要避開高劑量。</li><li>統合分析顯示每日 400 IU 以上可能增加死亡率。</li></ul><p>維生素 E 廣泛存在食物中，缺乏少見，多見於早產兒、低體重新生兒或脂肪吸收異常者，表現為共濟失調與溶血性貧血。USPSTF 對維生素 E 預防心血管疾病或癌症評為 D 級。</p>","p":"p441–442, p447"},{"tag":"臨床做法","h":"輔酶 Q10：心衰竭可輔助，高血壓與 statin 肌病沒效","b":"<ul><li><b>心衰竭</b>：有試驗顯示補充組心血管死亡率 9% vs 16%，但 Cochrane 回顧沒有明確結論，只算輔助。</li><li><b>高血壓、心血管疾病預防</b>：Cochrane 回顧無顯著效果。</li><li><b>粒線體疾病</b>：建議劑量嬰兒與兒童 5 mg/kg/天，成人與青少年 400 mg/天，但證據仍不足。</li><li><b>statin 肌肉病變</b>：2015 年統合分析顯示治療與預防都無益。</li></ul><p>它有促凝血活性，可能干擾 warfarin。TFDA 建議每日不超過 30 mg，15 歲以下、孕哺期與服用 warfarin 者不宜。</p>","p":"p443–444"},{"tag":"臨床做法","h":"綜合維生素：不必常規檢測，也不必禁止病人吃","b":"<p>不建議常規驗維生素濃度，因為缺乏最適濃度的資料，補充預防疾病的證據也不足。但懷疑缺乏時仍要驗，例如老年骨鬆驗維生素 D，不明原因認知下降驗 B12。</p><p>補充較有道理的族群：老年人、素食者、酗酒者、吸收不良、少日曬、胃繞道術後、洗腎、全腸道營養。沒有適應症時不建議用來預防慢性病，但只要不超過每日建議量，通常沒什麼害處。</p><p>注意脂溶性維生素較易中毒；維生素 C 超過 RDA 的 10–25 倍就可能增加腎結石風險；有骨質缺乏風險者不宜額外補含維生素 A 的綜合維生素。</p>","p":"p445–446"},{"tag":"核心觀念","h":"結語：食物優先，補充要有理由，和病人一起決定","b":"<p>多數維生素不必額外補充，應以原型食物優先。補充不保險，過量的害處可能多於好處。少數情境有明確證據，例如葉酸與維生素 D。</p><p>面對民眾的各種迷思，醫療人員要用醫病共享決策（SDM）：先聽他為什麼想補，再判斷是否符合需要。</p>","p":"p448"}],"recap":{"points":["維生素 A 要分動物性與植物性來源，過量與致畸胎風險是重點；資源豐富國家不需補充來預防疾病。","葉酸預防神經管缺損、維生素 D 針對高風險族群預防骨折，是少數證據較強的補充；維生素 C、E、B 群預防慢性病多無明確益處。","多數人靠均衡飲食即可，不建議常規檢測，補充要看缺乏風險，並用 SDM 與病人溝通。"],"quiz":[{"q":"葉酸與 B12 邊緣值時，MMA 正常、homocysteine 升高代表什麼？","a":"葉酸缺乏，沒有 B12 缺乏。"},{"q":"成人 25(OH)D 低於多少為缺乏？一般健康成人需要常規篩檢嗎？","a":"低於 20 ng/mL（50 nmol/L）為缺乏。USPSTF 認為無症狀成人常規篩檢證據不足，高風險族群可併入健檢。"}]}},"28":{"posts":[{"tag":"定義","h":"「保健食品」是大傘，健康食品只是其中一把","b":"<div class=\"tbl\"><table><tr><th>類別</th><th>內容</th><th>例子</th></tr><tr><td>機能性食品</td><td>傳統食用型態，有特殊生理機能</td><td>運動飲料、燕麥片、益生菌優酪乳</td></tr><tr><td>膳食補充食品</td><td>膠囊、錠狀、粉末、液體等非傳統型態</td><td>綜合維生素、牛樟芝膠囊、乳酸菌膠囊</td></tr><tr><td>特殊營養食品</td><td>為特殊生理狀況設計的配方食品</td><td>嬰幼兒配方、病人用輔助食品</td></tr><tr><td>健康食品</td><td>衛福部認證，法律名詞</td><td>有小綠人標章者</td></tr></table></div><p>通過認證的健康食品只佔整體保健食品市場一小部分。</p>","p":"p452–453"},{"tag":"必背","h":"法律上的「健康食品」，要有實質科學證據，但不能談治療","b":"<p>法律定義：具有保健功效，並標示或廣告其具該功效，且須有實質科學證據，不以治療、矯正人類疾病為目的。</p><p>坊間的「營養保健食品」「機能性食品」成分可能相同，但沒有經過科學實證，只能當一般食品販售，廣告不得不實、誇張或宣稱醫療效能。若涉及保健功效宣稱，可依違反健康食品管理法論處。</p><p>核准的健康食品包裝必須有「健康食品」字樣、小綠人標章、許可證字號和保健功效敘述，仍不得宣稱醫療效能或超出許可範圍。</p>","p":"p453–454"},{"tag":"台灣數字","h":"健康食品管理法：1999 年立法，目的是管住亂宣稱","b":"<div class=\"stat\"><div><strong>1999</strong><span>2 月 3 日公布，同年 8 月 3 日施行</span></div><div><strong>7 章 31 條</strong><span>2020 年修正</span></div><div><strong>5 年</strong><span>許可證效期</span></div></div><p>立法背景是當時有食品任意誇大宣稱、缺乏科學證據，民眾誤信甚至傷害健康。未規定的事項，適用食品衛生管理法。</p>","p":"p453–454, p456"},{"tag":"必背","h":"保健功效只能這四種說法","b":"<ol><li>補充人體缺乏的營養素，可預防或改善與該營養素相關的疾病</li><li>敘述特定營養素、成分或該食品對生理結構或機能的影響</li><li>提出科學證據支持其維持或影響生理結構或機能的說法</li><li>敘述攝取後的一般性好處</li></ol><p>所稱保健功效，是增進健康、減少疾病風險，且有實質科學證據，並經中央主管機關公告者。標示必須用中文，包括品名、內容物、有效日期、核准功效、許可證字號、攝取量與警語等。</p>","p":"p454–456"},{"tag":"必背","h":"查驗登記雙軌制：看字號就知道走哪一軌","b":"<div class=\"tbl\"><table><tr><th></th><th>第一軌 個案審查</th><th>第二軌 規格標準</th></tr><tr><td>做法</td><td>做動物或人體試驗，由審議小組審查安全與功效</td><td>成分符合公告規格標準，免做功效與安全試驗，免送審議委員會</td></tr><tr><td>字號</td><td>衛部健食字第 A00000 號（1 字母加 5 碼）</td><td>衛部健食規字第 000000 號（多一個「規」字，6 碼）</td></tr><tr><td>功效範圍</td><td>依個別產品的科學驗證結果</td><td>同規格標準的產品功效相同</td></tr></table></div><p>2020 年修正後，審查新增「檢驗與審查同步」，初審時就啟動檢驗方法審查，節省時間。每件申請案每次只受理一項保健功效或規格標準。</p>","p":"p456–457"},{"tag":"考點","h":"規格標準要通過四個要件，目前只有魚油和紅麴","b":"<p>衛福部開放規格標準審查的四要件：</p><ol><li>傳統長久供飲食，經驗安全無疑慮</li><li>功效機轉明確</li><li>有效成分明確</li><li>已建立有效成分的分析方法</li></ol><p>目前已公告的規格標準只有魚油和紅麴兩項。第一軌的審議委員由醫學、藥學、營養、食品、生化、毒理等領域專家組成。</p>","p":"p457"},{"tag":"法規","h":"違規罰則：最重三年有期徒刑","b":"<ul><li>違反規定最重可處 3 年以下有期徒刑，得併科新台幣 100 萬元以下罰金，並得按日連續處罰、廢止許可證。</li><li>標示或廣告涉及醫療效能，罰鍰 40 萬至 200 萬元。</li><li>許可證有效期 5 年，到期要在 3 個月內申請展延，每次不得超過 5 年。</li><li>若科學研究對功效有疑義、成分配方或生產方式受質疑，主管機關可重新評估已許可的產品。</li></ul>","p":"p456"},{"tag":"趨勢","h":"各國怎麼管？美、日、歐、澳、加五種模式","b":"<div class=\"tbl\"><table><tr><th>國家</th><th>制度重點</th></tr><tr><td>美國</td><td>1994 年 DSHEA，FDA 主管。可宣稱保健用途與結構功能，不得宣稱療效</td></tr><tr><td>日本</td><td>特定保健用食品（FOSHU）與營養機能食品（FNFC）兩類</td></tr><tr><td>歐盟</td><td>食品補充劑，EFSA 主管。健康宣稱須事先核准，有許可清單</td></tr><tr><td>澳洲</td><td>納入互補醫藥品，TGA 主管。高風險須註冊，低風險採備案列載</td></tr><tr><td>加拿大</td><td>天然保健品（NHPs），上市前須核准，核發 8 碼 NPN</td></tr></table></div>","p":"p457–459"},{"tag":"必背","h":"台灣公告的 14 項保健功效","b":"<p>自 1999 年至今公告的項目有：骨質保健、調節血脂、不易形成體脂肪、護肝保健、免疫調節、延緩衰老、胃腸功能改善、調節血糖、抗疲勞、輔助調節血壓、輔助調整過敏體質、牙齒保健、促進鐵吸收、膝關節保健。</p>","p":"p459"},{"tag":"台灣數字","h":"保健食品產值：微生物來源最大，約佔四分之一強","b":"<div class=\"stat\"><div><strong>27%</strong><span>微生物來源</span></div><div><strong>23%</strong><span>其他類（進口原料）</span></div><div><strong>18%</strong><span>植物來源</span></div><div><strong>16%</strong><span>動物來源</span></div></div><p>另有穀類來源 13%、保健用烹調用油 3%（2023 年國內產業調查）。微生物類以乳酸菌發酵飲品為最大宗，訴求以腸胃道保健、抗過敏、調節免疫最受青睞，也是通過功效驗證件數最多的三項。</p>","p":"p459–460"},{"tag":"研究","h":"紅麴降血脂的機轉，和 statin 類藥物同源","b":"<p>紅麴的功效成分是 monacolin 化合物。其中 monacolin K 能抑制 HMG-CoA reductase，這是膽固醇合成的速率限制酵素，因此膽固醇合成受抑制。這個結構後來被製藥業發展成 statin 類處方藥。</p><p>大型統合分析發現，服用紅麴膠囊者比安慰劑組顯著降低總膽固醇、LDL 膽固醇與三酸甘油酯。紅麴健康食品規格標準於 2007 年公布，使用的紅麴菌為 Monascus purpureus。</p>","p":"p461–462"},{"tag":"迷思","h":"牛樟芝的安全性風波：2013 年之後要補資料、加警語","b":"<p>靈芝和牛樟芝的功效成分來自三萜類、多醣體和腺苷。2013 年媒體揭露牛樟段木子實體的食用安全疑慮後，主管機關要求業者提供：</p><ul><li>原料的加工或製造過程與規格</li><li>90 天餵食毒性試驗報告</li><li>標示使用部位是子實體或菌絲體及培養方式</li><li>中文警語：嬰幼兒、孕婦、哺餵母乳者如需食用，請洽詢醫師或醫療專業人員</li></ul>","p":"p461"},{"tag":"必背","h":"魚油健康食品規格標準三條件","b":"<ol><li>Omega-3（EPA 加 DHA）純度 30–50%</li><li>每日攝取量所含 Omega-3 至少 1.0 g，不得超過 2.0 g</li><li>必須是三酸甘油酯型（TG），不得用乙基酯型（EE），因為 TG 型吸收率較高</li></ol><p>TG 型是天然魚油的分子結構，EE 型是加工過程的中間產物。魚油含 EPA、DHA，有助降血脂、抑制血栓形成。</p>","p":"p463"},{"tag":"台灣數字","h":"國人膳食纖維吃不到一半","b":"<div class=\"stat\"><div><strong>20–38 g</strong><span>19 歲以上每日建議量（第 8 版 DRIs）</span></div><div><strong>13.5–18.8 g</strong><span>19 歲以上實際攝取（2013–2016）</span></div></div><p>可溶性纖維在大腸被菌分解成短鏈脂肪酸（乙酸、丙酸、丁酸），促進有益菌生長，並影響肝臟合成膽固醇。纖維也會結合膽酸、膽鹽，增加排出。適量纖維還能延緩飯後血糖上升。</p>","p":"p463–464"},{"tag":"趨勢","h":"維生素改列食品，特殊營養食品仍要查驗登記","b":"<p>自 2012 年 1 月 1 日起，維生素依劑量分為藥品與食品。衛福部訂出 11 項需查驗登記的維生素成分含量標準，等於或低於標準者可改列為食品，因此像善存這類產品多改以食品販售。</p><p>特殊營養食品針對嬰幼兒或病人（糖尿病、肥胖、腎病、肺阻塞等），須經食藥署查驗登記取得核備函字號。截至 2017 年 4 月底共 180 個品項，以進口為主。</p>","p":"p464–465"},{"tag":"趨勢","h":"保健食品產值破千億，健康食品不良反應通報系統在規劃中","b":"<div class=\"stat\"><div><strong>1014 億</strong><span>2023 年整體保健食品產值（新台幣）</span></div><div><strong>25 年</strong><span>健康食品管理制度實施年數</span></div></div><p>市售主力功效前五名依序是腸胃道保健、調節血脂、免疫調節、護眼、營養補充。業者看好的未來方向為減重減脂、護眼、腸胃道保健、延緩衰老、安定神經與改善睡眠。</p><p>即使是許可證產品，個人體質不同，仍可能有非預期反應。衛福部規劃仿照藥物不良反應通報，建置民眾食用健康食品後的通報系統。</p>","p":"p465"}],"recap":{"points":["保健食品涵蓋機能性食品、膳食補充食品、特殊營養食品和健康食品，只有取得許可證的才是法律上的「健康食品」。","查驗採雙軌制，第一軌個案審查，第二軌規格標準（目前僅魚油、紅麴），可由字號分辨；標示與廣告不得宣稱醫療效能。","國內產值以微生物來源最大，整體破千億元；許可證產品仍可能有非預期反應，需要通報機制。"],"quiz":[{"q":"「衛部健食規字第 000000 號」代表走哪一軌？","a":"第二軌規格標準審查，產品成分符合公告規格標準，免做功效與安全試驗。"},{"q":"魚油健康食品的 Omega-3 必須是哪一種型式？為什麼？","a":"三酸甘油酯型（TG），不得用乙基酯型（EE），因為 TG 型吸收率較高。"}]}},"29":{"posts":[{"tag":"台灣數字","h":"十大死因有五個跟吃有關","b":"<div class=\"stat\"><div><strong>第 2</strong><span>心臟病</span></div><div><strong>第 4</strong><span>腦血管疾病</span></div><div><strong>第 5</strong><span>糖尿病</span></div><div><strong>第 7、9</strong><span>高血壓性疾病、腎炎與腎病</span></div></div><p>以上是 2024 年衛福部公布的十大死因排名，都與飲食息息相關。痛風與高尿酸血症也和這些生活型態有關。本章談糖尿病、腎臟病、高血脂、高尿酸四種常見慢性病的飲食。</p>","p":"p470"},{"tag":"核心觀念","h":"糖尿病營養治療：多講「可以吃什麼」，少講「不能吃什麼」","b":"<ul><li>目標是促進健康飲食型態，維持健康體重，達到個別化的血糖、血壓、血脂，並延緩併發症。</li><li>要考量病人的宗教、文化、食物喜好、讀寫與算術能力、學習意願。</li><li>多給正面訊息，例如把加奶精的奶茶改成鮮奶奶茶。</li><li>教具要依病人每日飲食習慣設計，不要只談三大營養素或單一食物。</li></ul>","p":"p471"},{"tag":"必背","h":"糖尿病三大營養素：沒有絕對理想值，要個別化","b":"<div class=\"tbl\"><table><tr><th>項目</th><th>建議</th></tr><tr><td>熱量</td><td>理想體重 × 25–35 大卡</td></tr><tr><td>醣類</td><td>沒有一個有力證據支持特定量；平均分配三餐，來源以全穀類、水果、奶類為主</td></tr><tr><td>油脂</td><td>約佔總熱量 20–35%，多用單元不飽和脂肪；飽和脂肪低於總熱量 10%，限制反式脂肪</td></tr><tr><td>蛋白質</td><td>1–1.5 g/kg 理想體重，約佔 15–20%</td></tr></table></div><p>醣類的量與胰島素劑量，是影響飯後血糖最重要的因素。</p>","p":"p471–472"},{"tag":"迷思","h":"糖尿病人需要吃魚油補 EPA、DHA 嗎？不用","b":"<p>沒有證據顯示 Omega-3 油脂能治療或預防心血管疾病，不須建議病人吃魚油。每週吃 2 兩（份）深海魚，就能供應足夠的 EPA 與 DHA。</p><p>食物來源有鯊魚、旗魚、鮪魚、秋刀魚、鮭魚、鯖魚、牡蠣，植物油則有芥花油。</p><p>第 2 型糖尿病人採地中海飲食（富含單元不飽和脂肪酸），有利血糖控制與心血管風險因子改善。得舒飲食（DASH）與植物性飲食也有利於治療。</p>","p":"p472"},{"tag":"考點","h":"糖尿病合併腎病變，蛋白質怎麼抓？","b":"<p>沒有臨床證據建議糖尿病腎病變病人要限制蛋白質，但也不是任意吃。若已有蛋白尿或腎功能惡化，採 RDA 的 0.8 g/kg/天。例如 60 公斤的病人，一天 48 克，蛋白質食物最多約 4 份。</p><p>其他重點：</p><ul><li>纖維每日 14 g/1,000 大卡，或女性 25 g、男性 38 g</li><li>鈉小於 2,300 mg/天（約 6 克鹽）；低鈉約 1,500 mg 可能有利血壓，但要顧及可口性與營養</li><li>以植物性蛋白取代部分動物性，可減少飽和脂肪攝取</li></ul>","p":"p472, p474"},{"tag":"考點","h":"ADA 2026 的醫療營養建議，幾個必記重點","b":"<div class=\"tbl\"><table><tr><th>項目</th><th>建議</th></tr><tr><td>營養師</td><td>轉介有執照營養師做個人化營養治療（A），可改善心血管代謝預後（A）</td></tr><tr><td>體重</td><td>過重或肥胖者目標減重至少 5–7%</td></tr><tr><td>補充劑</td><td>不建議補維生素、礦物質、草藥作為血糖控制（C）；不建議補 β-胡蘿蔔素（B）</td></tr><tr><td>酒精</td><td>不要超過建議量，不飲酒者不要開始喝（B）</td></tr><tr><td>水分</td><td>多喝水，以白開水或低熱量飲料取代含糖飲料</td></tr><tr><td>SGLT2 抑制劑</td><td>衛教酮酸中毒風險與症狀，勸阻生酮飲食（E）</td></tr><tr><td>地中海飲食</td><td>降低心血管風險（A）、改善血糖代謝（B）</td></tr></table></div>","p":"p473–474"},{"tag":"臨床做法","h":"吃 Metformin 的病人，記得驗 B12","b":"<p>飲食均衡且熱量足夠時，不需要額外補充維生素與礦物質。若要補，不可大於每日建議量，最好先檢驗確認缺乏。</p><p>服用 Metformin 的病人容易缺乏維生素 B12，尤其有貧血與周邊神經病變時，建議檢測血液 B12 是否足夠。</p>","p":"p474"},{"tag":"臨床做法","h":"糖尿病飲食原則：定時定量，別因為怕血糖高就不吃飯","b":"<ul><li>規律吃三餐與點心，米飯與穀類是基本能量來源，不要因血糖高而少吃。</li><li>理想體重 = 22 × 身高（公尺）²，BMI 標準 18.5–24。</li><li>減重每天減少約 500–750 大卡。</li><li>減鹽每日 3–6 克，每餐至少一碗蔬菜，以高纖穀類取代白米與糕點。</li><li>糖類總量不超過總熱量 10%，避免含蔗糖或糖漿的飲料；新鮮水果可適量。</li><li>飲酒男性每日最多 2 個酒精當量，女性 1 個（1 當量為 15 g 酒精）。孕婦、神經病變、肝硬化、高三酸甘油酯血症病人禁忌。</li><li>糖尿病兒童與成人每日 60 分鐘中強度以上有氧運動；老人每週 2–3 次柔軟與平衡運動。糖尿病合併 CKD 者規律快走（每天 30 分鐘或每週 150 分鐘），可降低 26% 的全因與心血管死亡率。</li></ul>","p":"p475"},{"tag":"必背","h":"CKD 依 GFR 分五期，營養重點隨期別改變","b":"<div class=\"tbl\"><table><tr><th>期別</th><th>GFR（mL/min）</th><th>程度</th></tr><tr><td>G1</td><td>≥90</td><td>腎臟受損，腎功能正常</td></tr><tr><td>G2</td><td>60–89</td><td>輕度異常</td></tr><tr><td>G3a</td><td>45–59</td><td>中度異常</td></tr><tr><td>G3b</td><td>30–44</td><td>中度異常</td></tr><tr><td>G4</td><td>15–29</td><td>重度異常</td></tr><tr><td>G5</td><td>&lt;15</td><td>腎臟衰竭</td></tr></table></div><p>分期依據 2024 年 KDOQI 指引。蛋白尿也會影響分期。G5 有尿毒症狀時進行腎臟替代療法。</p>","p":"p476"},{"tag":"必背","h":"CKD 的熱量與蛋白質：吃太少也會死亡率上升","b":"<ul><li><b>熱量</b>：透析前與一般人相當，每天 25–35 大卡/kg 理想體重。攝取不足會造成組織分解與蛋白質熱量消耗（PEW），增加死亡率。</li><li><b>蛋白質</b>：第 1、2 期與健康人相同（0.8–1.0 g/kg），第 3–5 期為 0.6–0.8 g/kg。極低蛋白飲食為 0.3 g/kg，可搭配酮酸療法（Ketosteril）。</li><li><b>來源</b>：以黃豆蛋白取代部分動物性蛋白，可降低蛋白尿、減少酸中毒、改善血脂、降低血磷與鉀。</li><li><b>補足熱量</b>：低蛋白飲食時，每日至少 400 大卡的低蛋白澱粉（冬粉、米粉、粉圓等）或商業產品當點心；油脂佔 25–35%，飽和脂肪低於 7%。</li></ul><p>藥廠建議每 5 公斤體重一顆吉多利錠，健保給付 eGFR 小於 15 mL/min 者每日最多 6 顆。高蛋白飲食傷腎的三個路徑是增加超過濾、增加鹽分造成高血壓、尿道酸化與高尿鈣造成結石。</p>","p":"p476–478"},{"tag":"考點","h":"CKD 的磷：無機磷吸收率高達 100%","b":"<div class=\"stat\"><div><strong>40–60%</strong><span>動物性有機磷吸收率</span></div><div><strong>10–30%</strong><span>植物性有機磷吸收率</span></div><div><strong>100%</strong><span>無機磷（食品添加物）吸收率</span></div></div><p>正常飲食磷約 1,200 mg，腸道排出約 300 mg，腎臟排出約 800 mg。腎功能下降時磷累積，造成副甲狀腺亢進、腎性骨病變與血管鈣化。</p><p>血磷應維持 2.5–4.5 mg/dL，高於 4.6 mg/dL 時限制飲食磷 5–10 mg/kg/天。無機磷常見於魚肉罐頭、泡麵、可樂。飲食與補充的鈣總量宜小於 2,000 mg。</p>","p":"p478–479"},{"tag":"臨床做法","h":"CKD 的鈉與鉀：不同期別，目標不同","b":"<p><b>鈉</b>：第 3、4 期病人把鹽限制在 3.5–4.7 g，可降收縮壓約 10 mmHg、舒張壓約 4 mmHg，並降低尿蛋白。高血壓是 CKD 惡化的第二大原因。</p><p><b>鉀</b>：80–90% 由腎臟排出，血鉀正常 3.5–5.0 mEq/L，成人最小需要量 2,000 mg/天。</p><ul><li>第 1、2 期併高血壓：每日 4 g 以上</li><li>第 3、4 期併高血壓：2–4 g</li><li>常高血鉀者：小於 2 g</li></ul><p>每 100 克水果含鉀超過 150 mg 算高鉀水果，例如香蕉、木瓜、火龍果、榴槤。也要避免魚湯、火鍋湯等高湯。</p>","p":"p478–479"},{"tag":"工具","h":"看食品標示：用一包餅乾示範鈉熱比與油脂","b":"<ul><li>400 mg 鈉 = 1 g 鹽。</li><li>鈉/熱量比值：心血管疾病、高血壓、糖尿病、腎臟病病人要小於 0.5 才算低鹽，健康人小於 1.0 為佳。</li><li>總脂肪熱量佔總熱量超過 30% 是高油脂食品。</li></ul><p>範例餅乾每份 160 大卡、鈉 470 mg，換算約 1.175 克鹽，鈉/熱量為 2.94，屬高鹽。膽固醇雖為 0，但飽和脂肪高，也不宜心血管疾病者選用。纖維每份只有 1 克，是低纖維食品。吃 4 份就有 640 大卡，約 2.3 碗飯。</p>","p":"p480, p484"},{"tag":"必背","h":"高血脂分類切點","b":"<div class=\"tbl\"><table><tr><th>項目（mg/dL）</th><th>分級</th></tr><tr><td>總膽固醇</td><td>&lt;200 理想；200–239 邊緣偏高；≥240 高</td></tr><tr><td>LDL-C</td><td>&lt;100 最適；100–129 接近最適；130–159 邊緣偏高；160–189 高；≥190 非常高</td></tr><tr><td>HDL-C</td><td>&lt;40 過低；≥60 高</td></tr><tr><td>三酸甘油酯</td><td>&lt;150 正常；150–199 邊緣偏高；200–499 高；≥500 非常高</td></tr></table></div>","p":"p481"},{"tag":"台灣數字","h":"LDL-C 每降 38.7 mg/dL，重大心血管事件少 22%","b":"<div class=\"stat\"><div><strong>22%</strong><span>重大心血管事件減少</span></div><div><strong>10%</strong><span>全因死亡減少</span></div></div><p>這是長達 5 年血脂治療的統合分析結果，每降 38.7 mg/dL 的 LDL-C 即有此效益，所以 LDL-C 是第一治療目標。台灣 2013–2016 年調查中，19 歲以上高膽固醇血症盛行率為男 13.0%、女 13.6%；高三酸甘油酯血症為男 17.9%、女 10.9%；HDL-C 過低為男 25.7%、女 27.8%。</p><p>一般高血脂病人 LDL-C 目標小於 100 mg/dL，已有心血管疾病者小於 70 mg/dL，三酸甘油酯小於 150 mg/dL。</p>","p":"p481–482"},{"tag":"必背","h":"高血脂營養治療：這些數字要記","b":"<ul><li>飽和脂肪每減少 1%，心血管疾病風險減少 2–3%。</li><li>每週吃 2–4 次深海魚的人，中風機率比吃不到 1 次的人少 6%，但補充魚油無法改善心血管預後。</li><li>每日纖維至少 20 g、植物固醇 2 g。每多吃 7 g 纖維，心血管疾病風險降 9%；多 10 g 纖維，中風降 16%。</li><li>每週至少 150 分鐘中強度運動，最好天天運動。</li><li>減重可降三酸甘油酯並提高 HDL-C；減少單糖可降低三酸甘油酯與脂肪肝。</li></ul>","p":"p482–483"},{"tag":"必背","h":"地中海飲食 vs 得舒飲食","b":"<div class=\"tbl\"><table><tr><th></th><th>地中海飲食</th><th>得舒飲食（DASH）</th></tr><tr><td>特性</td><td>高纖、高鈣、抗氧化</td><td>高鈣、高鉀、高鎂、高纖，低油、低飽和脂肪、低鹽</td></tr><tr><td>油脂</td><td>佔 40–50%；飽和 &lt;8%；單元不飽和 15–25%</td><td>佔 27%</td></tr><tr><td>其他</td><td>Omega-6:Omega-3 為 2:1–1:1</td><td>醣類 55%、蛋白質 18%、膽固醇 150 mg、纖維 31 g、鉀 4,700 mg、鎂 500 mg、鈣 1,240 mg</td></tr><tr><td>研究結果</td><td>5 年降低 29% 心血管疾病</td><td>減少 10% 心血管疾病、8% 相關死因</td></tr></table></div>","p":"p483"},{"tag":"臨床做法","h":"紅麴、黑巧克力、黃豆，鼓勵吃天然食物，不鼓勵吃膠囊","b":"<ul><li><b>魚油</b>：可降高三酸甘油酯血症，對高膽固醇無改善。</li><li><b>黑巧克力</b>：含黃酮類，可抑制膽固醇吸收。</li><li><b>紅麴米</b>：發酵產生 monacolin K，抑制膽固醇合成，降 LDL-C。</li><li><b>黃豆</b>：含異黃酮，可引起動脈擴張並降低膽固醇。</li></ul><p>以上指的是天然食品，不是魚油膠囊、紅麴膠囊、異黃酮膠囊等保健食品。其他原則：鹽每日不超過 5 克（最理想 3 克）；酒精男性每日小於 14 g、女性小於 7 g 且與食物一起；糖類依 WHO 小於總熱量 10%；絕對戒菸。</p>","p":"p483–484"},{"tag":"台灣數字","h":"台灣男性高尿酸盛行率 18.5%，女性 9.2%","b":"<div class=\"stat\"><div><strong>6.4</strong><span>男性平均血尿酸（mg/dL）</span></div><div><strong>4.9</strong><span>女性平均血尿酸（mg/dL）</span></div><div><strong>18.5%</strong><span>男性高尿酸盛行率</span></div><div><strong>9.2%</strong><span>女性高尿酸盛行率</span></div></div><p>2013–2016 年 NAHSIT 資料，研究定義為男 &gt;7.7、女 &gt;6.6 mg/dL 或服用降尿酸藥。生化定義則是成人空腹血尿酸大於 7.0 mg/dL。高尿酸是痛風最主要的危險因子，也是全因與心血管死亡的獨立危險因子。</p>","p":"p484–485"},{"tag":"臨床做法","h":"痛風飲食：牛奶有保護，啤酒和含糖飲料最糟","b":"<ul><li>目標血尿酸小於 6.0 mg/dL，合併痛風石初期可設小於 5.0 mg/dL。</li><li>每日喝超過兩杯牛奶（約 500 cc）可降低 50% 痛風發生率。</li><li>追蹤 47,150 名男性 12 年的研究發現，肉類與海鮮吃得多者較易痛風；蔬菜、黃豆、豆類、蕈菇與風險增加無關。</li><li>要減少內臟、紅肉、魚類海鮮（海參、海蜇皮除外）。</li><li>啤酒與烈酒影響最大；黑咖啡與無糖茶不限制。</li><li>含果糖飲料會代謝成尿酸，要避免。高湯與火鍋湯的嘌呤都溶在湯裡，也要避免。</li><li>腰圍維持男 ≤90 公分、女 ≤80 公分，並保持足夠水分。</li></ul>","p":"p485–486"}],"recap":{"points":["糖尿病營養要個別化，三大營養素沒有絕對理想值；定時定量、控制體重、選全穀與植物性蛋白，並不建議用魚油或維生素補充。","CKD 要依期別調整蛋白質（第 3–5 期 0.6–0.8 g/kg），同時顧足熱量，並控制磷、鈉、鉀；無機磷吸收率高達 100%。","高血脂以降 LDL-C 為首要目標，採地中海或得舒飲食；高尿酸飲食要避免啤酒、含果糖飲料與高嘌呤食物，並鼓勵乳製品。"],"quiz":[{"q":"CKD 第 3 至 5 期的蛋白質建議量是多少？","a":"每天每公斤理想體重 0.6–0.8 克；極低蛋白飲食為 0.3 克，可搭配酮酸療法。"},{"q":"鈉與熱量比值要小於多少才算低鹽食品？","a":"心血管疾病、高血壓、糖尿病、腎臟病病人要小於 0.5，健康人小於 1.0 為佳。"}]}},"30":{"posts":[{"tag":"台灣數字","h":"2024 年台灣出生 13.5 萬人，死亡 20.2 萬人","b":"<div class=\"stat\"><div><strong>134,856</strong><span>2024 年新生兒數</span></div><div><strong>202,107</strong><span>2024 年死亡人數</span></div><div><strong>0.87</strong><span>2023 年總生育率</span></div><div><strong>3.8‰</strong><span>2024 年嬰兒死亡率</span></div></div><p>台灣人口自 2020 年起負成長。生育率只比韓國（0.72）高，低於日本 1.15、美國 1.62、法國 1.66。嬰兒死亡率也高於日本（1.9‰）、韓國（2.8‰）。主要死因包括早產、先天性畸形與染色體異常，所以優生保健很重要。</p>","p":"p490"},{"tag":"定義","h":"優生保健：從婚前一路顧到新生兒","b":"<p>利用遺傳學與優生學原理和醫學技術，提供婚前、孕前、產前、產後各階段的衛生保健與指導，早期發現疾病或遺傳缺陷，給予防範與治療，孕育健康的下一代。</p><p>方法包括婚前健檢、家庭計畫、產前健檢、產後複檢、新生兒篩檢、育兒諮詢。</p><p>台灣 1985 年 1 月施行《優生保健法》。因「優生」二字可能被曲解為歧視身心障礙者，擬修改為《生育保健法》。</p>","p":"p490–491"},{"tag":"核心觀念","h":"婚前健檢的目的，是了解健康和準備生育，不是審查婚姻資格","b":"<p>目的是讓雙方了解彼此健康狀況、避免疾病傳播、提高生育力、篩檢可能遺傳的不良因子，並為孕育下一代做準備。它是優生保健中最積極的第一步。</p><p>現在國人普遍晚婚，婚前健檢往往也是孕前體檢，理想上要及早規劃。內容必須同時包含「檢查」與「諮詢」兩部分。目前不屬公費補助，各院所項目可能不同。</p>","p":"p490–491"},{"tag":"必背","h":"核心項目：從問診開始，家族史要畫到三代","b":"<ul><li><b>基本資料</b>：看種族好發疾病。亞洲人常見海洋性貧血、肝炎；非洲裔常見鐮刀型貧血、高血壓；白人常見囊狀纖維化（CF）。</li><li><b>健康史</b>：藥物與食物過敏、長期用藥、菸酒檳榔。</li><li><b>職業史</b>：特殊危險暴露，必要時照會職業病科。</li><li><b>疫苗史</b>：德國麻疹、水痘、HPV。</li><li><b>家族史</b>：3 代以上族譜圖，注意一歲內死亡、習慣性流產、智能不足、抽搐、生長發育異常。</li><li><b>月經與懷孕史</b>：未懷孕才能接種疫苗與做 X 光。</li></ul>","p":"p491–492"},{"tag":"必背","h":"核心項目的檢查：血液、生化、尿液、精神、X 光","b":"<div class=\"tbl\"><table><tr><th>類別</th><th>內容</th></tr><tr><td>血液</td><td>CBC、ABO 與 Rh 血型、VDRL/RPR、Anti-HIV、HBsAg、Anti-HBs、Anti-HCV</td></tr><tr><td>女性加驗</td><td>Rubella IgG、varicella IgG，陰性者建議打 MMR、水痘疫苗</td></tr><tr><td>生化</td><td>AC sugar、GOT、GPT、BUN、Cr</td></tr><tr><td>尿液</td><td>尿液常規</td></tr><tr><td>精神心理</td><td>GAD-7、BSRS-5，也要關心心理社會壓力與經濟狀況</td></tr><tr><td>胸部 X 光</td><td>篩檢肺結核、肺腫瘤、心臟大血管異常，須先排除懷孕</td></tr><tr><td>其他</td><td>女性可查 LH/FSH、total testosterone、prolactin；男性做精液分析</td></tr></table></div>","p":"p492"},{"tag":"臨床做法","h":"選擇項目：有特定風險或症狀才做","b":"<ul><li><b>骨盆腔超音波</b>：不孕症評估、子宮畸形（如縱隔子宮）、子宮內膜異位症。</li><li><b>腹部超音波</b>：有肝炎病史或肝癌家族史者。</li><li><b>心電圖</b>：有症狀或理學檢查發現心律不整。</li><li><b>AMH</b>：評估卵巢儲備功能，適合大齡或有多囊性卵巢者。</li><li><b>披衣菌</b>：無症狀比例高、傳染性高、有不孕風險，高風險者用尿液或子宮抹片做核酸檢測（NAATs），不建議抽血測 IgM、IgG。</li><li><b>淋病</b>：多重性伴侶者做核酸檢測。</li><li><b>血脂</b>：肥胖或家族高血脂者。</li><li><b>輸卵管攝影（HSG）</b>：不孕症評估時才考慮。</li><li><b>基因與染色體</b>：有家族遺傳病史，或想了解隱性致病基因帶因情況，如 SMA、海洋性貧血、X 染色體脆折症。</li></ul>","p":"p492–493"},{"tag":"迷思","h":"腫瘤標記和高輻射檢查，不建議放進婚前健檢","b":"<p>腫瘤標記（SCC、CEA、CA125、PSA、AFP 等）缺乏特異性，偽陽性與偽陰性都高。數值高不等於罹癌，正常也無法排除早期癌症，主要用於治療後追蹤、預後評估與高風險群，最好搭配影像檢查。</p><p>腦部或胸部電腦斷層、正子攝影等高輻射檢查也不建議常規做。乳房攝影一般建議 40 歲以後再篩檢。</p><p>無症狀者也不建議測特定激素或極罕見的遺傳因子，如威爾森氏症。</p>","p":"p493"},{"tag":"必背","h":"孕前的三個保護：葉酸、低劑量阿斯匹靈、Anti-D","b":"<ul><li><b>葉酸</b>：依 USPSTF，計畫懷孕者從懷孕前 1 個月起每日補充 0.4–0.8 mg，吃到懷孕第 2 至 3 個月，預防神經管缺陷。</li><li><b>阿斯匹靈</b>：有子癲前症病史、糖尿病、自體免疫疾病、高血壓、慢性腎病、多胞胎者，從第 12 週後每日低劑量（81 mg）預防子癲前症。</li><li><b>Anti-D</b>：Rh 陰性女性在懷孕中任何子宮內侵入性檢查，或有胎兒出血、流產時，應於 72 小時內注射 Anti-D 免疫球蛋白，避免產生 Rh 抗體。</li></ul><p>其他保健諮詢還包括體重（BMI &lt;18.5 要營養衛教）、血壓、血糖、貧血，以及協調雙方生育計畫與避孕。</p>","p":"p493–494"},{"tag":"臨床做法","h":"B、C 肝陽性怎麼辦？寶寶的處理有順序","b":"<ul><li><b>B 肝帶原者</b>：做 HBV DNA，必要時抗病毒藥物。母親 HBsAg 陽性，寶寶出生 24 小時內盡快打免疫球蛋白。第 3 劑疫苗後、滿 12 個月時驗 HBsAg 與 anti-HBs，若都陰性可免費追加。打過免疫球蛋白與第一劑疫苗後即可哺餵母乳。</li><li><b>Anti-HCV 陽性</b>：做 HCV RNA 與腹部超音波，必要時轉肝膽科。母子垂直傳染機率低於 6%，合併 HIV 則風險增加一倍，母乳哺育對嬰兒沒有影響。</li><li><b>HIV 陽性或 VDRL 陽性且 TPHA 確認梅毒</b>：轉門診追蹤診治。</li></ul>","p":"p494"},{"tag":"必背","h":"遺傳模式與子女風險","b":"<div class=\"tbl\"><table><tr><th>類型</th><th>例子</th><th>風險</th></tr><tr><td>隱性</td><td>海洋性貧血、CF、半乳糖血症、PKU、黏多醣症、SMA</td><td>雙親皆帶原：1/4 罹病、1/4 正常、1/2 帶原</td></tr><tr><td>顯性</td><td>亨丁頓舞蹈症、軟骨發育不全、家族性高膽固醇血症、ADPKD</td><td>一方罹病：1/2 正常、1/2 罹病</td></tr><tr><td>性聯隱性</td><td>色盲、血友病、蠶豆症（G-6-PD）、ALD</td><td>母親帶原：兒子一半得病，女兒一半成帶原者</td></tr></table></div><p>若兄弟為裘馨氏肌肉萎縮症（DMD）病患，母親帶原機率只有 75%，因為有些是突變造成。</p>","p":"p494"},{"tag":"考點","h":"多因子遺傳、染色體與其他疾病的家族風險","b":"<ul><li><b>多因子</b>：兔唇、顎裂、脊柱裂、心室中隔缺損、高血壓、糖尿病、思覺失調症等。同家庭患者越多，再發風險越高。MODY 例外，屬顯性遺傳。</li><li><b>染色體</b>：唐氏症，產婦年齡越大發生率越高。</li><li><b>智能障礙</b>：重度（智商低於 50）通常有特定病因，父母一般智力正常。家人多人智能在正常底限，下一代出現輕度智障機率較高。</li><li><b>巴金森氏症</b>：多數非遺傳，但一等親罹病機會約為一般人的 3 倍，約 3–7%。</li><li><b>多發性硬化症</b>：雙親之一罹病，女兒 4%、兒子 2%。</li></ul>","p":"p494–495"},{"tag":"臨床做法","h":"婚前、孕前疫苗：打完要避孕 4 週","b":"<ul><li><b>德國麻疹</b>：Rubella IgG 陰性者打 MMR。孕婦在 20 週前感染，可能生下先天性心臟病、聽障、白內障、智力障礙的胎兒。注射後 4 週內避免懷孕。</li><li><b>水痘</b>：varicella IgG 陰性者打 2 劑，間隔 4 至 8 週，打完 4 週內避孕。對 neomycin 或 gelatin 過敏者不建議。孕期感染致先天性水痘症候群約 2%。</li><li><b>流感</b>：任何孕期都可接種。</li><li><b>Tdap</b>：10 年內未補打者建議接種。</li><li><b>B 肝</b>：表面抗原與抗體皆陰性者建議接種。</li><li><b>HPV</b>：可考慮接種，預防子宮頸癌、口咽癌、肛癌。</li></ul>","p":"p495"}],"recap":{"points":["優生保健涵蓋婚前、孕前、產前、產後與新生兒階段，婚前健檢用來了解健康、準備生育，不是審查結婚資格。","婚前健檢分核心、選擇、不建議常規三類，腫瘤標記與高輻射檢查不建議放入；諮詢要涵蓋葉酸、Rh、B/C 肝與疫苗。","隱性遺傳雙親皆帶原時子女 1/4 罹病，顯性遺傳一方罹病時 1/2 罹病，性聯隱性由帶原母親傳給兒子。"],"quiz":[{"q":"計畫懷孕者的葉酸建議劑量與開始時間？","a":"從懷孕前 1 個月起每日 0.4–0.8 mg，持續到懷孕第 2 至 3 個月，預防神經管缺陷。"},{"q":"Rh 陰性女性在懷孕中何時需要打 Anti-D 免疫球蛋白？","a":"做子宮內侵入性檢查，或有胎兒出血、流產時，應於 72 小時內注射。"}]}},"31":{"posts":[{"tag":"核心觀念","h":"成人預防照護的四個工具：篩檢、諮詢、疫苗、化學預防","b":"<p>目標是疾病預防與健康促進。美國 HHS 每 10 年依實證訂新目標，Healthy People 2030 共有 355 項可測量核心目標，其中 23 項主要健康指標與預防照護有關，例如酒精狂飲、吸菸、添加糖攝取、身體活動、大腸直腸癌篩檢、流感疫苗、HIV 篩檢。</p><p>從預防醫學觀點，多數死因可透過控制可修正的危險因子與臨床預防服務降低風險。</p>","p":"p498"},{"tag":"趨勢","h":"台灣新政策：預防保健下修到 30 歲，2026 起加胃癌篩檢","b":"<ul><li>2025 年起成人預防保健起始年齡下修至 30 歲，新增尿酸，納入慢性病風險評估與生活習慣諮詢。</li><li>「三高防治 888 計畫」：80% 找得出、80% 要介入、80% 有改善。即 80% 三高個案納入照護網，其中 80% 獲得生活習慣諮詢，80% 穩控三高。</li><li>目標是 2030 年三高相關慢性病標準化死亡率降低三分之一。</li><li>癌症防治除既有「五癌篩檢」外，納入特定年齡女性 HPV 檢測，2026 年起新增胃癌防治篩檢。</li></ul>","p":"p499"},{"tag":"必背","h":"USPSTF A、B 級的成人癌症篩檢只有四項","b":"<p>四項是乳癌（女性）、子宮頸癌、大腸直腸癌、肺癌。癌症自 1982 年起即高居台灣十大死因第一位。</p><p>其他建議篩檢的還有：</p><ul><li><b>心血管相關</b>：肥胖、高血壓、糖尿病、血脂異常、主動脈瘤</li><li><b>感染性疾病</b>：披衣菌、淋病、B 肝、C 肝、HIV、梅毒、肺結核</li><li><b>其他</b>：心理健康與物質濫用</li></ul><p>癌症篩檢除了參考 USPSTF、AAFP、加拿大 CTFPHC，也要依本國流行病學資料。</p>","p":"p499"},{"tag":"考點","h":"乳癌：USPSTF 2024 建議 40–74 歲每 2 年一次乳房攝影","b":"<ul><li><b>USPSTF 2024</b>：40–74 歲每 2 年一次（Grade B）。75 歲以上證據不足。緻密乳房加做超音波或 MRI 的利弊，證據同樣不足（Grade I）。</li><li><b>CTFPHC</b>：40–74 歲每 2–3 年一次。</li><li><b>台灣</b>：2025 年起補助 40–74 歲女性每 2 年一次乳房 X 光攝影。</li></ul><p>BRCA 相關癌症的風險評估、遺傳諮詢與基因檢測有獨立建議。</p>","p":"p499"},{"tag":"考點","h":"子宮頸癌：USPSTF 三種策略，台灣新增 HPV 檢測","b":"<div class=\"tbl\"><table><tr><th>年齡</th><th>USPSTF 建議</th></tr><tr><td>21–29 歲</td><td>每 3 年子宮頸抹片</td></tr><tr><td>30–65 歲</td><td>任選一種（Grade A）：每 3 年抹片；每 5 年 hrHPV 檢測；每 5 年 hrHPV 加細胞學共同檢查</td></tr></table></div><p>CTFPHC 建議 30–69 歲每 3 年一次常規篩檢。</p><p>台灣自 2025 年起，25–29 歲每 3 年一次抹片，30 歲以上每年補助一次抹片，另外 35、45、65 歲女性當年度可做一次 HPV 檢測。</p>","p":"p499–500"},{"tag":"考點","h":"大腸直腸癌：台灣公費擴大到 45–74 歲","b":"<ul><li><b>USPSTF</b>：50–75 歲 Grade A，45–49 歲 Grade B。</li><li>糞便檢測：每年一次高敏感度糞便潛血或糞便免疫化學檢查。</li><li>直接可視化檢測：每 10 年一次大腸鏡，或每 5 年一次軟式乙狀結腸鏡。</li><li><b>台灣</b>：2025 年起公費糞便潛血檢查對象擴大為 45–74 歲，以及 40–44 歲有大腸癌家族史者，每 2 年一次。陽性者要安排大腸鏡等進一步檢查。</li></ul>","p":"p500"},{"tag":"考點","h":"肺癌 LDCT：美國、加拿大、台灣條件各不同","b":"<div class=\"tbl\"><table><tr><th>來源</th><th>對象</th><th>頻率</th></tr><tr><td>USPSTF（B）</td><td>50–80 歲，20 包年，吸菸中或戒菸未滿 15 年</td><td>每年 1 次</td></tr><tr><td>CTFPHC</td><td>55–74 歲，至少 30 包年，吸菸中或戒菸未滿 15 年</td><td>每年 1 次，最多連續 3 次</td></tr><tr><td>台灣公費</td><td>有肺癌家族史的 40–74 歲女性或 45–74 歲男性；50–74 歲 20 包年重度吸菸者</td><td>每 2 年 1 次</td></tr></table></div><p>USPSTF 提醒，戒菸滿 15 年、出現顯著限制預期壽命的健康問題，或無法或不願接受根治性肺部手術時，應停止篩檢。</p>","p":"p500"},{"tag":"迷思","h":"PSA 篩檢：55–69 歲看個人，70 歲以上不建議","b":"<p>攝護腺癌不在 USPSTF 建議篩檢的癌症內（Grade C），但國人自費檢查常有 PSA，所以特別提出。55–69 歲男性是否定期篩檢視個人狀況，可能帶來少許降低死亡的好處，也有傷害，包括偽陽性與切片、過度診斷與過度治療，以及尿失禁、勃起功能障礙。70 歲以上不建議。</p><p>美國癌症協會建議預期壽命至少 10 年者做共享決策。一般風險者 50 歲討論；非裔男性或一等親 65 歲前診斷者 45 歲討論；超過一位一等親 65 歲前診斷者 40 歲討論。</p>","p":"p500–501"},{"tag":"研究","h":"台灣口腔癌篩檢：死亡風險降到 0.53","b":"<div class=\"stat\"><div><strong>0.53</strong><span>篩檢者口腔癌死亡相對風險</span></div><div><strong>0.74</strong><span>校正自我選擇偏差後</span></div><div><strong>0.62</strong><span>晚期口腔癌相對風險</span></div><div><strong>0.79</strong><span>校正後晚期相對風險</span></div></div><p>2017 年研究針對 200 多萬名吸菸或嚼檳榔者，自 2004 年起整體篩檢率 55.1%。結論是篩檢可有效減少晚期口腔癌與死亡。USPSTF 對無症狀成人評為 Grade I。</p><p>台灣公費對象為 30 歲以上嚼檳榔（含已戒）或吸菸者，以及 18 歲至未滿 30 歲嚼檳榔（含已戒）的原住民，每 2 年 1 次。</p>","p":"p501"},{"tag":"趨勢","h":"胃癌：台灣 2026 年起，45–74 歲終身一次幽門桿菌糞便抗原","b":"<p>日本與韓國因胃癌發生率高，實施國家級篩檢，主要用胃內視鏡或上消化道攝影。</p><p>台灣自 2026 年起全面推行公費胃癌防治，對 45–74 歲民眾提供終身 1 次免費的幽門螺旋桿菌糞便抗原檢測，從篩出並根除主要致病因子著手降低罹癌風險。</p>","p":"p501"},{"tag":"考點","h":"心血管相關三項篩檢：血壓、糖尿病、腹主動脈瘤","b":"<div class=\"tbl\"><table><tr><th>項目</th><th>USPSTF 建議</th></tr><tr><td>高血壓</td><td>18 歲以上診間量血壓；治療前要在臨床環境外測量確認（Grade A）</td></tr><tr><td>糖尿病前期與第 2 型</td><td>35–70 歲過重或肥胖成人，間隔可每 3 年（Grade B）</td></tr><tr><td>腹主動脈瘤</td><td>65–75 歲曾吸菸男性，超音波 1 次（Grade B）</td></tr></table></div><p>ADA 補充：糖尿病前期每年篩檢，妊娠糖尿病史者每 1 至 3 年。65–75 歲從未吸菸的男性要選擇性篩檢，從未吸菸且無家族史的女性不常規做。無症狀成人不建議篩檢頸動脈狹窄。</p>","p":"p501–502"},{"tag":"必背","h":"感染性疾病篩檢：年齡和風險一起看","b":"<div class=\"tbl\"><table><tr><th>疾病</th><th>建議</th></tr><tr><td>披衣菌、淋病</td><td>24 歲以下，與 25 歲以上風險增加的性行為活躍女性（B）。女性感染率最高在 15–24 歲</td></tr><tr><td>B 肝</td><td>高風險成人（B）</td></tr><tr><td>C 肝</td><td>18–79 歲成人（B）；台灣提供符合規定者終身 1 次 B、C 肝篩檢</td></tr><tr><td>HIV</td><td>15–65 歲（A），高風險者重複篩檢合理</td></tr><tr><td>梅毒</td><td>高風險者；所有無症狀孕婦於妊娠早期</td></tr></table></div>","p":"p502"},{"tag":"工具","h":"心理健康與物質濫用：憂鬱、焦慮、酒精、藥物","b":"<ul><li>成人篩檢憂鬱症與焦慮症（Grade B），但要確保能診斷、治療與追蹤。工具有 PHQ、愛丁堡產後憂鬱量表、GAD scale。</li><li>18 歲以上詢問不健康藥物使用（Grade B）。</li><li>18 歲以上篩檢不健康飲酒，危險飲酒者提供簡短行為諮詢（Grade B）。</li><li>酒精篩檢可用 AUDIT-C 和 SASQ。</li></ul>","p":"p502–503"},{"tag":"臨床做法","h":"衛教諮詢：飲食、運動、戒菸、性傳染病","b":"<ul><li><b>營養與運動</b>：對有心血管危險因子者提供行為諮詢。減少飽和脂肪、鈉、糖，增加水果、蔬菜、全穀；每週達中等至高強度活動。BMI ≥30 者提供更強化的介入。</li><li><b>戒菸</b>：詢問所有成人的菸品使用，非懷孕成人提供行為介入加 FDA 核准藥物。台灣戒菸專線 0800-636363。</li><li><b>性傳染病</b>：對風險增加者提供行為諮詢，內容含相關知識、安全性行為動機、保險套使用與溝通。</li></ul><p>諮詢可結合醫病共享決策，依病人的疾病史、家族史、價值觀與偏好調整。</p>","p":"p503"},{"tag":"必背","h":"成人疫苗速查：美國 ACIP 對照台灣 CDC","b":"<div class=\"tbl\"><table><tr><th>疫苗</th><th>重點</th></tr><tr><td>流感</td><td>每年 1 劑；2025 ACIP 建議 65 歲以上優先用 HD-IIV3、RIV3 或 allV3</td></tr><tr><td>RSV</td><td>台灣建議 75 歲以上、60–74 歲重症高風險者、符合孕齡建議的孕婦，經醫師評估後接種</td></tr><tr><td>Tdap</td><td>未接種過補 1 劑，之後每 10 年補 Td 或 Tdap</td></tr><tr><td>水痘</td><td>無免疫證據者 2 劑（間隔至少 4 週）</td></tr><tr><td>HPV</td><td>美國 19–26 歲 2 或 3 劑，27–45 歲共享決策；台灣 19–26 歲 3 劑</td></tr><tr><td>帶狀疱疹</td><td>美國 50 歲以上 2 劑 RZV</td></tr><tr><td>B 肝</td><td>台灣 3 劑；高危險者表面抗體陰性可追加 1 劑，1 個月後再驗</td></tr><tr><td>A 肝</td><td>慢性肝病、血友病、肝臟移植、靜脈藥癮、男男間性行為、流行地區等，2 劑</td></tr><tr><td>M 痘</td><td>12 歲以上高風險者 2 劑，間隔至少 4 週</td></tr></table></div><p>肺炎鏈球菌疫苗規範會滾動修訂，臨床應查當年度最新指引。</p>","p":"p503–505"},{"tag":"考點","h":"化學預防四項：Statin、Aspirin、葉酸、PrEP","b":"<ul><li><b>Statin</b>：40–75 歲、無 CVD 史、有 1 項以上危險因子（血脂異常、糖尿病、高血壓、吸菸），且 10 年心血管事件風險 ≥10%，做一級預防。</li><li><b>Aspirin</b>：40–59 歲、10 年風險 ≥10%，是否開始依個人情況決定，出血風險不高且願意每天服用者較可能獲益。60 歲以上不建議用於一級預防。</li><li><b>葉酸</b>：計畫或可能懷孕的女性每日 0.4–0.8 mg，至少受孕前 1 個月開始，持續到懷孕前 2 至 3 個月。</li><li><b>PrEP</b>：HIV 高風險者提供抗反轉錄病毒暴露前預防，須伴隨持續行為諮詢與風險評估。</li></ul>","p":"p505"}],"recap":{"points":["成人預防照護包含篩檢、諮詢、疫苗與化學預防，多數遵循 USPSTF 的 A、B 級建議，並參考加拿大與台灣本土資料。","台灣近年擴大公費篩檢：成人預防保健下修至 30 歲、乳房攝影與大腸癌篩檢放寬、HPV 檢測，2026 年新增胃癌幽門桿菌篩檢。","PSA 篩檢為 Grade C，需共享決策；化學預防中 Statin 針對 10 年風險 ≥10% 者，60 歲以上不建議以 Aspirin 做一級預防。"],"quiz":[{"q":"USPSTF 對 30–65 歲女性的子宮頸癌篩檢有哪三種選擇？","a":"每 3 年單獨抹片、每 5 年單獨 hrHPV 檢測，或每 5 年 hrHPV 加細胞學共同檢查（Grade A）。"},{"q":"USPSTF 對 65–75 歲曾吸菸男性的腹主動脈瘤篩檢怎麼建議？","a":"做一次腹部超音波，為 Grade B。"}]}},"32":{"posts":[{"tag":"台灣數字","h":"女性平均多活 6.9 年，家庭裡的照顧者更需要先顧好自己","b":"<div class=\"stat\"><div><strong>84.3 歲</strong><span>女性平均餘命（113 年簡易生命表）</span></div><div><strong>77.4 歲</strong><span>男性平均餘命</span></div><div><strong>80.8 歲</strong><span>全體平均餘命</span></div></div><p>女性在家庭中仍是主要照顧者，她的健康會影響到至親家人。台灣女性長年的頭號殺手是癌症，尤其是肺癌、肝癌、大腸癌，以及近年追上來的乳癌。</p>","p":"p508"},{"tag":"核心觀念","h":"青少女期：身體快速長大，風險行為也跟著出現","b":"<p>青少年一般指 10–21 歲，分三期：早期 10–13 歲、中期 14–16 歲、晚期 17–21 歲。青少女通常比男生早約兩年發育，會出現乳房發育、陰毛、初經。可用 <b>Tanner 量表</b>評估發育是否遲緩。</p><p>初經後平均還會長高 7.5 公分，其他身體發育約再持續 4.5 年。初經年齡美國平均 12.43 歲，台灣 11.35 歲。</p>","p":"p509–510"},{"tag":"台灣數字","h":"15–24 歲的前三大死因，事故傷害排第一","b":"<ol><li>事故傷害</li><li>自殺</li><li>惡性腫瘤</li></ol><p>這是 2024 年衛福部統計。青少女最常見的死因是事故傷害，其中以車禍為大宗。南部一項大型研究發現，青少年（13–19 歲）摩托車車禍比 30–50 歲成人更常有臉部、腹部、肝脾破裂、頭骨、下顎和大腿骨折，也比較不願戴安全帽。家醫師要在社區宣導騎車戴安全帽。</p>","p":"p509"},{"tag":"必背","h":"18 歲前要補齊的疫苗清單","b":"<p>依疾管署 2025 年建議，18 歲前要完成：</p><ul><li>破傷風、白喉、百日咳、小兒麻痺</li><li>A 肝 2 劑、B 肝 3 劑</li><li>麻疹、德國麻疹、腮腺炎、水痘</li><li>腦膜炎（高危險群）</li><li><b>HPV</b>：國二生 2 劑，滿 15 歲後接種者 3 劑</li></ul><p>另外每年建議打流感疫苗，高危險群打肺炎疫苗，新冠疫苗依政策時程和對象接種。</p>","p":"p509"},{"tag":"臨床做法","h":"青少女的三個風險：身形焦慮、自我傷害、性傳染病","b":"<ul><li><b>身體形象</b>：為了被同儕認可而對身材有扭曲看法。要正面引導，教健康飲食，避免過重或過輕，預防日後的飲食失調。</li><li><b>吸菸</b>：台灣女性吸菸人口逐年增加，主因是控制體重、減輕焦慮、對抗壓力和環境。女性較容易戒成功，但最好的辦法還是別染上。</li><li><b>藥物濫用</b>：若出現疲倦、紅眼、咳不停、性格改變、情緒不穩、對事物失去興趣，要想到可能染毒。</li></ul>","p":"p510"},{"tag":"臨床做法","h":"性活躍青少女：先篩披衣菌與淋病，高風險再加梅毒、愛滋","b":"<p>青少女的子宮頸組織特性，使她們較容易感染披衣菌和 HPV。有些文化中女性弱勢，很難主導避孕，加上知識不足，常忽略早期徵象而延誤治療。</p><p>高風險族群包括：性行為沒有避孕（如保險套）、性伴侶有性病或用毒、自己曾得過性病。</p><p>建議教導青少女及性伴侶正確的防護知識，對性活躍者做披衣菌和淋病篩檢，高風險者再擴大到梅毒和愛滋。</p>","p":"p510–511"},{"tag":"台灣數字","h":"青少女生育率降到千分之三，不再是亞洲已開發國家最高","b":"<div class=\"stat\"><div><strong>3‰</strong><span>2021–2023 年 15–19 歲生育率</span></div></div><p>可能原因包括避孕可近性提升、性教育普及、社會文化改變、教育年限延長、青少年性行為型態改變。書中推薦的避孕方法有：禁慾、男用與女用保險套、殺精用品、避孕藥，以及長效可逆避孕方法（子宮內避孕器、皮下植入劑）。</p>","p":"p511"},{"tag":"核心觀念","h":"育齡女性的健康，從壓力和心血管風險開始看","b":"<p>長期壓力會導致高血壓、憂鬱，也會讓慢性發炎疾病惡化。壓力來源有財務、擔心失業、懷孕生子、工作與家庭難以平衡、職場性別歧視。症狀常是倦怠、頭痛、失眠、肩頸痠痛，女性本人和醫護都常忽略。</p><p>家醫師要留意病人的情緒變化，必要時轉介心理師或精神科。</p><p>2024 年女性癌症死因前三名是肺癌、乳癌、結直腸癌。</p>","p":"p511–512"},{"tag":"考點","h":"女性心臟病晚 10–15 年發生，但更嚴重","b":"<p>基本危險因子和男性相似：糖尿病、高膽固醇、吸菸、缺乏運動。女性另外有<b>生殖相關風險</b>：</p><ul><li>妊娠高血壓、子癲前症、妊娠糖尿病</li><li>早發性停經</li><li>多囊性卵巢症候群</li><li>自體免疫疾病</li></ul><p>停經後 LDL 常升高。美國心臟學會認為孕前、孕期和產後是辨識女性心血管風險的重要時機。女性較少做心血管評估，原因可能是症狀不典型、健康識能不足、風險被低估、保險或可近性問題。</p>","p":"p512"},{"tag":"必背","h":"口服避孕藥：第 1 年有效率 99.9%，但哪些人不能用要記清楚","b":"<p>成分是雌激素加黃體素。除了避孕，還能減少骨盆腔發炎、子宮外孕、經痛、缺鐵性貧血、青春痘，並預防骨質疏鬆。剛開始可能噁心、乳房脹痛、不規則出血，通常 3 個月後消失。較嚴重的副作用是靜脈栓塞，主要與雌激素有關。</p><p><b>盡量不要用</b>：凝血異常、肝功能異常、35 歲以上吸菸者、血壓或心血管疾病控制不佳者（中風風險增加）。</p><p>事後避孕藥是性行為後 72 小時內服高劑量黃體素，越早越有效，只能緊急使用，需醫師處方，不是墮胎藥。</p>","p":"p513"},{"tag":"臨床做法","h":"子宮內裝置、阻礙法、結紮、LARC，各有各的重點","b":"<ul><li><b>子宮內裝置</b>：含銅 T380A 用 3–5 年，Mirena 用 5 年。最大問題是骨盆腔發炎，尤其放置後前三週和性病高危險者。最適合已生產、性生活規律的婦女。</li><li><b>阻礙法</b>：保險套、子宮帽、子宮頸套。殺精劑不建議單獨使用。WHO 建議 HIV 高危險婦女不要用含 nonoxynol 9 的殺精劑。</li><li><b>結紮</b>：女性結紮可降低卵巢癌，Nurses' Health Study 顯示降低 67%。男性結紮較簡單安全，但國內接受度低。</li><li><b>LARC</b>：成功率超過 99%，有效 3–10 年，移除後生育力很快恢復，搭配保險套可兼顧防性病。</li></ul>","p":"p513–514"},{"tag":"必背","h":"乳癌篩檢：乳房攝影是標準工具，觸診與超音波只能輔助","b":"<div class=\"tbl\"><table><tr><th>方法</th><th>重點</th></tr><tr><td>觸診</td><td>基層研究敏感度只有 28–36%，不能單做</td></tr><tr><td>乳房攝影</td><td>敏感度約 75%、特異度約 92.3%，可早期發現惡性顯微鈣化</td></tr><tr><td>乳房超音波</td><td>適合緻密乳房、孕期、哺乳期，但不是篩檢工具，只當輔助診斷</td></tr><tr><td>核磁共振</td><td>敏感度近 100%、特異度約 90%，太貴，只用於特定對象</td></tr></table></div>","p":"p514–515"},{"tag":"考點","h":"BIRADS 怎麼接續處理，以及誰該篩乳癌","b":"<ul><li><b>BIRADS 0、3</b>：再安排乳房超音波或其他影像</li><li><b>BIRADS 1、2</b>：照正常時間追蹤乳房攝影</li><li><b>BIRADS 4、5</b>：轉介乳房外科</li></ul><p>USPSTF 2024：40–74 歲每 2 年一次乳房攝影（B 級）；75 歲以上和緻密乳房證據不足（I 級）。台灣免費篩檢同樣提供 40–74 歲每 2 年一次，有家族史或高風險者可能要提早或個別化評估。</p><p>台灣研究顯示，2 年一次乳房攝影可降低 41% 乳癌死亡率。</p>","p":"p514–515"},{"tag":"考點","h":"子宮頸癌篩檢：USPSTF 各年齡層怎麼做","b":"<div class=\"tbl\"><table><tr><th>對象</th><th>建議</th></tr><tr><td>21 歲以下</td><td>不建議篩檢（D）</td></tr><tr><td>21–29 歲</td><td>每 3 年抹片</td></tr><tr><td>30–65 歲</td><td>首選每 5 年 HPV DNA；或每 3 年抹片；或每 5 年抹片加 HPV（A）</td></tr><tr><td>65 歲以上且過去正常</td><td>不建議（D）</td></tr><tr><td>已切除子宮</td><td>不建議，除非原因是 CIN 2 或 3（D）</td></tr></table></div><p>台灣自 2025 年起，25–29 歲每 3 年、30 歲以上每年免費抹片，另有 35、45、65 歲 HPV 檢測。</p>","p":"p516"},{"tag":"必背","h":"HPV 疫苗：二價、四價、九價差在哪","b":"<ul><li><b>二價</b>：16、18 型（子宮頸癌）</li><li><b>四價</b>：6、11、16、18 型，其中 6、11 是生殖器疣主因</li><li><b>九價</b>：6、11、16、18、31、33、45、52、58 型</li></ul><p>高危險型病毒約 15 種。最好在第一次性行為前接種。建議 9–26 歲女性接種，26 歲以上用醫病共享決策討論。最佳策略是抹片加疫苗。</p>","p":"p516"},{"tag":"必背","h":"骨質疏鬆：T 值 -2.5 以下就是診斷","b":"<div class=\"stat\"><div><strong>1/4</strong><span>婦女有骨質疏鬆</span></div><div><strong>40%</strong><span>骨鬆骨折發生在脊椎</span></div><div><strong>20%</strong><span>髖骨折婦女一年內死亡</span></div></div><p>診斷依低創傷性骨折，或 DXA 的 T 值。T 值 -1.0 以上為正常，-1.0 到 -2.5 為骨質缺乏，-2.5 以下為骨質疏鬆。DXA 是黃金標準，測腰椎或兩側髖骨。</p>","p":"p518"},{"tag":"臨床做法","h":"骨質疏鬆的預防與用藥一覽","b":"<p>停經後婦女每天需鈣 1,500 毫克。維生素 D 在 50 歲前 400 IU，50 歲後 800 IU。不吸菸、飲酒不過量、做負重運動。已有骨鬆時，只補鈣片不夠，要在醫師建議下用藥：</p><ul><li><b>雙磷酸鹽</b>：抑制蝕骨細胞</li><li><b>SERM</b>：raloxifene 可降血脂，降低乳癌機率</li><li><b>荷爾蒙補充</b>：WHI 顯示用 5.2 年可降低 34% 脊椎與髖部骨折</li><li><b>Denosumab</b>：RANK ligand 單株抗體</li><li><b>副甲狀腺素</b>：teriparatide 刺激造骨</li><li><b>Strontium ranelate</b>：同時促進骨生成與抑制流失</li></ul>","p":"p518–519"},{"tag":"研究","h":"荷爾蒙補充療法：從救星到喊停，再到「黃金治療窗」","b":"<p>WHI 試驗原本要追蹤 9 年，2002 年因受試組乳癌機率超過安全範圍而提前中止，且發現對健康婦女會增加心血管疾病。但後續研究又看到它的優點。</p><p>2025 年台灣更年期醫學會指引建議的適應症：中重度血管舒縮症候群、生殖泌尿道症狀、停經未滿 10 年或未滿 60 歲、骨鬆高風險或已診斷、提早停經或卵巢早衰（治療到約 50 歲）。建議在<b>黃金治療窗</b>（未滿 60 歲或停經未滿 10 年）開始，越晚開始，心血管與腦中風風險可能越高。</p>","p":"p519"}],"recap":{"points":["不同年齡層的重點不同：青少女看事故、疫苗與性傳染病，育齡看避孕與心血管風險，更年期後看骨質疏鬆與荷爾蒙治療。","癌症篩檢要記住年齡與間隔：乳房攝影 40–74 歲每 2 年，子宮頸 21–29 歲抹片、30–65 歲可改 HPV DNA。","骨質疏鬆以 T 值 -2.5 以下診斷；荷爾蒙治療宜在未滿 60 歲或停經未滿 10 年的黃金治療窗開始。"],"quiz":[{"q":"哪些人盡量不要使用口服避孕藥？","a":"凝血或肝功能異常、35 歲以上吸菸者，以及血壓或心血管疾病控制不佳者。"},{"q":"BIRADS 4、5 的後續處理是什麼？","a":"轉介乳房外科做進一步處置。"}]}},"33":{"posts":[{"tag":"核心觀念","h":"青少年很少主動看醫生，但其實很在意自己的健康","b":"<p>美國資料顯示，近四成青少年常想到健康問題，另有二成經常擔心自己的健康狀態。他們想知道性行為、性病、懷孕、吸菸、喝酒、毒品、飆車這些事，卻很少主動開口，也希望醫師不要用批判的口氣談。</p><p>所以家醫師要主動利用每次接觸青少年或父母的機會，做衛教和評估。</p>","p":"p522–523"},{"tag":"趨勢","h":"WHO 列的青少年十大健康議題，台灣的版本長什麼樣","b":"<p>WHO 2014 年報告包括：體適能不足、營養不均衡、吸菸、物質濫用與偏差行為、生殖健康、心理健康、事故傷害與暴力、HIV、疫苗接種、整合性照護管理。</p><p>台灣的主要問題有：身心壓力上升、體重過重、體適能不足、事故傷害占死因比率仍高、性與生殖健康議題多元、多重冒險行為共病、身心障礙青少年的照護，以及預防保健服務與整合性照護的推展。</p>","p":"p522"},{"tag":"工具","h":"周全性健康評估 CAHA：評什麼、多久評一次","b":"<ul><li><b>身體評估</b>：身高體重、視力、牙齒、血壓、Tanner 分期、疫苗紀錄，常見問題如肥胖、脊椎側彎、痛經、貧血</li><li><b>心理社會評估</b>：獨立性、自我認同、身體心像、自我效能、復原力，用 SSHADESS 或 HEADSSS 問診</li><li><b>特殊事項</b>：優勢與風險，如霸凌、拒學、性行為、吸菸、藥癮、飆車</li></ul><p>週期沒有定論。每年一次為宜，至少青少年前、中、後期各一次，原則是把握每次接觸的機會。</p>","p":"p523"},{"tag":"必背","h":"AMA 的 GAPS 指引：六個特色","b":"<p>GAPS 是美國醫學會 1994 年出版的青少年預防保健指引。特色如下：</p><ol><li>整合醫療、學校、社區，讓青少年得到一致的健康指導</li><li>涵蓋身體疾病和社會問題（吸菸、喝酒、毒品、性病、意外懷孕、飲食障礙、憂鬱）</li><li>同時評估一系列危險行為，不只看主訴</li><li>定期篩檢，及早指導並建立長期關係</li><li>青少年早、中、晚期各提供一次完整理學檢查</li><li>父母在子女早、中期接受親職教育，青少年也要學習如何為人父母</li></ol>","p":"p523–525"},{"tag":"現場難題","h":"預防保健為什麼做不起來？五個障礙與五個對策","b":"<p><b>障礙</b>：看診時間緊迫、青少年不願談生活方式、醫護知識與能力不足、給付不足、家長不認同。</p><p><b>對策</b>：</p><ol><li>每次就醫都做，從詳細病史和理學檢查開始</li><li>電腦提醒系統或青少年健康護照</li><li>訓練會談技巧並強調隱密性</li><li>加強家長的預防保健認知</li><li>立法，把服務納入學校衛生或健保給付</li></ol>","p":"p525"},{"tag":"考點","h":"專家多數同意的項目，和只有部分同意的項目","b":"<p>參考 USPSTF、GAPS、AAFP、Bright Futures/AAP 後：</p><ul><li><b>多數同意</b>：疫苗接種、降低事故傷害風險的諮詢、降低心血管疾病風險的諮詢、避免物質濫用與不安全性行為、牙齒保健</li><li><b>部分同意</b>：定期給家長健康指導、定期視力與聽力篩檢、定期檢測血比容（貧血）與尿液分析</li></ul><p>AAP/Bright Futures 對 11–21 歲另建議：酒精與違法藥物篩檢諮詢、男性披衣菌與淋病篩檢、膽固醇檢測、家暴與親密暴力、戴安全帽、繫安全帶、酒駕、槍械與霸凌。</p>","p":"p525–526"},{"tag":"臨床做法","h":"在學校篩檢，青少年比較願意說話","b":"<p>多數青少年對學校提供的保健服務滿意度較高，也更敢暢所欲言。傳統醫療院所的方式不太符合他們的需求。</p><p>篩檢時程目前較一致的建議是視個案情況每 1 到 3 年一次。場所首選是把學校與社區醫療在地化連結，例如推廣多年的「青少年親善門診」。</p><p>國健署 2018 年起辦理青少年親善機構認證，已有超過 40 家醫療機構通過。</p>","p":"p526, p539"},{"tag":"工具","h":"HEADSSS 和 SSHADESS：問診從哪裡開始","b":"<div class=\"tbl\"><table><tr><th></th><th>HEADSSS</th><th>SSHADESS</th></tr><tr><td>取向</td><td>風險辨識</td><td>優勢導向</td></tr><tr><td>起點</td><td>家庭或學校，較快進入問題</td><td>先問優點，例如「你最擅長什麼？」</td></tr><tr><td>情緒範圍</td><td>聚焦憂鬱與自殺</td><td>擴大到壓力、焦慮、睡眠、飲食</td></tr><tr><td>缺點</td><td>處理不好像在審問</td><td>從輕鬆話題漸進到敏感話題</td></tr></table></div><p>SSHADESS 依序是優勢、學校、家庭、活動、藥物、情緒、性、安全。問藥物時建議先問「周遭的人」再問「自己」，減輕防備。</p>","p":"p527–529"},{"tag":"必背","h":"青少年高血壓的診斷標準","b":"<div class=\"tbl\"><table><tr><th>13–17 歲（2017 AAP）</th><th>血壓</th></tr><tr><td>正常</td><td>&lt;120/&lt;80</td></tr><tr><td>血壓偏高</td><td>120–129/&lt;80</td></tr><tr><td>第一期高血壓</td><td>130–139/80–89</td></tr><tr><td>第二期高血壓</td><td>≥140/90</td></tr></table></div><p>青少年若持續偏高，要考慮次發性高血壓。若在性徵發展成熟時血壓仍偏高，日後很可能變成本態性高血壓。</p>","p":"p526, p529"},{"tag":"核心觀念","h":"理學檢查三件事：BMI、生長、Tanner 分期","b":"<ul><li><b>BMI</b>：衛福部 2013 年公布的兒童與青少年肥胖定義，以 BMI 為標準，依年齡與性別有不同切點。</li><li><b>生長</b>：青春期增加的身高約占成人身高的 25%，增加的體重約占成人理想體重的 40% 以上。男生過重或肥胖的比率遠高於女生。</li><li><b>Tanner 分期</b>：身體發展與年齡不完全吻合，個體差異大，Tanner 分期分 1 到 5 期，是最常被引用的評估方法。</li></ul>","p":"p526–527, p531"},{"tag":"必背","h":"要不要抽血、驗結核、篩性病？看風險條件","b":"<ul><li><b>膽固醇</b>：家族史有早發心血管疾病或高血脂者，這段期間驗一次</li><li><b>結核菌素試驗</b>：接觸開放性結核病人，或在流浪、醫療機構等高危險環境生活工作者</li><li><b>性病篩檢</b>：性生活頻繁者每年至少一次</li><li><b>HIV</b>：高危險群</li><li><b>子宮頸抹片與梅毒血清（VDRL）</b>：18 歲以上且性活躍者</li><li><b>G-6-PD 缺乏或地中海型貧血</b>：有家族史者</li></ul>","p":"p531"},{"tag":"工具","h":"85210：一組青少年健康生活口訣","b":"<ul><li><b>8</b>：睡滿 8 小時</li><li><b>5</b>：天天五蔬果</li><li><b>2</b>：電腦、電視、電玩、電話合計少於 2 小時</li><li><b>1</b>：每天累積 30 分鐘運動，一週 210 分鐘</li><li><b>0</b>：喝足白開水，每天 1,500–2,000 cc，少喝含糖飲料</li></ul><p>健康指導還包括：避免交通事故、安全性行為、避免藥物濫用、學習處理霸凌、保護身體隱私。</p>","p":"p532"},{"tag":"核心觀念","h":"青少年心理社會發展：早、中、晚期各有不同任務","b":"<p>三大任務：從家庭獨立並形成自我認同、性別認同與發展親密關係、認知與方向感增加並選擇志業。</p><ul><li><b>早期</b>：對父母的活動興趣減少，專注青春期變化，追求與同儕一致，衝動控制差</li><li><b>中期</b>：與父母衝突高，深受同儕影響，性方面嘗試增加，感到無所不能，有冒險行為</li><li><b>晚期</b>：重新接受父母的建議與價值觀，生涯目標較實際，有妥協與自我控制的能力</li></ul>","p":"p532"},{"tag":"臨床做法","h":"幫青少年戒菸：依行為改變階段，換不同的做法","b":"<ol><li><b>懵懂期</b>：沒意願，先簡短諮詢加書面資料，強化動機</li><li><b>深思期</b>：有動機，用 5R's 增強（關聯、危險、饋償、阻礙、重覆）</li><li><b>準備期</b>：打算 1 個月內戒，訂戒菸計畫、選戒菸日、簽戒菸志願書、預想挑戰</li><li><b>行動期</b>：再吸菸不算真正失敗，持續支持</li><li><b>維持期</b>：定期追蹤防復發</li></ol><p>滿 18 歲以上建議用尼古丁替代療法。</p>","p":"p533"},{"tag":"必背","h":"疫苗補種重點：Tdap、HPV、A 肝、水痘、B 肝","b":"<ul><li><b>Tdap</b>：青少年期追種一次，之後每 10 年一次</li><li><b>HPV</b>：9–26 歲尚未有性行為者最佳。國二學生公費 9 價，2 劑（0、6 個月）；15 歲以上 3 劑（0、2、6 個月）</li><li><b>水痘</b>：未接種且未得過者 1 劑，滿 13 歲以上要 2 劑，間隔至少 4–8 週</li><li><b>A 肝</b>：未接種者 2 劑，間隔 6–12 個月</li><li><b>MMR</b>：未接種或沒抗體者 2 劑，間隔至少 4 週</li></ul>","p":"p534–535"},{"tag":"臨床做法","h":"接種完 B 肝疫苗但抗體陰性，怎麼補？","b":"<p>幼時已完成 B 肝接種、但表面抗體陰性的<b>高危險群</b>（透析、器官移植、免疫不全、多重性伴侶、注射藥癮、同住者或性伴侶帶原、醫療工作者等），可自費追加 1 劑，1 個月後驗血。表面抗體仍小於 10 mIU/mL，就按「0-1-6 個月」補完第 2、3 劑。</p><p>補完仍無抗體，不必再打，但要做好預防措施，並定期追蹤 HBsAg。</p><p>非高危險群不需全面追加，個案可自費加打 1 劑，仍陰性再諮詢醫師。</p>","p":"p534–535"},{"tag":"趨勢","h":"新冠疫苗現在走「年度接種加共同決策」","b":"<p>2025–2026 指引像流感疫苗一樣，每年依主流株更新。</p><ul><li><b>高風險群</b>（慢性病、免疫低下、集體生活、同住者高風險）強烈建議接種</li><li><b>健康青少年</b>透過共同臨床決策</li></ul><p>可用 mRNA 疫苗或 Novavax（12 歲以上）。最受關注的副作用是心肌炎或心包膜炎，尤其男性，極少見且多在接種後 1 週內。指引建議接種後 2 週內避免劇烈運動，若胸痛、心悸、呼吸困難或暈厥要立即就醫。</p>","p":"p536–537"},{"tag":"現場難題","h":"台灣學生健檢偏重生理疾病，缺了心理","b":"<p>學生健康檢查基準表由教育部訂定，但各校項目不一，多半強調生理篩檢，如肺結核、貧血、高血脂、蛋白尿、糖尿病、高血壓。</p><p>書中指出，應協同國健署和台灣青少年醫學暨保健學會定期修訂，並納入心理衡鑑（憂鬱症篩檢）等重要項目。</p>","p":"p538"},{"tag":"考點","h":"青少年看診的倫理與法律：隱密、同意、監護人","b":"<ul><li><b>隱密性</b>：同時尊重身體私密性、病情和醫療相關的個人秘密</li><li><b>知情同意</b>：有時要同時考慮本人和法定監護人</li><li><b>合法性</b>：7 歲以上未滿 20 歲為限制行為能力人，締結醫療契約依民法第 77 條前段，應得法定代理人允許</li></ul><p>檢查時要先安撫說明、充分遮蔽（如屏風）、邊查邊說、檢查異性時有護理師陪同、動作輕柔，結束後給予正向回饋。</p>","p":"p538–539"}],"recap":{"points":["青少年預防保健要把握每次接觸機會，用 HEADSSS 或 SSHADESS 評估心理社會，並以 GAPS 為藍本整合醫療、學校與社區。","篩檢與疫苗依年齡和風險條件進行，要熟記 Tdap、HPV、A 肝、水痘、B 肝的補種規則。","診療時要顧及隱密性與同意，台灣學生健檢仍缺心理健康篩檢。"],"quiz":[{"q":"SSHADESS 和 HEADSSS 最大的差別是什麼？","a":"SSHADESS 是優勢導向，從先問優點開始建立信任；HEADSSS 偏重風險辨識。"},{"q":"接種 B 肝疫苗後抗體仍陰性的高危險青少年，補種怎麼做？","a":"自費追加 1 劑，1 個月後驗血；仍小於 10 mIU/mL 就以 0-1-6 個月補完第 2、3 劑。"}]}},"34":{"posts":[{"tag":"核心觀念","h":"兒童照護從「看到再說」，變成主動做發展篩檢","b":"<p>現行模式已從被動的伺機性觀察，轉為用標準化工具做主動發展篩檢，並強調「幼兒專責醫師」在個案管理中的核心角色。醫師除了兒科理學檢查，還要熟悉發展里程碑和標準化篩檢工具。</p><p>本章依四個面向整理：生長與發展評估、身體診查、疫苗與化學預防、健康諮詢與衛教，分別談新生兒、嬰兒、學齡前與學齡期。</p>","p":"p542"},{"tag":"必背","h":"雙軌篩檢：7 次預防保健加 6 次發展篩檢","b":"<div class=\"stat\"><div><strong>7 次</strong><span>兒童預防保健，出生到入小學前，重身體診查與衛教</span></div><div><strong>6 次</strong><span>兒童發展篩檢，2024 年 7 月 1 日起，未滿 7 歲</span></div></div><p>發展篩檢的時段：6–10 個月、10 個月–1 歲 6 個月、1 歲 6 個月–2 歲、2–3 歲、3–5 歲、5–未滿 7 歲。用衛福部兒童發展篩檢量表，涵蓋粗大動作、精細動作、語言認知與社會發展，目的是及早發現疑似發展遲緩或自閉症類群障礙（ASD）。</p>","p":"p543"},{"tag":"台灣數字","h":"幼兒專責醫師：未滿 3 歲的連續照護，2026 年擬延到 6 歲","b":"<p>2023 年起全面推行，專責醫師為兒科、家醫科醫師及偏鄉衛生所醫師。工作包括主動追蹤疫苗、膽道閉鎖篩檢、牙齒塗氟時程，整合周產期照護，把發展遲緩或生長滯後個案轉介到聯合評估中心，並辨識脆弱家庭與兒虐風險，必要時家訪或通報。</p><p>衛福部預計 2026 年增加兒科健保預算，把媒合年齡延伸到 6 歲，改名為「兒童專責醫師」。</p>","p":"p543–545"},{"tag":"必背","h":"新生兒體重怎麼長才算正常","b":"<ul><li>出生 1 週內體重可能下降，幅度不應超過出生體重的 10%</li><li>通常 2 週大回到出生體重</li><li>滿月約增加 1 公斤，身長增加約 5 公分</li></ul><p>若下降太多或回升太慢，要評估哺餵技巧、奶量攝取和有沒有脫水。新生兒期的神經評估看粗動作與原始反射（Moro、rooting、palmar grasp）是否完整對稱。</p>","p":"p545–546"},{"tag":"臨床做法","h":"DDH 篩檢：Barlow、Ortolani，高風險加做超音波","b":"<p>新生兒身體診察通常在出生後 24–48 小時內做。DDH（發展性髖關節發育不良）要常規做 Barlow 與 Ortolani，並看大腿外展受限、長短腳（Galeazzi sign）、髖動作有聲響、大腿皮膚皺褶不對稱。</p><p>高風險因子有臀位產、家族史、羊水過少、理學檢查有疑慮，建議出生後 4–6 週做髖關節超音波。</p><p>治療依發現時間不同：6 個月前用吊帶，6 個月後需手法復位加石膏，開始走路後才發現則要開刀。</p>","p":"p546"},{"tag":"臨床做法","h":"CCHD 與膽道閉鎖：兩個不能漏掉的新生兒篩檢","b":"<ul><li><b>危急型先天性心臟病（CCHD）</b>：出生後 24–48 小時內，用脈衝式血氧儀測血氧飽和度，並看心雜音與股動脈搏動是否對稱。</li><li><b>膽道閉鎖</b>：生理性黃疸多在 2–3 天出現、2 週內改善。若過早、過快、過高或超過 2 週，加上活動力差、嗜睡、餵食困難、大便變淡，要懷疑病理性。教家長用嬰兒大便辨識卡，顏色異常加直接膽紅素過高，立即轉診小兒消化科，在出生 60 天內完成葛西手術，越早越好。</li></ul>","p":"p546"},{"tag":"必背","h":"新生兒四件事：B 肝、RSV、維生素 K、眼藥膏","b":"<ul><li><b>B 肝疫苗</b>：24 小時內第 1 劑，1 個月第 2 劑。母親 HBsAg 陽性（不論 e 抗原），24 小時內加打 HBIG，滿 12 個月驗 HBsAg 與抗體。</li><li><b>RSV</b>：高風險嬰幼兒健保給付 Palivizumab；足月兒可自費 Nirsevimab（2024 年核准），建議 12 個月內嬰兒打。母親懷孕 28–36 週打過 RSV 疫苗，通常不必再打，除非接種與出生間隔不足 14 天。</li><li><b>維生素 K</b>：出生時肌肉注射 0.5–1 mg，預防出血。</li><li><b>眼炎預防</b>：24 小時內用紅黴素或四環黴素眼藥膏（USPSTF A 級）。</li></ul>","p":"p547"},{"tag":"必背","h":"新生兒代謝與聽力篩檢，記住 21 項與「1-3-6」","b":"<ul><li><b>先天性代謝異常</b>：政府補助 21 項，建議出生滿 48 小時且哺乳滿 24 小時後採腳跟血。</li><li><b>聽力</b>：2012 年起全面補助，建議出生 72 小時做。「1-3-6 原則」：1 個月內完成篩檢，3 個月內確診，6 個月前開始戴輔具和聽語療育。</li></ul><p>未來可能擴充脊髓性肌肉萎縮症（SMA）和龐貝氏症等。</p>","p":"p547"},{"tag":"臨床做法","h":"預防嬰兒猝死症（SIDS）：仰睡、不用枕頭、同室不同床","b":"<ul><li>1 歲以下每次睡眠都要仰睡</li><li>1 歲以下禁用枕頭</li><li>床面堅實，避免鬆軟物</li><li>嬰兒與家長同室不同床</li><li>避免環境過熱與過度包裹</li></ul><p>趴睡是重要危險因素。研究證據支持使用奶嘴可降低 SIDS 發生率。</p>","p":"p547–548"},{"tag":"臨床做法","h":"母乳哺育：好處、時程、補充品","b":"<p>母乳能增進智力發展，降低腹瀉與肺炎，減少過敏與成人期心血管疾病。國健署建議純母乳到 4–6 個月開始加副食品，並持續哺乳到 2 歲或以上。</p><ul><li><b>維生素 D</b>：每日進食少於 1,000 毫升加強維生素 D 配方奶者，從新生兒起每天補 400 IU</li><li><b>鐵</b>：早產兒、出生體重小於 2,500 公克者，2 週到 1 歲至少 2 mg/kg/day</li><li><b>水與氟</b>：純母乳嬰兒除非大量失水不需額外補水，6 個月內不需補氟</li></ul>","p":"p548"},{"tag":"必背","h":"哪些情況不能餵母乳？三種處理方式","b":"<div class=\"tbl\"><table><tr><th>處理</th><th>情況</th></tr><tr><td>不建議哺乳，擠出的奶也不餵</td><td>嬰兒典型半乳糖血症；母親 HIV 感染未持續病毒抑制；母親 HTLV-1/2 感染</td></tr><tr><td>暫停直接哺乳與餵擠出奶</td><td>母親使用非法藥物（若停用並穩定美沙冬或 buprenorphine 維持，應鼓勵哺乳）、疑似或確診伊波拉、未治療布氏桿菌病、服用特定藥物、做放射性藥物影像檢查</td></tr><tr><td>暫停直接哺乳，但可餵擠出奶</td><td>乳房有活動性 HSV 病灶、Mpox、未治療的活動性結核病，以及分娩前 5 天到產後 2 天發病的水痘</td></tr></table></div><p>苯酮尿症新生兒可在監測下輪流餵母乳與特殊奶粉。</p>","p":"p548–549"},{"tag":"臨床做法","h":"嬰兒期身體診察：牙、眼、疝氣、隱睪","b":"<ul><li><b>牙</b>：下顎中門齒約 6.5 個月長出，1 歲前平均有 6–8 顆乳牙</li><li><b>眼</b>：用角膜照光反射看有無斜視，持續監測紅反射和雙眼固視，正式視力篩檢建議 3 歲開始</li><li><b>隱睪</b>：1 歲時睪丸仍未下降到陰囊，建議開刀，降低日後不孕與睪丸惡性腫瘤風險</li></ul>","p":"p551"},{"tag":"必背","h":"副食品怎麼加？時間、順序、禁忌","b":"<p>校正年齡 4 個月內不建議加，純母乳到 6 個月後必須加。每次只加一種新食物，從 1–2 湯匙開始，觀察 3–5 天。順序：米精，再麥精、蔬菜、水果、肉類。WHO 建議 6–8 個月每天至少 2–3 次，9 個月後至少 3–4 次。</p><p>延後添加不能降低過敏風險。台灣兒科醫學會建議含鐵鋅的副食品 4–6 個月開始，4 個月後尚未加副食品者補口服鐵劑 1 mg/kg/day。</p><p><b>1 歲以下不可餵蜂蜜</b>，避免肉毒桿菌中毒。</p>","p":"p552"},{"tag":"臨床做法","h":"口腔保健與塗氟：第一顆牙長出就開始","b":"<ul><li>USPSTF：第一顆牙萌發後就塗氟（B 級）；飲水不含氟地區，6 個月到 5 歲可口服補氟（B 級）</li><li>用含氟 1,000 ppm 以上的牙膏，每次豌豆大小</li><li>台灣補助未滿 6 歲每半年塗氟 1 次，最多 11 次</li><li>不讓寶寶含奶瓶睡覺，不吹涼食物、不共用餐具</li><li>6 歲長出第一大臼齒後，應做窩溝封填</li></ul>","p":"p552, p555"},{"tag":"臨床做法","h":"嬰幼兒事故傷害與環境：安全座椅、搖晃症候群、三手菸、防曬","b":"<ul><li>未滿 2 歲搭小型車必須用<b>後向式安全座椅</b>，固定在後座</li><li><b>受虐性腦傷</b>（嬰兒搖晃症候群）多發生在 2 歲以下，尤其 6 個月內。診斷時要同時啟動兒虐通報</li><li><b>三手菸</b>：在別的房間吸完再抱孩子，菸的微粒仍附在身上，通風和空氣清淨機都去不掉</li><li><b>防曬</b>：6 個月到 24 歲膚色白皙者，USPSTF B 級建議防曬衛教，用 SPF 15 以上廣譜防曬乳，上午 10 點到下午 4 點避開烈日</li></ul>","p":"p552–553"},{"tag":"臨床做法","h":"學齡前篩檢重點：血壓、視力、ASD","b":"<ul><li><b>ASD</b>：2–3 歲是關鍵期，AAP 建議 18 與 24 個月做常規篩檢</li><li><b>血壓</b>：AAP 2017 建議 3 歲以上每年量一次。未滿 13 歲，3 次不同就診都大於等於第 95 百分位，診斷高血壓</li><li><b>視力</b>：3 歲半到 4 歲是理想時機，包括視力、立體感、眼位。USPSTF 建議 3–5 歲至少做一次（B 級）</li></ul><p>2–5 歲平均每年增重 2 公斤、長高 7 公分，2 歲後每年至少記錄一次身高、體重、BMI。</p>","p":"p553–554"},{"tag":"必背","h":"兒童肥胖怎麼診斷與介入","b":"<ul><li>2 歲以下：WHO 體重身高比，97.7 百分位以上為肥胖</li><li>2–18 歲：BMI 85 百分位以上過重，95 百分位以上肥胖，超過 95 百分位切點值 120% 為極度肥胖</li></ul><p>USPSTF 建議 6 歲以上 BMI 高於正常範圍者，及早做強化行為介入（B 級）。防治涵蓋健康飲食、規律活動、充足睡眠、環境與社會互動四個面向。</p>","p":"p556"},{"tag":"迷思","h":"血鉛沒有安全值，但無症狀兒童不建議普篩","b":"<p>血鉛即使低於 5 ug/dL，仍會對發展中的神經系統造成不可逆影響。來源包括老舊建築剝落油漆、含鉛水管、來路不明的玩具與飾品、成分不明的中草藥、同住者職業暴露。</p><p>衛教重點：勤洗手、選有標準檢驗局標章的玩具、攝取足夠鈣、鐵、維生素 C。USPSTF 對無症狀兒童普篩是 I 級，高風險環境或服用不明草藥者可考慮檢測。</p>","p":"p556"},{"tag":"臨床做法","h":"學齡期（6–12 歲）：性早熟、焦慮、近視與近視防護","b":"<ul><li><b>性早熟</b>：女孩 8 歲前、男孩 9 歲前出現第二性徵要評估</li><li><b>發展監督</b>：學習困難（ADHD、輕度智能障礙、學習障礙）與情緒問題（焦慮、憂鬱、拒學）。USPSTF 建議 8 歲以上做焦慮症篩檢（B 級）</li><li><b>視力</b>：6 歲前是斜弱視治療關鍵期。「3010120」：用眼 30 分鐘休息 10 分鐘，每天戶外 120 分鐘以上</li><li><b>3C</b>：國健署規範 2 歲以下完全不用，2 歲以上每日不超過 1 小時並由父母陪伴</li></ul>","p":"p555, p557"},{"tag":"臨床做法","h":"學齡期疫苗與高血脂：HPV 擴及男生，膽固醇 9–11 歲篩一次","b":"<ul><li><b>5 歲到入國小前</b>：第 2 劑 MMR 與 1 劑四合一（DTaP-IPV）。每年 1 劑流感疫苗，8 歲以下初次接種要 2 劑</li><li><b>Tdap</b>：11 歲以上可自費 1 劑</li><li><b>HPV</b>：2018 年起國中女生公費，2022 年升級九價，2025 年 9 月起納入國中男生</li><li><b>高血脂</b>：USPSTF 對無症狀兒童為 I 級，但只靠家族史會漏掉約 50% 家族性高膽固醇血症，AAP 仍建議所有 9–11 歲做首次篩檢。高風險兒童 2 歲後提早監測，8–10 歲以上可考慮 statins</li></ul>","p":"p557–558"}],"recap":{"points":["台灣兒童照護是 7 次預防保健加 6 次發展篩檢的雙軌制，由幼兒專責醫師做個案管理。","新生兒期要抓住 DDH、CCHD、膽道閉鎖、代謝與聽力篩檢，以及 B 肝、維生素 K、眼藥膏。","各階段衛教重點不同，嬰兒是睡眠、副食品、口腔，學齡前是視力、肥胖、ASD，學齡期是性早熟、焦慮與疫苗補強。"],"quiz":[{"q":"新生兒聽力篩檢的「1-3-6 原則」是什麼？","a":"1 個月內完成篩檢，3 個月內確診，6 個月前開始戴輔具和聽語療育。"},{"q":"母親 HBsAg 陽性時，新生兒要做什麼？","a":"24 小時內除了第 1 劑 B 肝疫苗，還要加打 HBIG，並在滿 12 個月驗 HBsAg 與抗體。"}]}},"35":{"posts":[{"tag":"台灣數字","h":"十六族原住民，占全國人口 2.5%，成長率高於非原住民","b":"<div class=\"stat\"><div><strong>16 族</strong><span>官方認定的原住民族</span></div><div><strong>583,711</strong><span>2022 年原住民人數</span></div><div><strong>0.51%</strong><span>人口成長率，非原住民為 -0.50%</span></div><div><strong>47%</strong><span>原住民分布地占全台面積</span></div></div><p>阿美族、泰雅族、排灣族三族合占約七成。討論原住民健康，不能只從醫療看，還涉及傳統價值、健康認知、生活方式轉變、部落理解與醫病互動。</p>","p":"p560"},{"tag":"核心觀念","h":"原住民醫療史三階段：傳統、教會、光復時期","b":"<ol><li><b>傳統醫療</b>（原始時期到 1895 年）：以阿美族祭師的儀式為例，有 patebu 尋靈式、mipopo 祛穢式、pananum 慰靈式，兼負醫病與心靈撫慰。</li><li><b>教會醫療</b>：馬偕醫院、彰化基督教醫院等服務偏遠地區，門諾醫院 1955 年到花蓮服務原住民。</li><li><b>光復時期</b>：早期原住民健康餘命約 40 歲，因地處偏遠少受重視，缺乏系統性調查。</li></ol>","p":"p561"},{"tag":"台灣數字","h":"年輕人往都會區，老人留在原鄉","b":"<div class=\"stat\"><div><strong>71.3%</strong><span>15–64 歲人口比例（2022）</span></div><div><strong>19.0%</strong><span>0–14 歲，比非原住民高 7.1 個百分點</span></div><div><strong>9.6%</strong><span>65 歲以上，比非原住民低 8.1 個百分點</span></div></div><p>2013 至 2022 年各年齡層設籍都會區的比例上升。除 65 歲以上外，主要設籍地依序是都會區、山地原鄉、平地原鄉。65 歲以上則主要在平地與山地原鄉。縣市分布依序為花蓮縣、桃園市、台東縣、屏東縣、新北市。</p>","p":"p561"},{"tag":"台灣數字","h":"平均餘命差距在縮小，但仍比全國少 6 歲多","b":"<div class=\"tbl\"><table><tr><th>2022 年</th><th>原住民</th><th>全國</th></tr><tr><td>0 歲平均餘命</td><td class=\"num\">73.65</td><td class=\"num\">79.84</td></tr><tr><td>男性</td><td class=\"num\">69.21</td><td class=\"num\">76.63</td></tr><tr><td>女性</td><td class=\"num\">78.05</td><td class=\"num\">83.28</td></tr></table></div><p>10 年來原住民平均餘命從 71.26 歲增加 2.39 歲，兩者差距維持在 6.19 到 8.77 歲，並逐漸縮小。男性差 7.42 歲，女性差 5.23 歲。嬰兒死亡率 6.3‰，是全國 4.1‰ 的 1.5 倍。</p>","p":"p561–562"},{"tag":"必背","h":"2022 年原住民十大死因，COVID-19 首次上榜排第 4","b":"<ol><li>惡性腫瘤</li><li>心臟疾病</li><li>慢性肝病及肝硬化</li><li>COVID-19</li><li>腦血管疾病</li><li>糖尿病</li><li>肺炎</li><li>事故傷害</li><li>高血壓性疾病</li><li>慢性下呼吸道疾病</li></ol><p>糖尿病自 2021 年起超前事故傷害，2022 年排第 6。</p>","p":"p562"},{"tag":"必背","h":"三類疾病：傳統傳染病、文化適應疾病、文化轉型疾病","b":"<ul><li><b>傳統傳染病</b>：肺結核、肺炎。原住民肺結核死亡率仍是全台的 3–4 倍。吸菸、飲酒、嚼檳榔盛行率較高，男性高於女性。</li><li><b>文化適應疾病</b>：肝病、自傷、意外事故、嚼檳榔。</li><li><b>文化轉型疾病</b>：肥胖、高血脂、代謝症候群，來自飲食和狩獵生活的改變。</li></ul>","p":"p562"},{"tag":"台灣數字","h":"死亡率與全國比：肝病 5 倍，高血壓 2 倍","b":"<div class=\"tbl\"><table><tr><th>標準化死亡率（/10 萬）</th><th>原住民</th><th>全國</th><th>倍數</th></tr><tr><td>慢性肝病與肝硬化（2022）</td><td class=\"num\">52.1</td><td class=\"num\">10.4</td><td class=\"num\">5</td></tr><tr><td>意外事故（2017）</td><td class=\"num\">42.7</td><td class=\"num\">20</td><td class=\"num\">2.1</td></tr><tr><td>心臟疾病（2022）</td><td class=\"num\">88</td><td class=\"num\">47.8</td><td class=\"num\">1.8</td></tr><tr><td>糖尿病（2022）</td><td class=\"num\">43.1</td><td class=\"num\">24.7</td><td class=\"num\">1.7</td></tr><tr><td>高血壓性疾病（2022）</td><td class=\"num\">33.3</td><td class=\"num\">16.2</td><td class=\"num\">約 2</td></tr></table></div>","p":"p562–563"},{"tag":"現場難題","h":"就醫三大障礙：經濟、地理、文化語言","b":"<p>1995 年全民健保實施，去除了經濟障礙，原住民納保率達 97%。</p><p>1999 年起的 <b>IDS</b>（山地鄉醫療給付效益提升計畫），先由花蓮門諾醫院在秀林鄉做，再推到 30 個山地鄉。除了教學醫院轉診與專科醫療，還有部落夜間與假日門診，緩解就醫可近性的地理障礙。</p><p>剩下的文化語言障礙，仍待處理。</p>","p":"p565–566"},{"tag":"核心觀念","h":"喝酒不只是個人問題，背後是文化解體的代價","b":"<p>書中指出，原住民承受了近百年從部落到現代社會的文化解體、流離失所、政治邊緣與適應壓力，飲酒成了最方便的逃避。外界談飲酒常引起「污名化」的反彈，例如「為什麼每次說原住民愛喝酒？」，於是關心就此卻步。</p><p>要有轉圜，得靠原住民社會自己認定健康問題存在且重要，問題才有改善的起點。</p>","p":"p564"},{"tag":"核心觀念","h":"傳統醫療消失，帶走的不只是草藥","b":"<p>西方醫療取代傳統醫療，原因有三：療效確定明顯、代表的社會經濟實力有實際助益、傳道者視傳統醫療為落後。</p><p>後果是草藥技能衰退，也斬斷了疾病與社會責任的連結。傳統上，違反規範的懲罰是生病與死亡，人們因此遵守共同規範。當這層約束消失，又沒建立新的價值與標準，可能使原住民失去精神支持的穩定基礎。</p><p>所以恢復傳統醫療文化，重點在重建意義與價值，不只是恢復草藥技能。</p>","p":"p564–565"},{"tag":"臨床做法","h":"部落節酒：由下而上，讓部落自己做","b":"<p>2000 年起在 30 個山地鄉推動「部落健康營造」，喚起部落自主改善健康的共識。2004 年原民會推動部落節酒，是首次以「健康社區」概念，與醫院精神科介入不同：</p><ol><li>先做部落資源調查</li><li>由民眾自己覺察，主動參與並簽署節酒公約</li><li>成立推動委員會，部落志工定期關懷</li><li>交通要道掛宣導布條，重要祭典宣導</li></ol><p>用親屬連帶與團體內控，在高雄那瑪夏區布農族部落有明顯進展。</p>","p":"p567"},{"tag":"必背","h":"2023 年原住民健康法：把健康權放進法律","b":"<ul><li><b>健康權法律化</b>：政府有責任縮短與全國的平均餘命差距</li><li><b>參與政策制定</b>：衛福部設原住民族健康政策會，原住民代表不得少於二分之一</li><li><b>專責單位</b>：國衛院設原住民族健康研究中心，建置健康資料庫</li><li><b>文化安全照護</b>：醫事人員要修習相關課程，原鄉優先進用族語或原住民醫事人員</li><li><b>傳統醫學研究</b>與推廣</li><li><b>專責預算與人才培育</b>：醫事科系保留公費名額給原住民學生</li></ul><p>書中提到的國際對照有美國 1976 年印地安健康改善法案、紐西蘭 Maori Health Action Plan、澳洲 Closing the Gap。</p>","p":"p566, p569"},{"tag":"趨勢","h":"2025 白皮書：六大策略重塑原住民醫療體系","b":"<ol><li>擬定原住民衛生政策與全國性計畫</li><li>針對特殊疾病與文化適應疾病（肝病、肺結核、自傷）訂專案，心理健康服務專章</li><li>醫療資源缺乏地區推 IDS 與缺醫村計畫</li><li>建置原住民親善醫院網路，醫事人員繼續教育納入文化認證課程</li><li>推動部落健康營造，強化緊急救護與後送</li><li>培養原住民醫事與社工人員</li></ol><p>核心指標是縮短平均餘命差距。主要指標包括降低嬰幼兒死亡率、肺結核與肝病死亡率、意外事故與自殺死亡率。</p>","p":"p567–569"},{"tag":"台灣數字","h":"文健站從 121 站成長到 525 站","b":"<div class=\"stat\"><div><strong>121 → 525</strong><span>文健站數，2016 年到 2024 年</span></div><div><strong>4,259 → 15,935</strong><span>照顧長者人數</span></div></div><p>長照 2.0 將原住民族長照納入專章。模式以部落為單位集體照顧，依需求每週開三日或五日，服務健康與亞健康長者，提供延緩失能活動和共餐。重度失能者的機構受限於規模，方向仍是日間照顧中心。</p>","p":"p569"},{"tag":"臨床做法","h":"文化敏感的衛教：用「少吃、節制」取代「戒掉、強制」","b":"<p>醫療以西方生物醫學為主，與其不符的行為常被貼上「不遵從」的標籤。對原住民的酒與檳榔，只從醫療切入、用傳統衛教，可能效果有限。</p><p>書中建議以人文關懷與尊重出發，把「強制」「戒掉」這類字眼換成「少吃」「節制」。也要避免對所有原住民用「都一樣」的護理標準，因為各族面對疾病與死亡時，希望怎麼被照顧、吃什麼、做什麼都不同。</p>","p":"p570"},{"tag":"趨勢","h":"文化安全是共同方向，但定義與指標還在形成","b":"<p>原住民健康法已把「文化安全」入法，美澳紐加也重視這個議題，但具體定義與評核指標仍在形成共識。「原住民友善醫院」預計 2026 年開始試辦，模式與成效還要評估。</p><p>台灣原住民的平均餘命比美澳紐加原住民都低，且除澳洲原住民男性外，與全國平均餘命的差距也較大。</p>","p":"p571"},{"tag":"趨勢","h":"PRIDoC：原住民醫師的太平洋國際平台","b":"<p>太平洋原住民醫師聯盟（PRIDoC）2000 年起辦雙年會，成員來自澳洲、美國、阿拉斯加、加拿大、紐西蘭、夏威夷與台灣。2014 年在花蓮舉辦，約 200 人參加，滿意度達八成以上。</p><p>預期效益包括：參與國際討論，共同塑造原住民健康願景；強調「研究論證」與主流社會對話；讓各國認識台灣原住民的文化與健康努力。2026 年底原住民醫學會將在台灣再度主辦。</p>","p":"p572–573"}],"recap":{"points":["原住民平均餘命仍比全國低 6 歲多，肝病、肺結核、意外事故與代謝性疾病的死亡率都明顯偏高。","改善靠制度與部落自主並行，包括全民健保、IDS、部落健康營造、節酒計畫、2023 年原住民健康法與白皮書。","臨床上要有文化敏感度，衛教用語改為少吃、節制，並尊重各族不同的照護需求。"],"quiz":[{"q":"原住民就醫的三大障礙是什麼？全民健保解決了哪一個？","a":"經濟、地理、文化語言三大障礙；全民健保主要去除了經濟障礙。"},{"q":"2004 年部落節酒計畫的特色是什麼？","a":"以健康社區概念由下而上，由部落民眾覺察、簽署節酒公約，靠志工與親屬連帶、團體內控來推動。"}]}},"36":{"posts":[{"tag":"台灣數字","h":"台灣第五大族群：新住民逾 60 萬人","b":"<div class=\"stat\"><div><strong>60 萬+</strong><span>新住民（含外籍與大陸、港澳配偶），約占總人口 2.6%</span></div><div><strong>94.8 萬</strong><span>2024 年底外僑人口（不含大陸、港澳）</span></div><div><strong>71.2 萬</strong><span>其中外籍移工，占 75.1%</span></div><div><strong>5.8 萬</strong><span>未歸化外籍配偶，占 6.1%</span></div></div><p>移民者的健康受遷移歷程、法律身分、工作條件、家庭角色、社會支持和文化適應等結構性因素影響，語言障礙和制度可近性不足，讓他們即使納入健保也難以充分使用資源。</p>","p":"p574–575"},{"tag":"核心觀念","h":"從「外勞」到「移工」：用詞改變，代表政策語言轉向","b":"<p>2019 年 5 月 1 日起，居留證事由由「外籍勞工」改為「移工」，語言由管理導向轉向權利與尊嚴。目前開放印尼、越南、菲律賓、泰國、馬來西亞、蒙古、印度七國移工，2025 年 11 月底約 86 萬人。</p><p>外籍配偶方面，婦女新知基金會 2003 年倡議以「新移民女性」取代「外籍新娘」，移民署 2012 年把外籍配偶與大陸配偶統稱為「新住民」。但書中提醒，社會若缺乏尊重與平等對待，光正名仍難實質改善處境。</p>","p":"p575–576"},{"tag":"核心觀念","h":"移工的工作與風險：3K 產業、長工時、失聯","b":"<p>移工制度起於 1980 年代的結構性缺工，1989 年專案引進，1992 年《就業服務法》施行後法制化。現多集中在製造、營造、農漁業與社福照護，長期面對高工時與高風險環境，加上語言與文化差異，身心壓力較高。</p><p>近年失聯移工逾 10 萬人，書中視為制度與勞動市場間的結構張力。移工議題已超出勞動管理，是涉及人權、社會支持與公共衛生的綜合課題。</p>","p":"p575"},{"tag":"必背","h":"外國人五類：健檢最嚴的是第二、三類","b":"<div class=\"tbl\"><table><tr><th>類別</th><th>對象</th></tr><tr><td>第一類</td><td>專業或技術人力，如教師、主管、運動教練</td></tr><tr><td>第二類</td><td>基層勞動人力，如製造、營造、農漁業、家庭幫傭與看護，健檢與管理最嚴格</td></tr><tr><td>第三類</td><td>中階技術人力，管理大致比照第二類</td></tr><tr><td>第四類</td><td>外國留學生、僑生，可兼職工作</td></tr><tr><td>第五類</td><td>已有居留或永久居留身分者，限制最少</td></tr></table></div><p>家庭看護工聘僱許可最長 12 年，符合條件可累計到 14 年。2022 年 4 月 30 日起「移工留才久用方案」，讓資深移工轉任中階技術家庭看護工，不受年限限制。</p>","p":"p576"},{"tag":"必背","h":"移工健檢時間表：入國前、入國 3 日內、6/18/30 個月","b":"<ol><li><b>入國前</b>：母國認可醫院檢查，須有 3 個月內合格證明，任一項不合格就不核發簽證</li><li><b>入國後 3 個工作日內</b>：國內指定醫院檢查，確認結果並補捉潛伏期才可檢出的病例</li><li><b>工作滿 6、18、30 個月前後 30 日內</b>：定期健檢</li></ol><p>項目包括胸部 X 光、漢生病、腸內寄生蟲糞便檢查、身體檢查，必要時加梅毒血清與麻疹、德國麻疹免疫確認。</p>","p":"p577–578"},{"tag":"必背","h":"健檢異常三種處理：疑似、可補救、確定不合格","b":"<ul><li><b>疑似或無法確認</b>（如 X 光疑似肺結核）：註明「需再檢查」，15 日內完成，逾期視為不合格</li><li><b>不合格但可補救</b>（如腸內寄生蟲）：雇主協助治療，65 日內完成治療與再檢，取得陰性證明才合格</li><li><b>確診法定傳染病</b>：非多重抗藥性結核病者通報後做都治（DOTS），完成療程即可視為合格；多重抗藥性結核，或累計未配合都治達 15 日以上，則不合格</li></ul><p>整體精神是預防、追蹤與可治療，不是一次性排除。</p>","p":"p578"},{"tag":"必背","h":"新住民健檢是一次性把關，不是長期追蹤","b":"<p>外籍配偶或申請居留、定居者，在申請時完成一次健檢，通常須是最近 3 個月內。項目有胸部 X 光、梅毒血清、腸內寄生蟲糞便、漢生病皮膚視診、身體檢查，並要有麻疹與德國麻疹抗體陽性或疫苗證明，沒有免疫力者補接種即視為合格。</p><p>取得居留或定居後，原則上不適用 6、18、30 個月定期健檢，除非身分轉為受聘僱外國人，或因疫情另行公告。</p>","p":"p579"},{"tag":"迷思","h":"健檢的盲點：精神狀態幾乎沒有不合格案例","b":"<p>實驗室與影像檢查容易做品質控管，但精神狀態評估長期被忽略。入境前已有躁鬱症、憂鬱症、思覺失調症、焦慮等，來台後在工作負荷、文化適應和心理壓力下可能被誘發或惡化。</p><p>實務上幾乎沒有不合格案例，原因包括：大量健檢時醫師問診時間有限、非精神專科醫師評估、語言障礙，以及受檢者刻意隱瞞病史。書中認為這是制度性的強化空間。</p>","p":"p579–580"},{"tag":"台灣數字","h":"2024 年移工健檢：不合格的主因是腸道寄生蟲","b":"<div class=\"tbl\"><table><tr><th>2024 年</th><th>受檢人數</th><th>不合格</th><th>寄生蟲</th><th>胸部 X 光</th></tr><tr><td>初入境</td><td class=\"num\">185,275</td><td class=\"num\">1,246（0.67%）</td><td class=\"num\">1,082</td><td class=\"num\">110</td></tr><tr><td>定期健檢</td><td class=\"num\">715,944</td><td class=\"num\">2,391（0.33%）</td><td class=\"num\">1,848</td><td class=\"num\">433</td></tr></table></div><p>梅毒不合格初入境 54 人、定期 109 人。受檢者以泰國、印尼、菲律賓、越南占大多數。</p>","p":"p580"},{"tag":"臨床做法","h":"愛滋政策轉向：2015 年前後取消入境與居留限制","b":"<ul><li>1990 年《後天免疫缺乏症候群防治條例》，2007 年改名為《人類免疫缺乏病毒傳染防治及感染者權益保障條例》，防治與保障並列</li><li>2015 年前後修法，刪除針對外籍 HIV 感染者的入境、停留與居留限制，HIV 檢驗也不再是外籍人士申請工作、學生簽證或居留證的必要項目</li><li>治療費：1997 年起提供 HAART。2017 年 2 月 4 日起，外籍感染者確診後前 2 年自行負擔，取得健保身分並完成 2 年治療後，回歸健保依慢性病模式給付</li></ul>","p":"p581–582"},{"tag":"臨床做法","h":"梅毒怎麼判不合格？看「通報定義」，不是單一抗體陽性","b":"<p>梅毒是第三類法定傳染病。常用 RPR、VDRL 篩檢，可能假陽性，需再用 TPHA、TPPA、FTA-ABS 等特異性試驗確認。</p><p>符合通報的情況：</p><ul><li>一、二、三期典型臨床表現加實驗室支持</li><li>無症狀但血清學符合潛伏性梅毒</li><li>曾治療但 RPR/VDRL 效價比前次上升 4 倍以上，疑似再感染或治療失敗</li></ul><p>不合格者在收到證明次日起 30 日內完成治療並取得完成治療證明，即可回復合格。</p>","p":"p582–583"},{"tag":"臨床做法","h":"腸道寄生蟲：依致病性分級，痢疾阿米巴最嚴","b":"<ul><li><b>直接合格</b>：人芽囊原蟲與多數非致病性阿米巴（大腸、哈氏、微小、嗜碘阿米巴），不需治療</li><li><b>不合格</b>：腸道蠕蟲蟲卵或其他有公共衛生意義的原蟲，65 日內治療並再檢陰性才回復合格</li><li><b>疑似痢疾阿米巴原蟲</b>（E. histolytica/E. dispar）：醫院暫不核發報告，24 小時內通報衛生主管機關，7 日內重新採檢 3 次新鮮糞便送疾管署確認。確認為 E. dispar 合格，E. histolytica 不合格，須治療後連續 3 次陰性才合格</li></ul>","p":"p583–584"},{"tag":"考點","h":"麻疹、德國麻疹、漢生病、登革熱，各自的防治重點","b":"<ul><li><b>德國麻疹</b>（第二類）：孕期前 20 週內感染可能造成先天性德國麻疹症候群（CRS）。免疫不足者補接種即可，育齡女性接種後須避孕 4 週，孕婦產後補接種</li><li><b>麻疹</b>（第二類）：空氣與飛沫傳播，境外移入是再傳入主因，免疫不足補接種</li><li><b>漢生病</b>（第三類）：由皮膚科醫師或受訓通過者檢查。須同時符合「持續性皮膚病灶合併感覺異常或神經腫大」與「抹片或病理檢出麻風桿菌或符合的肉芽腫反應」才不合格</li><li><b>登革熱</b>（第二類）：不在法定健檢項目，重點是症狀監測、通報與病媒蚊控制</li></ul>","p":"p584–586"},{"tag":"臨床做法","h":"移工的職安衛：語言可近性是職災預防關鍵","b":"<p>移工常暴露於機械傷害、墜落、感電、化學品、高溫噪音和肌肉骨骼負荷。雇主依法要做危害辨識與風險評估，並用移工看得懂的語言提供安全說明與防護訓練，如多語教材、圖像化指引、實地示範。</p><p>懷孕移工禁止從事危害母胎的工作。職災時享有與本國勞工相同的醫療與保險保障，但仍要加強權益宣導。心理健康與過勞方面，有多語諮詢、1955 專線與跨部門轉介。</p>","p":"p586"},{"tag":"台灣數字","h":"新住民女性：以育齡婚姻移民為主，三大交織風險","b":"<div class=\"stat\"><div><strong>614,673</strong><span>外籍及大陸（含港澳）配偶，2025 年 11 月底</span></div><div><strong>63.6%</strong><span>大陸及港澳籍</span></div></div><p>東南亞以越南籍最多。三個交織的面向：</p><ul><li><b>婦幼保健</b>：部分在納入健保前就已懷孕，政府以產檢補助提高可近性</li><li><b>心理衛生</b>：易有焦慮、憂鬱、睡眠障礙、身體化症狀，與育兒、照顧負荷和就業不穩交織。服務使用率仍偏低</li><li><b>家暴防治</b>：經濟依賴、居留不穩與支持網絡薄弱，使求助更困難，要結合心理支持與經濟賦權</li></ul>","p":"p586–587"}],"recap":{"points":["台灣移民以外籍移工和新住民為主，用詞從「外勞」改為「移工」，反映政策轉向權利與尊嚴。","移工健檢是入國前、入國後 3 日、6/18/30 個月的連續追蹤，異常依疑似、可補救、確定不合格處理，核心是可治療、可管理，新住民則是一次性把關。","各疾病處理不同：結核與漢生病走都治，寄生蟲與梅毒限期治療，麻疹與德國麻疹補接種，HIV 已取消入境限制，精神健康評估仍是缺口。"],"quiz":[{"q":"移工健檢結果「疑似需確認」時，再檢查期限是多久？逾期怎麼辦？","a":"收到證明次日起 15 日內完成再檢查，逾期直接視為不合格。"},{"q":"新住民取得居留後還要做 6、18、30 個月定期健檢嗎？","a":"原則上不用，除非身分轉為受聘僱外國人，或因疫情另行公告補檢。"}]}},"37":{"posts":[{"tag":"核心觀念","h":"旅遊感染的風險常被低估，因為人早就回家了才發病","b":"<p>部分傳染病潛伏期長，旅客回國後才發病，不一定被歸類成旅遊相關感染。症狀輕微或無症狀的人也可能根本沒就醫。</p><p>第一線臨床醫師是擋住境外移入傳染病的重要防線，要熟悉國內少見、但旅遊地風險高的疾病，包括流行地區、傳染途徑、症狀和預防方式。</p>","p":"p592–593"},{"tag":"必背","h":"黃熱病：多數人沒事，但重症致死率可達三到六成","b":"<div class=\"stat\"><div><strong>約55%</strong><span>感染後症狀輕微或無症狀</span></div><div><strong>約12%</strong><span>惡化出現黃疸、肝功能異常、出血</span></div><div><strong>30–60%</strong><span>重症致死率</span></div></div><p>流行在撒哈拉以南非洲與中南美洲，由斑蚊屬或趨血蚊屬叮咬傳染。預防靠疫苗加防蚊。</p>","p":"p593–594"},{"tag":"台灣數字","h":"台灣 64 例瘧疾，全部是境外移入","b":"<p>2014 至 2020 年台灣的 64 例瘧疾都來自國外。</p><ul><li>患者以 20 至 59 歲男性為主，夏秋兩季居多</li><li>逾七成感染自非洲，近二成自亞洲</li><li>超過半數是惡性瘧，其次是間日瘧</li></ul><p>台灣的傳播媒介矮小瘧蚊只出現在南部與東部部分縣市，和多數病例的分布並不重疊。</p>","p":"p594"},{"tag":"臨床重點","h":"瘧疾怎麼傳、怎麼辨認","b":"<p>瘧蚊在黃昏到黎明叮咬，把瘧原蟲注入血液。輸血、骨髓或器官移植、共用針具也能傳。</p><p>典型症狀是寒顫、高燒、出汗循環出現。沒治療可能走向黃疸、休克、肝腎衰竭、肺水腫、急性腦病變和昏迷。<b>惡性瘧致死率可超過 10%</b>。</p>","p":"p594–595"},{"tag":"必背","h":"狂犬病一旦發病，多半 1 到 2 週內死亡","b":"<p>95% 的感染發生在非洲與亞洲。所有哺乳類都能感染，開發中國家以犬貓為主。咬傷、抓傷最常見，黏膜接觸唾液或神經組織、被舔到擦傷處也有風險。</p><p>早期有發燒、頭痛、倦怠，咬傷處會出現異樣感或刺痛。進入急性神經期後出現譫妄、抽搐，以及<b>恐水症</b>（hydrophobia），多在 1 至 2 週內因心臟衰竭或呼吸麻痺死亡。</p>","p":"p595"},{"tag":"台灣數字","h":"旅行者腹瀉，三到七成旅客都會中","b":"<div class=\"stat\"><div><strong>30–70%</strong><span>旅客會發生旅行者腹瀉</span></div><div><strong>80–90%</strong><span>由細菌引起</span></div><div><strong>5–15%</strong><span>由病毒引起</span></div></div><p>第 1 週風險最高。細菌以腸毒素型大腸桿菌最常見，病毒有諾羅、輪狀、星狀病毒，原蟲較少見。</p>","p":"p595–596"},{"tag":"必背","h":"痢疾、霍亂、傷寒，三種都走糞口路線","b":"<div class=\"tbl\"><table><tr><th>疾病</th><th>特徵症狀</th></tr><tr><td>桿菌性痢疾</td><td>每日腹瀉 8 至 10 次以上、發燒、腹痛、裏急後重</td></tr><tr><td>霍亂</td><td>無痛性大量米湯樣水瀉，快速脫水、酸中毒</td></tr><tr><td>傷寒</td><td>發燒、頭痛、腹痛、相對性心跳減緩、肝脾腫大、紅疹</td></tr></table></div><p>目前國內可接種傷寒疫苗。曾有南亞、東南亞旅遊史的廣泛抗藥性（XDR）傷寒境外移入個案，所以旅遊史會影響抗生素選擇。</p>","p":"p596"},{"tag":"台灣數字","h":"台灣年輕人多半沒有 A 肝抗體","b":"<p>2013 年台灣研究發現，20 歲以下族群的 A 型肝炎血清抗體盛行率在 10% 以下，大部分兒童和青少年沒有抗體，有群聚或大流行的風險。</p><p>6 歲以下感染約 70% 無症狀或輕微；年紀較大的兒童和成人約 70% 會有症狀，且嚴重度隨年齡增加。可能併發猛爆型肝炎。預防要靠飲食衛生和 A 型肝炎疫苗。</p>","p":"p596"},{"tag":"必背","h":"流腦帶與朝覲：腦膜炎雙球菌的旅遊風險","b":"<p>撒哈拉以南橫跨非洲中部有「流腦帶」（meningitis belt），過去以 A 群為主，現在轉為 W 與 C 群為主。人群聚集的活動容易傳播，朝覲（Hajj）曾爆發過疫情。</p><ul><li>即使給抗生素，致死率仍有 10% 至 15%</li><li>5% 至 20% 病人跳過腦膜炎直接敗血症，出現瘀斑、休克，致死率可高達 40%</li></ul>","p":"p597–598"},{"tag":"必背","h":"流腦疫苗：4 價結合型一劑，保護 5 年","b":"<p>預計 11 月到隔年 3 月流行季前往高風險地區者，可在國內接種 4 價（A、C、W-135、Y）不活化結合型疫苗（Menveo，適用 2 至 55 歲，1 劑）。</p><ul><li>約 7 至 10 日產生保護力，可維持 5 年</li><li>暴露於高風險環境者每 5 年追加 1 劑</li><li>沙烏地阿拉伯要求赴麥加朝覲或副朝覲的 1 歲以上者，持有效接種證明（結合型 5 年內、接種滿 10 日）</li><li>B 型疫苗（Bexsero）已上市，但不常規建議旅遊者接種，依目的地疫情評估</li></ul>","p":"p603"},{"tag":"臨床重點","h":"麻疹、流感、HIV、梅毒淋病、M 痘，一張表看重點","b":"<div class=\"tbl\"><table><tr><th>疾病</th><th>旅遊重點</th></tr><tr><td>麻疹</td><td>冬春好發，空氣、飛沫傳染；有柯氏斑點；高風險者建議自費打 MMR</td></tr><tr><td>流感</td><td>最有效預防是流感疫苗；熱帶可全年傳播，南半球高峰與北半球相反</td></tr><tr><td>HIV</td><td>旅客風險不高；暴露前預防（PrEP）可考慮，暴露後 72 小時內可採 PEP</td></tr><tr><td>梅毒、淋病</td><td>全程正確使用保險套，搭配水性潤滑劑，不用油性</td></tr><tr><td>M 痘</td><td>避免接觸齧齒、靈長類與病死動物；食物要煮熟</td></tr></table></div>","p":"p596–600"},{"tag":"時程","h":"旅遊前 4 到 6 週就該來門診","b":"<p>瘧疾預防藥要在抵達前 1 至 2 日或 2 至 3 週開始吃。疫苗約 2 週後才有保護力，需要 2 劑的疫苗（如 MMR、水痘）兩劑通常要間隔 4 週以上。</p><p>即使不到 4 至 6 週，仍建議來評估，還有機會接種，多劑次疫苗可選加速時程或至少打完第一劑。評估要看個人因素（病史、懷孕、疫苗史、用藥）和旅遊因素（地點、海拔、天數、季節、型態、特殊活動）。</p>","p":"p600"},{"tag":"工具","h":"查疫情、查疫苗要求，去哪裡找","b":"<ul><li>疾管署「國際旅遊與健康」的「國際疫情及建議等級」，可查國際重要疫情</li><li>同一區塊的「旅遊醫學」下有「國際旅遊處方箋」，可查特定國家的疫情、接種規定、瘧疾風險</li><li>美國 CDC 的 Travelers' Health 與 Yellow Book，可查各國瘧疾風險與接種建議</li><li>英國 TravelHealthPro 也提供各國瘧疾風險</li></ul><p>瘧疾風險受氣溫、海拔、地貌影響，不能只用國家分，要看旅遊地、型態與住宿條件。</p>","p":"p601–602"},{"tag":"必背","h":"黃熱病疫苗：打一劑終身有效","b":"<p>活性減毒疫苗，接種 10 日後生效。一劑後終身保護，證明書也終身有效，一般人不需每 10 年補打。</p><ul><li>建議追加者包括懷孕時接種或接種後做造血幹細胞移植者、HIV 感染者或高風險且距上次超過 10 年者、常規處理野生型病毒的實驗室人員（每 10 年）</li><li>禁忌包括未滿 6 個月嬰兒、蛋白嚴重過敏、免疫不全者</li><li>6 至 8 個月、60 歲以上、孕婦、哺乳婦女等，風險大於副作用時可考慮</li></ul>","p":"p602"},{"tag":"必背","h":"狂犬病疫苗：暴露前 3 劑，暴露後 2 劑或 4 劑","b":"<div class=\"tbl\"><table><tr><th>情況</th><th>做法</th></tr><tr><td>暴露前預防</td><td>第 0、7、21（或 28）日各 1 劑，共 3 劑，自費</td></tr><tr><td>已完成 PrEP 或完整 PEP，之後被咬</td><td>只需 2 劑（第 0、3 天），不用免疫球蛋白</td></tr><tr><td>未完成暴露前預防，被咬</td><td>4 劑（第 0、3、7、14 天）</td></tr></table></div><p>狂犬病免疫球蛋白要儘速在傷口浸潤注射，可與首劑疫苗同天打，但不可同部位或混在同一針筒。首劑疫苗已超過 7 天且當時沒打，就不再給。</p>","p":"p603–604"},{"tag":"臨床做法","h":"瘧疾預防藥三選一：服藥時程不同","b":"<div class=\"tbl\"><table><tr><th>藥物</th><th>用法</th><th>主要禁忌</th></tr><tr><td>Atovaquone/proguanil</td><td>每日 1 次，抵達前 1 至 2 日開始，離開後續服 7 日</td><td>孕婦、哺乳（嬰兒小於 5 公斤）、嚴重腎功能不全</td></tr><tr><td>Doxycycline</td><td>每日 1 次，抵達前 1 至 2 日開始，離開後續服 4 週</td><td>孕婦、小於 8 歲</td></tr><tr><td>Mefloquine</td><td>每週 1 次，抵達前 2 至 3 週開始，離開後續服 4 週</td><td>精神疾病史、痙攣或癲癇病史</td></tr></table></div><p>Mefloquine 可用在各孕期與哺乳期。Doxycycline 注意光敏感。</p>","p":"p604–606"},{"tag":"臨床做法","h":"旅途中的飲食與防蚊要點","b":"<ul><li>避免路邊攤、生或未熟的肉類海鮮蛋、生菜沙拉和帶皮水果（可自己削皮者除外）、自來水、來路不明的冰塊、未消毒乳製品</li><li>餐前、如廁後用肥皂洗手；沒水時用酒精濃度 ≥60% 的乾洗手液</li><li>穿淺色長袖長褲包鞋，選有紗窗的住處或完整蚊帳</li><li>防蚊劑成分：DEET、Picaridin、IR3535。先擦防曬，隔 15 分鐘再擦防蚊劑</li></ul>","p":"p604–605"},{"tag":"必背","h":"回國後 21 天內出現症狀，立刻就醫並交代旅遊史","b":"<p>入境時有嘔吐、腹瀉、發燒、出疹、黃疸等症狀，要通知機組人員或檢疫人員。多數旅遊相關傳染病潛伏期在 21 日內，返國 21 日內出現症狀應儘快就醫，並告知旅遊史、活動史、飲食史和動物與人員接觸史。</p><ul><li>潛伏期通常小於 2 週：登革熱等蟲媒病毒、流感、旅行者腹瀉</li><li>潛伏期 2 至 6 週：病毒性肝炎、急性 HIV、利什曼原蟲症、瘧疾、傷寒</li><li>一年內去過瘧疾流行區的人，鑑別診斷都要納入瘧疾</li></ul>","p":"p605"},{"tag":"考點","h":"診斷法定傳染病沒通報，醫師可罰 9 到 45 萬","b":"<p>依傳染病防治法第 39 條第 1 項，醫師發現傳染病或疑似傳染病，要立即採取感染控制措施並通報當地主管機關。時限依類別為 24 小時至 1 週。</p><div class=\"stat\"><div><strong>9–45萬</strong><span>醫師未依時限通報的罰鍰（新台幣）</span></div><div><strong>30–200萬</strong><span>可併罰所屬醫事機構</span></div></div>","p":"p607"},{"tag":"特殊族群","h":"慢性病、嬰幼兒、孕婦的旅遊重點","b":"<ul><li><b>慢性病</b>：病況要先控制好，出發前 4 至 6 週諮詢。瘧疾預防藥可能與抗凝血劑、抗組織胺、抗癲癇藥、抗生素、抗黴菌藥交互作用</li><li><b>嬰幼兒</b>：2 個月以下不適用 DEET、picaridin、IR3535；2 個月至 2 歲只建議 10% 至 30% DEET；picaridin 與 IR3535 僅適用 2 歲以上</li><li><b>孕婦</b>：流感與 COVID-19 疫苗任何孕期可打；多數活性減毒疫苗禁忌；黃熱病疫苗為相對禁忌。瘧疾易造成重度貧血、早產或流產，應盡量避免前往流行區</li></ul>","p":"p607–608"}],"recap":{"points":["旅遊相關傳染病常在回國後才發病，臨床醫師要熟悉流行地區、傳染途徑、症狀與預防，並詢問旅遊史。","行前 4 至 6 週評估風險，依需要接種黃熱病、流腦、狂犬病等疫苗，或開立瘧疾預防藥。","返國 21 天內有症狀要儘速就醫，醫師須注意法定傳染病通報時限，特殊族群要個別評估。"],"quiz":[{"q":"黃熱病疫苗接種一劑後保護力多久？一般人需要追加嗎？","a":"一劑即終身有效，證明書也終身有效，一般健康民眾不需追加。"},{"q":"完成暴露前預防接種的人被動物咬傷，暴露後要打幾劑狂犬病疫苗？要打免疫球蛋白嗎？","a":"只需 2 劑（第 0、3 天），不需要免疫球蛋白。"}]}},"38":{"posts":[{"tag":"核心觀念","h":"經濟艙症候群：久坐不動，小腿就可能長血栓","b":"<p>下肢靜脈回流靠肌肉收縮。久坐不動會造成血液鬱積，進一步在深層靜脈形成血栓，就是<b>深層靜脈栓塞</b>（DVT）。西方人發生率比東方人高，飛機又比其他交通工具更高，所以叫經濟艙症候群。</p><p>較大的血栓會造成局部紅、熱、腫、痛。血栓跑到肺部就是肺栓塞，出現胸痛、呼吸困難，甚至死亡，嚴重者常在機上或抵達機場時就發作。</p>","p":"p610–611"},{"tag":"必背","h":"DVT 的危險因子，一次記十項","b":"<ul><li>曾有 DVT 或肺栓塞，家族有相關病史</li><li>吸菸、BMI 超過 30</li><li>使用口服避孕藥或賀爾蒙治療</li><li>懷孕、癌症病人</li><li>近期外傷或重大手術（尤其腹腔、骨盆腔、下肢）</li><li>遺傳性凝血功能異常、嚴重心衰竭</li></ul><p>高危險族群旅遊前要先找旅遊醫學醫師諮詢。</p>","p":"p611"},{"tag":"臨床做法","h":"長途飛行預防 DVT：每 2 到 3 小時動一動","b":"<ul><li>每 2 至 3 小時起身活動 3 至 5 分鐘，空間受限就在座位上伸展，特別是足部</li><li>手提行李不要放腳下</li><li>穿寬鬆衣物，可考慮彈性襪</li><li>多喝水，避免咖啡與酒精等利尿飲料，避免安眠藥</li></ul><p>高風險者有些醫師會建議旅程前後使用口服抗凝劑（DOACs），但要個別評估，不是通用建議。</p>","p":"p611"},{"tag":"臨床做法","h":"動暈症：座位選對、視線放遠","b":"<p>動暈症是平衡系統受到干擾，例如身體靜止、眼睛卻看到移動。約 5% 的人有過經驗，2 至 12 歲兒童最常見，女性高於男性（孕婦與經期更明顯），有偏頭痛病史者也較易發生。</p><ul><li>坐最穩的位置：船中央、機翼附近、汽車前座、巴士中段偏前</li><li>視線固定在遠處或閉眼，避免看書和手機</li><li>避開悶、汽油味等刺激環境</li></ul>","p":"p611–612"},{"tag":"必背","h":"動暈症用藥：Meclizine 與東莨菪鹼貼片","b":"<div class=\"tbl\"><table><tr><th>藥物</th><th>用法</th><th>注意</th></tr><tr><td>Meclizine（第一代抗組織胺）</td><td>旅程前 30 至 60 分鐘服用</td><td>口乾、嗜睡、頭暈；青光眼、哮喘、前列腺肥大排尿困難者避免</td></tr><tr><td>Scopolamine 貼片</td><td>出發前 4 至 6 小時貼在耳後等無毛處，適合持續數日的行程</td><td>先諮詢醫師</td></tr></table></div>","p":"p612"},{"tag":"核心觀念","h":"時差：往東飛比往西飛更難調","b":"<p>時差是生理時鐘和自然晝夜不協調造成。一般跨越 4 至 6 個時區就會發生，小孩與老人調節較差，嬰幼兒較不受影響。</p><p>西向東飛行時間縮短，東向西飛行時間拉長，而多數人的生理時鐘約 24.5 小時，所以<b>由西向東造成的時差更嚴重、調整更久</b>。症狀有焦躁、失眠、注意力不集中、倦怠、腸胃不適、情緒低落，適應後會消失。</p>","p":"p612"},{"tag":"臨床做法","h":"調時差三階段：出發前、飛行中、抵達後","b":"<ul><li><b>出發前</b>：盡量搭白天抵達的班機；往東飛行前 2 天每天提早 1 至 2 小時就寢，往西則延後 1 至 2 小時</li><li><b>飛行中</b>：限制酒精與咖啡因，手錶調成目的地時間，盡量睡</li><li><b>抵達後</b>：白天多曬太陽，依當地時間吃飯活動，太累可喝少量咖啡因或小睡 20 至 30 分鐘</li></ul><p>褪黑激素效果與安全性仍有爭議，台灣未核准用於調時差，尚未列入常規建議。</p>","p":"p612–613"},{"tag":"定義","h":"高海拔疾病三兄弟：AMS、HAPE、HACE","b":"<div class=\"tbl\"><table><tr><th>疾病</th><th>重點</th></tr><tr><td>急性高山病 AMS</td><td>抵達 6 至 12 小時發生，頭痛加上虛弱、腸胃症狀、頭暈或睡不好任一項，多在 24 至 48 小時緩解</td></tr><tr><td>高海拔肺水腫 HAPE</td><td>非心因性肺水腫，休息時就喘、咳嗽、胸悶，常快速致死</td></tr><tr><td>高海拔腦水腫 HACE</td><td>常接在 AMS 之後，協調喪失、步態不穩、意識改變，常快速致死</td></tr></table></div>","p":"p613"},{"tag":"核心觀念","h":"高山症無法預測，體能好也不保險","b":"<p>海拔上升使氧分壓下降，身體要靠高度適應（acclimatization）來應付。當適應速度趕不上上升速度，就會發病。</p><p>沒有好的篩選工具可預測，因為每個人適應的能力與速度不同，且和平地體能表現與訓練無明顯相關。</p><ul><li><b>外在危險因子</b>：快速上升、絕對高度、睡眠高度、激烈運動、寒冷低體溫、酒精等中樞抑制劑</li><li><b>內在危險因子</b>：曾有高山症、長年住低海拔、肺動脈高壓、心或肺內分流、COPD</li></ul>","p":"p613–614"},{"tag":"考點","h":"高山症怎麼診斷：頭痛加一項，步態不穩是腦水腫早期指標","b":"<p>在高海拔的任何病症，先假定是高山病，直到證明是別的疾病。診斷準則是露易絲湖評分（Lake Louise score）。</p><ul><li>AMS：有登高、頭痛，加頭暈、失眠、噁心嘔吐、虛弱至少一項；少數無頭痛者，五個症狀中符合三項也可診斷</li><li>HAPE：症狀（休息時呼吸困難、咳嗽、虛弱、胸悶）與徵兆（囉音或哮鳴音、中心型發紺、呼吸過速、心搏過速）各至少兩項</li><li>HACE：AMS 加步態不穩或意識改變，或沒有 AMS 症狀但有這兩項</li></ul><p>步態可用腳跟接腳尖走 5 至 10 公尺直線來測。3 歲以下用孩童露易絲湖指數。</p>","p":"p614–615"},{"tag":"必背","h":"高山症治療：往下走最有效","b":"<p>治療原則是降低高度、給氧或減少耗氧、增加環境壓力、藥物。<b>降低高度是公認最重要且最有效的</b>，一般下降 500 至 1,000 公尺就足以改善。</p><p>無法立刻下降時，就地休息、給氧，或用加壓袋（Gamow bag）增加環境壓力，再搭配藥物。</p>","p":"p614–615"},{"tag":"必背","h":"高山症用藥對照：哪個藥治哪個病","b":"<div class=\"tbl\"><table><tr><th>藥物</th><th>有效於</th><th>重點</th></tr><tr><td>Acetazolamide</td><td>AMS</td><td>每 8 至 12 小時 250 mg；磺胺過敏、蠶豆症禁用</td></tr><tr><td>Dexamethasone</td><td>AMS、HACE，對 HAPE 無效</td><td>每 6 小時 4 mg；僅留給不能用 Diamox 或嚴重又無法下降者</td></tr><tr><td>Nifedipine</td><td>HAPE</td><td>先給 10 mg 舌下錠，之後每 12 小時 20 至 30 mg</td></tr><tr><td>Sildenafil、tadalafil</td><td>HAPE</td><td>50 mg 每 8 小時、10 mg 每 12 小時；不可併用硝酸鹽類</td></tr></table></div>","p":"p615"},{"tag":"考點","h":"高山症風險分三級，中高風險就要吃預防藥","b":"<ul><li><b>低度</b>：無病史，2 天以上到 2,500 至 3,000 公尺，超過 2,500 公尺後睡眠高度每日升不超過 500 公尺，每升 1,000 公尺多留一天</li><li><b>中度</b>：有病史且 2 天內爬 2,500 至 2,800 公尺，或無病史但 2 天內爬超過 2,800 公尺，或超過 3,000 公尺後每日升超過 500 公尺</li><li><b>高度</b>：有嚴重病史且 2 天內爬超過 2,800 公尺，或 2 天內升超過 3,500 公尺，或沒安排適應時間，或有其他共病</li></ul><p>中高風險者在上升到 2,500 公尺以上前 1 天開始，每 8 至 12 小時吃 125 mg 丹木斯，到抵達最高點後 2 至 3 天。</p>","p":"p616"},{"tag":"必背","h":"潛水的減壓病：氮氣在上升時變成氣泡","b":"<p>減壓病（decompression sickness）俗稱潛水伕病。依亨利定律，壓力越高氣體溶得越多。下潛後身體充滿氮等惰性氣體，上升時外界壓力降低，氣體從血液中析出成氣泡，阻塞血流並引發發炎或血栓。</p><ul><li><b>第一型</b>：氣泡在肢體、關節、皮膚，主要是深部疼痛，常見膝與肩關節，移動患處不會加重或緩解</li><li><b>第二型</b>：較嚴重，在神經系統、前庭或心肺循環，有被束縛感、腰背痛、腳底羊毛感、麻痺，也可能暈眩、耳鳴、聽力喪失</li></ul>","p":"p616–617"},{"tag":"臨床做法","h":"疑似減壓病：先給 100% 氧氣，快送高壓氧","b":"<p>診斷靠臨床表現。抽血、胸部 X 光、腦部 CT、MRI 都不特異或幫助有限，MRI 可用於再加壓後評估神經後遺症。</p><ul><li>到院前給 100% 氧氣、盡量減少氮氣吸入，並給等張溶液靜脈輸液</li><li>盡快送到有高壓氧設備的單位，最好在症狀出現 6 小時內開始再加壓治療</li><li>即使到院時症狀已輕微，只要懷疑就要做再加壓，因為輕微神經損傷可能進展成永久後遺症</li></ul><p>預防上，不舒服就停止潛水，上升要慢，過程持續吐氣不可憋氣。</p>","p":"p617–618"},{"tag":"必背","h":"熱疾病：熱衰竭有汗，中暑無汗","b":"<p>高危險族群包括 65 歲以上、4 歲以下、慢性病、使用利尿劑或部分心血管與精神科藥物、曾中暑、肥胖、脫水或酒癮者。</p><div class=\"tbl\"><table><tr><th>類型</th><th>重點</th></tr><tr><td>輕度（熱痙攣、熱昏厥、熱水腫、熱疹）</td><td>水份與電解質流失，陰涼處休息並補充</td></tr><tr><td>熱衰竭</td><td>脫水，有排汗，中心體溫正常或低於 40°C；移到陰涼處平躺、補水與電解質</td></tr><tr><td>中暑</td><td>體溫調節中樞失常，超過 40.5°C，皮膚乾燥無汗；冷水噴灑、強力風扇、冰敷頸腋鼠蹊並盡快送醫</td></tr></table></div>","p":"p618–619"},{"tag":"必背","h":"低溫傷害：低體溫症是中心體溫低於 35°C","b":"<p>老人產熱效率差，小孩顫抖產熱能力不足。淋雨造成排汗過度散熱也可能引起低體溫。</p><ul><li><b>低體溫症</b>：症狀有顫抖、心跳加快、說話含糊、意識混亂、嗜睡。處理是移到溫暖處，換掉濕衣，蓋防風衣，儘快就醫</li><li><b>凍傷</b>：皮膚白、轉紅紫、組織死亡則轉黑。分四級，第四級全層皮膚、皮下與骨頭受傷，截肢風險高。用 37 至 40°C 溫水回溫，不可用熱水</li><li><b>雪盲</b>：雪地活動 8 至 12 小時後出現，5 至 7 天消除，用冷開水沖眼並以眼罩休息</li></ul>","p":"p619–620"},{"tag":"臨床重點","h":"曬傷：UVA 曬黑老化，UVB 曬傷致癌","b":"<ul><li><b>UVA</b>（315–400 nm）：穿透力強，到達地表的量是 UVB 的 100 倍，曬黑、老化、皺紋</li><li><b>UVB</b>（280–315 nm）：曬傷，與皮膚癌有關</li></ul><p>紫外線指數：0 至 2 低度、3 至 5 中度、6 至 7 高度、8 至 10 極高度、11 以上重度。</p><p>曬傷約在曝曬 4 小時後開始，24 至 36 小時惡化，3 至 5 天恢復。長期曝曬增加皮膚癌，也會造成白內障與黃斑部病變。</p>","p":"p620"},{"tag":"臨床做法","h":"慢性病患者旅遊前的時間表","b":"<p>慢性病患者並不需要放棄旅遊，重點是行前做足準備。台灣三高人口盛行率逐年上升，行政院 2025 年提出三高防治 888 計畫（80% 找得出、80% 介入、80% 有改善）。</p><ul><li><b>行前 4 至 6 週</b>：旅遊醫學門診，確認疫苗、預防用藥、慢性病藥量、醫療器材</li><li><b>行前 3 至 4 週</b>：準備病歷摘要、過敏史、用藥與醫療單位聯絡資訊，了解保險與後送條件</li><li><b>行前 1 至 2 天</b>：藥物、備用藥與醫療資訊放進登機行李</li></ul>","p":"p620–621"},{"tag":"台灣數字","h":"旅遊者健康問題的全貌","b":"<div class=\"stat\"><div><strong>20–70%</strong><span>旅程中有健康相關問題</span></div><div><strong>&lt;5%</strong><span>需要就醫</span></div><div><strong>&lt;0.1%</strong><span>需要急診服務</span></div><div><strong>1/10萬</strong><span>約有 1 人死亡</span></div></div>","p":"p621"}],"recap":{"points":["交通相關疾病包括 DVT、動暈症與時差，重點在辨識危險因子、選對座位與作息調整，以及用藥時機。","高海拔疾病要慢慢上升，治療首選降低高度；潛水的減壓病與動脈氣體栓塞要給 100% 氧氣並盡快再加壓。","高溫、低溫與紫外線都會傷身，要分辨熱衰竭與中暑、凍傷分級，慢性病患者要在行前 4 至 6 週做準備。"],"quiz":[{"q":"為什麼由西向東飛行的時差通常比由東向西更嚴重？","a":"西向東飛行時間縮短，東向西時間拉長，而多數人的生理時鐘約 24.5 小時，所以前者更難調整。"},{"q":"高山症最重要且最有效的治療是什麼？降多少通常就夠？","a":"降低高度，一般下降 500 至 1,000 公尺就足以使症狀改善。"}]}},"39":{"posts":[{"tag":"核心觀念","h":"陽光、水、空氣、土壤任何一項被污染，人就會生病","b":"<p>環境污染常來自人類為了更舒適的生活而進行的開發與工業化，其中以工業發展帶來的工作場所污染與周遭生活環境污染最嚴重。歷史上的公害事件一再在不同地方、不同人群重演。</p><p>主要議題有三類：環境污染（空氣、水、土壤中的鉛、殺蟲劑、工業化學品）、氣候變化、職業危害（石棉、噪音、化學物質）。家醫科醫師站在第一線，若能想到疾病可能由環境污染造成，就可能阻止事件擴大。</p>","p":"p626–627"},{"tag":"定義","h":"環境荷爾蒙：從外面進來、干擾內分泌的化學物質","b":"<p>環境荷爾蒙（environmental hormone，或 endocrine disruptor）指外因性干擾生物體內分泌系統的化學物質，可模仿、加強、干擾或抗拒體內荷爾蒙的正常活動。嚴重時阻害生殖機能或引發惡性腫瘤，對懷孕期胚胎和成長初期影響特別大，例如多氯聯苯、戴奧辛。</p><p>目前公告約 70 種，殺蟲劑及其代謝物最多。</p>","p":"p627"},{"tag":"必背","h":"環境荷爾蒙的分類比例","b":"<div class=\"stat\"><div><strong>26 種</strong><span>殺蟲劑或代謝物（37%）</span></div><div><strong>9 種</strong><span>殺菌劑（13%）</span></div><div><strong>9 種</strong><span>除草劑（13%）</span></div><div><strong>9 種</strong><span>塑膠塑化劑（13%）</span></div></div><p>農藥類在台灣有些不曾使用、有些已禁用，使用中的依農藥管理法及環境用藥管理法嚴格管制。</p>","p":"p627"},{"tag":"核心觀念","h":"戴奧辛怎麼進身體，主要靠吃","b":"<p>戴奧辛是一群高含氯結構化合物的統稱，無色無味、高脂溶性，易累積在脂肪組織。毒性最強、研究最廣的是 2,3,7,8-TCDD。來源常見於含塑膠垃圾的焚燒、殺蟲劑製造，以及用氯化物漂白紙張。</p><p>進入人體有吸入、接觸、食入三條路，<b>主要途徑是吃到含戴奧辛的魚類、肉品與乳製品等畜產品</b>。</p>","p":"p627"},{"tag":"考點","h":"戴奧辛的危害清單：致癌、生殖、內分泌、免疫","b":"<ul><li><b>致癌</b>：IARC 2016 年將 TCDD 列為第一級致癌物，但體內濃度與癌症的關係尚無明確結果</li><li><b>生殖</b>：動物實驗有子宮內膜增生與異位、睪丸萎縮、精子減少</li><li><b>內分泌</b>：影響甲狀腺素代謝，並阻斷 estrogen receptor，可能影響乳癌賀爾蒙治療</li><li><b>免疫</b>：動物實驗降低體液與細胞免疫</li><li><b>先天缺陷</b>：動物實驗中被視為致突變劑</li></ul>","p":"p627–628"},{"tag":"臨床重點","h":"戴奧辛中毒的臨床表現，最典型是氯痤瘡","b":"<p>臨床上少見。2001 年 EHP 的 2 例急性高劑量暴露病人，除輕微腸胃不適外，主要是嚴重的皮膚氯痤瘡，約在接觸後 6 至 8 週出現，可長在顴骨、耳朵或耳後，甚至手掌腳掌。2004 年烏克蘭總統尤申科遭下毒，臉部嚴重變形，是知名案例。</p><p>檢驗可見正球性貧血、白血球過多、血脂異常升高。目前沒有特定藥物能消除戴奧辛的傷害，只能治療症狀，曾用 A 酸、類固醇、抗生素，蔗糖聚酯（olestra）也被試用過。</p>","p":"p628–629"},{"tag":"核心觀念","h":"化學毒氣的傷害，往往數月到數年後才浮現","b":"<p>化學毒氣（CWAs）除急性生命威脅外，還會留下不可逆的長期後遺症。</p><ul><li><b>芥子氣</b>（糜爛性）：破壞 DNA，慢性支氣管炎、支氣管擴張、肺纖維化，慢性角膜炎，被列為第一類致癌物，皮膚留下難癒合的疤痕</li><li><b>神經毒劑</b>（沙林、VX）：抑制乙醯膽鹼酯酶，長期焦慮、憂鬱、睡眠障礙、記憶衰退，可能增加類帕金森氏症風險</li><li><b>光氣、氰化物</b>：光氣可致 COPD，氰化物大劑量倖存者可因基底核受損出現帕金森症</li></ul><p>倖存者也常有創傷後壓力症候群（PTSD）。</p>","p":"p629"},{"tag":"台灣案例","h":"烏腳病：一口深井水，毀了台灣西南沿海","b":"<p>烏腳病是台灣西南沿海特有的末梢血管阻塞疾病，足部發黑而得名，日治時期 1920 年就有零星案例。病例以嘉義布袋、義竹與台南學甲、北門四個濱海鄉鎮最多，都在急水溪出海口附近。</p><p>當地淺層井水過鹹，居民改打 100 至 200 公尺的深井取水。研究發現烏腳病與飲用深井水有關。</p>","p":"p629–630"},{"tag":"台灣數字","h":"深井水的砷含量，超標近十倍以上","b":"<div class=\"stat\"><div><strong>0.4–0.6</strong><span>深井水砷含量（ppm）</span></div><div><strong>0.05</strong><span>國家容許標準（ppm）</span></div></div><p>一般認為烏腳病與慢性砷中毒有關。但深井水還含腐植酸等物質，且世界上其他更嚴重的砷中毒地區沒有烏腳病報告，所以有學者質疑砷是原因。不過飲用深井水是主因，這點普遍被接受。</p>","p":"p630"},{"tag":"臨床重點","h":"烏腳病的症狀，以及砷的長遠影響","b":"<p>初期肢端血流不順，皮膚蒼白或紫紅，麻痺、發冷、發紺，受壓刺痛，可能間歇性跛行。惡化會劇烈疼痛，嚴重者需截肢，手指也會受影響。流行地區其他週邊血管疾病與冠狀動脈疾病的死亡率也較高。</p><p>政府在流行地區普及自來水後，病人大幅減少。但後續發現當地皮膚癌、膀胱癌、腎臟癌、肺癌、肝癌的死亡率與發生率都較高。1996 年宜蘭頭城、五結沿海也發現地下水含砷過高與疑似病例，中國、印度、孟加拉、智利、美國等地也有地區性砷中毒。</p>","p":"p630"},{"tag":"定義","h":"PM2.5 是什麼，台灣有多少來自境外","b":"<p>懸浮微粒（PM）中粒徑小於或等於 2.5 微米的粒子稱為 PM2.5，單位是微克/立方公尺。台灣 PM2.5 境外傳輸約 37%，境內污染約 63%。</p><ul><li><b>自然源</b>：火山灰、塵灰，佔極少數</li><li><b>原生性</b>：火力發電廠、石化廠、工廠燃燒不完全，含重金屬、戴奧辛、多環芳香烴，以及柴油車的有機碳</li><li><b>衍生性</b>：硫氧化物、氮氧化物、有機碳化合物經日照後產生硫酸鹽、硝酸鹽等</li></ul>","p":"p630–631"},{"tag":"研究","h":"PM2.5 進肺之後，心血管先出事","b":"<p>PM2.5 進入肺部會引發全身性發炎與氧化壓力，是心肌梗塞、中風等心血管事件的主因。年長者與慢性病患是易感族群，住院率與死亡風險明顯增加。健康效應包括支氣管炎、氣喘、心血管疾病、肺癌，長短期暴露都會提高呼吸道疾病與死亡風險。</p><p>雙北市調查 689 名 35 至 65 歲、沒有冠心病的中年男性，住家 PM2.5 黑碳濃度愈高，頸動脈壁愈厚，動脈硬化風險愈高。</p>","p":"p631"},{"tag":"必背","h":"游離與非游離輻射，傷害差很多","b":"<div class=\"tbl\"><table><tr><th>類型</th><th>特性</th></tr><tr><td>游離輻射</td><td>頻率約大於 10 GHz，可致癌與新生兒異常，日本原子彈事件為例</td></tr><tr><td>非游離輻射</td><td>能量小，不能使分子離子化。包括紫外線、可見光、紅外線、射頻（含微波）。健康效應來自熱效應與電磁場效應，傷害比游離輻射小得多</td></tr></table></div><p>因為非游離輻射幾乎無所不在，大眾十分關心，已是職業與環境衛生的重要課題。</p>","p":"p631"},{"tag":"研究","h":"電磁波與癌症：多數研究找不到關聯","b":"<ul><li>美國國家科學研究院專家討論認為，無足夠證據支持極低頻電磁場會危害健康；也有證據顯示可能引起褪黑激素分泌改變或骨折修復加快等生物效應</li><li>法國研究指出住在高壓電纜 500 公尺內，磁場暴露不會提高畸胎率</li><li>Inskip 等人（782 名腦腫瘤病人與 799 名對照）與丹麥全國調查，都發現行動電話使用與腦腫瘤無關</li></ul><p>行動電話基地台周邊測得的最高暴露量遠低於安全標準。WHO 2006 年指出，低於 ICNIRP 標準的電磁波，無證據證明有害健康。</p>","p":"p631–632"},{"tag":"迷思","h":"電磁波敏感症：病因不明，原因不能只歸給電磁波","b":"<p>WHO 定義為「病因不明，而可歸因於電磁波暴露的環境不相容症狀」。症狀有頭痛、暈眩、皮膚刺痛、失眠、焦慮。澳洲盛行率最高。</p><p>長期以來認為與反安慰劑效應（nocebo effect）有關，負面預期確實會加劇症狀。但 Dieudonne 對 40 位患者的質性研究提出七階段形成過程，指出單一的負面心理預期不足以解釋，不能僅由心理預期解釋它的形成。</p>","p":"p632–633"},{"tag":"臨床重點","h":"3C 族的眼睛：電腦終端機症候群與藍光","b":"<p>電腦終端機症候群有三類表現：眼睛酸澀、視力模糊；頸肩腕疼痛；精神神經症狀、全身疲勞與高血壓。多見於 35 歲以上中年族群，部分人眼壓升高引發青光眼。這是睫狀肌長時間收縮與兩眼過度內聚造成的自律神經疲勞，需完全停止看電腦 1 至 2 週才能恢復。</p><p>藍光可能影響褪黑激素分泌，進而影響睡眠週期與工作表現，但目前仍無證據證實藍光對人類有危害。</p>","p":"p633"},{"tag":"定義","h":"塑膠微粒與奈米塑膠，已經進到人體裡","b":"<div class=\"stat\"><div><strong>&lt;5 mm</strong><span>微塑料直徑</span></div><div><strong>&lt;1 μm</strong><span>奈米塑膠（或 100 nm）</span></div><div><strong>68,000</strong><span>每人每日估計吸入顆粒數</span></div></div><p>暴露途徑有攝入、吸入、皮膚接觸，醫療植入與注射也是直接路徑。瓶裝水、自來水、軟性飲料、食鹽、蜂蜜、糖，甚至茶包都是潛在來源。吸入以室內更嚴重，來自地毯、合成纖維衣物與建材。</p>","p":"p634–635"},{"tag":"研究","h":"微塑料與心血管：NEJM 2024 在斑塊裡發現異物","b":"<p>毒理機轉有三項：氧化壓力與粒線體損傷、慢性發炎與細胞因子風暴、特洛伊木馬載體效應（Trojan Horse Effect）。</p><p>2024 年 Marfella 等人發表於《新英格蘭醫學雜誌》的研究，首次在人體直接證明微塑料暴露與不良臨床預後。心血管斑塊的巨噬細胞內嵌有鋸齒狀異物微粒，提示可能誘發斑塊不穩定與慢性血管壁發炎，使動脈粥樣硬化惡化。另有肺纖維化與哮喘風險、腸道通透性增加，睪丸、胎盤、母乳也發現微塑料。</p>","p":"p635"}],"recap":{"points":["環境荷爾蒙與戴奧辛主要經由食物進入人體，可能影響內分泌、生殖與免疫，目前沒有特定解毒治療。","烏腳病與深井水砷污染、PM2.5 與心血管疾病，都顯示環境暴露會留下長遠的健康後果，家醫科醫師要想到環境病因。","電磁波與藍光的危害證據仍有限，塑膠微粒則已在心血管斑塊、胎盤等處被發現，是新興的公共衛生威脅。"],"quiz":[{"q":"戴奧辛進入人體最主要的途徑是什麼？","a":"食入，包括魚類、肉品、乳製品等含戴奧辛的畜產品。"},{"q":"烏腳病流行地區的深井水砷含量與國家標準各是多少？","a":"砷含量約 0.4 至 0.6 ppm，國家容許標準是 0.05 ppm。"}]}},"40":{"posts":[{"tag":"核心觀念","h":"人類世：地球九道安全邊界，已經破了六道","b":"<p>科學界廣泛接受地球已進入「人類世」（Anthropocene），人類活動成為主導地球物理、化學與生物系統變遷的核心力量。行星邊界（Planetary Boundaries）框架定義了九個維持地球穩定的門檻。</p><p>依 2023 年評估，已有六個被超越：氣候變遷、生物多樣性損失、土地系統變遷、淡水利用、生物地球化學流（氮、磷循環）、新化學物質污染。氣候變遷已轉化成診間裡的具體臨床徵候，從中暑增加到新興傳染病擴張。</p>","p":"p638–639"},{"tag":"台灣數字","h":"二氧化碳從 280 升到 420 ppm，富人排了一半","b":"<div class=\"stat\"><div><strong>280→420</strong><span>大氣 CO₂ 濃度（ppm），工業化前至今</span></div><div><strong>10%</strong><span>最富有人口，產生近 50% 溫室氣體排放</span></div><div><strong>1.1°C</strong><span>2011–2020 年較工業化前升溫</span></div></div><p>低收入國家排放最少，卻承受最嚴重的健康與經濟衝擊，這種「氣候不公」是現代醫學倫理要面對的。</p>","p":"p639–640"},{"tag":"家醫角色","h":"醫師需要「氣候勝任力」，WONCA 也改了組織名稱","b":"<p>醫療需整合「行星健康」（Planetary Health）與「健康一體」（One Health）視角，理解人類、動物與環境健康的耦合。醫療人員要有<b>氣候勝任力</b>（Climate Competence），能識別氣候敏感疾病、評估社區脆弱性，並在醫療運作中實施減碳與調適。</p><p>世界家庭醫學會在 2023 年 8 月，把原本的環境工作小組更名為行星健康工作小組（WONCA Working Party on Planetary Health）。</p>","p":"p639"},{"tag":"必背","h":"溫室效應與 GWP：甲烷短期槓桿最大","b":"<p>自然溫室效應讓地表平均約 14°C，沒有的話會降到 -19°C。工業革命後燃燒化石燃料與森林砍伐打破平衡。</p><p>全球暖化潛勢（GWP）以二氧化碳為基準（GWP=1）。CO₂ 單分子增溫力最低，但排放量大、留存最久，佔暖化累積效應超過 50%，是長期暖化的主因。</p><ul><li>甲烷 100 年 GWP 約 27 至 30</li><li>甲烷 GWP-20 約 81，所以短期減緩策略中控制甲烷槓桿效益極高</li></ul>","p":"p639–640"},{"tag":"必背","h":"IPCC AR6 的關鍵數字","b":"<div class=\"stat\"><div><strong>1.59°C</strong><span>陸地升溫（2011–2020 相對 1850–1900）</span></div><div><strong>0.88°C</strong><span>海洋升溫</span></div><div><strong>約90%</strong><span>海洋吸收的多餘能量</span></div><div><strong>7%</strong><span>每升溫 1°C 大氣多承載的水氣</span></div></div><p>2023 年是有記錄以來最熱的一年。AR6 SSP5-8.5 最佳估計約升溫 4.4°C（可能範圍 3.3 至 5.7°C）。即使落實各國 NDCs，2030 年代初期突破 1.5°C 的機率仍極高，可能引發氣候臨界點，如西南極冰蓋崩潰與北極永久凍土快速消融。</p>","p":"p640"},{"tag":"核心觀念","h":"氣候影響健康的三個層面","b":"<ol><li><b>直接威脅</b>：熱浪造成中暑、熱衰竭，水災、野火造成人命與財產損失</li><li><b>自然環境改變的間接威脅</b>：暖化使病媒蚊分布變廣，登革熱、瘧疾、屈公病、茲卡病毒上升</li><li><b>社會經濟變化</b>：乾旱使糧食歉收，農民往都市移動成為氣候難民，精神疾病也增加</li></ol>","p":"p640–641"},{"tag":"考點","h":"熱中暑被視為多重器官衰竭症候群，四個機轉","b":"<ul><li><b>熱細胞毒性</b>：體溫超過 40°C，蛋白質變性、脂質膜損傷、粒線體功能障礙，誘發細胞凋亡</li><li><b>內毒素血症</b>：血液重新分配到皮膚，腸道缺血，黏膜屏障破壞，革蘭氏陰性菌內毒素入血</li><li><b>SIRS</b>：免疫細胞釋放 IL-1、IL-6，產生類似敗血症的發炎反應</li><li><b>凝血異常</b>：血管內皮受損，最終導致 DIC</li></ul>","p":"p641–642"},{"tag":"台灣數字","h":"熱暴露讓老人熱相關死亡率增加一倍多","b":"<p>易感族群包括 65 歲以
