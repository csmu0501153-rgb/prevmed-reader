<style>
/* Layout: one narrow news-feed column; sticky masthead with day chips + progress; one card per idea */
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#14211f; --muted:#5a6b67; --line:#d5e0dc;
  --accent:#0a7a68; --accent-soft:#e1f1ec; --star:#c98a06;
  --f-head:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;

:root[data-theme="dark"]{

  --accent:#43c2a5; --accent-soft:#1a2d29; --star:#f0b43a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 6px}
.mast h1{font-family:var(--f-head);font-size:20px;margin:0;letter-spacing:.02em}
.mast .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 13px var(--f-body);padding:4px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:disabled{opacity:.45;cursor:default}
.chip.fav{color:var(--star);border-color:var(--star)}
.chip.fav[aria-pressed="true"]{background:var(--star);color:var(--surface)}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
main{display:flex;flex-direction:column;gap:14px;padding-block:18px 48px}

.intro b{color:var(--ink)}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tag{color:var(--accent);font-weight:700;letter-spacing:.06em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
article h2{font-family:var(--f-head);font-size:21px;line-height:1.4;margin:0;text-wrap:balance}
article p{margin:0}
article ul,article ol{margin:0;padding-left:1.3em}
article li+li{margin-top:2px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat div{background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.stat strong{display:block;font-family:var(--f-mono);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);line-height:1.4;display:block}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.star{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--line);padding:4px}
.star[aria-pressed="true"]{color:var(--star)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.recap{border-color:var(--accent);border-width:2px}
.q{border-top:1px dashed var(--line);padding-top:10px}
.q button{margin-top:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:500 14px var(--f-body);padding:4px 12px;border-radius:999px;cursor:pointer}
.q .ans{margin-top:6px;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

<script>
const CHAPTERS=["預防性健康照護概論","個人化醫學之概念與應用","人工智慧於預防醫學之應用與展望","運用數位科技的精準預防醫學","預防性健康照護的醫療經濟觀","篩檢概念與原則","癌症篩檢","心血管疾病的危險評估","營養篩檢與評估","常見代謝內分泌疾病篩檢","認知功能篩檢","未有實證支持的篩檢項目","菸害與戒菸","嚼食檳榔","酒精與健康","非健康藥物使用","睡眠障礙","網路成癮","身體活動促進及運動傷害預防","體重過重與肥胖","疫苗接種","傳染病的化學預防","心血管疾病的化學預防","茶與健康","咖啡與健康","老年疾病的化學預防","維生素與健康","健康食品","特殊族群的營養照顧","優生保健與婚前健康檢查","成年人之預防性健康照護","女性之預防性健康照護","青少年之預防性健康照護","新生兒及兒童之預防性健康照護","原住民族群的健康議題","移民者的健康議題","旅遊者常見的傳染性疾病","旅遊者常見的非傳染性疾病","環境與健康","氣候變遷與健康","綠色家庭醫學推動指引"];

const DAYS={"1":{"posts":[{"tag":"定義","h":"預防性健康照護，照顧的是「還沒生病」的人","b":"<p>對象是沒有症狀、或還沒確診的人。內容包括找出風險、健康行為諮詢、打疫苗、做篩檢，以及異常結果的追蹤與轉介。</p><p>目標有三個：降低可改變的風險、延後發病、及早發現。主要在基層和家醫科門診落實。</p>","p":"p8"},{"tag":"定義","h":"臨床預防 vs. 公共衛生：一個看個人，一個看族群","b":"<ul><li><b>臨床預防</b>：以單一病人為單位，靠病歷、檢驗、個案管理追蹤。</li><li><b>公共衛生</b>：以全人口為單位，靠監測通報、癌症登記、死因統計、政策評估。</li></ul><p>兩邊要互相回饋：個案變好，不代表族群整體的發生率或死亡率就會下降，所以還需要族群層級的品質指標。</p>","p":"p9"},{"tag":"核心觀念","h":"疾病自然史：預防要抓對時間窗","b":"<p>疾病大致走這條路：</p><p><b>易感期</b> → <b>臨床前期</b> → <b>臨床期</b> → 併發症／失能／死亡</p><p>臨床前期中，能被檢查抓到的那一段叫 <b>DPCP</b>（detectable preclinical phase），篩檢就是在這段出手。原則是把介入放在「淨效益大於傷害」的時間點。</p>","p":"p9–10"},{"tag":"必背","h":"三段五級預防，一張表記起來","b":"<div class=\"tbl\"><table><tr><th>段</th><th>級</th><th>例子</th></tr>\n<tr><td>第一段<br>發病前</td><td>1 健康促進<br>2 特殊防護</td><td>戒菸、運動、睡眠<br>疫苗、職業防護</td></tr>\n<tr><td>第二段<br>臨床前期</td><td>3 早期診斷、即時治療</td><td>FIT、乳房攝影、抹片、LDCT、量血壓血糖</td></tr>\n<tr><td>第三段<br>臨床期後</td><td>4 限制殘障<br>5 復健</td><td>糖尿病整合照護<br>中風、心臟復健</td></tr></table></div>","p":"p10"},{"tag":"延伸","h":"高齡社會版本：四段七級","b":"<p>在三段之後加一個「末段」：</p><ul><li>第 6 級：安寧緩和照護</li><li>第 7 級：哀傷輔導</li></ul><p>另外要記得，五級預防不是一條直線。同一位病人可能同時需要第一段的生活型態介入，和第三段的慢病控制或復健。</p>","p":"p11"},{"tag":"台灣數字","h":"台灣已經是超高齡社會，但健檢利用率不到三成","b":"<div class=\"stat\"><div><strong>20.06%</strong><span>65 歲以上人口（2025 年底）</span></div><div><strong>30 歲</strong><span>成人預防保健下修的起始年齡</span></div><div><strong>138,051</strong><span>2023 年新發癌症人數，中位數 65 歲</span></div><div><strong>29.3%</strong><span>2023 年成人預防保健利用率，連續 4 年未達 30%</span></div></div><p>主要死因仍是癌症、心臟病、肺炎。</p>","p":"p11, p15"},{"tag":"家醫角色","h":"好醫療的六個標準：IOM 六大品質目標","b":"<p>安全（safe）、有效（effective）、以病人為中心（patient-centered）、及時（timely）、效率（efficient）、公平（equitable）。</p><p>家庭醫學強調全人與連續照護，跟這六個目標一致。新冠疫情也讓家醫的「第一線守門人」角色更明顯。</p>","p":"p11–12"},{"tag":"必背","h":"USPSTF 的 A、B、C、D、I 是什麼意思？","b":"<ul><li><b>A / B</b>：淨效益明確，列為常規優先項目</li><li><b>C</b>：看個人風險和偏好，選擇性提供</li><li><b>D</b>：不建議常規做</li><li><b>I</b>：證據不足，無法判斷</li></ul><p>評等依據是系統性回顧後的「淨效益」與證據確定性。</p>","p":"p12"},{"tag":"溝通","h":"就算是 A 級建議，也要跟病人一起決定","b":"<p>接受預防服務的人大多沒有症狀。只要檢查有侵入性、要自費、會帶來後續檢查負擔，就適合用醫病共享決策（SDM）。</p><p>風險溝通的技巧：</p><ul><li>同時講絕對風險和風險差，不要只講相對風險</li><li>用自然頻率（例如「每 1000 人有幾人」）和圖像</li><li>說明偽陽性、偽陰性</li><li>聊病人最在意的結局</li></ul>","p":"p12"},{"tag":"工具","h":"5A's：門診裡的預防照護流程","b":"<ol><li><b>Assess</b> 評估：健康需求、病人想扮演的決策角色</li><li><b>Advise</b> 勸告：說明建議項目的好處、壞處、替代方案、不確定性</li><li><b>Agree</b> 同意：接受看法不同，一起協商</li><li><b>Assist</b> 協助：開立檢查或服務</li><li><b>Arrange</b> 安排：執行並排好追蹤</li></ol>","p":"p12–13（圖一）"},{"tag":"台灣研究","h":"糞便潛血篩檢有用，但陽性後一定要做大腸鏡","b":"<div class=\"stat\"><div><strong>↓ 約 62%</strong><span>有篩檢者的大腸癌死亡率（RR 0.38）</span></div><div><strong>↓ 約 10%</strong><span>覆蓋率 21.4% 時，整體族群死亡率（RR 0.90）</span></div></div><p>效益取決於 FIT 陽性後有沒有完成大腸鏡和處置。只檢測不追蹤，結局不會改善。</p>","p":"p13"},{"tag":"迷思","h":"每年做全身健檢就能活更久？證據說沒有","b":"<p>系統性回顧顯示，一般性健康檢查（general health checks）沒有降低全因死亡、心血管死亡或癌症死亡，反而可能增加後續檢查。</p><p>挑篩檢項目時要看：疾病重不重要（盛行率、嚴重度、可預防性）、檢測的敏感度和特異度、介入後能不能改善結局、資源夠不夠。也要考慮偽陽性和過度診斷。</p>","p":"p14"},{"tag":"台灣數字","h":"三大癌症篩檢率：大腸癌追蹤率最低","b":"<div class=\"tbl\"><table><tr><th>2023</th><th>篩檢率</th><th>陽性追蹤率</th></tr>\n<tr><td>子宮頸癌（30+，3 年內）</td><td class=\"num\">45.3%</td><td class=\"num\">92.8%</td></tr>\n<tr><td>乳癌（45–69，2 年內）</td><td class=\"num\">39.3%</td><td class=\"num\">92.59%</td></tr>\n<tr><td>大腸癌（50–74，2 年內）</td><td class=\"num\">32.3%</td><td class=\"num\">79.62%</td></tr></table></div>","p":"p15"},{"tag":"現場難題","h":"民眾為什麼不去篩檢？四種原因","b":"<ol><li><b>健康識能不足</b>：覺得自己很健康，或把「篩檢陽性」當成「確診」</li><li><b>可近性</b>：請假、交通、等候、照顧家人，不熟悉轉介流程</li><li><b>心理社會</b>：怕痛、怕麻煩、怕知道結果、怕影響工作或保險</li><li><b>文化與資訊</b>：語言隔閡、不信任醫療、媒體誇大或恐嚇</li></ol><p>醫師端的障礙則是時間不夠、缺少風險工具和提醒召回系統。</p>","p":"p14–15"},{"tag":"考點","h":"國際指引常考的三個篩檢條件（USPSTF）","b":"<ul><li><b>大腸癌</b>：45–75 歲（45–49 歲 B 級，50–75 歲 A 級）</li><li><b>肺癌 LDCT</b>：50–80 歲、吸菸 20 包年以上、仍在吸或戒菸未滿 15 年，每年一次</li><li><b>腹主動脈瘤</b>：65–75 歲曾吸菸的男性，超音波終身一次</li></ul><p>書中表三比較了美、澳、加、英四國的建議，各國年齡和頻率不太一樣。</p>","p":"p16–24（表三）"},{"tag":"趨勢","h":"精準預防：依風險分層，把資源給最可能受益的人","b":"<p>用臨床資料、家族史、基因、多體學、環境暴露和社會處境來分層，再調整介入強度和追蹤頻率。例如多基因風險分數（PRS）可以用來決定要不要提早篩檢；BRCA、Lynch 症候群檢測可以找出高危險家族。</p><p>限制：不同族群外推性差、效益與成本效益證據還不夠、隱私和責任歸屬問題。</p>","p":"p25"},{"tag":"趨勢","h":"數位健康與 AI：重點是能不能放進工作流程","b":"<p>應用分三塊：</p><ul><li>工具：電子病歷提醒、名單管理、遠距監測、族群健康儀表板</li><li>AI：篩檢判讀分流、用病歷建立風險預測模型</li><li>治理：隱私、資安、偏差、問責，並保留人類監督</li></ul><p>參考框架是 WHO 的數位健康全球策略（2020–2025）。</p>","p":"p25–26"},{"tag":"趨勢","h":"社會處方：開給病人的不只是藥","b":"<p>社會決定因子（SDOH）指的是經濟、教育、居住、工作、社會支持等處境對健康的影響。</p><p>基層的做法：用簡短工具找出社會需求、寫進病歷，再用可回覆的轉介（closed-loop referral）連到社區資源。社會處方就是把病人轉介到運動、飲食、心理支持、社交、法律或社福資源。目前證據顯示部分結果有改善，但成效不一。</p>","p":"p26–27"}],"recap":{"points":["預防介入要放在疾病自然史中淨效益最大的時間窗；記熟三段五級和四段七級。","USPSTF 分 A/B/C/D/I；即使是 A/B 級，也要用 SDM 和絕對風險來溝通。","篩檢的效益取決於陽性後的追蹤，台灣大腸癌陽性追蹤率只有約八成。"],"quiz":[{"q":"USPSTF 評為 C 級的項目，臨床上該怎麼處理？","a":"依病人的個人風險和偏好選擇性提供，不列為常規。"},{"q":"「第 3 級預防」屬於第幾段？內容是什麼？","a":"第二段預防；早期診斷與即時治療，例如篩檢和個案發現。"}]}},"2":{"posts":[{"tag":"核心觀念","h":"RCT 證實有效的藥，不一定對你這位病人有效","b":"<p>實證醫學（EBM）靠隨機對照試驗（RCT）和系統性回顧，用族群的平均效果（average treatment effect）來決定個別病人怎麼治。這個做法隱含一個假設：個體差異不會影響療效。</p><p>在慢性病、多重共病、高齡人口為主的現在，這個假設常常站不住腳。同一種治療，有人明顯受益，有人效果有限，甚至出現副作用，這叫做治療效果異質性（heterogeneity of treatment effect）。</p>","p":"p30"},{"tag":"迷思","h":"EBM 的群體思維，會同時造成過度醫療和治療不足","b":"<ul><li><b>過度醫療（overuse）</b>：低風險的人做了不必要的篩檢或治療。</li><li><b>治療不足（underuse）</b>：高風險的人沒拿到足夠強度的介入。</li></ul><p>兩種現象同時存在，是醫療資源配置失衡和健康不平等的來源。台灣社區推動的整合性篩檢，被視為從 EBM 走向風險導向的個人化照護的關鍵實證平台，並引入風險分層（risk stratification）的概念。</p>","p":"p30–31"},{"tag":"定義","h":"4P 醫療模式：預防、預測、個人化、參與","b":"<ol><li><b>預防</b> Prevention</li><li><b>預測</b> Prediction</li><li><b>個人化</b> Personalized</li><li><b>參與</b> Participation</li></ol><p>醫療模式的演進，是從症狀與經驗導向，到 EBM，再到整合 4P 的複雜模式。EBM 把個人差異當成隨機誤差，精準醫學（precision medicine）則用基因體學和分子標記，把族群再分成風險或治療反應不同的次族群。</p>","p":"p31–32"},{"tag":"趨勢","h":"以乳癌為例，照護典範走過三個階段","b":"<ul><li><b>EBM 階段</b>：以瑞典兩郡隨機分派研究為基石，證實篩檢可降低晚期乳癌發生率與死亡率。</li><li><b>XAI 健康階段</b>：整合腫瘤大小、淋巴結、組織分級、荷爾蒙受體等特徵，建出風險光譜，提供個人化的篩檢起始年齡與間隔。</li><li><b>4P 數位雙胞胎階段</b>：涵蓋全週期照護。</li></ul><p>分層仍是把人歸到某一群，BRCA1、BRCA2 的發現則讓高風險族群的預防可以調整。</p>","p":"p32"},{"tag":"工具","h":"黑盒子 AI 要怎麼讓醫師信任？靠 XAI","b":"<p>深度學習能處理高維度資料，抓出非線性與複雜的交互作用，讓個人化預測成為可能。但它是黑盒子，臨床不容易接受。</p><p>可解釋人工智慧（explainable AI, XAI）用 <b>SHAP</b> 和 <b>LIME</b> 等方法，把模型的決策過程量化、視覺化，醫師才能理解並信任輸出。</p>","p":"p33"},{"tag":"必背","h":"4P 裡每個 P 的任務不同","b":"<ul><li><b>預測</b>：把未來風險變成可管理的對象，決策起點從診斷轉向風險辨識，介入可以提前。</li><li><b>預防</b>：依個人主要風險來源設計。遺傳因素為主者，藥物或監測較重要；生活型態為主者，行為介入更關鍵。</li><li><b>個人化</b>：整合生物、心理、社會、環境多層資料與交互作用。</li><li><b>參與</b>：病人看不懂或做不到，效益就大打折扣。資訊要易懂、可行動，並透過共享決策（shared decision making）促進參與。</li></ul>","p":"p33–34"},{"tag":"核心觀念","h":"逗留時間決定篩檢間隔","b":"<p>多階段疾病自然史模型把疾病看成一連串狀態轉移，用轉移機率描述各階段關係。</p><p>癌症篩檢中，次臨床期的長短（sojourn time）決定最佳間隔。太短，篩檢可能來不及發現；太長，則可能過度診斷。多狀態模型能估計這段時間，並能區分進展性與非進展性病變，改善過度診斷的估計。</p>","p":"p34"},{"tag":"定義","h":"個人化醫學要整合的七種「體」","b":"<p>核心理念是整合個人層級的多元資訊，建立精準的風險評估模型。</p><ul><li>基因體（genome）、表觀基因體（epigenome）</li><li>轉錄體（transcriptome）、蛋白質體（proteome）</li><li>代謝體（metabolome）、微生物體（microbiome）</li><li>環境暴露體（exposome）</li></ul><p>書中提到的三類照護情境：26 歲遺傳篩檢找易感性、34 歲確診糖尿病或高血壓後的動態監測用藥、34 歲心血管事件後的連續風險監測。</p>","p":"p34–35"},{"tag":"核心觀念","h":"環境暴露組：從受孕到死亡累積的所有暴露","b":"<ol><li><b>一般外在暴露</b>：空氣污染、氣候、噪音、社經條件</li><li><b>特定外在暴露</b>：飲食、運動、職業暴露、藥物、菸酒</li><li><b>內在暴露</b>：代謝、發炎、氧化壓力、腸道微生物組、免疫狀態</li></ol><p>塑膠微粒（microplastics）是新興外在風險因子，腸道微生物組則是最關鍵的內在環境之一。</p>","p":"p36"},{"tag":"研究","h":"多基因風險分數，抓得出風險等同單基因突變的人","b":"<p>多基因風險分數（polygenic risk score, PRS）是整合遺傳與環境暴露的動態風險模型中，最具代表性的工具。</p><p>Khera 等人證實，針對冠心病、心房顫動、第二型糖尿病、發炎性腸道疾病與乳癌的 PRS，可以辨識出風險等同單基因突變帶因者的高危族群。把 DNA 變異和年齡、BMI、家族史等傳統臨床因子合併，預測表現也明顯優於任一單獨模型。</p>","p":"p36"},{"tag":"工具","h":"數位分身能回答「如果改做別的，結果會怎樣」","b":"<p>數位分身（digital twin, DT）是與實體同步的虛擬模型，整合多源資料，用數學模型和 AI 模擬。關鍵功能是反事實推論（counterfactual inference），比較不同介入策略的未來結果。</p><p>醫療因此從描述和預測，進展到因果與模擬推論。限制在資料品質、可驗證性和隱私保護，需要跨領域治理。</p><p>物聯網（IoT）和穿戴裝置則讓資料從「間歇」變成「連續」，形成連續健康表型，也支持資料蒐集、分析、介入、回饋的閉環式照護。</p>","p":"p36–37"},{"tag":"台灣研究","h":"台灣大腸癌篩檢：晚期癌降 34%，死亡率降 40%","b":"<p>2004 年起，50–69 歲每兩年做一次糞便潛血檢查（FIT，陽性閾值 20 μg Hb/g feces），陽性者三個月內接受大腸鏡。</p><div class=\"stat\"><div><strong>56.6%</strong><span>篩檢覆蓋率（2004–2009，5,417,699 人）</span></div><div><strong>7.0%</strong><span>首輪 FIT 陽性率</span></div><div><strong>89.8%</strong><span>追蹤者中完成大腸鏡的比例</span></div><div><strong>↓40%</strong><span>死亡率（41.3 降至 20.3／10 萬人年）</span></div></div><p>晚期（Stage II+）癌發生率從 75.7 降到 48.4／10 萬人年，降 34%。遠端效益優於近端。</p>","p":"p39"},{"tag":"核心觀念","h":"固定的陽性值加固定兩年間隔，有哪些缺口","b":"<p>單一陽性值與固定兩年間隔，在個人層級會遇到幾個問題：</p><ul><li>偽陰性與間隔癌</li><li>偽陽性造成過度轉介</li><li>低風險族群過度診斷</li><li>高風險族群間隔不足</li></ul><p>納入連續的糞便血紅素（f-Hb）、家族史、代謝症候群、菌相等風險資訊，可依連續風險指標動態調整篩檢頻率。</p>","p":"p39"},{"tag":"台灣研究","h":"依糞便血紅素分層，低風險可以六年才篩一次","b":"<p>嚴等人以 3,500,250 位參與者，發表全球首例大規模 f-Hb 導向的精準篩檢架構。f-Hb 與進展性腺瘤、發生和死亡都有明確的劑量效應，濃度越高死亡率越高。</p><ul><li><b>低風險</b>：可延至六年</li><li><b>中風險</b>：維持兩年</li><li><b>高風險</b>：縮短到半年至一年</li></ul><div class=\"stat\"><div><strong>↓49%</strong><span>FIT 試劑需求</span></div><div><strong>↓28%</strong><span>大腸鏡需求</span></div></div><p>在等效益目標下，台灣醫療經濟模型估算，全面實施每投入 1 元約得 25 元長期報酬。</p>","p":"p39–40"},{"tag":"研究","h":"菌相加 XAI 加 LLM，把風險講到個人身上","b":"<p>Novielli 等人整合加、法、美三國共 453 位個案（腺瘤 264、CRC 189）的 16S rRNA 糞便菌相資料，外部驗證用義大利世代 43 位，最終保留 164 個菌屬特徵。</p><p>SHAP 顯示 CRC 的正向關鍵特徵是 Peptostreptococcus、Fusobacterium、Parvimonas、Porphyromonas 屬與 BMI，丁酸產生菌則呈保護訊號。</p><p>再以大型語言模型（LLM）當推理引擎，串接菌相、遺傳、問卷與病歷，把靜態報告變成可對話、可追蹤的建議。遺傳高風險者（如錯配修復缺陷或 PRS 偏高）建議提早做大腸鏡。</p>","p":"p40–41"},{"tag":"台灣數字","h":"代謝症候群每升一階，心血管事件風險跳一大截","b":"<p>台灣社區整合性篩檢以 47,495 位參與者建立三階段模型：無代謝異常（FMD）、輕度代謝異常（MMD，1–2 項）、代謝症候群（MetS）。</p><div class=\"tbl\"><table><tr><th>狀態</th><th>CVD 年發生率</th></tr><tr><td>FMD</td><td>1.62%</td></tr><tr><td>MMD</td><td>4.74%</td></tr><tr><td>MetS</td><td>20.22%</td></tr></table></div><p>進展率方面，FMD 到 MMD 為 44.82%，MMD 到 MetS 為 6.15%。這個劑量效應，是 CKM 與糖尿病照護轉向 4P 精準醫學的實證基礎。</p>","p":"p41–42"},{"tag":"臨床做法","h":"數位分身把十年糖尿病風險從 81% 壓到 50%","b":"<ul><li><b>案例 A（高風險）</b>：60 歲男性、吸菸、BMI 約 27、血壓 160/100 mmHg，有糖尿病家族史。經生活型態調整、戒菸、血壓與血脂用藥，十年風險由 81% 降到約 50%。</li><li><b>案例 B（中風險）</b>：55 歲男性、吸菸、BMI 約 25、血壓 148/90 mmHg。介入後 BMI 23、血壓 108/70 mmHg，十年風險由 41% 降到約 12%。</li></ul><p>數位分身在這裡扮演三種角色：把風險量化成可追蹤的十年機率、讓介入前後效益可視化、為個別病人提供行為與藥物調整建議。</p>","p":"p42–43"}],"recap":{"points":["EBM 用族群平均決定治療，會遇到療效異質性，也造成過度醫療與治療不足，個人化醫學因此興起。","4P（預防、預測、個人化、參與）整合多體學、環境暴露、物聯網與 XAI，數位分身再加上反事實推論的能力。","台灣的大腸癌篩檢與代謝症候群資料，示範了如何依個人風險調整篩檢間隔與介入強度。"],"quiz":[{"q":"什麼是治療效果異質性？","a":"同一種經 RCT 證實有效的治療，在不同個體間效果差異很大，有人明顯受益，有人效果有限甚至出現副作用。"},{"q":"依 f-Hb 分層的個人化大腸癌篩檢，各風險層的篩檢間隔是多少？","a":"低風險可延至六年，中風險維持兩年，高風險縮短到半年至一年。"}]}},"3":{"posts":[{"tag":"定義","h":"智慧醫療、數位健康、數位醫學，講的是同一件事","b":"<p>資通訊技術應用於醫學，是醫學資訊（medical informatics）最簡單的定義。智慧醫療（smart healthcare）、數位健康（digital health，出現在 2019 年 WHO 報告）和數位醫學（digital medicine，學界較常用）都指相近的領域。</p><p>新科技帶來期待，不當使用也會造成巨大傷害。要產生真正價值，需要嚴謹評估效益與影響，並制定實作指引與法規監管。</p>","p":"p46"},{"tag":"趨勢","h":"AI 的兩次寒冬，一次輸給算力，一次輸給維護成本","b":"<p>「人工智慧」一詞起源於 1955 年達特矛斯夏季研究計劃。發展分成兩大學派：符號邏輯（做出專家系統）和感知器（後來發展為類神經網路）。</p><ul><li><b>第一次寒冬</b>：初期目標太大，感知器又卡在實作面，1966 與 1977 年兩份評論報告後經費大減。</li><li><b>第二次寒冬</b>：規則式專家系統（如 MYCIN）的知識庫需要專業人員持續維護，複雜到一定程度就難以擴展。</li></ul><p>20 世紀末，硬體進步加上演算法創新，AI 進入第三波浪潮，持續至今。</p>","p":"p46–47"},{"tag":"定義","h":"強 AI 與弱 AI 差在哪","b":"<ul><li><b>強人工智慧</b>：可比擬甚至超越人類的通用型 AI（GPAI），是發展的終極目標。</li><li><b>弱人工智慧</b>：只在特定領域達到或超過人類水準的專用型 AI。</li></ul><p>臨床決策支援系統（CDSS）就屬於弱 AI，例如協助開立處方、提醒該打疫苗、發出異常警告。</p>","p":"p47"},{"tag":"必背","h":"機器學習的四種任務、三種學習方式","b":"<div class=\"tbl\"><table><tr><th>任務</th><th>內容</th></tr><tr><td>分類</td><td>從已分類資料預測類別</td></tr><tr><td>迴歸</td><td>從已知數值預測連續值</td></tr><tr><td>集群</td><td>把資料分群</td></tr><tr><td>降維</td><td>高維轉低維，減少計算量</td></tr></table></div><ul><li><b>監督式</b>：用有標籤資料，做分類與迴歸，適合預測預後或療效。</li><li><b>非監督式</b>：用無標籤資料，做集群與降維，適合研究疾病機轉、基因分析。</li><li><b>強化學習</b>：以獎懲試誤找最佳解，例如 AlphaGo、自動駕駛。</li></ul>","p":"p48–49"},{"tag":"必背","h":"分類模型的六個評估指標","b":"<ul><li><b>精確率</b> precision：TP/(TP+FP)，預測陽性中真的陽性比率。</li><li><b>召回率</b> recall：TP/(TP+FN)，實際陽性中被抓到的比率。</li><li><b>準確度</b> accuracy：(TP+TN)/Total。</li><li><b>F1-score</b>：精確率與召回率的調和平均，資料不平衡時適用。</li><li><b>AUC-ROC</b>：越接近 1 越好，0.5 等同隨機猜測。</li><li><b>PR-AUC</b>：陽性比例很少時，表現優於 AUC-ROC。</li></ul>","p":"p49"},{"tag":"核心觀念","h":"深度學習省掉了最花錢的特徵工程","b":"<p>類神經網路由輸入層、隱藏層、輸出層組成，每個神經元把輸入乘上權重、加偏差值，再經活化函數得到輸出。深度學習就是隱藏層兩層以上的類神經網路，2012 年 ILSVRC 競賽的突破成為 AI 史的轉捩點。</p><p>傳統機器學習要先做特徵工程，需精通領域的人工處理，門檻高、成本高。深度學習可以自動完成，所以語音辨識、電腦視覺、自然語言處理這類要用大量原始資料訓練的任務，適合用它。</p>","p":"p49–50"},{"tag":"核心觀念","h":"偏差最常出在訓練資料","b":"<p>偏差（bias）包含訓練資料偏差、演算法偏差，以及會自我學習的演算法之後續學習偏差，其中以訓練資料偏差最常見。</p><p>沒考慮性別、種族、年齡等社會屬性的資料，訓練出的模型若用在大規模社會決策，惡化不平等與歧視的風險很大。</p>","p":"p50"},{"tag":"工具","h":"黑箱問題的解方：XAI 的四個角色與三類技術","b":"<p>可解釋 AI（XAI）讓決策過程透明可理解。在醫療場域的四大角色是建立信任、透明度、因果關係、法規遵循。</p><ul><li><b>局部解釋</b>：針對單一病人的結果給理由。</li><li><b>全域解釋</b>：說明整個模型與參數怎麼運作。</li><li><b>事後解釋</b>：模型訓練完再用 LIME 或 SHAP 等工具解釋。</li></ul><p>生成式 AI（GenAI）的風險還包括隱私法規、資料偏差造成不公平輸出、不透明，以及責任歸屬與工作流程整合。</p>","p":"p50–51"},{"tag":"必背","h":"歐盟 AI 法案把風險分成四級","b":"<p>歐盟 2019 年發表「可信賴的 AI 倫理指引」，七大需求為：人類自主性與監督、技術穩健性與安全性、隱私與資料治理、透明性、多元不歧視與公平性、社會與環境福祉、問責性。</p><p>2021 年提出、2024 年通過的 AI 法案，依風險分四類：</p><ol><li>不可接受（全面禁止）</li><li>高風險（嚴格規範）</li><li>有限風險</li><li>最小風險</li></ol><p>禁止項目包括操縱行為的系統、社會評分、情緒辨識、公共空間遠距生物辨識等。</p>","p":"p51–52"},{"tag":"必背","h":"WHO 與 FUTURE-AI 的原則","b":"<p>WHO 2021 年指南提出六大倫理原則：保護自主性；促進福祉、安全與公共利益；透明、可解釋、可理解；負責與當責；包容與公平；與時俱進與永續。</p><p>2025 年 FUTURE-AI 聯盟（50 國、117 位專家）的六大原則，縮寫即 FUTURE：公平性、通用性、可追溯性、可用性、穩健性、可解釋性。</p><p>WHO 2024 年更新，列出大型多模態模型（LMM）的風險，包括高估效益、系統性偏差、過度依賴、資安風險。</p>","p":"p52–53"},{"tag":"台灣數字","h":"台灣的 AI 治理：2025 年底通過人工智慧基本法","b":"<div class=\"stat\"><div><strong>2018</strong><span>推出台灣 AI 行動計畫</span></div><div><strong>2.0</strong><span>行動計畫 2023–2026</span></div><div><strong>10／4／5</strong><span>三類智慧醫療中心已成立的醫院數（2026 年初）</span></div></div><p>三類中心為「負責任 AI 執行中心」、「臨床 AI 取證驗證中心」、「AI 影響性研究中心」。人工智慧基本法的七項原則包括永續與福祉、人類自主、隱私與資料治理、資安、透明可解釋、公平不歧視、問責。</p>","p":"p53–54"},{"tag":"核心觀念","h":"智慧醫療要看「淨效益」，成功靠使用者與高層","b":"<p>DeLone 與 McLean 的資訊系統成功模型有六個面向：系統品質、資訊品質、服務品質、使用意願、使用者滿意度、淨效益。其中淨效益最重要，包含對服務對象、使用人員、機構乃至社會的所有正反影響。</p><p>他們點出兩個獨立的成功因素，使用者參與和最高領導人支持。AI 的碳排放也不能忽略，推論過程的累積耗能可能比訓練更可觀。</p>","p":"p54–55"},{"tag":"臨床做法","h":"初段預防：AI 找高風險族群、做疫情預警","b":"<ul><li>以病歷、人口學與問卷資料訓練的模型預測自殺風險，AUC-ROC 可超過 0.8。</li><li>用台灣人體生物資料庫建的心血管疾病風險模型，AUC-ROC 達 0.846。</li><li>AI 虛擬助理搭配穿戴裝置做慢性病管理。</li><li>BlueDot 在 WHO 公布前 9 天，就對武漢的不明肺炎群聚發出警告。</li></ul><p>監測應用增加後，隱私與資料偏差的疑慮也跟著上升。</p>","p":"p55–56"},{"tag":"臨床做法","h":"次段預防：AI 讀乳房攝影、心電圖與病理","b":"<p>AI 用於篩檢，期待達到減輕工作負荷、提升敏感性、提升特異性。</p><ul><li>乳房攝影：部分深度學習模型使 AUC 達 0.89 以上，維持敏感性、降低偽陽性，最高可減少醫師工作量 70% 以上。</li><li>台灣團隊 2021 年的深度學習模型，無需人工標註即可分類肺癌組織類型，AUC-ROC 達 0.95。</li><li>AI 心電圖與智慧手錶已有多項獲 FDA 認證，可偵測多種心臟疾病，也可預測心衰竭、心房顫動與死亡率。</li></ul><p>台灣 TFDA 2020 年至 2024 年初核准的 AI 醫材近 200 項，主要在醫療影像輔助診斷。</p>","p":"p56–57"},{"tag":"迷思","h":"AI 對弱勢族群可能效果更差","b":"<p>弱勢族群包括低社經地位者、特定種族、高齡者、身心障礙者，以及數位落差大的群體。訓練資料若不夠多元，會造成結果、可用性與表現評估的偏差，放大健康不平等，影響診斷、治療與支付決策。</p><p>Cochrane 建議用 PROGRESS-Plus 框架（居住地、種族、職業、性別、宗教、教育、社經、社會資本等）來顯現並避免這類不平等。</p>","p":"p57"},{"tag":"趨勢","h":"三段預防與其他應用：照護、預測、新藥","b":"<ul><li>AI 與感測設備可監測跌倒、壓瘡等，對話機器人分擔照顧人力，照顧機器人有助延緩失能。</li><li>2025 年 9 月的 Delphi-2M 模型，依病歷與人口學資料預測未來 20 年超過 1000 種疾病的風險。</li><li>藥物研發方面，AI 可用於標靶鑑定、分子設計與篩選、先導化合物最佳化、試驗設計。</li><li>醫院營運方面，涵蓋物流資源、行政自動化、病人流量排程。</li></ul>","p":"p57–58"},{"tag":"考點","h":"AI 落地要面對的八個挑戰","b":"<ol><li>從實驗環境上線的時效</li><li>可解釋性與透明性限制</li><li>病人隱私與資安</li><li>偏差的潛在風險</li><li>高品質資料難取得</li><li>對通用型 AI 的過度期待</li><li>人機協作（人機循環 HITL）</li><li>法律責任歸屬不確定</li></ol><p>未來方向是把「人」視為風險管理核心，AI 定位為臨床輔助工具，不取代專業判斷，且醫療人員要具備在 AI 失效時仍能獨立診療的能力。</p>","p":"p59"}],"recap":{"points":["AI 歷經兩次寒冬後進入第三波浪潮，機器學習、深度學習與生成式 AI 靠算力與大數據興起。","各國與 WHO 都以可信賴 AI 為核心制定規範，重點是人類自主與監督、透明、公平與問責。","AI 在三段預防都有應用，但要面對偏差、隱私、可解釋性與責任歸屬，並以人機協作為原則。"],"quiz":[{"q":"歐盟 AI 法案把 AI 系統分成哪四類風險？","a":"不可接受風險、高風險、有限風險、最小風險，其中不可接受風險須全面禁止。"},{"q":"資料很不平衡、陽性個案很少時，哪個指標比 AUC-ROC 更適合？","a":"精確召回曲線下面積（PR-AUC）。"}]}},"4":{"posts":[{"tag":"趨勢","h":"AI 醫療研究已從「能不能用」走到「怎麼一起工作」","b":"<ul><li><b>2023</b>：AI 是否可用（proof of concept）</li><li><b>2024</b>：能否在臨床派上用場（clinical validation）</li><li><b>2025</b>：醫療人員如何與 AI 共工（deployment 與人機協作）</li></ul><p>LLM 在 2024 至 2025 年達到可實際操作的水準，環境感知 AI 醫療紀錄（ambient AI scribe）經多中心研究證實可降低醫師倦怠，加上台灣政策與監管同步進入新階段，精準預防醫學才具備重啟條件。</p>","p":"p64–65"},{"tag":"台灣數字","h":"台灣精準醫療的三條軸線同時在推進","b":"<div class=\"stat\"><div><strong>56 萬人</strong><span>TPMI 收案規模（2022 年底）</span></div><div><strong>265 項</strong><span>多基因風險評分涵蓋的疾病</span></div><div><strong>10 家</strong><span>負責任 AI 執行中心首批醫院（2024 年 9 月）</span></div></div><p>TPMI 由中央研究院聯合 16 個醫療體系、33 家醫院執行，2025 年 12 月在 Nature 連續發表兩篇研究。健保署則自 2024 年起，把家庭醫師整合性照護計畫升級為「大家醫計畫」。</p>","p":"p65, p67"},{"tag":"核心觀念","h":"精準預防 2.0 有兩個根本轉變","b":"<ol><li>風險評估的依據，從單一可調控因子，擴展到多體學，再加上電子病歷與數位行為資料的縱貫整合。</li><li>臨床決策從族群統一建議，轉向以風險分層為基礎的差異化介入。</li></ol><p>家醫科熟悉的「年齡、性別、三高」分層，正在疊加多基因風險評分（PRS）、數位生物標記與動態風險軌跡。這個框架延伸自 Hood 提出的 P4 醫學（預測、預防、個人化、參與）。</p>","p":"p65–66"},{"tag":"必背","h":"家醫科醫師的三個新角色","b":"<ul><li><b>資料的詮釋者</b>：確認資料品質、評估臨床意義、決定下一步檢查。例如手錶的「可能 AF」通知，可能是真的陣發性 AF，也可能是運動、咖啡因或感測偏差造成的偽陽性。</li><li><b>風險的轉譯者</b>：把 PRS 這類抽象分數，轉成篩檢策略、生活型態介入強度、轉介需求三個具體決定。</li><li><b>介入的整合者</b>：排序介入優先性、過濾不適用建議、保留決策整體性，避免病人被多個 AI 的衝突建議搞亂。</li></ul>","p":"p66–67"},{"tag":"核心觀念","h":"家醫的五大特質，在精準預防時代都被放大","b":"<p>連續性、周全性、協調性、可近性、負責性，各自對應新功能。</p><ul><li>PRS 反映終身縱向風險，要靠連續性的醫病關係追蹤。</li><li>多源連續資料流，要靠周全性的全人視角整合。</li><li>多個 AI 工具並行時，協調性避免病人陷入碎片化建議。</li><li>風險溝通與共享決策，要建立在可近性與負責性累積的信任上。</li></ul>","p":"p67"},{"tag":"定義","h":"族群健康管理：從「等病人來」變成「主動找人」","b":"<p>族群健康管理（PHM）是在明確的收案名單上，系統性辨識風險、分層、配置介入資源，並持續監測群體結果。家醫科同時掌握預防篩檢、連續性照護關係和整合性病歷，是最佳執行者。</p><p>真正的挑戰是工作模式翻轉：由「機會性篩檢」（病人前來才介入）轉向「主動性外展」（系統先辨識高風險個案並主動召回）。這對基層文化的衝擊，往往比引入任一演算法更深。</p>","p":"p68"},{"tag":"台灣數字","h":"888 計畫與大家醫計畫的規模","b":"<div class=\"stat\"><div><strong>522 群</strong><span>社區醫療群（2024）</span></div><div><strong>5,544 家</strong><span>參與診所</span></div><div><strong>627.3 萬</strong><span>收案會員</span></div></div><p>888 計畫的目標：2030 年前八成三高病患加入照護網、八成接受生活習慣諮商、控制率達八成。大家醫計畫整合原糖尿病、初期慢性腎臟病、代謝症候群等論質計酬方案，並導入「數位照顧模式」。</p>","p":"p68–69"},{"tag":"核心觀念","h":"大家醫計畫讓家醫從「看診者」變「族群健康經理人」","b":"<ol><li><b>會員管理化</b>：醫師持有明確個案名單與品質指標。</li><li><b>資料儀表板化</b>：三高的時間控制趨勢可視覺化呈現。</li><li><b>外展系統化</b>：控制不佳或沒持續追蹤者，系統可自動提醒醫師介入。</li></ol><p>落地挑戰包括基層資訊系統異質、跨院所互通仰賴健保署 FHIR 介面、品質指標能否反映預防價值而非計次給付，以及偏鄉與都會的差距可能被數位化放大。</p>","p":"p69–70"},{"tag":"工具","h":"AI 介入心血管風險的四種模式","b":"<p>傳統的 Framingham、FRAX、QRISK 仍是基石，機器學習模型能再整合病歷縱向資料、檢驗趨勢與用藥依從性。</p><ol><li><b>風險預測</b>：估算未來 5–10 年心血管事件機率</li><li><b>即時偵測與提醒</b>：穿戴裝置偵測血壓、心律異常並推播</li><li><b>對話式行為改變支援</b>：LLM 提供飲食、運動、戒菸建議</li><li><b>長期健康追蹤</b>：營養與睡眠 app 把數據回饋診間</li></ol>","p":"p68–69"},{"tag":"研究","h":"風險分層工具的下游效益，證據還不夠","b":"<p>Golinelli 等人 2025 年的系統性回顧納入 7 項研究，其中 4 項顯示急診就醫減少、3 項顯示住院減少、2 項顯示總死亡下降。但醫療成本效益的結論並不一致。</p><p>選工具時，要根據它對具體臨床目標（急診率、住院率、特定併發症）的改善潛力來判斷，不要只看演算法在訓練世代上的高準確度。</p>","p":"p69"},{"tag":"迷思","h":"歐美訓練出來的模型，不能直接套在台灣人身上","b":"<p>UK Biobank、All of Us、FinnGen 驗證了整合病歷、基因體與生活型態資料的可行性，但對台灣有兩個限制：</p><ul><li>訓練世代以歐美白人為主，亞洲族群表現須本土再驗證。</li><li>各國健康行為、飲食與環境暴露差異大，風險係數無法直接平移。</li></ul><p>這正是 TPMI 補位的價值。</p>","p":"p69"},{"tag":"必背","h":"數位生物標記的五個資料層次","b":"<p>數位生物標記是透過數位裝置取得、可量化、且與健康狀態相關的指標（Coravos 等人 2019 年提出操作型定義），應與傳統生物標記一樣接受安全性與臨床效用評估。</p><ol><li>穿戴式裝置：心率、HRV、AF 偵測、活動量、睡眠</li><li>連續監測：CGM、居家血壓、脈搏血氧</li><li>環境感測：智慧家居、跌倒偵測</li><li>影像與聲學：視網膜影像、咳嗽聲學</li><li>行為數位足跡：手機使用模式、社群互動</li></ol>","p":"p70"},{"tag":"臨床做法","h":"心房顫動與糖尿病：連續資料怎麼用","b":"<ul><li><b>REGAL 試驗（Mayo Clinic）</b>：對 AI 心電圖預測為 AF 高風險、但尚無 AF 診斷者，配戴 Apple Watch 做兩年居家心律監測，目標是在症狀前抓到無症狀 AF，早期啟動抗凝以預防中風與認知衰退。</li><li><b>CGM 的 AI 應用</b>：從事後看血糖紀錄，演進為即時行為回饋，分析個人對食物、運動、壓力的血糖反應，在糖尿病前期人群對體重、HbA1c 與行為改變漸顯支援價值。</li></ul>","p":"p70–71"},{"tag":"臨床做法","h":"加速計讓「衰弱」可以量化，眼底 AI 30 秒分流","b":"<p><b>活動與失能</b>：手機與穿戴裝置的加速計可客觀記錄活動強度、靜坐時間、步態，推估失能、跌倒與認知衰退風險。書中舉例，每日步數從 5,000 降到 2,800、坐姿時間從 8 小時增到 11 小時。</p><p><b>糖尿病眼底 AI</b>：已通過食藥署核准，用深度學習分析眼底彩色影像，輸出「需轉介眼科」或「可繼續觀察」。書中提到，過去糖尿病病人每年眼科檢查轉介率不到 50%，眼底 AI 可在診間 30 秒完成拍攝與初判。</p>","p":"p71"},{"tag":"研究","h":"LLM 單獨作答，比醫師加 LLM 高 16 個百分點","b":"<p>Goh 等人 2024 年的 RCT 發現，LLM 並未顯著提升醫師的診斷推理表現，但 LLM 單獨運作的分數比兩組醫師都高 16 個百分點。書中因此認為，目前 LLM 在家醫科的合理定位是「不會疲倦、不會煩躁的衛教與文件助理」。</p><p>Olson 等人 2025 年多中心研究（263 位門診醫師，近半為基層）顯示，使用 ambient AI scribe 30 天後，倦怠比率從 51.9% 降到 38.8%。但 Haberle 等人 2024 年在 Intermountain Health 的早期評估發現，下班後電子病歷工時反而惡化，所以效益與副作用都要持續監測。</p>","p":"p72"},{"tag":"考點","h":"評估任何 AI 工具，先問這四個問題","b":"<ol><li><b>是否經本土驗證？</b>次族群（原住民、低社經、長照住民）代表性仍不足，而他們常是預防效益最大的對象。</li><li><b>偽陽性的下游成本誰承擔？</b>低盛行率下的自動化偏誤（automation bias）會觸發過度檢查與醫源性傷害的瀑布效應。</li><li><b>我能解釋給病人聽嗎？</b>黑箱建議會損害長期信任。</li><li><b>不用工具時，我的判斷會退化嗎？</b>Budzyn 等人 2025 年研究發現，常用 AI 大腸鏡的醫師在不用 AI 時，腺瘤偵測率反而下降，這是技能退化（deskilling）的首個真實世界證據。</li></ol>","p":"p72–73"}],"recap":{"points":["精準預防 2.0 把風險評估擴展到多體學與數位資料，並以風險分層取代族群統一建議。","家醫科醫師要擔任資料詮釋者、風險轉譯者、介入整合者，大家醫計畫與 888 計畫是台灣的政策落地。","導入數位或 AI 工具前，要檢視本土驗證、偽陽性成本、可解釋性與技能退化風險。"],"quiz":[{"q":"家醫科醫師在精準預防 2.0 的三個新角色是什麼？","a":"資料的詮釋者、風險的轉譯者、介入的整合者。"},{"q":"族群健康管理要完成哪一項工作模式翻轉？","a":"從機會性篩檢（病人前來才介入），轉向主動性外展（系統先辨識高風險個案並主動召回）。"}]}},"5":{"posts":[{"tag":"核心觀念","h":"預防政策要花錢，先問「價值在哪」","b":"<p>醫療資源有限，每推一項預防政策，都表示要從別處挪用資源，所以要有科學方法評估價值（value）。台灣面對人口老化與慢性病負擔，過去「重治療、輕預防」的模式，在超高齡社會會對健保財務造成巨大衝擊。</p><p>台灣醫藥品查驗中心（CDE）的醫療科技評估成本效益分析方法學指引，是本土的重要參考依據。</p>","p":"p76"},{"tag":"台灣數字","h":"三高防治 888 計畫：三個 80%","b":"<ul><li><b>80% 找得出</b>：病友納入照護網</li><li><b>80% 要介入</b>：照護網內病友獲得生活習慣諮詢，並結合飲食、運動與藥物治療</li><li><b>80% 有改善</b>：病情穩定控制或改善</li></ul><p>經濟模型的概念由四段組成：投入（健檢資源、大家醫平台、照護網）、活動（資料整合、風險分層、健康管理）、產出（涵蓋率、三高控制率）、結果（降低中風與心肌梗塞死亡）。</p>","p":"p77"},{"tag":"核心觀念","h":"預防的經濟特性：時間差與效力落差","b":"<ul><li><b>時間差</b>：預防是現在花錢，效益要等數年甚至數十年。因此要用折扣率（discount rate）調整未來的成本與效益。</li><li><b>效力到效益的落差</b>：RCT 在嚴控環境下，依從性高，看到的是效力（efficacy）。推到全人口後，民眾不篩檢、服藥不規律，或有競爭死因，預期效益會打折，這才是效益（effectiveness）。</li></ul><p>經濟評估必須能處理這個落差。</p>","p":"p77"},{"tag":"趨勢","h":"真實世界證據從輔助角色，變成補強 RCT 的主力","b":"<p>長期慢性病政策很難做 20 年的對照試驗，RCT 證據往往不足。台灣有全民健保資料庫、癌症登記檔和大家醫計畫平台數據，可以回答這類問題：</p><ul><li>實際的篩檢參與率是多少？</li><li>納入照護網後的服藥遵從度如何？</li><li>高血壓進展到中風的真實發生率與死亡率？</li></ul><p>納入真實世界證據（RWE）後，評估能從「理論上的成本效益」走向「務實的預算規劃」。</p>","p":"p78"},{"tag":"必背","h":"站在誰的角度算帳：付費者觀點 vs. 社會觀點","b":"<div class=\"tbl\"><table><tr><th>觀點</th><th>納入的成本</th></tr><tr><td>付費者（台灣為健保署）</td><td>藥費、診療費、檢驗費、住院費</td></tr><tr><td>社會（最廣）</td><td>上述醫療成本，加病人自費、交通、看護，以及生產力損失（請假扣薪、早逝的社會貢獻損失）</td></tr></table></div><p>例如評估 B 型肝炎疫苗，只用付費者觀點，可能顯示花費高於效益。納入避免年輕人因肝癌早逝的生產力損失後，疫苗政策就很有價值。觀點是第一步，也最常被忽略。</p>","p":"p78"},{"tag":"必背","h":"成本的三種分類","b":"<ol><li><b>直接醫療成本</b>：門診、藥事服務、檢驗檢查、手術、住院費，可依健保支付標準點數換算。</li><li><b>直接非醫療成本</b>：交通費、家人陪同的雜費、看護費。</li><li><b>間接成本</b>：疾病、失能或死亡造成的時間與生產力損失。台灣常用人力資本法（Human Capital Approach），以主計總處公布的平均每人月薪資計算。</li></ol><p>例如 40 歲男性中風住院 30 天無法工作，間接成本就是 30 天的薪資損失。</p>","p":"p79"},{"tag":"必背","h":"CEA、CUA、CBA 三種分析怎麼分","b":"<div class=\"tbl\"><table><tr><th>方法</th><th>效益單位</th><th>特點</th></tr><tr><td>CEA 成本效果</td><td>自然單位（每篩出一例的成本、生命年等）</td><td>直觀，但跨領域難比</td></tr><tr><td>CUA 成本效用</td><td>QALY</td><td>CDE 做 HTA 最推薦</td></tr><tr><td>CBA 成本利益</td><td>貨幣</td><td>生命價值貨幣化有倫理爭議，較少當主要工具</td></tr></table></div><p>目前實務上，常統稱為成本效益分析。</p>","p":"p79–80"},{"tag":"定義","h":"QALY：生命長度乘上生命品質","b":"<p>生活品質調整後人年（QALY）= 存活年數 × 效用值（utility）。效用值介於 0（死亡）到 1（完全健康）。</p><p>例如中風後遺症病人效用值可能只有 0.6，存活 10 年，就獲得 10 × 0.6 = 6 QALYs。</p><p>類似的指標還有失能調整後人年（DALY）、health-years equivalents（HYEs）、saved-young-life equivalents（SAVEs）。</p>","p":"p79–80"},{"tag":"必背","h":"折扣率：未來的一塊錢比現在的便宜","b":"<div class=\"stat\"><div><strong>3%</strong><span>台灣 CDE 規範的標準折扣率</span></div><div><strong>3.5%</strong><span>部分研究使用</span></div><div><strong>0–5%</strong><span>敏感度分析測試範圍</span></div></div><p>現值（PV）是把各年的成本或效益 Fn，用 (1+r)^n 折算後加總。不折扣，會因為效益遞延而高估預防政策的效益。</p>","p":"p80"},{"tag":"必背","h":"ICER 與願付價格：怎麼判讀","b":"<p>遞增成本效果比值（ICER）= (新方案成本 - 對照方案成本) ÷ (新方案效益 - 對照方案效益)，意思是多獲得一單位效益（如一個 QALY）要多花多少錢。</p><p>數值本身沒意義，要跟願付價格（WTP）比較。</p><ul><li><b>ICER 小於 WTP</b>：具成本效益，值得採用。</li><li><b>ICER 大於 WTP</b>：雖然有效，但太貴，不具成本效益。</li></ul>","p":"p80–81"},{"tag":"考點","h":"成本效益平面的四個象限","b":"<div class=\"tbl\"><table><tr><th>象限</th><th>成本差／效益差</th><th>意義</th></tr><tr><td>第四（Win-Win）</td><td>省錢、更有效</td><td>優勢區，直接採用</td></tr><tr><td>第一</td><td>多花錢、更有效</td><td>取捨區，看 ICER 是否低於 WTP，多數新藥與 888 這類方案落在此</td></tr><tr><td>第三</td><td>省錢、效果較差</td><td>取捨區，要不要為了省錢犧牲健康</td></tr><tr><td>第二（Lose-Lose）</td><td>多花錢、效果較差</td><td>劣勢區，應直接剔除</td></tr></table></div>","p":"p81–82"},{"tag":"台灣數字","h":"一個 QALY 值多少錢？台灣的閾值","b":"<p>WHO 傳統標準：ICER 小於 1 倍人均 GDP 為高度具成本效益，1 到 3 倍為具成本效益，大於 3 倍為不具成本效益。</p><div class=\"stat\"><div><strong>約 100 萬</strong><span>1 倍人均 GDP（新台幣／QALY）</span></div><div><strong>約 300 萬</strong><span>3 倍人均 GDP</span></div><div><strong>210 萬</strong><span>Shiroiwa 2010 年估計的民眾願付價格</span></div></div><p>CDE 指引強調閾值不是鐵律。罕見疾病、缺乏替代療法、兒童與弱勢族群的預防介入，社會通常能容忍更高的 ICER，反映對公平的重視。</p>","p":"p83"},{"tag":"必背","h":"敏感度分析：決定性 vs. 機率性","b":"<ul><li><b>決定性（DSA）</b>：參數用固定值，只在可能範圍內改變。有單因子、二因子、情境分析（最好與最壞估計）、臨界值分析。</li><li><b>機率性（PSA）</b>：參數給機率分布，用蒙地卡羅模擬重複抽樣，每次抽樣產生一個 ICER，散落在 C-E 圖上。</li></ul><p>PSA 的結果可畫成成本效益接受曲線（CEAC），X 軸是 WTP，Y 軸是新方案具成本效益的機率，比單一 ICER 更能給決策者信心。</p><p>決策樹有決策結、機會結、結束節三種節點，機會結的機率總和為 1。</p>","p":"p83–86"},{"tag":"研究","h":"水痘疫苗的敏感度分析，生產力損失是關鍵變數","b":"<p>以社會觀點比較 70% 與 10% 的水痘疫苗接種率。疫苗功效 80% 到 100%、治療成本 0.5 到 1.5 倍、折扣率 1% 到 5%，方案 A（70%）都有絕對優勢。</p><p>只有間接成本會改變結論。臨界值分析顯示，每天生產力損失為 36.65 美元時，兩方案沒有差別，小於它則 B 較划算，大於它則 A 較划算。</p>","p":"p84–85"},{"tag":"研究","h":"高血壓個人化預防：省錢又更健康","b":"<p>研究用台灣資料建立高血壓自然史的馬可夫模型（正常、高血壓前期、第一期、第二期），比較四個策略。</p><div class=\"tbl\"><table><tr><th>策略</th><th>總成本（USD）</th></tr><tr><td>A 現況照護</td><td>16,455</td></tr><tr><td>B 全人口普遍策略</td><td>18,681</td></tr><tr><td>C 高風險策略</td><td>17,801</td></tr><tr><td>D 個人化預防</td><td>14,872</td></tr></table></div><p>B 的 ICER 高達約 12 萬美元，超過閾值。D 增加成本為負，且效益高於各策略，對 A 是絕對優勢，模擬結果全部落在第四象限。在 WTP 為 30 萬美元／QALY 時，B 的成功機率 74%、C 為 85%，D 在幾乎所有 WTP 都接近 100%。</p>","p":"p86–89"},{"tag":"研究","h":"AI 風險分層乳癌篩檢：低風險者每 6 年一次","b":"<p>Hill 等人在 JAMA Network Open 的研究，用 Mirai 演算法（由數位乳房攝影影像讀出風險），對 50 至 70 歲女性做風險分層篩檢，對比固定每 3 年一次的現行計畫。</p><ul><li>最低風險組：每 6 年</li><li>低於平均：每 3 年</li><li>高於平均：每 2 年</li><li>最高風險組：每年</li></ul><p>結果落在第四象限，每人增加約 0.014 QALY，成本減少約 60.72 英鎊。低風險者約佔 30% 到 40%，節省的篩檢遠超過對高風險者增加的投入。Mirai 已在林口長庚 13,356 位病人影像驗證過一致性。</p>","p":"p89–91"},{"tag":"考點","h":"CEA 問值不值得，預算衝擊分析問付不付得起","b":"<ul><li><b>預算衝擊分析（BIA）</b>：問「口袋夠不夠深」。個人化預防的省錢常在 10 年後才出現，第一年卻要編列平台建置與篩檢費，付不起頭期款就可能推不動。決策者通常要求 BIA 與 CEA 同時呈現。</li><li><b>公平性</b>：預防矛盾（對群體有益，對個人未必有感）和反向照護法則（最需要的人最難取得資源）。只追求 ICER 最小，會把資源投向容易接觸的都會區。分佈式成本效益分析（DCEA）會納入公平性加權或做次群組分析。</li></ul>","p":"p91–92"}],"recap":{"points":["醫療經濟評估要先定觀點與成本，再用 CEA、CUA（QALY）或 CBA 衡量效益，並以 3% 折扣率折算未來。","ICER 要與願付價格比較，台灣常用約 100 到 300 萬元／QALY 的範圍，並以成本效益平面與 CEAC 呈現不確定性。","個人化、風險分層的預防策略可能又省錢又更有效，但決策時仍要看預算衝擊與公平性。"],"quiz":[{"q":"ICER 與願付價格（WTP）怎麼比較判讀？","a":"ICER 小於 WTP 表示新方案具成本效益，值得採用；ICER 大於 WTP 則代價過高，不具成本效益。"},{"q":"成本效益平面的哪一個象限是「優勢區」？代表什麼？","a":"第四象限，新方案比舊方案更省錢、效果也更好。"}]}},"6":{"posts":[{"tag":"定義","h":"篩檢找的是「可能有病」的人，不是確診","b":"<p>篩檢（screening）是用檢驗、測驗、問卷、量表或分數評量系統，從<b>無症狀</b>的族群中，區分出某疾病或危險因子的高風險與低風險個案。在三段五級預防中，篩檢屬於次段預防。</p><p>民眾常把篩檢和診斷混為一談。篩檢陽性不代表真的罹病，必須經進一步診斷流程才能確診。診斷則是針對有症狀者或篩檢出的高危險群。連診間量血壓，也算對高血壓的一種篩檢。</p>","p":"p96–97"},{"tag":"核心觀念","h":"篩檢介入在臨床前期，症狀出現前","b":"<p>許多疾病或危險因子在臨床前期（pre-clinical stage）只有生理或病理變化，沒有明顯症狀，受檢者難以自己察覺。篩檢可在這段時間發現潛在疾患，提供早期治療，以減少日後併發症、殘障與死亡。</p><p>但並非所有疾病都適合當篩檢目標，篩檢工具也不是百利而無一害。工具的可信度、實際預防效果、對個案的影響、社會成本，執行前都要考慮。</p>","p":"p97"},{"tag":"台灣數字","h":"本土研究：有效的篩檢能降低多少癌症死亡率","b":"<div class=\"stat\"><div><strong>40%</strong><span>大腸癌死亡率下降</span></div><div><strong>26%</strong><span>口腔癌死亡率下降</span></div><div><strong>41%</strong><span>乳癌死亡率下降</span></div><div><strong>70%</strong><span>子宮頸癌死亡率下降</span></div></div><p>國際研究也發現，低劑量電腦斷層篩檢可降低重度吸菸者約 20% 的肺癌死亡率。</p>","p":"p97"},{"tag":"必背","h":"篩檢的好處與壞處","b":"<p><b>好處</b></p><ul><li>早期診斷與治療，減少併發症與死亡率</li><li>減少醫療費用</li><li>避免晚期才治療的痛苦</li><li>結果正常，受測者較安心</li></ul><p><b>壞處</b></p><ul><li>早期診斷但對預後沒幫助，只加重痛苦</li><li>過度診斷（overdiagnosis）：疾病進展緩慢，對死亡率或生活品質影響極低，卻增加焦慮、檢查不適與花費</li><li>異常卻沒有有效診斷工具確診，造成醫療浪費</li><li>偽陰性帶來錯誤的安全感，可能延誤治療</li><li>偽陽性帶來不必要的焦慮與後續檢查痛苦</li></ul>","p":"p97–98"},{"tag":"考點","h":"接受篩檢的人，會走向五種不同結果","b":"<p>篩檢陽性進入診斷，診斷陰性則結束。診斷陽性的人，可能有四種結局：</p><ol><li>治療成功，對健康有正面效益</li><li>治療失敗，無法帶來正面效益</li><li>不需治療（過度診斷），疾病不會造成傷害或死亡</li><li>過早治療，預後與症狀出現後才治療相同</li></ol><p>也就是說，接受篩檢的人不一定都能診斷出疾病，診斷出來也不一定帶來臨床效益。</p>","p":"p98"},{"tag":"必背","h":"USPSTF 與 CPSTF 的建議等級","b":"<div class=\"tbl\"><table><tr><th>等級</th><th>意義</th></tr><tr><td>A</td><td>高度可信的顯著淨好處，建議執行</td></tr><tr><td>B</td><td>高度可信的中度淨好處，或中度可信的中度至顯著淨好處，建議執行</td></tr><tr><td>C</td><td>至少中度可信的少量淨好處，視專業考量與病人喜好</td></tr><tr><td>D</td><td>缺乏淨好處甚至弊大於利，不建議</td></tr><tr><td>I</td><td>證據不足，無法評估利害</td></tr></table></div><p>CPSTF 從公共衛生角度，用系統性回顧分成「建議」、「不建議」、「證據不足」三類。</p>","p":"p99"},{"tag":"必背","h":"篩檢的四組分類方式","b":"<ul><li><b>目標族群</b>：大規模篩檢（mass screening）漏網之魚少、族群控制較好，但成本高；高危險群／選擇性篩檢較省成本，難在精準定義高危險群，族群層級成效較差。</li><li><b>是否組織化</b>：組織性篩檢依固定間隔對目標族群做；伺機性篩檢是臨床醫師看診時隨機提供。</li><li><b>次數</b>：單次篩檢（如唐氏症篩檢）與週期性篩檢（如癌症篩檢）。</li><li><b>多重工具</b>：平行性與系列性（見下一則）。</li></ul>","p":"p99–100"},{"tag":"考點","h":"平行性篩檢與系列性篩檢：敏感度與特異度此消彼長","b":"<div class=\"tbl\"><table><tr><th></th><th>平行性</th><th>系列性</th></tr><tr><td>做法</td><td>同時用多個工具，任一陽性就算</td><td>先用高敏感度工具，陽性再做更嚴謹檢測，全部陽性才算</td></tr><tr><td>淨敏感度</td><td>增加</td><td>減少</td></tr><tr><td>淨特異度</td><td>減少</td><td>增加</td></tr><tr><td>例子</td><td>糖尿病篩檢</td><td>兩階段妊娠糖尿病篩檢</td></tr></table></div>","p":"p100"},{"tag":"必背","h":"篩檢計畫的基本原則：疾病面","b":"<p>源自 1960 年代 Wilson 和 Junger 在 WHO 提出的原則，精神延續至今。</p><ol><li>對個案、家庭與社會有重大影響</li><li>高盛行率與發生率，且臨床前期夠長，能及時偵測</li><li>自然史清楚，有可偵測的危險因子或指標，診斷後有良好且可接受的治療</li><li>早期治療比症狀出現後治療效果更好，並能降低死亡率與罹病率</li><li>疾病定義清楚，目標族群確實觸及得到</li></ol>","p":"p100"},{"tag":"必背","h":"篩檢計畫的基本原則：工具與策略面","b":"<ul><li><b>工具</b>：成本合理，有良好敏感性、特異性與預測值，並有一致認同的臨床定義或閾值；民眾普遍接受（簡便、迅速、無侵襲性），不違背倫理，法令政策配合。</li><li><b>策略</b>：要有高品質隨機研究證實能降低罹病率或死亡率；不是偶發活動，要長期定期執行；有明確時機或頻率，由可靠機構與人力執行；若目的只是提供資訊而非後續治療（如基因篩檢），準確度要求更嚴，且要事先與個案討論；考慮任何篩檢策略前，應先做初段預防。</li></ul>","p":"p100–101"},{"tag":"定義","h":"敏感度、特異度、PPV、NPV 一次搞懂","b":"<ul><li><b>敏感度</b>：罹病者中篩檢陽性的比率。高敏感度時，陰性結果較可靠地排除疾病。</li><li><b>特異度</b>：未罹病者中篩檢陰性的比率。高特異度時，陽性結果較可靠地指向疾病。</li><li><b>陽性預測率（PPV）</b>：篩檢陽性者中真的罹病的比率。</li><li><b>陰性預測率（NPV）</b>：篩檢陰性者中真的沒病的比率。</li></ul><p>另外，效度（validity）是工具能否正確反映真實狀態，信度（reliability）是再現性與一致性，兩者不同。</p>","p":"p101"},{"tag":"核心觀念","h":"盛行率太低，再準的工具 PPV 也會很低","b":"<p>臨床決策更相關的是 PPV 與 NPV，而兩者都受盛行率影響。假設敏感度 99%、特異度 99.9%：</p><div class=\"tbl\"><table><tr><th>盛行率</th><th>陽性預測率</th></tr><tr><td>1/100,000</td><td>1/101</td></tr><tr><td>1/10,000</td><td>1/11</td></tr><tr><td>1/1,000</td><td>1/2</td></tr><tr><td>1/100</td><td>10/11</td></tr><tr><td>1/10</td><td>99/100</td></tr></table></div><p>盛行率過低，會導致過度診斷或治療。篩檢高風險族群，可以提高 PPV。</p>","p":"p101–102"},{"tag":"定義","h":"評估篩檢成效的指標：RRR、ARR、NNS、NNH","b":"<ul><li><b>相對風險下降（RRR）</b>：篩檢組比未篩檢組，罹病或死亡風險的相對下降比例。</li><li><b>絕對風險下降（ARR）</b>：兩組風險機率差的絕對值。</li><li><b>需要被篩檢的個案數（NNS）</b>：檢驗出一個罹病者所需篩檢人數。</li><li><b>需要被傷害的個案數（NNH）</b>：因篩檢導致一位個案受傷害所需篩檢人數。</li></ul>","p":"p102"},{"tag":"必背","h":"篩檢常見的四種偏差","b":"<ul><li><b>前導期偏差</b>：篩檢提前診斷，把前導期算進存活時間，存活看似變長，其實死亡時間沒變。例如亨丁頓舞蹈症，基因篩檢提前診斷，病人可能仍在同一時間點死亡。</li><li><b>病程長短偏差</b>：進展慢的型別無症狀期長，容易被篩出，看似預後較好，對高侵襲性癌卻沒有額外好處（如甲狀腺癌、乳癌）。</li><li><b>過度診斷偏差</b>：篩出的異常不具臨床重要性，有無治療都不影響存活，對疾病特異性死亡率沒有影響。</li><li><b>自我選擇偏差</b>：願意受檢的人較注重健康、遵從性高，預後本來就較好。</li></ul>","p":"p102–103"},{"tag":"臨床做法","h":"臨床上怎麼用建議等級：A、B 要提供，D 不要提供","b":"<p>美國 USPSTF、CPSTF 與加拿大預防性健康照護任務小組（CTFPHC）都以實證角度給建議，可到官網或手機 app 查最新版本。</p><ul><li>建議等級 <b>A 或 B</b>：醫師都應該提供。</li><li>建議等級 <b>C</b>：透過醫病共同決策取得共識，例如攝護腺癌篩檢。</li><li>建議等級 <b>D</b>：不應提供，避免無效篩檢與醫療浪費。</li></ul><p>較有證據支持的基因篩檢，包括對家族性乳癌與卵巢癌高危險群做 BRCA 篩檢，以及對大腸直腸癌高度相關的 Lynch 症候群高危險族群做突變基因篩檢。</p>","p":"p103–104"},{"tag":"台灣數字","h":"USPSTF 與台灣現行的癌症篩檢建議對照","b":"<div class=\"tbl\"><table><tr><th>項目</th><th>USPSTF</th><th>台灣現行</th></tr><tr><td>大腸癌</td><td>50–75 歲（A）、45–49 歲（B）</td><td>45 至未滿 75 歲每 2 年糞便潛血；40–44 歲有家族史者同</td></tr><tr><td>乳癌</td><td>40–74 歲每 2 年乳房攝影</td><td>40–74 歲婦女每 2 年 1 次</td></tr><tr><td>肺癌</td><td>50–80 歲、吸菸 20 包-年以上、現吸或戒菸未達 15 年，每年低劑量 CT</td><td>50–74 歲吸菸 20 包-年以上，戒菸 15 年內者每 2 年 1 次，另有肺癌家族史對象</td></tr><tr><td>子宮頸癌</td><td>21–65 歲每 3 年抹片；30–65 歲可每 5 年 HPV 檢測</td><td>30 歲以上每年 1 次抹片（建議每 3 年至少 1 次），另提供 35、45、65 歲 HPV 檢測</td></tr></table></div>","p":"p105"},{"tag":"趨勢","h":"從單一疾病篩檢，走向以社區為基礎的整合式篩檢","b":"<p>近年衛生單位推動以全人為服務、以社區為基礎的整合式篩檢：整合不同篩檢項目、建構統一資訊系統、完整的後續轉介追蹤，並與其他資料庫水平聯結，深入社區到點服務，除了提升成效，也提高民眾參與度。</p><p>篩檢的對象也可以是某種生理狀態（如營養評估），執行者不一定是醫師，也可以是團隊其他人員。基因晶片、孕前檢查、循環腫瘤細胞篩檢等新工具，多數尚無完整實證基礎，更要看重信效度與篩檢目的。</p>","p":"p104–105"}],"recap":{"points":["篩檢是從無症狀族群找出可能有病的人，屬次段預防，結果陽性還需要診斷確認，也有偽陽性、偽陰性與過度診斷的壞處。","是否值得篩檢，要看疾病特性、篩檢工具與策略三面向的原則，並以敏感度、特異度、PPV、NPV 評估，盛行率會大幅影響 PPV。","解讀篩檢成效時要警覺前導期、病程長短、過度診斷與自我選擇偏差。建議等級 A、B 應提供，C 要共同決策，D 不應提供。"],"quiz":[{"q":"平行性篩檢與系列性篩檢，對淨敏感度與淨特異度各有什麼影響？","a":"平行性篩檢增加淨敏感度、減少淨特異度；系列性篩檢增加淨特異度、減少淨敏感度。"},{"q":"為什麼篩檢常見前導期偏差？","a":"篩檢讓診斷時間提前，存活期被算進前導期而看似延長，但死亡時間其實沒有改變，預後並未改善。"}]}},"7":{"posts":[{"tag":"台灣數字","h":"癌症連續 40 年是國人前兩大死因，政府已推六癌篩檢","b":"<div class=\"stat\"><div><strong>230.8</strong><span>2024 年癌症粗死亡率（每十萬人）</span></div><div><strong>113.3</strong><span>2024 年標準化死亡率，較上年降 1.9%</span></div><div><strong>約 88%</strong><span>癌症死亡集中在 55 歲以上</span></div></div><p>篩檢屬於次段預防。政府 2010 年起推乳癌、子宮頸癌、大腸直腸癌、口腔癌篩檢，2022 年加肺癌，2026 年再加胃癌。</p>","p":"p110–112"},{"tag":"必背","h":"四種癌症篩檢已證實能降死亡率，而且划算","b":"<ul><li><b>大腸癌</b>：每 2 年 1 次糞便潛血，死亡率降 35%</li><li><b>口腔癌</b>：35 歲以上有菸酒習慣的男性，每 3 年 1 次口腔黏膜目視檢查，降 26%</li><li><b>乳癌</b>：50 至 69 歲婦女，每 2 至 3 年 1 次乳房 X 光攝影，降 40%</li><li><b>子宮頸癌</b>：大規模抹片篩檢，發生率與死亡率降 70%</li></ul>","p":"p112"},{"tag":"核心觀念","h":"越早發現存活率越高，數字說得很清楚","b":"<div class=\"tbl\"><table><tr><th>癌別</th><th>早期</th><th>晚期</th></tr>\n<tr><td>大腸癌 5 年存活</td><td class=\"num\">局部 89.9%</td><td class=\"num\">遠處轉移 13.9%</td></tr>\n<tr><td>乳癌 5 年存活</td><td class=\"num\">原位癌 98% 以上</td><td class=\"num\">四期 40%</td></tr>\n<tr><td>子宮頸癌 5 年存活</td><td class=\"num\">零期近 100%</td><td class=\"num\">四期 10 至 14%</td></tr></table></div><p>大腸癌若已擴散到附近淋巴結，5 年存活率仍有 71.3%。</p>","p":"p112"},{"tag":"迷思","h":"不是每種癌症都適合篩檢，先過六道關","b":"<ol><li>疾病在社區裡重要（臨床前期盛行率高）</li><li>夠嚴重，影響壽命或生活品質</li><li>臨床前期夠長，提早治療能降低罹病與死亡</li><li>檢驗工具敏感度、特異度高，又簡單、無痛、便宜</li><li>早期治療真的有效</li><li>醫療系統接得住：人力、場地、追蹤、保險給付</li></ol><p>胰臟癌死亡率高，卻一直沒有有實證的篩檢工具。</p>","p":"p112–113"},{"tag":"迷思","h":"癌症健檢套餐，嚴格說來不是篩檢","b":"<p>腫瘤標記沒有實證支持，容易偽陽性，帶來不必要的檢查和擔憂。電腦斷層、核磁共振、正子掃描號稱能找出潛在癌症，卻更容易偽陰性，讓人放鬆警覺，等到有症狀已經太晚。</p><p>偽陽性會導致不必要的侵入性檢查，偽陰性會讓受檢者和醫師過度放心。</p>","p":"p113–114"},{"tag":"必背","h":"篩檢存活率變高，不一定是真的有效：四種偏差","b":"<ul><li><b>前導期偏差</b>（lead time bias）：只是提早診斷，存活時間因多算前導期而變長。要比較篩檢組與對照組的實際死亡率。</li><li><b>病程長短偏差</b>（length bias）：進展慢的腫瘤較容易被抓到。</li><li><b>過度診斷偏差</b>（overdiagnosis bias）：抓到的病灶不具臨床重要性，例如 DCIS、早期攝護腺癌。</li><li><b>自我選擇偏差</b>（self-selection bias）：願意受檢的人本來就較注重健康。</li></ul>","p":"p114"},{"tag":"臨床做法","h":"組織性篩檢 vs. 自發性篩檢，基隆模式是成功例子","b":"<p><b>組織性篩檢</b>（organized screening）是固定間隔邀請目標族群；<b>自發性篩檢</b>（opportunistic screening）是等民眾主動要求才做。</p><p>陳秀熙教授的社區整合式篩檢「基隆模式」同時處理 5 種癌症（乳癌、子宮頸癌、大腸直腸癌、肝癌、口腔癌）和 3 種慢性病（糖尿病、高血壓、高血脂），明顯提高參與度，資源也用得更有效。發生率不高的地區，可改採高危險群篩檢以節省成本。</p>","p":"p114–115"},{"tag":"必背","h":"肺癌：LDCT 是唯一有國際實證的篩檢工具","b":"<p>USPSTF 2021 建議：50 至 80 歲、吸菸 20 包年以上、仍在吸或 15 年內戒菸者，<b>每年</b>1 次低劑量電腦斷層（LDCT），B 級。戒菸超過 15 年、健康狀況影響預期壽命、或無法接受肺部手術時停止。</p><p>LDCT 約降低重度吸菸者肺癌死亡率 20%。但它不能預防肺癌發生，也有偽陽性、偽陰性與輻射暴露。最有效的預防還是儘早戒菸。</p>","p":"p116, p119"},{"tag":"台灣數字","h":"台灣肺癌篩檢：吸菸門檻 2025 年降到 20 包年","b":"<ul><li><b>家族史</b>：男性 45 至 74 歲、女性 40 至 74 歲，且父母、子女或兄弟姊妹得過肺癌</li><li><b>重度吸菸</b>：50 至 74 歲，吸菸 20 包年以上（2025 年起由 30 包年下修），仍在吸或戒菸未滿 15 年</li><li><b>其他高風險</b>：肺結核、COPD、氡暴露、金屬冶煉與石化業職業暴露，醫師評估後可考慮</li></ul><p>公費頻率是每 2 年 1 次，和 USPSTF 的每年 1 次不同。2024 年肺癌死亡 10,495 人，佔癌症死亡 19.4%。</p>","p":"p119"},{"tag":"臨床做法","h":"肝癌篩檢鎖定高危險群：AFP 加腹部超音波","b":"<div class=\"tbl\"><table><tr><th>對象</th><th>頻率</th></tr>\n<tr><td>B、C 型肝炎帶原，無肝硬化</td><td>每 6 至 12 個月</td></tr>\n<tr><td>肝硬化患者</td><td>每 3 至 6 個月</td></tr></table></div><p>腹部超音波偵測肝癌的敏感度 71%、特異度 93%。AFP+US 是目前最有實證的監測方式，約降低 40% 死亡率。新興標記 PIVKA-II 尚未成為我國或他國的篩檢政策。</p>","p":"p120"},{"tag":"台灣數字","h":"大腸癌連續 9 年發生率第一，現行篩檢是糞便潛血","b":"<p>2024 年大腸癌死亡 7,007 人，佔癌症死亡 13.0%。一位一等親得大腸直腸癌，風險是一般人的 2 至 4 倍；兩位則升到 3 至 6 倍。</p><div class=\"stat\"><div><strong>45–74 歲</strong><span>2025 年起每 2 年 1 次糞便潛血</span></div><div><strong>40–44 歲</strong><span>有家族史者建議提早篩檢</span></div></div><p>USPSTF（2016）建議 50 至 75 歲篩檢為 A 級，76 至 85 歲個別考量為 C 級。</p>","p":"p120–121"},{"tag":"研究","h":"大腸癌各種篩檢工具，降幅差很多","b":"<ul><li>iFOBT 每年做，大腸癌死亡率降 33%；每 2 年做，降 15 至 21%</li><li>乙狀結腸鏡降 41%</li><li>全大腸鏡降 68%</li></ul><p>台灣依本土證據，每 2 年 1 次 iFOBT 可降 35%。確診應以大腸鏡為主，鋇劑攝影和乙狀結腸鏡只當作無法接受大腸鏡時的替代方案。最佳採檢頻率的證據仍不足。</p>","p":"p121"},{"tag":"必背","h":"大腸息肉切除後，多久追蹤一次？","b":"<div class=\"tbl\"><table><tr><th>病理</th><th>追蹤間隔</th></tr>\n<tr><td>低風險腺瘤（1 至 2 顆管狀腺瘤，皆小於 1 公分）</td><td class=\"num\">5 至 10 年</td></tr>\n<tr><td>高風險腺瘤（3 顆以上、任一顆 1 公分以上、含絨毛成分或高度分化異常）</td><td class=\"num\">3 年</td></tr>\n<tr><td>未完整或分塊切除</td><td class=\"num\">3 至 6 個月</td></tr></table></div><p>間隔主要看病理報告（種類、大小、數量），以及清腸是否乾淨。</p>","p":"p122"},{"tag":"台灣數字","h":"乳癌台灣好發年齡比歐美早，篩檢已擴大到 40 至 74 歲","b":"<div class=\"stat\"><div><strong>53 歲</strong><span>台灣乳癌發生年齡中位數（美國 61 歲）</span></div><div><strong>40–74 歲</strong><span>2025 年起公費乳房攝影範圍</span></div></div><p>2004 年起提供 50 至 69 歲每 2 年 1 次，2009 年擴大到 45 至 69 歲，40 至 44 歲有家族史者 2010 年起可篩檢。</p>","p":"p122, p124"},{"tag":"必背","h":"USPSTF 乳癌篩檢：2 年 1 次，40 至 74 歲","b":"<ul><li><b>40 至 74 歲</b>：每 2 年 1 次乳房攝影（B 級）</li><li><b>75 歲以上</b>：證據不足（I 級）</li><li><b>緻密乳房</b>：加做超音波或 MRI 的證據不足（I 級），可能多找到乳癌，但多半是偽陽性</li></ul><p>數位乳房攝影與斷層合成（DBT）都是有效的初級篩檢。決策要同時考慮風險、乳房密度、預期壽命和對偽陽性的接受度，並用共享決策。</p>","p":"p123–124（表三）"},{"tag":"台灣數字","h":"口腔癌：菸、酒、檳榔三者並存，風險是無暴露者的 123 倍","b":"<div class=\"stat\"><div><strong>9 成</strong><span>口腔癌患者有吸菸</span></div><div><strong>7 成</strong><span>有喝酒</span></div><div><strong>123 倍</strong><span>三者並存的罹癌機率</span></div></div><p>政策是口腔黏膜檢查，每 2 年 1 次：30 歲以上嚼檳榔（含已戒）或吸菸者，以及 18 歲以上嚼檳榔（含已戒）的原住民。USPSTF 對例行口腔癌篩檢認為證據不足（I 級）。</p>","p":"p124–125"},{"tag":"迷思","h":"攝護腺癌 PSA 篩檢：看似合理，美國兩大學會卻反對","b":"<p>許多攝護腺癌長得慢，老年患者最後常死於其他疾病。PSA 在攝護腺肥大等良性疾病也會升高，偽陽性容易帶來不必要的侵襲性檢查。肛門指診的準確度則看執行者技巧。</p><p>USPSTF 與 ACS 都反對對無症狀的高齡男性做 PSA 篩檢。</p>","p":"p125"},{"tag":"台灣研究","h":"胃癌篩檢改查幽門螺旋桿菌，馬祖研究是關鍵證據","b":"<p>台灣 80 至 90% 的胃癌與<b>幽門螺旋桿菌</b>（Helicobacter pylori）感染有關。2026 年起公費提供 45 至 79 歲民眾終身 1 次糞便抗原檢測。</p><div class=\"stat\"><div><strong>64.2% → 15.0%</strong><span>馬祖幽門桿菌盛行率</span></div><div><strong>↓ 53%</strong><span>胃癌發生率</span></div></div><p>馬祖自 2004 年起全面篩檢與除菌，追蹤十多年。日本用上消化道攝影篩檢，但台灣發生率較低，用胃鏡或攝影篩檢更不符合經濟效益。</p>","p":"p125–126"},{"tag":"必背","h":"子宮頸癌：癌前期約 10 年，抹片單次會漏掉兩成","b":"<p>從上皮變異到侵犯性癌約需 10 年，有足夠時間被抓到。單次抹片偽陰性約 20%，連續 3 次陰性可降到約 1%。3 年 1 次抹片可降低 60 至 90% 的發生與死亡。</p><p>USPSTF 建議曾有性生活且有子宮頸的女性至少每 3 年 1 次抹片（A 級）。65 歲以上非高危且近期抹片正常、或因良性疾病全子宮切除者，不建議例行篩檢（D 級）。</p>","p":"p126–127"},{"tag":"趨勢","h":"2025 年起 HPV DNA 納入公費：35、45、65 歲各一次","b":"<p>抹片單次敏感度約 50 至 70%，HPV DNA 對 CIN2+ 敏感度可達 90% 以上。99% 以上的子宮頸癌與高風險型 HPV（如 16、18、52、58 型）持續感染有關。</p><ul><li><b>35、45 歲</b>：年輕時多為暫時感染，到這個年紀仍陽性，代表持續感染機率高</li><li><b>65 歲</b>：陰性風險極低，陽性則要積極追蹤</li></ul><p>25 至 29 歲女性也鼓勵每 3 年抹片 1 次。台灣婦癌醫學會仍建議抹片為第一線，HPV 可合併使用或在 ASCUS 時加做。</p>","p":"p127–129"}],"recap":{"points":["適合篩檢的癌症要過六道關，還要排除前導期、病程長短、過度診斷與自我選擇四種偏差。","台灣公費六癌篩檢（乳癌、子宮頸癌、大腸直腸癌、口腔癌、肺癌、胃癌）的對象、頻率近年都在擴大，要熟記各項年齡與間隔。","篩檢的價值要看陽性後的追蹤與治療，攝護腺癌 PSA 和一般癌症健檢套餐則缺乏支持。"],"quiz":[{"q":"USPSTF 與台灣的肺癌 LDCT 篩檢頻率各是多久？","a":"USPSTF 每年 1 次；台灣公費每 2 年 1 次。"},{"q":"什麼是前導期偏差？要怎麼避免？","a":"疾病只是提早診斷，存活時間因多算前導期而變長，死亡並未延後。比較篩檢組與對照組的實際死亡率可避免。"}]}},"8":{"posts":[{"tag":"台灣數字","h":"心血管疾病穩居國人死因第二，糖尿病和高血壓也在前六","b":"<p>2008 年起至 2024 年，心血管疾病在十大死因中是第二名，僅次於癌症。2024 年腦血管疾病第四名，糖尿病第五、高血壓第六，這兩者正是心血管與腦血管疾病的重要危險因子。</p><div class=\"stat\"><div><strong>48.6%</strong><span>美國成人心血管疾病盛行率（2017–2020）</span></div><div><strong>50–60%</strong><span>45 歲無心血管疾病者的終身風險</span></div></div>","p":"p132–133"},{"tag":"定義","h":"心血管疾病包含四大範疇","b":"<ul><li><b>冠心病</b>（CHD）：心肌梗塞、心絞痛、心衰竭，以及冠狀動脈疾病造成的死亡</li><li><b>腦血管疾病</b>：腦中風和暫時性腦缺血（TIA）</li><li><b>周邊動脈疾病</b>：包含間歇性跛行</li><li><b>主動脈粥狀硬化</b>：以及胸主動脈或腹主動脈瘤</li></ul>","p":"p132–133"},{"tag":"核心觀念","h":"初次心肌梗塞的危險因子，九成以上可以改","b":"<p>可改變的包含吸菸、血脂異常、高血壓、糖尿病、腹部肥胖、心理社會因素、蔬果攝取、飲酒和運動量。</p><div class=\"stat\"><div><strong>&gt;90%</strong><span>初次心肌梗塞可歸因於可改變因子</span></div><div><strong>&lt;10%</strong><span>45 或 55 歲維持理想指標的終身風險</span></div><div><strong>約 9 年</strong><span>Life's Essential 8 高水準者增加的預期壽命</span></div></div><p>理想指標指血壓 &lt;120/80 mmHg、總膽固醇 &lt;180 mg/dL、不抽菸、無糖尿病。</p>","p":"p133"},{"tag":"必背","h":"七大危險因子，加上 AHA 新增的睡眠與 Non-HDL-C","b":"<p>所有成人都要評估：吸菸、過重與肥胖、不健康飲食、缺乏運動、血脂異常、高血壓、糖尿病。</p><ul><li>2022 AHA 把<b>睡眠健康</b>列為心血管健康八大要素之一</li><li><b>Non-HDL-C</b> 取代總膽固醇成為首選指標，含 LDL、VLDL、IDL、Lp(a) 和乳糜微粒殘體；ApoB 也開始用在預防醫學</li><li>尼古丁暴露擴及電子煙和二手菸</li><li>Lp(a)、hs-CRP 和社會決定因素也被視為風險因子</li></ul>","p":"p133–134（表一）"},{"tag":"研究","h":"減重 5 至 10%，血壓和三酸甘油酯就明顯下降","b":"<p>肥胖，尤其腹部肥胖，會透過高血壓、血脂異常、高血糖和全身性發炎增加風險。英國基層資料中，BMI 大於 40 的人減重 10 至 25%，高血壓風險降 22%，血脂異常風險降 19%。</p><div class=\"stat\"><div><strong>17,600+</strong><span>SELECT 試驗納入的過重或肥胖、已有心血管疾病者</span></div><div><strong>↓ 20%</strong><span>每週 semaglutide 2.4 mg，約 40 個月，MACE 風險</span></div></div>","p":"p135"},{"tag":"趨勢","h":"心、腎、代謝是同一個病程：CKM 症候群與 hs-CRP","b":"<ul><li>慢性腎臟病患者的心血管事件風險是常人的 2 至 3 倍。</li><li>2023 年 AHA 提出<b>心血管-腎臟-代謝症候群</b>（CKM），尿蛋白（UACR）升高比 eGFR 下降更早預測心肌梗塞與中風。</li><li>2025 年 12 月 ACC 建議：即使 LDL-C 控制良好，hs-CRP 持續偏高仍有高復發風險，稱為殘餘發炎風險，初級與次級預防都應和膽固醇一起檢測。</li></ul><p>hs-CRP 過高時，要先排除急性感染。</p>","p":"p135–136"},{"tag":"台灣數字","h":"吸菸：每天只抽 2 至 5 支，風險仍明顯上升","b":"<div class=\"stat\"><div><strong>+50%</strong><span>每日 2–5 支，心臟衰竭風險</span></div><div><strong>+60%</strong><span>每日 2–5 支，全因死亡風險</span></div><div><strong>↓ 44%</strong><span>穩定冠心病者戒菸後的重大心血管事件</span></div></div><p>相同吸菸條件下，女性的心血管風險明顯高於男性。戒菸後 10 年內風險降最快，但要約 20 年以上才與完全不吸菸者相當。</p>","p":"p136"},{"tag":"迷思","h":"雞蛋、咖啡、酒：新版飲食建議怎麼說","b":"<ul><li><b>雞蛋</b>：2025–2030 美國飲食指南視為高品質食物，只有血脂異常或糖尿病者要適度限制，每日不超過 1 顆。</li><li><b>咖啡</b>：新研究顯示可能有保護作用，上午喝者心血管死亡風險約降 31%，前提是不加過多糖與奶精。</li><li><b>飲酒</b>：過量會升高血壓與三酸甘油酯。適度指女性每天最多 1 當量、男性最多 2 當量，1 當量 14 公克酒精。</li></ul><p>高升糖指數飲食、紅肉、反式脂肪和蔬果不足，都與風險上升有關。</p>","p":"p136–137"},{"tag":"核心觀念","h":"不能改的因子：年齡、性別、家族史","b":"<ul><li><b>年齡</b>：校正傳統因子後仍是獨立因子，每 10 年風險約加倍。</li><li><b>性別</b>：男性是冠心症危險因子。停經後女性發生率快速上升，是未停經同齡者的三倍。</li><li><b>家族史</b>：一等親中，男性 55 歲前、女性 65 歲前發生動脈粥狀硬化心血管疾病或因此死亡，才算重要的早發家族史。</li></ul>","p":"p137"},{"tag":"工具","h":"傳統風險工具：Framingham、ATP III、PCE","b":"<div class=\"tbl\"><table><tr><th>工具</th><th>評估的事件</th></tr>\n<tr><td>FRS-CHD（1988，高加索人）</td><td>10 年內冠心病死亡、非致命心肌梗塞、心絞痛</td></tr>\n<tr><td>ATP III（2002）</td><td>重度冠心病，不含心絞痛</td></tr>\n<tr><td>PCE（2013，2018 修訂）</td><td>冠心病死亡、非致命心肌梗塞、致命與非致命腦中風</td></tr></table></div><p>各工具定義的事件、預測族群都不同，要依個案挑選適合的，目前沒有公認的統一策略。</p>","p":"p138–139（表二）"},{"tag":"工具","h":"新一代工具：SCORE2 與 AHA PREVENT","b":"<ul><li><b>SCORE2</b>（ESC 2021）：40 至 69 歲、無心血管疾病或糖尿病者的 10 年致命與非致命風險。<b>SCORE2-OP</b> 適用 70 至 89 歲，校正高齡的競爭性死亡風險。用性別、年齡、吸菸、收縮壓、Non-HDL-C 五項。</li><li><b>PREVENT</b>（AHA 2023）：適用 30 至 79 歲，首度納入心衰竭，eGFR 是必評項目，UACR、HbA1c、社會剝奪指數可選用，不再用種族。</li></ul><p>PREVENT 算出的風險通常比舊版 PCE 低，因為採用近 10 至 20 年的資料。</p>","p":"p139–141"},{"tag":"臨床做法","h":"高血壓何時開始吃藥？2023 ESH 的起點與目標","b":"<ul><li><b>啟動</b>：18 至 79 歲診間血壓 ≥140/90 mmHg。80 歲以上收縮壓 ≥160，140 至 159 也可考慮。已有冠心病且血壓 ≥130/80 時可考慮。</li><li><b>目標</b>：18 至 79 歲先降到 &lt;140/90，耐受佳再降到 &lt;130/80 或更低。80 歲以上收縮壓降到 140 至 150，耐受佳可到 130 至 139。診間血壓不要低於 120/70。</li></ul><p>生活方式：減重（每降 1 公斤約降 1 mmHg）、鹽每日 &lt;5.8 克、每週 150 至 300 分鐘中強度運動、戒菸限酒。</p>","p":"p141"},{"tag":"臨床做法","h":"降血壓藥：多數人一開始就用兩種","b":"<p>ACEi、ARB、Beta-blocker、CCB、利尿劑五類都可當首選。多數患者建議起始就用單錠複方雙藥，首選 <b>RAS 抑制劑（ACEi 或 ARB）加 CCB 或利尿劑</b>。兩藥不夠就加到三藥，第四線可加 MRA（如 spironolactone）。</p><ul><li>不要同時用 ACEi 加 ARB，會增加腎損傷與高血鉀風險</li><li>糖尿病或慢性腎臟病優先 ACEi 或 ARB</li><li>氣喘避免 Beta-blocker，優先 CCB 或 ARB</li></ul>","p":"p142–143"},{"tag":"必背","h":"2025 ACC/AHA 高血壓分級與用藥時機","b":"<div class=\"tbl\"><table><tr><th>分類</th><th>收縮壓</th><th>舒張壓</th></tr>\n<tr><td>正常</td><td class=\"num\">&lt;120</td><td class=\"num\">&lt;80</td></tr>\n<tr><td>血壓上升</td><td class=\"num\">120–129</td><td class=\"num\">&lt;80</td></tr>\n<tr><td>第 1 期</td><td class=\"num\">130–139</td><td class=\"num\">80–89</td></tr>\n<tr><td>第 2 期</td><td class=\"num\">≥140</td><td class=\"num\">≥90</td></tr></table></div><p>初級預防中，平均血壓 ≥130/80 且 PREVENT 10 年風險 ≥7.5%，或有糖尿病、慢性腎臟病、已知心血管疾病，建議用藥。所有血壓上升或高血壓者都要做生活方式介入，如 DASH 飲食、減鈉、補鉀、運動。</p>","p":"p143–144"},{"tag":"台灣數字","h":"2022 台灣高血壓指引：不同族群的血壓目標","b":"<div class=\"tbl\"><table><tr><th>族群</th><th>目標（mmHg）</th></tr>\n<tr><td>初級預防</td><td class=\"num\">&lt;140/90</td></tr>\n<tr><td>糖尿病</td><td class=\"num\">&lt;130/80</td></tr>\n<tr><td>冠心病、慢性腎病、75 歲以上</td><td class=\"num\">&lt;120（AOBP）</td></tr>\n<tr><td>腦中風</td><td class=\"num\">&lt;140/90</td></tr>\n<tr><td>使用抗血栓劑預防中風</td><td class=\"num\">&lt;130/80</td></tr></table></div><p>AOBP 是自動化診間血壓監測。</p>","p":"p142（表五）"},{"tag":"臨床做法","h":"糖尿病視同最高風險類別，HbA1c 目標要個別化","b":"<p>第 2 型糖尿病但沒有心肌梗塞者，發生心肌梗塞與冠心病死亡的風險，和沒有糖尿病但已有心肌梗塞者相當。</p><ul><li>多數人 HbA1c 目標 ≤7.0%；老年、合併症多或預期壽命有限者可放寬，台灣指引舉例 &lt;8.5%</li><li>ADA 2026：已有 ASCVD、心衰竭或慢性腎臟病，治療應含 SGLT2 inhibitor 或 GLP-1 RA，不論 HbA1c 與是否用 Metformin</li><li>搭配血壓 &lt;130/80、Statin、生活方式與戒菸；已確診 ASCVD 者每日 aspirin 75 至 162 mg</li></ul><p>台灣用藥須留意健保給付規定。</p>","p":"p144–146"},{"tag":"臨床做法","h":"2026 ACC/AHA 血脂指引：更早治療，目標回來了","b":"<ul><li>用 PREVENT 取代 PCE，採 CPR 三步：計算、個人化、必要時用冠狀動脈鈣化（CAC）重新分類</li><li>初級預防：10 年風險 3 至 &lt;5% 可考慮降 LDL-C，5 至 &lt;10% 溝通後應考慮</li><li>Lp(a) 至少測一次，≥50 mg/dL 風險約增 1.4 倍，≥100 mg/dL 增 2 倍以上</li><li>40 至 75 歲有糖尿病、第 3 或 4 期慢性腎臟病或 HIV，不論 LDL-C 都建議降 LDL</li><li>極高風險次級預防：LDL-C &lt;55、Non-HDL-C &lt;85 mg/dL</li><li>三酸甘油酯 ≥1000 mg/dL 必須加藥，預防胰臟炎</li></ul>","p":"p147–148"},{"tag":"臨床做法","h":"台灣與 ESC 的降脂藥階梯：Statin、Ezetimibe、PCSK9","b":"<ol><li><b>Statin</b>：初級預防首選，先中等強度，不達標再調高</li><li><b>Ezetimibe</b>：最大耐受劑量 Statin 仍不達標時合併，或 Statin 不耐受時替代</li><li><b>PCSK9 抑制劑</b>：高強度 Statin 加 Ezetimibe 仍未達標，或 Statin 不耐受時考慮</li></ol><p>ESC 2025 指出 PCSK9 單株抗體單用約降 LDL-C 60%，三者併用最高降 85 至 86%。Inclisiran 是 siRNA，抑制肝臟合成 PCSK9。指引不推薦未經實證的補充劑或維生素。</p>","p":"p148–150"},{"tag":"必背","h":"心房顫動讓中風風險升高到 5 倍，首選 NOAC","b":"<p>心房顫動使血液在心房淤滯形成血栓，脫落就造成缺血性中風，常更嚴重且致殘率高。</p><ul><li><b>CHA₂DS₂-VASc</b>：女性 1、65–74 歲 1、≥75 歲 2、心衰竭 1、高血壓 1、糖尿病 1、中風/TIA/血栓病史 2、血管疾病 1。0 分每年中風約 0.2%，9 分約 12.2%</li><li>2024 台灣腦中風指引：非瓣膜性心房顫動以 NOAC 為第一線，優於 warfarin</li><li>用 HAS-BLED 評估出血風險，但高出血風險不是拒絕抗凝的理由，要處理可控因子如血壓</li></ul>","p":"p150–153"},{"tag":"臨床做法","h":"NOAC 比 warfarin 方便，但腎功能要注意","b":"<ul><li><b>NOAC</b>（dabigatran、rivaroxaban、apixaban、edoxaban）：藥效快、不必抽血監測，多數一天一次。腎功能不佳要調整劑量。</li><li><b>Warfarin</b>：價格低、長期數據多，但要常抽 INR，與深色蔬菜、中藥有交互作用。</li></ul><p>急性缺血性中風後，穩定且無顱內出血的小或中度梗塞，warfarin 可在 24 小時後開始，NOAC 約 48 小時後開始。近期置放支架的心房顫動患者，要縮短三合一療法，盡快轉為單一抗血小板加抗凝血。</p>","p":"p152–153（表十）"}],"recap":{"points":["心血管疾病的危險因子九成以上可改變，要評估七大因子，並納入 Non-HDL-C、Lp(a)、hs-CRP、腎功能與睡眠。","風險工具已從 PCE 走向 SCORE2 與 PREVENT；血壓、血糖、血脂目標都要依風險個別化並更積極。","心房顫動患者用 CHA₂DS₂-VASc 評估，非瓣膜性者首選 NOAC，高出血風險不是不抗凝的理由。"],"quiz":[{"q":"PREVENT 相較 PCE 有哪些改變？","a":"適用 30 至 79 歲，納入心衰竭與必評的 eGFR，可選 UACR、HbA1c、社會剝奪指數，不再用種族變項。"},{"q":"已確診 ASCVD、心衰竭或慢性腎臟病的第 2 型糖尿病患者，ADA 2026 建議治療要含什麼藥？","a":"SGLT2 inhibitor 或 GLP-1 受體促效劑，不論基礎 HbA1c 與是否使用 Metformin。"}]}},"9":{"posts":[{"tag":"定義","h":"營養不良不只是吃太少，吃太多也算","b":"<p>廣義的營養不良（malnutrition）包括營養不足、營養不均和營養過剩。少活動的生活型態加上營養不均的飲食，是高血壓、糖尿病、中風、癌症等慢性病的危險因子。</p><p>歷史上，1747 年英國海軍醫生 James Lind 發現柑橘類水果可治療船員壞血病，營養與健康的關係才逐漸受重視。</p>","p":"p158"},{"tag":"核心觀念","h":"營養篩檢和營養評估，差在對象與深度","b":"<ul><li><b>營養篩檢</b>（nutritional screening）：找出已知營養素缺乏或過多的症狀，看有沒有營養不良風險。對相對健康者使用，團隊任何成員都能做。</li><li><b>營養評估</b>（nutritional assessment）：針對懷疑營養不良或高危險群，判斷發生的可能性、原因和嚴重度，並進一步介入。</li></ul><p>例如用短版 MNA-SF 篩出可能營養不良，再做完整 MNA 確認。</p>","p":"p158–159"},{"tag":"台灣數字","h":"三高防治 888 計畫：營養被列為核心策略","b":"<div class=\"stat\"><div><strong>8 年</strong><span>計畫期程</span></div><div><strong>8 成</strong><span>三高病人加入慢性病照護網</span></div><div><strong>8 成</strong><span>接受生活習慣諮商</span></div><div><strong>8 成</strong><span>達到三高控制目標</span></div></div><p>營養面強調減鹽、減糖、增加蔬果、高齡者營養評估和社區營養介入。</p>","p":"p158"},{"tag":"必背","h":"營養評估的 ABCD 四大方法","b":"<ul><li><b>A</b> Anthropometric：體位測量</li><li><b>B</b> Biochemical：生化檢驗</li><li><b>C</b> Clinical：臨床檢查</li><li><b>D</b> Dietary：飲食評估</li></ul><p>單一方法往往不夠完整，所以專家把各項結合，發展出「分數評量系統」來提高敏感度和特異度。</p>","p":"p159–160"},{"tag":"台灣數字","h":"台灣成人 BMI 與腰圍切點","b":"<div class=\"tbl\"><table><tr><th>分類</th><th>BMI（kg/m²）</th></tr>\n<tr><td>過輕</td><td class=\"num\">&lt;18.5</td></tr>\n<tr><td>健康體位</td><td class=\"num\">18.5 至 &lt;24</td></tr>\n<tr><td>過重</td><td class=\"num\">24 至 &lt;27</td></tr>\n<tr><td>輕度肥胖</td><td class=\"num\">27 至 &lt;30</td></tr>\n<tr><td>中度肥胖</td><td class=\"num\">30 至 &lt;35</td></tr>\n<tr><td>重度肥胖</td><td class=\"num\">≥35</td></tr></table></div><p>腰圍異常：男性 ≥90 公分，女性 ≥80 公分。兒童青少年看年齡別百分位，超過 85 為過重，超過 95 為肥胖。</p>","p":"p160"},{"tag":"工具","h":"體位測量：方便，但看不出缺哪種營養素","b":"<p>體位測量能反映蛋白質熱量的失衡，卻無法指出缺的是哪種營養素，數值也要和同年齡、性別、種族的標準值比較才有意義。</p><ul><li><b>皮下脂肪厚度</b>：用 Lange 測徑器量三頭肌與肩胛下，或量上臂圍（MUAC）。方便便宜，但肝腎疾病的水腫會造成誤差。</li><li><b>影像與儀器</b>：電腦斷層、核磁共振估算內臟與皮下脂肪，DEXA 可測骨礦物、瘦質和脂肪質。</li></ul>","p":"p160"},{"tag":"臨床做法","h":"生化檢驗：白蛋白更像整體健康指標","b":"<p>白蛋白、前白蛋白、運鐵蛋白等常用來看蛋白質營養。但白蛋白受肝臟合成、腎臟流失影響，三分之二又在血管外，濃度隨總水分、肝腎功能變動。</p><p>所以它當作整體健康指標，比當作營養狀態指標更恰當。維生素 A、E、D、B12、葉酸，以及鋅、鎂、磷也可用來篩檢可疑個案。</p>","p":"p161–162"},{"tag":"臨床做法","h":"臨床檢查：體重減輕是敏感的警訊","b":"<div class=\"stat\"><div><strong>&gt;10%</strong><span>體重減輕，臨床上有顯著意義</span></div><div><strong>&gt;5%</strong><span>最近 3 個月內的體重減輕</span></div><div><strong>40–50%</strong><span>接受手術的病人有不同程度營養不良或風險</span></div></div><p>理學檢查可看到缺鐵的湯匙狀指甲、缺維生素 B 群的口角炎、缺碘的甲狀腺腫大。但這些常在缺乏已嚴重時才出現，早期發現要配合生化檢驗。</p>","p":"p162"},{"tag":"臨床做法","h":"別忘了功能與心理評估：握力和動機","b":"<ul><li><b>功能評估</b>：用握力計測骨骼肌功能。握力差的住院病人住院較久、死亡率較高。基層可用握力器或肌力檢查，早期發現長者的肌少症風險。</li><li><b>心理狀態</b>：飲食行為（厭食、暴食）和憂鬱最相關。抗精神病藥、抗憂鬱劑、情緒穩定劑可能讓體重增加。也要評估病人的動機、期待和行為改變階段，幫助營養諮商。</li></ul>","p":"p162"},{"tag":"工具","h":"飲食評估：24 小時回憶法怎麼做","b":"<p>由受過訓練的訪視員，請受訪者回想過去 24 小時吃喝的所有東西，問卷為開放式，記錄時間、地點、頻率、食物名稱、材料、數量與烹調方式，再對照食物成分表分析營養素。</p><p>若想了解飲食型態，最好記錄最近 5 至 7 天，包含週末假日。其他還有飲食史、食物紀錄、食物頻率問卷，也有 APP 可用影像或文字記錄。</p>","p":"p162–164"},{"tag":"必背","h":"GLIM 營養不良診斷：一項病因加一項表現型","b":"<p>2019 年四個國際營養學會提出全球營養不良領導倡議（GLIM）共識，要同時符合：</p><ul><li><b>病因準則</b>：發炎或疾病負荷，或食物攝取、吸收不良</li><li><b>表現型準則</b>：體重下降、低 BMI，或肌肉量下降</li></ul><p>表現型準則也用來判定嚴重度。ESPEN 則建議住院病人用 NRS-2002，社區族群用 MUST，老年人用 MNA-SF。</p>","p":"p164"},{"tag":"工具","h":"SGA 與 MNA：一個看全面，一個專攻老人","b":"<ul><li><b>SGA</b>：整合飲食與疾病史、功能評估和理學檢查。A 級營養良好，B 級中度營養不良，C 級嚴重營養不良。信效度好，但複雜耗時，病人回溯也可能有誤差。</li><li><b>MNA</b>：18 項，約 15 分鐘。總分 &gt;24 無風險，17 至 23 有潛在風險，&lt;17 營養不良。第一部分即 <b>MNA-SF</b>，≥12 分正常，≤11 分可能營養不良，再做完整 MNA。</li></ul>","p":"p164–167"},{"tag":"工具","h":"MUST、NRS-2002、MST：三種快速篩檢","b":"<ul><li><b>MUST</b>：用目前 BMI、近 3 至 6 個月非刻意體重減輕、急性疾病（5 天以上無法進食）三項，分低、中、高風險。適用各年齡成人與各照護場域。</li><li><b>NRS-2002</b>：ESPEN 建議用於所有住院病人，總分 ≥3（70 歲以上加 1 分）為高風險，啟動營養支持。</li><li><b>MST</b>：只問非刻意體重減輕與食慾變差兩題，總分 ≥2 為風險者。不易用於無法溝通的病人。</li></ul>","p":"p167–169"},{"tag":"工具","h":"NRI、GNRI 與即時營養評估：靠抽血數字的風險量表","b":"<div class=\"tbl\"><table><tr><th>工具</th><th>風險切點</th></tr>\n<tr><td>NRI</td><td>&gt;100 無風險，83.5 至 97.5 輕度，&lt;83.5 重度</td></tr>\n<tr><td>GNRI（老年住院）</td><td>&gt;98 無風險，92 至 98 低度，82 至 91 中度，&lt;82 重度</td></tr>\n<tr><td>即時營養評估</td><td>白蛋白 &lt;3.5 g/dL 且淋巴球 &lt;1,500/mm³</td></tr></table></div><p>GNRI 用理想體重取代平時體重，預測老年住院併發症與死亡的可信度高於單用 BMI 或白蛋白。它是風險指標，不是營養不良診斷。</p>","p":"p167–170"},{"tag":"台灣數字","h":"國民營養調查：蔬果乳品不足，維生素 D 最缺","b":"<div class=\"stat\"><div><strong>39.3%</strong><span>19 歲以上男性代謝症候群盛行率</span></div><div><strong>30.3%</strong><span>19 歲以上女性代謝症候群盛行率</span></div><div><strong>3–4 成</strong><span>16 至 44 歲女性維生素 D 缺乏</span></div><div><strong>5 成</strong><span>45 歲以上成人碘缺乏，雖然八至九成家庭用碘鹽</span></div></div><p>第六次調查（2017–2020）顯示，蔬菜、水果、乳品遠低於建議，主食過於精製，飽和脂肪與鈉偏高，膳食纖維偏低。生育年齡女性貧血盛行率達 20%。</p>","p":"p170–171"},{"tag":"臨床做法","h":"小腿圍可以篩肌少症：亞洲切點","b":"<p>研究指出高齡者小腿圍與衰弱症有關。台灣 65 歲以上長者小腿圍平均值，男性 35.4 公分、女性 34.0 公分，且隨年齡減少。</p><p>亞洲肌少症工作小組（AWGS）的診斷切點是男性 &lt;34 公分、女性 &lt;33 公分。</p>","p":"p171"},{"tag":"核心觀念","h":"營養需求怎麼算：熱量與蛋白質","b":"<p><b>總熱量消耗</b>（TEE）= 基礎代謝率 BMR（50 至 70%）+ 活動消耗（15 至 30%）+ 食物熱效應 TEF（10%）。臨床常用預測公式如 Harris-Benedict 算基礎能量，再加上壓力與活動量。</p><p><b>蛋白質</b>：第八版 DRIs 建議成人 1.1 g/kg，70 歲以上和 80 歲以上老人 1.2 g/kg。換算後各年齡層男性 70 g/天、女性 60 g/天。</p>","p":"p172"},{"tag":"必背","h":"DRIs 家族：EAR、RDA、AI、UL、AMDR","b":"<ul><li><b>EAR</b>：滿足半數健康人所需的量</li><li><b>RDA</b>：EAR 加 2 個標準差，滿足 97 至 98% 健康人</li><li><b>AI</b>：資料不足無法定 RDA 時，用健康者實際攝取量推算</li><li><b>UL</b>：對絕大多數人不致有害的最高攝取量</li><li><b>AMDR</b>：碳水化合物、脂質、蛋白質的適宜熱量比例範圍</li></ul><p>RDA 常被誤當成最低值而攝取過量，所以 1997 年改以 DRIs 為新標準。國人三大營養素實際攝取：蛋白質 16 至 17%、脂肪 28 至 35%、醣類 49 至 56%。</p>","p":"p171–173"},{"tag":"工具","h":"門診營養介入用 5A's，轉介社區營養推廣中心","b":"<p>5A's：<b>Ask</b> 詢問、<b>Assess</b> 評估、<b>Advise</b> 建議、<b>Agree</b> 共同決定、<b>Assist</b> 協助與追蹤。強調以病人為中心、可達成的行為目標和持續追蹤。</p><p>2018 年起國健署倡議各縣市衛生局設「社區營養推廣中心」，由營養師提供營養風險篩檢、營養教育、健康餐飲輔導等服務，醫師可連結資源。學習資源可看「我的餐盤」。</p>","p":"p174"},{"tag":"趨勢","h":"營養照護流程 ADIME：評估只是第一步","b":"<p>美國營養與飲食學會（AND）定義的營養照護流程（NCP）有四步：</p><ol><li>營養評估與再評估</li><li>營養診斷</li><li>營養介入</li><li>營養監測與評值</li></ol><p>循環調整，讓跨專業團隊用標準化語彙合作。老年人若營養狀況良好，可縮短住院天數、降低死亡率。</p>","p":"p174"}],"recap":{"points":["營養篩檢用於相對健康者找風險，營養評估用於高風險或疑似營養不良者，方法可用 ABCD 記憶。","各種分數量表各有適用對象：MNA 與 GNRI 看老人，NRS-2002 看住院，MUST 看社區與各年齡，GLIM 需一項病因加一項表現型。","國人營養問題包括蔬果乳品不足、鈉偏高、維生素 D 與碘缺乏，基層可用 5A's 與社區營養資源介入。"],"quiz":[{"q":"MNA 的三個分數區間各代表什麼？","a":"大於 24 分無營養不良風險，17 至 23 分有潛在風險，小於 17 分為營養不良。"},{"q":"為什麼血清白蛋白不太適合單獨當營養狀態指標？","a":"它受肝臟合成、腎臟流失與總體水分影響，三分之二在血管外，更像整體健康指標。"}]}},"10":{"posts":[{"tag":"台灣數字","h":"台灣成人近四分之一肥胖，糖尿病盛行率逾一成","b":"<div class=\"stat\"><div><strong>23.9%</strong><span>19 歲以上肥胖盛行率（2017–2020）</span></div><div><strong>26.8%</strong><span>體重過重盛行率</span></div><div><strong>10.7%</strong><span>成人糖尿病盛行率（IDF 2024）</span></div><div><strong>14.8%</strong><span>葡萄糖耐受性異常盛行率</span></div></div><p>肥胖盛行率比 1994–1996 年成長一倍。空腹血糖異常盛行率為 5.0%。</p>","p":"p178"},{"tag":"工具","h":"肥胖篩檢首選 BMI，因為它和體脂高度相關","b":"<p>USPSTF 建議用身體質量指數（BMI）篩檢肥胖。BMI 與體脂比率高度相關（R² 男 0.95、女 0.98）。</p><p>生物電阻抗、DEXA、同位素稀釋、水中稱重也能評估，但臨床上不易實施。腰圍是可取代 BMI 的另一種方式。</p>","p":"p178–179"},{"tag":"必背","h":"同樣是 BMI，WHO、亞洲、台灣的切點都不一樣","b":"<div class=\"tbl\"><table><tr><th>標準</th><th>過重</th><th>肥胖</th></tr>\n<tr><td>WHO 1998</td><td class=\"num\">25 至 &lt;30</td><td class=\"num\">≥30</td></tr>\n<tr><td>IOTF 2000（亞洲）</td><td class=\"num\">23 至 &lt;25</td><td class=\"num\">≥25</td></tr>\n<tr><td>台灣 2013</td><td class=\"num\">24 至 &lt;27</td><td class=\"num\">≥27</td></tr></table></div><p>2 歲以上兒童青少年看同年齡同性別百分位，85 以上過重，95 以上肥胖。</p>","p":"p179"},{"tag":"研究","h":"肥胖篩檢沒有直接的隨機試驗，但間接證據支持","b":"<p>肥胖會增加心血管疾病、第 2 型糖尿病、高血脂、膽囊疾病、癌症、關節病變，以及情緒、睡眠、飲食障礙的風險。</p><p>目前沒有隨機對照研究證明肥胖篩檢能改善罹病率、死亡率與功能，但從早期減重介入的健康效益，有間接證據支持。體重篩檢可能讓人被貼標籤，卻沒有證據顯示會直接造成精神功能或飲食障礙，減重造成骨密度下降、增加飲食障礙的疑慮也未被證實。</p>","p":"p179"},{"tag":"考點","h":"USPSTF 肥胖建議：量身高體重，有肥胖就轉介行為介入","b":"<ul><li><b>18 歲以上成人</b>：常規測量身高體重算 BMI，肥胖者提供或轉介密集多面向行為介入（B 級）</li><li><b>6 歲以上兒童青少年</b>：常規測量算 BMI，肥胖者提供或轉介完整且密集的行為介入（B 級）</li></ul><p>多久量一次，目前沒有證據可建議間隔。</p>","p":"p179"},{"tag":"工具","h":"糖尿病篩檢有三種工具，診斷要兩項異常","b":"<p>ADA 與 USPSTF 認為空腹血糖、糖化血色素、75 公克 OGTT 後 2 小時血糖都可用來篩檢。</p><p>診斷需符合下列其一：</p><ul><li>同一時間兩種不同檢測都異常（例如空腹血糖 ≥126 mg/dL 且糖化血色素 ≥6.5%）</li><li>不同時間同一種檢測兩次異常（例如兩次空腹血糖 ≥126 mg/dL）</li></ul><p>心血管風險從空腹血糖異常或葡萄糖耐性異常就開始，並隨血糖上升而增加。</p>","p":"p179–180"},{"tag":"研究","h":"糖尿病常規篩檢缺直接證據，但介入血糖異常者有效","b":"<p>沒有直接證據顯示常規篩檢能改善健康或減少併發症。不過對空腹血糖異常或葡萄糖耐性異常者，隨機試驗顯示強力生活方式介入可降低糖尿病發生率。</p><p>篩檢的潛在傷害是偽陽性造成的精神壓力，以及後續治療的副作用。對高風險族群則有良好證據：高血壓患者發現糖尿病後降血壓、高血脂患者發現糖尿病後降血脂，都能降低心血管風險。</p>","p":"p180"},{"tag":"考點","h":"USPSTF 糖尿病篩檢：35 至 70 歲過重或肥胖者","b":"<ul><li><b>對象</b>：35 至 70 歲過重或肥胖的成人（B 級）</li><li><b>介入</b>：血糖異常者提供飲食與運動介入</li><li><b>頻率</b>：血糖正常者每 3 年篩檢一次是適當的</li></ul>","p":"p180"},{"tag":"臨床做法","h":"妊娠性糖尿病：24 週用 50 公克 OGTT 先篩","b":"<p>台灣做法是懷孕 24 週時做 50 公克 OGTT，空腹或進食後都可。負荷後 1 小時血糖 ≥140 mg/dL，再做 100 公克 OGTT 確診。</p><p>以 ≥140 mg/dL 為異常，敏感度 75 至 100%，特異度 25 至 86%。</p><p>篩檢加早期介入（飲食與積極胰島素）可降低肩難產、生產傷害（臂神經叢傷害、骨折）和巨嬰症，但對新生兒死亡、黃疸、低血糖、呼吸窘迫症沒有一致結論，也不會增加剖腹產或母親低血糖。USPSTF 建議 24 週後篩檢為 B 級，24 週前證據不足（I 級）。</p>","p":"p180–181"},{"tag":"迷思","h":"甲狀腺 TSH 篩檢：抓得到，但治療有沒有好處不確定","b":"<ul><li>TSH 在其他檢查異常前就能偵測亞臨床甲狀腺疾病（T4 正常、TSH 異常），敏感度 98%、特異度 92%。</li><li>80 歲以上無甲狀腺疾病者，有 12% 的 TSH 超過 4.5 mIU/L，老人的「正常值」可能不適用。</li><li>無症狀甲低在美國男約 3%、女約 5%，未治療約 37% 會恢復正常，只有 2 至 5% 會變成明顯甲低。無症狀甲亢約 0.7%，約 25% 恢復正常，1 至 2% 進展成明顯甲亢。</li></ul><p>沒有足夠證據顯示治療能改善血壓、BMI、骨密度、血脂或認知。USPSTF 對無症狀成人常規篩檢評為證據不足（I 級）。</p>","p":"p181"}],"recap":{"points":["肥胖用 BMI 篩檢，台灣 BMI ≥24 為過重、≥27 為肥胖；18 歲以上成人都該常規量身高體重，肥胖者轉介行為介入。","糖尿病篩檢針對 35 至 70 歲過重或肥胖者，正常者每 3 年一次；孕婦在 24 週後篩檢妊娠性糖尿病。","無症狀成人的甲狀腺 TSH 常規篩檢證據不足（I 級）。"],"quiz":[{"q":"台灣妊娠性糖尿病的篩檢流程是什麼？","a":"懷孕 24 週做 50 公克 OGTT，1 小時血糖 ≥140 mg/dL 者再做 100 公克 OGTT 確診。"},{"q":"為什麼 TSH 能比其他檢查更早發現甲狀腺問題？","a":"TSH 可在 T4 仍正常時就偵測到亞臨床甲狀腺疾病，敏感度 98%、特異度 92%。"}]}},"11":{"posts":[{"tag":"核心觀念","h":"為什麼要早期篩出失智？不只是為了治療","b":"<p>大部分失智症進程緩慢、無法治癒，但早期發現仍能延緩惡化、維持功能與生活品質，並減輕照顧者壓力。</p><p>有些失智可逆，例如甲狀腺功能低下、維生素 B12 缺乏、電解質失調、常壓性水腦症、腦腫瘤，更要早期找出來治療。早期診斷也讓病人與家屬能提早做預立醫療決定與財務規劃。</p>","p":"p184"},{"tag":"定義","h":"DSM-5 把失智症改稱「主要神經認知障礙」","b":"<p>六大認知領域中，有一項以上顯著衰退，已影響獨立生活，且不發生在譫妄中，也無法用憂鬱症、思覺失調症等解釋：</p><ul><li>注意力</li><li>學習與記憶</li><li>執行功能</li><li>語言</li><li>視覺建構感知</li><li>社會人際認知</li></ul><p>認知衰退但尚不影響獨立生活，則歸為<b>輕度神經認知障礙</b>（Mild Neurocognitive Disorder）。</p>","p":"p184–185"},{"tag":"核心觀念","h":"六大領域壞掉時，門診會看到什麼","b":"<ul><li><b>注意力</b>：難專注、無法多工、易分心</li><li><b>學習記憶</b>：忘記重要事件、重複提問</li><li><b>執行功能</b>：計劃、推理、處理複雜任務變差</li><li><b>語言</b>：找不到詞、話語重複、用「那個」代替名稱</li><li><b>視覺建構</b>：迷路、不會用熟悉的工具</li><li><b>社交認知</b>：難辨識他人情緒、舉止失當</li></ul><p>阿茲海默症多從短期記憶開始，路易體失智症早期就有視覺空間能力減退和視幻覺。</p>","p":"p185"},{"tag":"必背","h":"失智症十大警訊","b":"<ol><li>近期記憶喪失影響生活工作</li><li>抽象思考能力降低</li><li>很難完成熟悉的家庭事務</li><li>物品擺放錯亂</li><li>語言表達困難，說不出確切名詞</li><li>行為與情緒改變</li><li>時間空間概念變差，容易迷路走失</li><li>個性改變</li><li>判斷力變差，警覺性降低</li><li>喪失活動力，對事物失去興趣</li></ol>","p":"p185"},{"tag":"臨床做法","h":"篩檢之前，先排除這些會假裝失智的狀況","b":"<p>好的篩檢工具要簡便可行，且有適當的敏感度與準確度。施測前先排除：</p><ul><li>譫妄</li><li>憂鬱</li><li>藥物影響</li><li>睡眠呼吸中止</li><li>聽力或視力不足</li></ul>","p":"p185"},{"tag":"工具","h":"AD-8：問家屬，2 題以上「是」就要進一步評估","b":"<p>美國華盛頓大學發展，訪談家屬或照顧者，看個案這幾年在判斷力、興趣、重複話語、學習使用工具、時間定向、財務處理、記住約會、持續思考記憶問題 8 方面有沒有改變，是同一人的前後比較。</p><div class=\"stat\"><div><strong>≥2 分</strong><span>已有認知缺損，需進一步確診</span></div><div><strong>97.6% / 78.1%</strong><span>國內敏感度 / 特異度</span></div><div><strong>74% / 86%</strong><span>國外敏感度 / 特異度</span></div></div><p>沒有家屬資訊、直接問病人，敏感度較低。</p>","p":"p185–186（表一）"},{"tag":"工具","h":"MMSE 最常用，但有天花板效應","b":"<p>Folstein 等人 1975 年發表，滿分 30 分，小於 24 分可能失智。分數受教育程度影響：高教育者切點可提高到 26 分以下，不識字者可降到 16 分以下。</p><p>內容含定向力（10）、訊息登錄（3）、注意力與計算（5，連續減 7）、短期回憶（3）、語言（8）、空間抄圖（1）。可篩出輕度到中重度失智，但較難測出極早期失智，對高教育者的退化也鑑別力不足。</p>","p":"p186–187"},{"tag":"研究","h":"MoCA 抓 MCI 的敏感度 90%，MMSE 只有 18%","b":"<div class=\"stat\"><div><strong>90%</strong><span>MoCA 對 MCI 敏感度</span></div><div><strong>87%</strong><span>MoCA 特異度</span></div><div><strong>18%</strong><span>MMSE 對 MCI 敏感度</span></div></div><p>MoCA 約 10 分鐘，滿分 30 分，教育程度 ≤12 年加 1 分，26 分以上為正常。可篩檢輕度認知功能障礙（MCI）和極早期阿茲海默症，測專注、執行功能、記憶、語言、視覺構建、思考概念、計算、定向。</p>","p":"p187"},{"tag":"工具","h":"畫鐘測試：簡單就好，計分不用複雜","b":"<p>請受測者畫一個時鐘，填上 1 至 12，畫出指定時間（如 11 點 10 分）。時鐘結構失調、數字錯漏或位置混亂、指針方向或長度不對即為異常。</p><p>評估視覺空間、邏輯思維和執行功能。複雜計分不會提高效度，只會拖長施測時間，基層只要分辨正常與異常即可。它能識別中重度失智，對極早期敏感度低，不宜單獨篩 MCI，但 MoCA 和 SLUMS 都含畫鐘。</p>","p":"p187–189"},{"tag":"必背","h":"SLUMS：依學歷分層的切點","b":"<div class=\"tbl\"><table><tr><th>學歷</th><th>正常</th><th>MCI</th><th>失智</th></tr>\n<tr><td>高中以上</td><td class=\"num\">27–30</td><td class=\"num\">21–26</td><td class=\"num\">0–20</td></tr>\n<tr><td>未完成高中</td><td class=\"num\">25–30</td><td class=\"num\">20–24</td><td class=\"num\">0–19</td></tr></table></div><p>SLUMS 免費，滿分 30 分，涵蓋記憶、定向、注意、語言、計算與執行功能（畫鐘），對 MCI 敏感度高，可取代 MMSE。</p>","p":"p189"},{"tag":"定義","h":"主觀認知退化 SCD：自覺變差，但測驗還正常","b":"<p>SCD 是自覺記憶退化，客觀認知測驗仍在正常範圍，是正常與 MCI 之間連續譜的極早期階段。用 SCD-Q21（滿分 21 分，分數越高越明顯）。</p><ul><li>得分中位數：正常老人 6 分，MCI 老人 9.5 分</li><li>精簡版 SCD-Q9：正常老人中位數 3 分，MCI 老人 5 分</li></ul><p>風險較高的情形：年齡 ≥60 歲、症狀持續、擔憂、覺得比同儕差、曾求助、家屬也察覺。憂鬱、焦慮、睡眠障礙、慢性壓力常造成假陽性，要一併評估。</p>","p":"p189–190"},{"tag":"臨床做法","h":"基層怎麼篩：先 SCD 或 AD-8，陽性再用 MoCA 或 SLUMS","b":"<p>目前缺乏證據支持對所有無症狀老人做認知篩檢。流程是先用 SCD 或 AD-8 前測，陽性者再用 MoCA、SLUMS 或 MMSE（必要時加畫鐘）客觀評估。</p><p>出現這些情形就啟動篩檢：</p><ul><li>主訴記憶或認知下降</li><li>家屬或照顧者察覺記憶、判斷力或功能改變</li><li>醫師在門診觀察到可疑表現</li><li>日常生活功能下降</li></ul><p>懷疑早期失智時優先 MoCA 或 SLUMS，異常或高度懷疑者轉介專科或記憶門診。</p>","p":"p192"}],"recap":{"points":["失智症（主要神經認知障礙）看六大認知領域與日常生活功能是否下降，施測前要先排除譫妄、憂鬱、藥物、睡眠呼吸中止、聽視力問題。","AD-8 問家屬、≥2 分異常；MMSE 有天花板效應；MoCA 與 SLUMS 對 MCI 敏感度較高；畫鐘只分正常或異常。","不建議對所有無症狀老人做認知篩檢，有主訴或警訊才篩，先 SCD 或 AD-8，陽性再用 MoCA 或 SLUMS。"],"quiz":[{"q":"為什麼懷疑早期失智時優先選 MoCA 或 SLUMS，而不是 MMSE？","a":"MMSE 有天花板效應，對 MCI 敏感度僅 18%；MoCA 約 90%，SLUMS 對 MCI 也有高敏感度。"},{"q":"AD-8 的資訊來源與判讀切點是什麼？","a":"訪談家屬或照顧者，比較個案近年的變化，8 題中 2 題以上為「是」就要進一步評估。"}]}},"12":{"posts":[{"tag":"定義","h":"完整的篩檢建議，不只是「做某項檢查」","b":"<p>篩檢（screening）是對還沒症狀的人做特定檢驗，希望在臨床前期提早診斷和治療。它屬於三段五級中的第二段，也就是第三級預防。</p><p>一份完整建議要包含：篩檢對象、目標疾病、篩檢工具、頻率、開始與停止的年齡。決策時還要把陽性後的確診檢查和確診後的治療一併跟個案討論。</p>","p":"p194–195"},{"tag":"核心觀念","h":"邏輯上該篩，不代表真的該篩","b":"<p>理想的篩檢項目通常是重要又常見的疾病，工具敏感度不差、特異度夠好、侵入性可接受，而且早期治療確實有用。</p><p>但篩檢工具、確診、治療三個階段都可能有傷害，例如併發症、偽陽性、焦慮、請假損失。單靠邏輯推論或片段觀察資料，無法確認好處多於壞處，必須有品質夠好的研究。</p>","p":"p195"},{"tag":"迷思","h":"篩檢族存活更久？小心前導時間偏差","b":"<ul><li><b>前導時間偏差</b>（lead-time bias）：篩檢出來的人存活期較長，可能只是診斷得早，不代表治療真的有效。</li><li><b>惰性癌症</b>（indolent cancer）：有些癌症進展很慢，心血管的部分血管阻塞也未必會惡化，卻會因篩檢而被檢查、治療，承擔風險。</li></ul>","p":"p195"},{"tag":"研究","h":"什麼樣的篩檢研究才可信？","b":"<p>最佳設計是隨機對照試驗：在「要不要篩檢」這一步就隨機分組，用標準化的篩檢、確診、治療流程，追蹤夠久，看有意義的結果（死亡率、生活品質）。</p><p>常見陷阱有兩個：</p><ul><li>用目標疾病發現率當結果，追蹤又太短，篩檢組會顯得抓到更多病人。</li><li>只看單一疾病死亡率，漏掉併發症死亡、其他死因和長期傷害（例如檢查輻射造成的癌症）。</li></ul><p>重要政策還會依據多個試驗的統合分析。</p>","p":"p195–196"},{"tag":"必背","h":"本章在談哪些篩檢？D、I，以及部分 C","b":"<p>USPSTF 的建議強度由「好處大於壞處的大小」和「證據明確程度」決定，分 A、B、C、D、I。</p><ul><li><b>D</b>：好處不多於壞處，不建議</li><li><b>I</b>（Insufficient）：證據不足，無法給建議</li><li><b>C</b>：好處只稍多於壞處，需個別化醫病討論</li></ul><p>本章也引用澳洲 RACGP Red Book（第 10 版），把項目分成「強烈不建議」與「通常不建議」。範圍限於無症狀、一般風險的成人，不含兒童、孕婦與高風險族群。</p>","p":"p196–197"},{"tag":"必背","h":"基因檢測：一般風險族群，三種都不建議","b":"<ul><li><b>MTHFR</b>：不建議用來篩檢靜脈血栓、早期流產或冠心病（RACGP）。</li><li><b>BRCA 1/2</b>：個人與家族都沒有相關癌症史者不建議（USPSTF D）。有乳房、卵巢、輸卵管、腹膜惡性腫瘤病史者，建議用問卷評估後諮商與檢測（B）。</li><li><b>ApoE</b>：不建議用來篩檢阿茲海默症風險，預測力不夠，也沒有不同的預防措施。</li></ul>","p":"p198"},{"tag":"考點","h":"腹主動脈瘤超音波：誰要做、誰不用做","b":"<div class=\"tbl\"><table><tr><th>對象（65–75 歲）</th><th>USPSTF</th></tr>\n<tr><td>男性，曾吸菸（100 支以上）</td><td class=\"num\">B 篩檢</td></tr>\n<tr><td>男性，不曾吸菸</td><td class=\"num\">C 個別化</td></tr>\n<tr><td>女性，不曾吸菸且無家族史</td><td class=\"num\">D 不建議</td></tr>\n<tr><td>女性，曾吸菸或有家族史</td><td class=\"num\">I 證據不足</td></tr></table></div><p>方式是超音波，終身一次。</p>","p":"p198"},{"tag":"考點","h":"心血管：這些檢查拿來篩無症狀者，證據都不夠","b":"<ul><li><b>頸動脈超音波</b>：D 級。無症狀狹窄的治療效益未確定，且有風險。</li><li><b>踝肱血壓指數 ABI</b>：I 級。篩出偏低者用阿斯匹靈，也沒看到明確效益。</li><li><b>心房顫動</b>（心電圖、穿戴裝置）：I 級。但脈搏觸診是基本常規，應例行執行。</li><li><b>BNP</b>：只適合高風險、尚無症狀者做分層，不是一般人的常規。</li><li><b>CCTA</b>：是疑似冠心病的診斷工具，不是無症狀者的篩檢。</li></ul>","p":"p198–200"},{"tag":"考點","h":"心電圖與非傳統危險因子，加在風險評估上有用嗎？","b":"<ul><li><b>靜態或運動心電圖</b>：一般風險 D 級，中高風險 I 級。陽性率低、偽陽性高，很難改變 Framingham 或 Pooled Cohort Equations 的分層。</li><li><b>ABI、hsCRP、CAC score</b>：I 級。只帶來小幅改善，還可能把沒事的人誤分為高風險，也沒有研究證明能降低心血管事件或死亡。</li></ul><p>RACGP 明確建議，低風險無症狀者不要常規用 CAC score。中度風險、結果可能影響治療強度時才可考慮。</p>","p":"p200–201"},{"tag":"必背","h":"乳癌、子宮頸癌、大腸癌：年齡與停篩界線","b":"<div class=\"tbl\"><table><tr><th>癌別</th><th>建議</th></tr>\n<tr><td>乳癌</td><td>40–74 歲女性每 2 年乳房攝影或 DBT（B）；75 歲以上 I；緻密乳房加做超音波或 MRI 為 I</td></tr>\n<tr><td>子宮頸癌</td><td>65 歲以上且過去篩檢適當者不再篩（D）；已切除子宮頸且無 CIN 2/3 或癌症者也不篩（D）</td></tr>\n<tr><td>大腸癌</td><td>50–75 歲 A，45–49 歲 B，76–85 歲 C</td></tr></table></div><p>乳癌篩檢不建議臨床乳房觸診或熱影像。台灣 2025 年起公費乳癌篩檢已調整為 40–74 歲每 2 年一次。</p>","p":"p201–202"},{"tag":"臨床做法","h":"大腸癌：RACGP 偏好糞便潛血，不建議用大腸鏡篩一般人","b":"<p>RACGP 建議一般風險族群用免疫法糞便潛血檢查，通常不建議以大腸鏡當篩檢工具。USPSTF 則把糞便潛血、糞便 DNA、電腦斷層虛擬大腸鏡、乙狀結腸鏡、大腸鏡都列為可用工具。</p><p>76–85 歲要看預期餘命、慢性病、過去篩檢史和個人喜好。家族史或遺傳性症候群（Lynch、家族性腺瘤性息肉症）屬高風險，另行評估。</p>","p":"p202"},{"tag":"台灣數字","h":"口腔癌與肺癌：台灣的特殊處境","b":"<ul><li><b>口腔癌</b>：一般風險篩檢 USPSTF 為 I 級，但台灣是發生率最高的國家之一。本土研究顯示，對嚼檳榔或吸菸的高危險群篩檢，可減少第三、四期口腔癌並降低死亡率，公費篩檢鎖定這群人。</li><li><b>肺癌 LDCT</b>：50–80 歲、20 包年、仍吸或戒菸未滿 15 年（B）。台灣肺癌病人過半是不吸菸者，女性約九成不吸菸。</li></ul><p>台灣共識宣言對重度吸菸者年齡同為 50–80 歲，60–75 歲最有效益，累積菸量暫定 30 包年。</p>","p":"p202–203"},{"tag":"研究","h":"非吸菸者肺癌：一等親有肺癌最值得主動談","b":"<p>台灣 TALENT 研究針對 55–75 歲非吸菸高危險族群。初步結果和第一年報告顯示，一等親有肺癌者風險較高，一等親愈多位風險愈高，LDCT 能找到更多早期肺癌。</p><p>但發現較多早期癌，可能包含惰性癌症，還要等長期追蹤的隨機試驗。其他族群（二、三等親、被動吸菸、肺結核或 COPD、烹飪指數 110 以上等）證據仍在累積，目前要篩就需個別化諮商。公費 LDCT 也要有共享決策、標準化追蹤和跨專科處置，並協助吸菸者戒菸。</p>","p":"p203"},{"tag":"台灣數字","h":"胃癌篩檢：各國發生率差很多","b":"<div class=\"stat\"><div><strong>約 27</strong><span>日本、韓國每 10 萬人</span></div><div><strong>9.8</strong><span>台灣每 10 萬人</span></div><div><strong>1.6</strong><span>美國每 10 萬人</span></div><div><strong>3–4</strong><span>澳洲每 10 萬人</span></div></div><p>內視鏡篩檢證據只支持極高盛行率地區。台灣自 2026 年起公費補助 45–74 歲終身一次幽門螺旋桿菌糞便抗原檢測，陽性者接受除菌或進一步內視鏡檢查。馬祖的大規模篩檢與根除計畫可降低胃癌發生率與死亡率。</p>","p":"p203–204"},{"tag":"必背","h":"這些癌症，一般風險族群不建議篩檢（D 級）","b":"<ul><li><b>甲狀腺癌</b>：觸診、超音波都不建議</li><li><b>胰臟癌</b>：腫瘤指數、CT、MRI、內視鏡超音波都不建議，糖尿病、高齡、吸菸等一般危險因子者也一樣</li><li><b>卵巢癌</b>：CA125、陰道超音波、骨盆檢查都不建議，沒有研究顯示能降低死亡率</li><li><b>睪丸癌</b>：自我或醫師檢查都不建議，有症狀才診斷治癒率也不差</li></ul><p>另有 I 級：膀胱癌（尿液檢查）、皮膚癌（視診）。</p>","p":"p204–205"},{"tag":"考點","h":"PSA 篩檢攝護腺癌：看年齡，也看預期餘命","b":"<ul><li><b>USPSTF</b>：55–69 歲個別化（C），70 歲以上不建議（D）。</li><li><b>RACGP</b>：50–69 歲經充分討論利弊後可做；預期餘命小於 7 年不建議；肛門指診不建議當例行篩檢。</li></ul><p>可能的壞處有偽陽性造成切片、過度診斷、過度治療，以及尿失禁、性功能異常等併發症。</p>","p":"p205"},{"tag":"考點","h":"COPD、OSA、甲狀腺、維生素 D、骨鬆、肌少症","b":"<ul><li><b>COPD</b>：無症狀一般風險，肺功能或問卷都不建議（D）。</li><li><b>OSA</b>：問卷篩檢 I 級，RACGP 通常不建議。</li><li><b>TSH</b>、<b>維生素 D</b>：一般成人 I 級或傾向不建議。</li><li><b>骨鬆</b>：65 歲以上女性、或有風險因子的停經後女性用 DXA（B），男性 I。RACGP 不建議直接 DXA，50 歲以上先用 FRAX。</li><li><b>肌少症</b>：AWGS 2025 建議 65 歲以上，或 50–64 歲有風險者可考慮篩檢。但工具在 50–64 歲未充分驗證，證據基礎仍有限。</li></ul>","p":"p205–206"},{"tag":"臨床做法","h":"焦慮、憂鬱、自殺風險：量表篩檢三種不同結論","b":"<div class=\"tbl\"><table><tr><th>項目</th><th>USPSTF</th></tr>\n<tr><td>焦慮（GAD-2、GAD-7）</td><td>19–64 歲 B；65 歲以上 I</td></tr>\n<tr><td>憂鬱（PHQ、GDS）</td><td>不分年齡 B</td></tr>\n<tr><td>自殺風險</td><td>I，基層情境證據不足</td></tr></table></div><p>篩檢要有效，陽性者必須被確診並得到實證治療。焦慮常以疼痛、睡眠困擾等身體化症狀就診，要保持警覺。憂鬱最佳篩檢間隔未定，可依風險因子與生活事件判斷是否重複。</p>","p":"p207"},{"tag":"考點","h":"老年人的篩檢：大多證據不足（I 級）","b":"<ul><li>視力異常（65 歲以上）</li><li>青光眼：基層工具不夠準，眼壓也不足</li><li>聽力異常（老人或 50 歲以上）</li><li>認知功能異常與失智症（65 歲以上社區老人，MMSE、Mini-Cog、AD8 等都一樣）</li><li>老年虐待或親密暴力（育齡婦女則建議篩檢）</li></ul><p>即使不篩檢，臨床上仍要留意失智早期症狀並盡早評估。</p>","p":"p208"},{"tag":"核心觀念","h":"沒有篩檢證據，不等於沒事可做","b":"<p>篩檢項目沒證據，相關疾病還是有實證有效的預防介入：戒菸、改善飲食、限制飲酒、增加運動，都能降低心血管疾病和多種癌症風險。</p><p>家醫科醫師應基於實證，建議並執行這些介入。</p>","p":"p208–209"}],"recap":{"points":["篩檢要看三階段的淨效益，而且要有設計良好的隨機試驗，要小心前導時間偏差和惰性癌症。","一般風險族群不建議篩檢的項目（D 級）很多，例如頸動脈、心電圖、甲狀腺癌、胰臟癌、卵巢癌、睪丸癌、COPD、無症狀菌尿。證據不足的項目（I 級）則靠共享決策。","有些項目要看年齡、風險與台灣情境，例如 PSA、LDCT、口腔癌、胃癌與幽門螺旋桿菌，不能一概而論。"],"quiz":[{"q":"女性 65–75 歲、不曾吸菸也沒有家族史，要不要做腹主動脈瘤超音波？","a":"不建議（USPSTF D 級），研究顯示好處沒有多於壞處。"},{"q":"為什麼一般風險族群不建議常規做心電圖篩檢心血管疾病？","a":"陽性率低且偽陽性高，很難改變風險分層和治療，還可能帶來不必要的侵入性檢查或過度治療（USPSTF D 級）。"}]}},"13":{"posts":[{"tag":"台灣數字","h":"全球每年 800 萬人死於菸害，台灣吸菸率降到 12.8%","b":"<div class=\"stat\"><div><strong>800 萬</strong><span>全球每年死於菸害，其中 700 萬直接死於菸草使用</span></div><div><strong>120 萬</strong><span>非吸菸者死於二手菸</span></div><div><strong>12.8%</strong><span>台灣 2024 年整體吸菸率</span></div><div><strong>22.7%</strong><span>男性 50–64 歲吸菸率高峰</span></div></div><p>女性吸菸率高峰在 40–49 歲（7.2%）。近 4 成曾吸菸者已不再吸菸，但尼古丁成癮復發率高，仍需專業戒菸服務。</p>","p":"p216"},{"tag":"趨勢","h":"電子煙在青少年的盛行率，遠高於成人","b":"<div class=\"stat\"><div><strong>8.8% → 6.3%</strong><span>高中職學生電子煙使用率（2021 → 2023）</span></div><div><strong>3.9% → 3.2%</strong><span>國中學生電子煙使用率（2021 → 2023）</span></div><div><strong>1.0%</strong><span>18 歲以上成人（2024）</span></div></div><p>新法實施後已見初步成效，但電子煙仍是青少年成癮的主要入門物質。</p>","p":"p217"},{"tag":"核心觀念","h":"尼古丁成癮是需要反覆介入的慢性病","b":"<p>尼古丁成癮是高度成癮的慢性病，往往要多次嘗試才能戒除，臨床上要用慢性病照護模式（Chronic Care Model）持續強化動機。單靠意志力的成功率極低，需要專業諮商和藥物。</p>","p":"p217–218"},{"tag":"核心觀念","h":"為什麼會上癮？多巴胺與受體的故事","b":"<ol><li>尼古丁吸入後 7–10 秒穿過血腦屏障，結合腹側被蓋區（VTA）的 α4β2 尼古丁乙醯膽鹼受體。</li><li>刺激伏核釋放大量多巴胺，帶來滿足、專注、緩解焦慮，形成正向增強。</li><li>長期暴露造成受體去敏感化和數量上調。</li><li>一停菸，多巴胺驟降，藍斑核正腎上腺素失調，出現焦慮、易怒、注意力渙散、坐立難安、食慾增加。</li></ol><p>所以戒斷渴求可持續數週到數月。</p>","p":"p217–218"},{"tag":"工具","h":"FTND 6 題量表，用分數決定治療強度","b":"<div class=\"tbl\"><table><tr><th>總分</th><th>成癮度</th><th>建議</th></tr>\n<tr><td class=\"num\">0–3</td><td>低度</td><td>先行為諮商；失敗可考慮低劑量 NRT（如咀嚼錠）</td></tr>\n<tr><td class=\"num\">4–6</td><td>中度</td><td>藥物輔助，單用貼片或口服藥</td></tr>\n<tr><td class=\"num\">7–10</td><td>高度</td><td>強烈建議藥物，高劑量或合併療法，並增加諮商頻率</td></tr></table></div><p>關鍵問題是起床後多久抽第一支菸，以及每天抽幾支。</p>","p":"p218"},{"tag":"考點","h":"CYP2A6 快代謝者，菸癮更重","b":"<p>尼古丁代謝酵素 CYP2A6 的基因多型性會影響成癮嚴重度。快代謝者（fast metabolizers）體內尼古丁濃度下降較快，常有更強的菸癮與戒斷症狀，臨床上通常需要更高劑量的藥物或更密集的行為介入。</p>","p":"p219"},{"tag":"迷思","h":"電子煙沒有焦油，不代表無害","b":"<ul><li>菸油（植物性甘油、丙二醇、香料、尼古丁）加熱到 200–250°C 產生氣霧。</li><li>熱裂解會產生甲醛、乙醛等一級致癌物，還有鎳、鉛等重金屬奈米微粒，能進入肺泡和血液，造成系統性發炎。</li><li>2019 年美國的 <b>EVALI</b>（電子煙相關肺傷害）與添加維生素 E 醋酸酯的產品有關，肺部巨噬細胞充滿脂質，造成瀰漫性肺泡損傷與呼吸衰竭。</li></ul>","p":"p219"},{"tag":"迷思","h":"加熱菸宣稱「沒燃燒」，毒物其實沒少","b":"<p>加熱菸（HTPs）把菸草柱加熱到 200–350°C，業者說未達燃燒溫度（約 600°C 以上）所以沒有焦油。但獨立研究顯示仍有熱裂解與不完全燃燒。</p><p>部分致癌物比紙菸低，但縮水甘油（glycidol）、丙烯醯胺（acrylamide）、α,β-不飽和羰基化合物可能更高。同樣釋放尼古丁與 PM2.5，造成血管內皮功能異常、氧化壓力增加。目前沒有長期證據顯示能降低心血管疾病或癌症死亡率，還可能削弱完全戒菸的動機。</p>","p":"p219"},{"tag":"必背","h":"2023 年《菸害防制法》：一禁一管","b":"<ul><li>禁菸年齡由 18 歲提高到 20 歲。</li><li>禁菸場所擴大到大專院校與幼兒園。</li><li><b>電子煙</b>（類菸品）：全面禁止製造、輸入、販賣、使用。</li><li><b>加熱菸</b>（指定菸品）：須先通過健康風險評估審查才能上市，未核准視同禁止。</li></ul>","p":"p220"},{"tag":"必背","h":"2026 年起二代戒菸新制：依菸品分流給付","b":"<div class=\"tbl\"><table><tr><th>使用者</th><th>給付</th></tr>\n<tr><td>紙菸</td><td>藥物全額給付（免部分負擔）加衛教</td></tr>\n<tr><td>加熱菸（符合成癮度標準）</td><td>藥物全額給付加衛教</td></tr>\n<tr><td>單純電子煙</td><td>只給付戒菸衛教費用，不補助藥物</td></tr>\n<tr><td>紙菸或加熱菸加電子煙（多重使用者）</td><td>視為紙菸使用者，申報完整藥物與衛教</td></tr></table></div><p>新制自 2026 年 1 月 1 日實施。</p>","p":"p220"},{"tag":"臨床做法","h":"5A's：每次門診都問，三分鐘也有效","b":"<ol><li><b>Ask</b>：把吸菸當生命徵象，記錄菸品種類、每日量、起床後第一支菸時間。</li><li><b>Advise</b>：清楚、堅定、個人化地建議戒菸。</li><li><b>Assess</b>：評估近期（如 30 天內）是否願意戒。</li><li><b>Assist</b>：兩週內設戒菸日，處方藥物並教正確用法，預想戒斷症狀與體重增加。</li><li><b>Arrange</b>：戒菸日後一週內回診或電話追蹤。復吸視為學習機會，重新調整計畫。</li></ol><p>證據顯示短於三分鐘的簡短諮商就能提升戒菸率。</p>","p":"p221–222"},{"tag":"臨床做法","h":"5R's：沒打算戒的人怎麼辦","b":"<ul><li><b>Relevance</b> 相關性：找出和他個人有關的理由，例如保護孫子。</li><li><b>Risks</b> 風險：癌症、心血管，新興菸品使用者要提 EVALI 和未知長期風險。</li><li><b>Rewards</b> 獎勵：味覺嗅覺、體能、形象。</li><li><b>Roadblocks</b> 障礙：怕戒斷、怕變胖、社交壓力，給具體對策。</li><li><b>Repetition</b> 重複：每次回診都溫和再提，復發是常態。</li></ul>","p":"p222"},{"tag":"必背","h":"NRT 長效貼片：重點是劑量與副作用","b":"<ul><li>提供 24 小時穩定血中尼古丁，貼在頸部以下到腰部間、無毛髮且皮膚完整處，每天輪替部位。</li><li>約 30–50% 使用者有局部紅疹或搔癢；睡覺貼著可能失眠或多夢，嚴重時睡前撕下、隔天早上再貼新的。</li><li>每日超過 10 支或中重度成癮者，建議由高劑量（如 21 mg）開始，療程約 8–12 週，逐步減量。</li></ul>","p":"p224"},{"tag":"臨床做法","h":"咀嚼錠最常見的失敗原因：用錯方法","b":"<p>咀嚼錠和口含錠靠口腔黏膜吸收，不是吞進胃裡。要教病人「咀嚼一停含」（chew and park）：慢慢咀嚼到辛辣味出現，停在臉頰與牙齦間，味道變淡再咀嚼，反覆約 30 分鐘。</p><p>一直咀嚼並吞口水，尼古丁會被胃酸破壞，還會噁心、打嗝。口腔噴霧劑起效最快（約 60 秒），適合強烈早晨菸癮或突發壓力，噴在口腔側壁或舌下，噴後數分鐘不要吞嚥。</p>","p":"p224–225"},{"tag":"必背","h":"Bupropion SR：用法與禁忌","b":"<ul><li>原為非典型抗憂鬱劑，抑制多巴胺與正腎上腺素再吸收。</li><li>戒菸日前 1–2 週開始，每日 150 mg 晨服，3 天後無不適改一天兩次，兩次間隔 8 小時以免誘發癲癇，療程約 7–12 週。</li><li>副作用：失眠（第二劑建議晚餐後儘早服用）、口乾、躁動。</li><li><b>絕對禁忌</b>：癲癇病史、厭食症或暴食症病史、腦部腫瘤或創傷史、使用 MAOIs。</li></ul><p>適合擔心戒菸後變胖的女性，或合併輕微憂鬱症狀者。</p>","p":"p225"},{"tag":"必背","h":"Varenicline：部分致效劑，雙重機轉","b":"<p>它是 α4β2 受體的部分致效劑。一方面少量刺激受體、釋放些許多巴胺緩解戒斷；一方面佔住受體，偷吸菸也沒有快感。</p><ul><li>戒菸成功率約為安慰劑的 3 倍，優於 Bupropion 與單一 NRT。</li><li>常見副作用是噁心，飯後服用並多喝水。</li><li>EAGLES 研究證實神經精神副作用（如自殺意念）與安慰劑無異。</li><li>原廠藥因亞硝胺不純物自 2021 年全球回收，2025 年起重新生產並恢復國健署補助，國內也引進學名藥（如戒衛清）。</li></ul>","p":"p225"},{"tag":"必背","h":"戒菸藥物劑量與合併規則（二代戒菸）","b":"<ul><li><b>Varenicline</b>：1 mg，每日 2 次。</li><li><b>Bupropion SR</b>：150 mg，每日 2 次，間隔 8 小時。</li><li><b>NRT</b>：貼片每日 1 片；咀嚼錠由 2–4 mg 開始，每日約 8–12 錠；口含錠每日 9–15 錠；口腔吸入劑每日 6–12 藥匣；噴霧以每次 1–2 噴替代一支菸。</li></ul><p>補助以單一用藥為原則，現已不硬性要求「治療失敗」才能用，醫師把判斷理由記在病歷即可。</p>","p":"p226"},{"tag":"考點","h":"合併療法：哪三種補助、哪些不補助","b":"<p><b>補助的組合（僅三種）</b></p><ol><li>長效貼片加一項短效尼古丁藥物</li><li>Bupropion 加一項尼古丁藥物</li><li>Bupropion 加貼片加短效尼古丁藥物</li></ol><p><b>不補助</b>：Varenicline 限單一使用，不補助任何合併；同時使用 3 項（含）以上尼古丁製劑也不補助。</p><p>中重度成癮者（FTND ≥ 4 分或每日超過 10 支），長效貼片加速效劑型的成功率顯著優於單一療法。</p>","p":"p225–226"},{"tag":"考點","h":"戒菸後，CYP1A2 活性下降，藥物濃度會上升","b":"<p>菸草燃燒產生的多環芳香烴（PAHs）是 CYP1A2 的強力誘導劑。成功戒菸後 PAHs 下降，CYP1A2 活性降低，原本由此代謝的藥物血中濃度可能急遽升高。</p><p>常見藥物有 clozapine、olanzapine、theophylline 和部分抗凝血劑。長期服用者要監測濃度或臨床反應，適時調降劑量，避免藥物中毒。</p>","p":"p226–227"},{"tag":"臨床做法","h":"選藥原則：看效力、共病與病人偏好","b":"<ul><li><b>效力</b>：Varenicline 與 NRT 合併（貼片加速效劑型）最高。重度成癮（FTND ≥ 7）、菸量大或單一療法失敗者優先考慮。</li><li><b>癲癇、飲食失調</b>：禁用 Bupropion，改 NRT 或 Varenicline。</li><li><b>穩定心血管疾病</b>：三類藥都安全，Bupropion 可能小幅升血壓，要監測。</li><li><b>憂鬱症狀</b>：Bupropion 可優先考慮。</li><li><b>怕變胖</b>：Bupropion 與尼古丁咀嚼錠能延緩體重增加。</li><li><b>皮膚過敏</b>避免貼片；<b>假牙或顳顎關節障礙</b>避免咀嚼錠。</li></ul>","p":"p227"}],"recap":{"points":["尼古丁經 α4β2 受體引起多巴胺釋放而成癮，受體上調讓戒斷渴求持續數週到數月，所以要用慢性病模式照護。","電子煙與加熱菸並非無害。台灣 2023 年修法全面禁電子煙、加熱菸須審查，2026 年二代戒菸依菸品分流給付。","每次門診用 5A's，無意願者用 5R's，再依 FTND、共病與禁忌選 NRT、Bupropion SR 或 Varenicline。"],"quiz":[{"q":"哪些病史是 Bupropion SR 的絕對禁忌？","a":"癲癇病史、厭食症或暴食症病史、腦部腫瘤或創傷史，以及正在使用 MAOIs。"},{"q":"病人成功戒菸後，為什麼 clozapine 或 theophylline 要注意？","a":"戒菸後 PAHs 下降，CYP1A2 活性降低，藥物血中濃度可能升高，需監測並調降劑量。"}]}},"14":{"posts":[{"tag":"定義","h":"你說的「檳榔」，其實是一整包嚼塊","b":"<p>一般說的檳榔是檳榔嚼塊（betel quid，也叫 paan）：以檳榔子為主，配荖葉、荖花、荖藤、香料和石灰。</p><ul><li><b>葉仔</b>（包葉檳榔）：檳榔子用塗了白灰的荖葉包起來。</li><li><b>菁仔</b>：檳榔子切開，放入紅灰和荖花等配料。</li></ul><p>紅灰是白灰加甘味料、香料或中藥調成，偏甜，是初學者的最愛。白灰（熟石灰）的鹼性可中和檳榔的酸澀。</p>","p":"p231–233"},{"tag":"核心觀念","h":"檳榔素：提神的來源，也有細胞毒性","b":"<p>檳榔子的植物鹼含量約 0.1–1.0%，以檳榔素（arecoline）為主，每克約 7.5 mg。它是副交感神經促動劑，作用在毒蕈鹼受器，能促進腸胃蠕動、瞳孔收縮、心跳減慢，一般劑量催涎、發汗、提神保暖，高劑量則抑制中樞而動作遲緩。</p><p>檳榔素在肝臟轉成檳榔次鹼，並有細胞毒性、促凋亡和促增生效果。多酚類在鹼性環境下自氧化，釋出自由基傷害 DNA；粗纖維會磨損牙齒和口腔黏膜。</p>","p":"p231–232"},{"tag":"迷思","h":"荖花、荖藤也含致癌物，實驗上的保護作用不能當真","b":"<p>荖花含最多黃樟素（safrole），具細胞毒性與基因毒性，會形成 safrole-DNA adducts，是已知致癌物。荖藤長期嚼食可能產生亞硝胺。</p><p>荖葉的丁香酚與 hydroxychavicol 在體外和動物實驗有抗氧化、抗突變潛力，但這只是實驗層級的證據，不能解讀成對嚼檳榔致癌性有實質保護。</p>","p":"p232"},{"tag":"迷思","h":"檳榔不等於原住民文化，嚼食人口多的鄉鎮多半不是原住民鄉","b":"<p>嚼檳榔的歷史達數千年，分布範圍與南島語系民族擴張地區大致相符，可用作藥物、聘禮、祭品、社交品，也強化文化認同。</p><p>但檳榔和原住民不應畫上等號。調查顯示，台灣嚼檳榔人口眾多的鄉鎮，並不是原住民鄉鎮。</p>","p":"p231"},{"tag":"台灣數字","h":"台灣嚼檳榔率 30 年大降，剩 3.5%","b":"<div class=\"stat\"><div><strong>16.9%</strong><span>1993–1996 年 20–64 歲（男 31%，女 2.4%）</span></div><div><strong>7.6%</strong><span>2009 年成人整體</span></div><div><strong>5.8%</strong><span>2013 年成人整體</span></div><div><strong>3.5%</strong><span>2021 年 18 歲以上（男 6.6%，女 0.5%）</span></div></div><p>全球約 6 億人有嚼食習慣，各地盛行率介於 8.4% 到 83%。</p>","p":"p233"},{"tag":"台灣數字","h":"誰還在嚼？40–49 歲男性，加上東部居民","b":"<div class=\"tbl\"><table><tr><th>2021 年</th><th>整體</th><th>男性</th></tr>\n<tr><td>40–49 歲</td><td class=\"num\">5.7%</td><td class=\"num\">10.7%</td></tr>\n<tr><td>30–39 歲</td><td class=\"num\">4.4%</td><td class=\"num\">8.2%</td></tr>\n<tr><td>50–64 歲</td><td class=\"num\">3.9%</td><td class=\"num\">7.4%</td></tr>\n<tr><td>台東縣</td><td class=\"num\">12.8%</td><td class=\"num\">15.4%</td></tr>\n<tr><td>花蓮縣</td><td class=\"num\">10.3%</td><td class=\"num\">13.0%</td><
