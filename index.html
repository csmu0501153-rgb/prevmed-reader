/tr>\n<tr><td>屏東縣</td><td class=\"num\">7.2%</td><td class=\"num\">12.0%</td></tr></table></div><p>台北市與新竹市最低，約 0.9%。50–64 歲男性已戒除率 19.9%。</p>","p":"p233–234"},{"tag":"必背","h":"IARC：檳榔子本身就是第一類致癌物","b":"<p>IARC 在 1987 年與 2003 年認定，嚼含菸草的檳榔、或同時吸菸又嚼檳榔，對人類有明確致癌性，可導致口腔癌、咽癌、喉癌和食道癌，並下結論「檳榔子屬第一類致癌物」，即使嚼不含添加物的檳榔子也會致癌。</p><p>其他系統的影響，因缺少長期世代研究，因果關係證據較弱，但相關研究持續增加。</p>","p":"p234–235"},{"tag":"研究","h":"嚼過檳榔，全因死亡風險就更高","b":"<ul><li><b>孟加拉 Araihazar</b>（Wu 2015）：20,033 人追蹤 10 年，曾嚼檳榔者全因死亡和癌症風險較高，有劑量反應；全因死亡及癌症可歸因於檳榔的比例分別為 14.1% 與 24.2%，心血管疾病則無明顯風險。</li><li><b>台灣</b>（2007）：6,511 人平均追蹤 9.5 年，曾嚼者全因死亡與心血管死亡風險較高，嚼檳榔年數愈高風險愈高。</li></ul>","p":"p235"},{"tag":"核心觀念","h":"檳榔是全球第四常見的成癮物質","b":"<p>排在菸草、酒精、咖啡因之後。戒斷症狀包括情緒波動、焦慮煩躁、注意力喪失、睡眠障礙和渴望。</p><p>2008 年研究發現，只嚼檳榔未吸菸者有 38.8% 與 40.8% 符合 DSM-IV 與 ICD-10 的物質依賴標準；嚼檳榔又吸菸者高達 79.5%。</p>","p":"p235"},{"tag":"台灣數字","h":"台灣口腔癌：男性發生率 39.8／10 萬，發病比別的癌早 10–20 年","b":"<div class=\"stat\"><div><strong>8,522</strong><span>2023 年新個案，男性 7,641 人</span></div><div><strong>39.8</strong><span>男性年齡標準化發生率（每 10 萬）</span></div><div><strong>57 歲</strong><span>發生年齡中位數（2019），死亡中位數 60 歲</span></div></div><p>口腔癌是 25–44 歲男性最容易發生的癌症，近年長居男性十大癌症死因第四位。有 88% 的口腔癌病人與 96% 的口腔黏膜下纖維化病人有嚼檳榔習慣。</p>","p":"p235–236"},{"tag":"必背","h":"吸菸、酗酒、嚼檳榔三合一，口腔癌風險 123 倍","b":"<div class=\"stat\"><div><strong>28 倍</strong><span>單獨嚼檳榔</span></div><div><strong>18 倍</strong><span>單獨吸菸</span></div><div><strong>10 倍</strong><span>單獨酗酒</span></div><div><strong>123 倍</strong><span>三者皆有，相較三者皆無</span></div></div><p>來源是國家衛生研究院葛應欽教授的研究。台灣研究也一致認為，嚼檳榔是口腔癌最重要的危險因子。大多數口腔癌（84–97%）是鱗狀細胞癌。</p>","p":"p235–236"},{"tag":"定義","h":"口腔黏膜下纖維化：嚼檳榔特有的癌前病變","b":"<p>口腔黏膜下纖維化（OSF）是慢性癌前病變，在台灣好發於 20–40 歲男性。黏膜變僵硬，導致張口困難、吞嚥困難，嚴重影響進食、說話和牙科治療。</p><p>嚼檳榔是最主要原因，可歸因風險達九成以上。吸菸不是直接原因，但會顯著加速癌化。</p>","p":"p236"},{"tag":"核心觀念","h":"OSF 的機轉：膠原蛋白合成多、分解少","b":"<ul><li>檳榔鹼刺激纖維母細胞增生並合成膠原蛋白。</li><li>多酚抑制膠原蛋白酶，使膠原蛋白在黏膜下堆積。</li><li>TGF-β 被認為是驅動纖維化的核心路徑，另有 TNF-α、IL-6、PGE2 參與。</li><li>鹼性環境下產生的 ROS 和亞硝胺造成缺氧、慢性發炎和 DNA 損傷，最終演變成口腔癌。</li></ul><p>營養缺乏（鐵、維生素 B12）與遺傳多型性可能影響嚴重度。</p>","p":"p237"},{"tag":"研究","h":"食道癌：嚼檳榔的勝算比約 3 到 4","b":"<p>2013 年文獻回顧顯示，在亞洲嚼檳榔是增加食道癌風險的顯著獨立因子（OR 3.05）。2024 年傘狀回顧也指出，單獨嚼檳榔的 OR 通常在 3 到 4，合併菸草風險更高。</p><p>檳榔鹼和黃樟素可誘導基因毒性。嚼檳榔的食道癌患者診斷年齡較輕、對化學放射治療反應較差、整體存活率較差。</p>","p":"p237"},{"tag":"研究","h":"心血管：嚼檳榔者比吸菸者風險還高","b":"<ul><li><b>Lin 2008</b>（台灣男性 56,116 人，追蹤 8 年）：已戒者心血管疾病 RR 1.56，現仍嚼者 RR 2.02。曾嚼檳榔者因心血管疾病死亡風險高於曾吸菸者（RR 2.10）。</li><li><b>Zhang 2010</b>：亞洲人心血管疾病 RR 1.26，缺血性心臟病 1.27，腦血管疾病 1.32，台灣為 1.30，且有劑量反應。</li><li><b>Tsai 2012</b>：嚼檳榔男性阻塞性冠心病風險增加 3.5 倍。</li></ul><p>高血壓方面，長期嚼食和高血壓有獨立且有劑量反應的關聯，可能透過交感神經活化、內皮功能障礙與慢性發炎。</p>","p":"p237–238"},{"tag":"研究","h":"代謝一籮筐：糖尿病、代謝症候群、肥胖","b":"<div class=\"tbl\"><table><tr><th>項目</th><th>重點數字</th></tr>\n<tr><td>第 2 型糖尿病</td><td>已戒者 OR 1.53；統合分析曾嚼者 OR 1.45，男性 1.55；每日超過 20 顆 OR 2.02</td></tr>\n<tr><td>代謝症候群</td><td>現行 OR 約 1.78，曾經 1.38；新發 OR 1.35</td></tr>\n<tr><td>肥胖</td><td>BMI 與腰圍較高，高暴露者肥胖風險約為兩倍</td></tr></table></div><p>假說是生物鹼與亞硝胺造成慢性發炎、氧化壓力、胰臟 β 細胞毒性；也可能抑制 GABA 受體增加食慾，干擾脂肪細胞分化。</p>","p":"p238–239"},{"tag":"臨床做法","h":"神經與消化：從提神到中毒","b":"<p>一般劑量帶來欣快、身體溫熱、出汗、流涎、心悸、高度警覺，這也是勞動階層用來提神的原因。初嚼常有眩暈、噁心、出汗。</p><ul><li><b>輕度中毒</b>：流口水、盜汗、流淚、尿失禁、腹瀉、嘔吐、四肢無力、反應遲鈍。</li><li><b>中度</b>：興奮、顫抖、步態不穩、行為凶暴。</li><li><b>重度</b>：肺水腫、支氣管收縮、癱瘓、抽筋，甚至呼吸停止。</li></ul><p>消化道方面，檳榔渣刺激胃壁，可致胃炎、胃與十二指腸潰瘍、穿孔，影響營養吸收。</p>","p":"p240–241"},{"tag":"研究","h":"孕婦嚼檳榔：低出生體重、貧血、男嬰比例下降","b":"<div class=\"stat\"><div><strong>1.75 倍</strong><span>低出生體重風險</span></div><div><strong>OR 1.72</strong><span>孕產婦貧血</span></div><div><strong>aOR 0.62</strong><span>產下男嬰的比例（台灣研究）</span></div><div><strong>5.99 倍</strong><span>檳榔加菸加酒，低出生體重風險</span></div></div><p>檳榔鹼可穿過胎盤，刺激交感神經使血管收縮、減少子宮胎盤血流，細胞毒性也會抑制血管內皮生長。</p>","p":"p240"},{"tag":"臨床做法","h":"戒檳榔有用：白斑症 62% 可緩解","b":"<p>台灣研究顯示，嚼檳榔者口腔黏膜白斑症的機率是不嚼者的 17.4 倍。對已有白斑的人，戒除檳榔可使 62% 得到緩解。去除危險因子，加上口腔黏膜篩檢做早期診斷，是口腔癌防制重點。</p><p>國健署的三招戒檳：</p><ol><li>無聊或需要保暖時，用蔬菜條、蒟蒻條、無糖口嚼錠、硬喉糖替代，或刷牙。天冷就加衣、喝溫熱飲。</li><li>想提神時，好好休息並培養運動習慣。</li><li>遇到朋友邀約，用轉移話題、反覆說不或自嘲家教嚴等技巧拒絕。</li></ol><p>《檳榔健康危害防制法》目前仍在草案階段。</p>","p":"p241–242"},{"tag":"工具","h":"口腔自我檢查六口訣：觀面、按頸、弄唇、翻頰、看顎、吐舌","b":"<ol><li><b>觀面</b>：看膚色和兩頰是否對稱。</li><li><b>按頸</b>：摸有沒有硬塊或觸痛。</li><li><b>弄唇</b>：上下翻唇，看內側是否粉紅。</li><li><b>翻頰</b>：用手指摸口內和舌底有沒有硬塊，黏膜是否變白。</li><li><b>看顎</b>：發「啊」聲，看顎部有無突起、潰瘍。</li><li><b>吐舌</b>：伸出左右擺動，看舌是否靈活，舌側緣有無白斑、紅斑、潰瘍或腫塊。</li></ol><p>每天刷牙時檢查，是降低癌前病變與口腔癌的有效方法。</p>","p":"p242"}],"recap":{"points":["檳榔子本身是 IARC 第一類致癌物；嚼檳榔和口腔癌、OSF、食道癌、肝癌明確相關，與心血管、代謝、呼吸、孕產等也有關。","台灣嚼檳榔率已降到 3.5%，但 40–49 歲男性與花東地區仍是重點。吸菸、酗酒、嚼檳榔三者併用口腔癌風險高達 123 倍。","最重要的介入是戒檳榔，加上定期口腔黏膜檢查和每天自我檢查，以早期發現白斑、紅斑、OSF 等癌前病變。"],"quiz":[{"q":"口腔黏膜下纖維化（OSF）的主要機轉是什麼？","a":"檳榔鹼刺激纖維母細胞合成膠原蛋白，多酚抑制膠原蛋白酶，使膠原蛋白在黏膜下堆積，TGF-β 是核心路徑。"},{"q":"對已有口腔白斑的人，戒檳榔有什麼好處？","a":"可使 62% 的白斑症得到緩解。"}]}},"15":{"posts":[{"tag":"台灣數字","h":"全球 4 億人有酒精使用疾患，治療覆蓋率不到兩成","b":"<div class=\"stat\"><div><strong>約 7%</strong><span>全球成人符合 AUD 診斷（2019）</span></div><div><strong>4 億</strong><span>受影響人數</span></div><div><strong>約 2 倍</strong><span>男性盛行率相對女性</span></div><div><strong>&lt;20%</strong><span>全球 AUD 治療覆蓋率</span></div></div><p>AUD 的失能調整生命年（DALYs）在精神疾病中名列前茅，藥物治療使用率更低。</p>","p":"p246–247"},{"tag":"台灣數字","h":"台灣：只有約四成人知道酒精和癌症有關","b":"<p>全國性調查顯示，僅約 42% 民眾明確認知酒精與癌症風險相關，對酒精與糖尿病、高血壓的關聯，也有相當比例表示不確定。這個認知落差是基層篩檢與衛教的切入點。</p><p>台灣生物資料庫（n &gt; 30,000）分析也發現，飲酒與焦慮症狀有關，而且與吸菸交互影響。戒酒動機則受態度、主觀規範與知覺行為控制影響。</p>","p":"p246–247"},{"tag":"核心觀念","h":"酒精的急性傷害：外傷、暴力、自傷","b":"<ul><li>在急診與重大外傷中，酒精是最常被檢出的物質之一。澳洲多中心研究顯示，非交通傷害事件中約 25–35% 有酒精或其他物質，主要是酒精。</li><li>墨西哥 Zacatecas 的自然實驗：限制酒吧營業時間與夜間銷售後，夜間行人平均 BAC 由 0.062 降到 0.043（約降 30%），BAC ≥ 0.08 與 ≥ 0.15 的比例也顯著下降。</li></ul><p>疫情期間出現「飲酒兩極化」：低風險者可能減少社交飲酒，高風險者的飲酒量反而增加。</p>","p":"p247"},{"tag":"核心觀念","h":"酒精的慢性傷害，分三層來看","b":"<ol><li><b>器質性</b>：肝硬化、肝癌、心血管疾病</li><li><b>生活型態交互</b>：酒精 × 吸菸 × 代謝異常</li><li><b>心理社會</b>：焦慮、創傷、情緒調節困難</li></ol><p>2010–2019 年 AUD 與酒精相關肝病（ALD）的疾病負擔持續上升，2000–2021 年酒精相關肝癌也上升。</p>","p":"p247–248"},{"tag":"研究","h":"MASLD、MetALD：酒精和吸菸是雙重暴露","b":"<p>在代謝功能障礙相關脂肪肝（MASLD）族群，現吸菸者的全因死亡率、肝相關死亡率、肝硬化發生率和心血管事件都顯著較高。從未吸菸者最低。</p><p>在 MetALD（代謝功能障礙合併酒精相關脂肪肝）族群，吸菸造成的肝硬化差異未達顯著，提示高酒精暴露時酒精本身可能是主導因子。</p><p>兩者都透過氧化壓力和發炎促進肝纖維化與肝星狀細胞活化，所以評估這類病人預後時，酒精和吸菸都要問。</p>","p":"p247–248"},{"tag":"考點","h":"酒精是第一級致癌物，東亞人特別要小心 ALDH2","b":"<p>IARC 將酒精列為第一級致癌物，相關癌症包括口腔癌、咽喉癌、食道癌、肝癌、乳癌、大腸直腸癌。</p><p>台灣人乙醛去氫酶（ALDH2）缺乏比例較高，乙醛代謝不足會累積這個已知致癌物，所以即使飲酒量不多也可能有較高風險。酒精與吸菸有協同致癌效應，在上消化道與肝臟腫瘤更明顯。</p><p>風險溝通要結合族群特性與個人代謝風險，不要只講一般健康建議。</p>","p":"p248"},{"tag":"定義","h":"AUD 診斷：DSM-5 看 11 項症狀，ICD-11 分兩類","b":"<ul><li><b>DSM-5</b>：11 項症狀，依數目分輕度、中度、重度。</li><li><b>ICD-11</b>：分「有害使用模式」與「依賴症候群」。</li></ul><p>診斷要結合症狀嚴重度、功能受損程度與文化背景，不要只看症狀數。基層用簡化的 DSM-5 症狀檢核表可行。高齡者耐受度下降、代謝改變、共病多，較低飲酒量也可能有較大風險，AUD 容易被低估。</p>","p":"p249"},{"tag":"核心觀念","h":"AUD 是生物、心理、社會三方交互的結果","b":"<p>台灣大學生樣本顯示，衝動性與注意力不集中可透過童年創傷與創傷後壓力症狀（PTSD）影響問題性飲酒，酒精可能是情緒調節或創傷因應策略。</p><ul><li><b>生物</b>：遺傳易感性，台灣族群中 NGF 基因多型性與衝動性、生活壓力事件及 AUD 有關。</li><li><b>心理</b>：創傷與 PTSD 增加酒精濫用風險。</li><li><b>社會</b>：文化飲酒規範、同儕、壓力情境。</li></ul>","p":"p249"},{"tag":"工具","h":"基層篩檢：先 AUDIT-C，再用 DSM-5 清單確認","b":"<p>常用工具有 AUDIT、AUDIT-C、CAGE 與 DSM-5 症狀檢核表。醫院與急診中 AUDIT 與 AUDIT-C 效度良好，RAPS4-QF 在急診也實用。</p><p>基層建議採兩階段：先用 AUDIT-C 找出高風險飲酒者，再以 DSM-5 症狀清單評估是否符合 AUD，適合有限的門診時間。老年人要降低篩檢門檻。</p>","p":"p249"},{"tag":"臨床做法","h":"簡短介入 3–5 分鐘就夠，拉長時間不一定更好","b":"<p>Cochrane 回顧指出，基層簡短介入（brief intervention）能顯著降低飲酒量，延長介入時間未必有額外效果。家庭醫學門診可用 3–5 分鐘結構化對談。</p><p>簡短介入三步驟：</p><ol><li><b>Feedback</b> 回饋飲酒風險</li><li><b>Advice</b> 提出減量或戒酒建議</li><li><b>Motivation enhancement</b> 強化改變動機</li></ol><p>孕產婦等族群的電子化簡短介入（e-SBI）也有潛力，家醫在胎兒酒精譜系障礙（FASD）預防上很重要。</p>","p":"p250–251"},{"tag":"必背","h":"門診流程：篩檢、分層、介入、轉介","b":"<ol><li>門診先花約 1 分鐘問每週飲酒頻率與每次飲酒量。</li><li>可能高風險者用 AUDIT-C 量化。</li><li>低風險者給衛教並定期追蹤；中度風險者做簡短介入；高風險或疑似 AUD 者完整評估並考慮轉介。</li></ol><p><b>轉介精神科或成癮專科的時機</b>：疑似中至重度 AUD、多次簡短介入仍無改善、合併憂鬱焦慮等精神共病、出現戒斷症狀或酒精相關醫療併發症。</p><p>台灣的戒酒意圖量表（AAIS）可快速評估戒酒動機。</p>","p":"p250–251"},{"tag":"必背","h":"AUD 藥物：Naltrexone 管減量，Acamprosate 管維持戒酒","b":"<div class=\"tbl\"><table><tr><th>藥物</th><th>重點</th></tr>\n<tr><td>Naltrexone（第一線）</td><td>μ-opioid 拮抗劑，減弱獎賞感。降低重度飲酒天數與飲酒量，適合以減量為目標者。副作用噁心、頭暈，急性肝炎或肝功能顯著異常者要審慎</td></tr>\n<tr><td>Acamprosate（第一線）</td><td>調節 glutamate，穩定戒酒後的神經興奮。較適合維持完全戒酒。腎臟排除，腎功能不全需調整或避免。副作用腹瀉</td></tr></table></div>","p":"p251"},{"tag":"臨床做法","h":"第二線與特殊藥物：Topiramate、Baclofen、Disulfiram","b":"<ul><li><b>Topiramate</b>（非核准用途）：統合分析顯示可降低飲酒天數比例、重度飲酒天數比例和每日飲酒量，證據中等。偏向減量，副作用較明顯（感覺異常、味覺異常、認知下降、頭暈），常在第一線無效或不適用時使用。</li><li><b>Baclofen</b>（GABA-B 致效劑）：Cochrane 指出可能降低復飲風險，但證據確定性低，有時用於合併肝病或不能用 naltrexone 者，注意嗜睡。</li><li><b>Disulfiram</b>：抑制乙醛去氫酶，使飲酒後不適。高度依賴服藥順從性，可能有嚴重不良反應，不是家醫門診常規處方。</li></ul><p>以渴求為主要症狀時，短期試驗顯示 naltrexone 較一致。</p>","p":"p251–252"},{"tag":"趨勢","h":"酒精防治三層架構：臨床、制度、政策","b":"<ol><li><b>臨床</b>：篩檢、簡短介入、藥物與長期追蹤。</li><li><b>制度</b>：把酒精篩檢納入慢病照護流程，並有訓練與轉介網絡。基層醫師自覺能力不足是主要障礙，訓練時數與自信程度正相關。</li><li><b>政策</b>：管理可近性，例如縮短營業時間、限制銷售時段。日本《酒精相關健康問題對策基本法》整合醫療、教育與社會支持，可作參考。</li></ol><p>醫師自身也有問題性飲酒風險，實際盛行率可能被低估。</p>","p":"p252–253"}],"recap":{"points":["酒精造成急性外傷暴力與慢性肝病、心血管疾病、癌症和心理問題；酒精是第一級致癌物，台灣 ALDH2 缺乏比例較高，但只有約 42% 民眾知道酒精與癌症有關。","基層用 AUDIT-C 篩檢，再以 DSM-5 症狀確認；中度風險做 3–5 分鐘簡短介入，高風險或有共病、戒斷者轉介。","藥物依治療目標選擇：naltrexone 偏減量，acamprosate 偏維持戒酒，topiramate、baclofen 為次線，disulfiram 不是家醫常規。"],"quiz":[{"q":"基層醫療的酒精簡短介入，三個步驟是什麼？","a":"回饋飲酒風險、提出減量或戒酒建議、強化行為改變動機。"},{"q":"Naltrexone 與 acamprosate 各自較適合什麼目標？","a":"Naltrexone 適合以減少飲酒量和重度飲酒天數為主；acamprosate 適合已戒斷、以維持完全戒酒為目標者。"}]}},"16":{"posts":[{"tag":"定義","h":"「非健康藥物使用」不只毒品，還包含處方藥濫用","b":"<p>定義是使用非法取得的藥品或毒品（不含酒精與菸草），或非醫療性地使用精神活性處方藥物（psychoactive drug）。也就是使用的原因、時間、數量或頻率與處方不符，或由處方者以外的人提供。</p><p>比起過去的「非法藥物使用」和「娛樂性用藥」，這個詞多包含了醫療性管制藥品的濫用。</p>","p":"p257"},{"tag":"核心觀念","h":"吸毒是可預防性死亡、傷害與殘疾的常見原因","b":"<ul><li><b>興奮劑</b>（如 cocaine）：心律不整、心肌梗塞、癲癇發作。</li><li><b>大麻</b>：反應時間變慢，平衡、協調、學習和記憶衰退，慢性咳嗽與呼吸道感染。</li><li><b>懷孕期使用</b>：胎盤早期剝離、子癲前症、出血；胎兒與嬰兒的自然流產、大腦發育異常、早產、低出生體重、新生兒戒斷症候群。</li></ul><p>也與暴力、犯罪、監禁、學業與工作受損、人際失調等問題相關。</p>","p":"p256"},{"tag":"台灣數字","h":"台灣施用毒品人口約 4.2 萬，曾用過者估計 22 萬","b":"<div class=\"stat\"><div><strong>約 42,000</strong><span>施用毒品人口（2025 年法務部統計），較 2021 年 46,810 下降 10.2%</span></div><div><strong>22 萬</strong><span>曾使用非法藥物者估計（2021 年 20.4 萬）</span></div></div><p>美國 NSDUH 2024：18 歲以上成人非健康藥物使用率 13.2%（較 2018 年增加 12%），18–25 歲達 25.5%，孕婦 1 個月內使用率 5.8%，12–17 歲青少年 1 個月內大麻使用率 8.5%。</p>","p":"p256"},{"tag":"必背","h":"USPSTF 2020：成人用「問的」篩檢，B 級","b":"<ul><li><b>18 歲以上（含孕產婦）</b>：用詢問方式篩檢非健康藥物使用，Grade B。前提是能提供轉介、準確診斷、有效治療和適當照顧。</li><li><b>18 歲以下</b>：證據不足（I statement）。</li><li>篩檢指的是問問題，不是驗尿液、唾液、血液等生物檢體。</li></ul><p>不適用於已診斷物質使用障礙症、已在轉診或治療者，也不適用於無法轉介治療或篩檢結果帶有懲罰性質的場域。2008 年版本當時證據不足，2020 年才升級。</p>","p":"p257–258"},{"tag":"研究","h":"公眾意見擔心的四種篩檢傷害","b":"<ol><li>讓不願被篩檢的人不敢就醫。</li><li>陽性結果帶來醫療與社會法律後果。</li><li>隱私問題。</li><li>臨床醫師的注意力被轉移，忽略已有藥物使用障礙病人的其他疾病。</li></ol><p>USPSTF 視這些為潛在傷害，並補充實施細節以降低風險。目前沒有研究直接評估篩檢對於改善藥物使用或其健康、社會、法律結果的益處或危害。2025 年無新證據，但強調可用 APP 或遠距工具（如 TAPS Tool App）提高可近性並降低隱私疑慮。</p>","p":"p258–260"},{"tag":"工具","h":"成人篩檢工具：直接評估與間接評估","b":"<p>USPSTF 找到 30 多種工具，多數敏感度在 75% 以上，評估了 15 種用於非懷孕成人。</p><ul><li><b>直接評估</b>：單項藥物使用頻率（single-item、SUBS、TAPS-1），或頻率加風險（ASSIST、CAST、DAST、TAPS 等）。</li><li><b>間接評估</b>：問酒精或菸草，例如單項重度飲酒頻率。</li></ul><div class=\"stat\"><div><strong>0.71–0.94</strong><span>直接工具偵測任何非健康用藥的敏感度</span></div><div><strong>0.87–0.97</strong><span>特異度</span></div></div>","p":"p259"},{"tag":"工具","h":"最簡單的篩檢，一句話就好","b":"<p>最簡單的是直接評估工具中的單項頻率題，可直接問：「在過去 1 年中，你有多少次因為非醫療原因使用非法藥物或使用處方藥？」</p><p>這種詢問不難，最難的是接下來要有適當的轉介和照顧。</p><p>孕產婦的工具表現較差：直接工具偵測產前用藥敏感度 0.37–0.76，特異度 0.68–0.83；間接工具 4P's Plus 偵測藥物或酒精敏感度 0.87，特異度 0.76。</p>","p":"p259, p268"},{"tag":"臨床做法","h":"鴉片類使用障礙：藥物治療有效","b":"<p>19 項試驗評估了 naltrexone（拮抗劑）、buprenorphine（部分促效劑）與 methadone（促效劑）對海洛因相關鴉片類使用障礙成人的效果。</p><ul><li><b>Naltrexone</b>（口服、注射或植入）大幅降低復發並提高治療維持率，但對整體功能、生活品質、焦慮憂鬱、法律與就業結果不一致。</li><li><b>Methadone 與 buprenorphine</b> 同樣降低復發、提高維持率。少數研究顯示 buprenorphine 的自覺生活品質較佳。</li></ul><p>嚴重不良事件很少，且與對照組無顯著差異。但目前沒有研究針對處方鴉片類成癮者、初級保健篩檢發現者，也沒有針對青少年、孕婦或產後者的危害評估。</p>","p":"p260–261"},{"tag":"研究","h":"社會心理介入：對大麻戒除最有效","b":"<p>52 項試驗中，強化介入（2 次以上，每次 1 小時以上）常用認知行為療法、動機式訪談、酬賞管理（contingency management）；簡易介入為 1–2 次、每次 1 小時以內。</p><ul><li>簡易介入效果略小於強化介入，但無統計差異。</li><li>3–4 個月時，尋求治療者的戒除成效優於篩檢發現者。</li><li>對大麻戒除最明顯（3–4 個月 RR 2.08，6–12 個月仍有效），對興奮劑或混合藥物不明顯。</li></ul>","p":"p261–262"},{"tag":"台灣數字","h":"台灣毒品現況：人數降了，新興毒品和低齡化升了","b":"<div class=\"stat\"><div><strong>10,500 公斤</strong><span>2024 年查獲量，第三級占 48.2%（K 他命 44.5%）</span></div><div><strong>45%</strong><span>首次濫用年齡在 20–29 歲</span></div><div><strong>35.2%</strong><span>2024 年出獄再犯率</span></div><div><strong>165 件</strong><span>2024 年新興毒品死亡案例，2020 年 143 件</span></div></div><p>教育部 2024 年學生藥物濫用通報 750 人，高中職占 52%，國中 35%，最小到國小。混合型新興毒品如咖啡包占 25.2%。依托咪酯相關案件激增 30%。</p>","p":"p262"},{"tag":"必背","h":"毒品四級 vs. 管制藥品四級，兩套法律","b":"<ul><li><b>毒品</b>：依《毒品危害防制條例》，按成癮性、濫用性、社會危害性分四級，法務部會同衛福部審議，每 3 個月定期檢討。製造、運輸、持有、施用皆違法。</li><li><b>管制藥品</b>：依《管制藥品管理條例》，按習慣性、依賴性、濫用性、社會危害性分四級，由衛生主管機關的審議委員會決定。供醫療或研究使用。</li></ul><p>兩套品項有重疊，如嗎啡、海洛因。製造、運輸、販賣第一級毒品最重可處死刑或無期徒刑。</p>","p":"p262–263"},{"tag":"考點","h":"台灣常見毒品，依藥理分五類","b":"<div class=\"tbl\"><table><tr><th>類別</th><th>例子</th></tr>\n<tr><td>中樞抑制劑</td><td>鴉片、嗎啡、海洛因、BZD、zolpidem、巴比妥類、GHB、依托咪酯</td></tr>\n<tr><td>中樞興奮劑</td><td>安非他命、甲基安非他命、搖頭丸（MDMA）、PMA、古柯鹼</td></tr>\n<tr><td>中樞迷幻劑</td><td>PCP、魔菇（psilocybin）、LSD、大麻</td></tr>\n<tr><td>吸入性</td><td>強力膠、笑氣、亞硝酸酯類</td></tr>\n<tr><td>新興精神物質（NPS）</td><td>K 他命、K2 類大麻、火狐狸、合成卡西酮等</td></tr></table></div><p>依托咪酯（俗稱喪屍煙彈）原是靜脈麻醉藥，濫用可致幻覺、解離感、癲癇，2024 年 11 月升為第二級毒品，醫療使用仍維持第四級管制藥品。</p>","p":"p263–265"},{"tag":"核心觀念","h":"新興毒品：偽裝成零食飲料，致死率更高","b":"<p>新興影響精神物質（NPS）多偽裝成咖啡包、奶茶包、果汁、果凍、梅子粉、糖果。多為混合型，使用者常不知道自己用了什麼，成分以 K 他命比例最高。包裝常標註「非供人類使用」，以合法興奮劑名義在網路或商店販賣以規避法律。</p><p>症狀多屬抑制、興奮或迷幻劑，致死率比傳統毒品高。2025 年 ICD-11 新增 NPS 子類，強調混合型毒品診斷的複雜性。</p>","p":"p258, p265"},{"tag":"必背","h":"觀察勒戒 vs. 戒癮治療：先醫療後司法","b":"<div class=\"tbl\"><table><tr><th></th><th>觀察勒戒</th><th>戒癮治療</th></tr>\n<tr><td>法源</td><td>第 20 條第 1 項</td><td>第 24 條第 1 項（緩起訴）</td></tr>\n<tr><td>自由</td><td>送戒治所，限制人身自由，最長 2 個月</td><td>指定醫院門診，不影響日常，為期 1 年</td></tr>\n<tr><td>後續</td><td>仍有施用傾向，聲請強制戒治 6 個月至 1 年</td><td>按時完成且無其他犯罪，不撤銷緩起訴</td></tr>\n<tr><td>費用</td><td>公費</td><td>自費</td></tr></table></div><p>適用初犯或三年後再犯者。若沒完成戒癮治療，檢察官可撤銷緩起訴，也可以再給一次機會。</p>","p":"p266"},{"tag":"必背","h":"替代治療：美沙冬 vs. 丁基原啡因","b":"<div class=\"tbl\"><table><tr><th></th><th>美沙冬</th><th>丁基原啡因</th></tr>\n<tr><td>作用</td><td>全促效劑，口服液</td><td>部分促效劑</td></tr>\n<tr><td>管制級別</td><td>第二級</td><td>第三級</td></tr>\n<tr><td>用法</td><td>每日到院當面服藥</td><td>視個案每 2–3 天一次，穩定者可限量攜回（最多兩週處方量）</td></tr>\n<tr><td>安全性</td><td>有呼吸抑制風險</td><td>較高，藥效持久</td></tr></table></div><p>兩者減少物質使用與提高維持率的效果相當。全台 130 間醫療院所提供替代療法，自費戒癮完成率升至 28%（鴉片類）。</p>","p":"p266–267"},{"tag":"臨床做法","h":"病人主動就醫戒癮，醫院不會報警","b":"<p>依《毒品危害防制條例》第 21 條，施用者到衛福部指定醫療機構請求治療，醫療機構免將他送法院或檢察機關。就醫期間再次被查獲，檢察官會依職權不起訴（少年則由少年法院不付審理），但以一次為限。</p><p>醫師前線的角色是準確轉介毒防中心和戒治機構，避免直接報警讓病人不信任醫療而拒絕就醫。可用法務部「反毒大本營」網站查詢各地毒防中心與指定戒癮機構。</p>","p":"p267–268"},{"tag":"考點","h":"管制藥品不能自己拿給別人吃","b":"<p>開立第 1–3 級管制藥品，醫師必須領有管制藥品使用執照並用專用處方箋；藥師依專用處方箋調劑，領藥時須出示身分證明並簽名。</p><p>常見情況是病人擅自使用親友的鎮靜安眠藥。這可能違反《管制藥品管理條例》，若該藥同屬毒品（如 BZD 屬第四級毒品），還可能涉及毒品危害防制條例的法律責任。醫師若評估病人有嚴重濫用傾向，應依《管制藥品濫用通報及獎勵辦法》通報。</p>","p":"p267–268"}],"recap":{"points":["非健康藥物使用包含毒品與處方藥的非醫療使用；USPSTF 2020 建議 18 歲以上成人用詢問方式篩檢（B 級），前提是能轉介與治療，青少年證據不足。","台灣毒品分四級，管制藥品也分四級，兩套法律。新興毒品偽裝成零食飲料，致死率高，使用者也有低齡化趨勢。","施用者視為病人：初犯或三年後再犯者依勒戒或附命戒癮治療處理；替代治療有美沙冬和丁基原啡因；病人主動就醫，醫院免送辦。"],"quiz":[{"q":"USPSTF 針對成人非健康藥物使用的篩檢，是驗尿還是詢問？等級是什麼？","a":"以詢問方式，不是生物檢體檢驗；18 歲以上成人為 B 級，青少年為證據不足（I）。"},{"q":"美沙冬與丁基原啡因在管制級別與給藥方式有什麼差別？","a":"美沙冬是第二級、全促效劑，須每日到院當面服藥；丁基原啡因是第三級、部分促效劑，穩定者可限量攜回（最多兩週）。"}]}},"17":{"posts":[{"tag":"核心觀念","h":"人一輩子三分之一在睡覺，家醫每位病人都該問睡眠","b":"<p>睡不好短期會身心俱疲，長期可能免疫力下降，也會增加意外風險。有睡眠困擾的病人常四處求醫（doctor shopping）、重複檢查、多重用藥，造成醫療資源負擔。</p><p>基層沒有昂貴的睡眠檢查儀器，所以要靠問診把問題釐清，也順便找出共病。</p>","p":"p272–273"},{"tag":"定義","h":"正常睡眠：一晚 4 到 6 個週期，每個約 90 分鐘","b":"<ul><li><b>NREM</b>（非快速動眼期）：大腦安靜，分 N1、N2、N3。N1 是剛入睡，N3 是深睡，又叫慢波睡眠。</li><li><b>REM</b>（快速動眼期）：大腦活躍，和鮮明的作夢有關，肌肉張力消失，避免把夢中動作做出來。</li></ul><p>越到後面的週期，REM 越長，NREM 越短也越淺。</p>","p":"p273"},{"tag":"考點","h":"老年人睡不好，有一部分是正常老化","b":"<p>和年輕成人相比，老年人入睡時間較長、睡眠中斷較多、清晨醒來就睡不著，NREM 第二階段比例增加，第三階段變少。</p><p>診斷老年人的睡眠障礙時，要先把這些正常老化的變化算進去。</p>","p":"p273"},{"tag":"定義","h":"失眠怎麼算？急性、慢性的切點要記清楚","b":"<p>ICD 的失眠：入睡超過 30 分鐘，或入睡後醒來超過 30 分鐘、過早清醒。有適當睡眠機會仍發生，且白天出現倦怠、嗜睡、情緒煩躁、難專心或身體不適，影響學習或工作。</p><div class=\"stat\"><div><strong>≥ 3 天</strong><span>每週發生天數（DSM-V 慢性失眠）</span></div><div><strong>&gt; 3 個月</strong><span>慢性失眠持續時間</span></div><div><strong>&lt; 1 個月</strong><span>急性失眠持續時間</span></div></div>","p":"p274"},{"tag":"臨床做法","h":"失眠的型態，可以反推有沒有焦慮或憂鬱","b":"<div class=\"tbl\"><table><tr><th>失眠型態</th><th>常相關的問題</th></tr><tr><td>入睡困難</td><td>焦慮</td></tr><tr><td>醒來再入睡困難（中高年齡常見）</td><td>焦慮或憂鬱</td></tr><tr><td>早醒</td><td>憂鬱</td></tr></table></div><p>問診時發現這些型態，要主動深入了解有沒有精神疾病。</p>","p":"p274–275"},{"tag":"分類","h":"睡眠障礙分類：原發性與次發性，三套診斷系統","b":"<ul><li><b>ICD-10</b>：區分器質性和非器質性。</li><li><b>DSM-V</b>：改稱「睡醒障礙症」，睡眠問題獨立看待，不再只當成精神或醫學疾病的附屬，診斷標準加入睡眠不滿意、早醒。</li><li><b>ICSD</b>：分類詳細，部分要實驗室檢查，基層用起來有限制。</li></ul><p>依病因分為原發性（非精神、生理疾病或物質引起）和次發性（和身心疾病、藥物、環境有關）。</p>","p":"p275"},{"tag":"必背","h":"原發性睡眠障礙：睡眠異常 vs. 異睡症","b":"<ul><li><b>睡眠異常</b>（dyssomnias）：質、量或時間點有問題，包括原發性失眠、過眠、猝睡症、睡眠呼吸中止、腿部不寧症、日夜節律睡眠障礙。</li><li><b>異睡症</b>（parasomnias）：入睡、覺醒或睡眠中的異常行為，包括夢魘、夜驚、夢遊。</li></ul><p>夢魘醒來後記得夢境。夜驚會突然驚叫、心跳加速、盜汗。夢遊發生在深睡期，醒後通常不記得。</p>","p":"p275"},{"tag":"台灣數字","h":"台灣慢性失眠盛行率約 11.3%，女性和高齡者更高","b":"<div class=\"stat\"><div><strong>11.3%</strong><span>全台慢性失眠（2017 年）</span></div><div><strong>16.7%</strong><span>50–59 歲</span></div><div><strong>22.7%</strong><span>60–69 歲</span></div><div><strong>13.9% vs 8.6%</strong><span>女性與男性</span></div></div><p>女男危險比從 2006 年的 1.33 升到 1.62。國外一般慢性且有臨床意義的失眠約 10%，其中只有 13% 會尋求專業治療。</p>","p":"p276"},{"tag":"共病","h":"睡不好的背後，常是這些內外科疾病","b":"<ul><li><b>風濕</b>：關節疼痛，81% 因此失眠者表現為難維持睡眠</li><li><b>心衰竭</b>：呼吸困難、端坐呼吸、夜尿</li><li><b>呼吸道</b>：氣喘或鼻炎夜咳、COPD 換氣不足</li><li><b>腸胃</b>：消化性潰瘍夜間痛、胃食道逆流</li><li><b>腎衰竭</b>：中樞性與阻塞性呼吸中止、皮膚癢、痙攣</li><li><b>內分泌</b>：糖尿病多尿夜尿；甲亢夢魘、盜汗、心搏過速</li><li><b>肥胖</b>：上呼吸道變窄，打鼾或呼吸中止</li><li><b>癌症</b>：不適或治療藥物造成嗜睡或失眠</li></ul>","p":"p276–277"},{"tag":"核心觀念","h":"焦慮憂鬱患者，高達 77% 同時失眠","b":"<p>精神疾病方面，重大精神疾病、情感性疾病、焦慮、恐慌、憂鬱、藥物濫用與酒癮都常合併失眠。神經系統疾病如失智症、巴金森氏症也一樣。</p><p>處置原則是同時評估並治療這些共病，也檢視多重用藥有沒有引發睡眠問題，才能減少不必要的安眠藥。反過來，病人有這些疾病時，醫師也要主動問睡眠。</p>","p":"p276–277"},{"tag":"臨床做法","h":"失眠問診：先問五件事，超過一個月再深入","b":"<p><b>初步問診五項</b>：失眠類別（入睡或維持）、持續多久、每週頻率、白天影響、其他伴隨症狀。</p><p>失眠超過 1 個月，再追問：整個病程、加重與減緩因素、作息（晚睡、值夜班）、夜間症狀（惡夢、夜尿、盜汗、熱潮紅、心悸）、茶咖啡酒與睡前習慣、錯誤認知（一定要睡超過 8 小時）、過去治療經驗、精神疾病可能、用藥與物質（支氣管擴張劑、類固醇、利尿劑、興奮劑、降血壓藥、抗憂鬱藥、安眠藥）、過去病史。</p>","p":"p277–278"},{"tag":"工具","h":"四種評估工具：PSQI、ISI、STOP-BANG、睡眠日誌","b":"<div class=\"tbl\"><table><tr><th>工具</th><th>重點</th></tr><tr><td>PSQI</td><td>近 1 個月睡眠品質，7 面向 24 題，每題 0–3 分</td></tr><tr><td>ISI</td><td>近 2 週失眠嚴重度，7 題，每題 0–4 分，可做篩檢和療效追蹤</td></tr><tr><td>STOP-BANG</td><td>睡眠呼吸中止篩檢，8 題是非題，0–2 分低風險，3 分以上要警覺</td></tr><tr><td>睡眠日誌</td><td>病人在家記錄，適合慢性失眠和節律問題，可能高估入睡時間、低估總睡眠</td></tr></table></div>","p":"p278–279"},{"tag":"考點","h":"PSG 和腕動計，什麼時候才需要？","b":"<ul><li><b>PSG</b>（polysomnography）：偵測腦波、呼吸氣流、心電圖、肌電圖、血氧等，適合懷疑睡眠呼吸中止、週期性肢體抽動、REM 睡眠行為障礙。</li><li><b>腕動計</b>（actigraphy）：戴在手腕記錄 24 小時活動量，適合各類失眠、睡眠週期紊亂，也可評估治療效果。</li></ul><p>USPSTF 對無症狀成人篩檢阻塞性睡眠呼吸中止，評為 I 級（證據不足）。要先詳細問診加問卷，有明顯症狀與需求才轉介睡眠中心。</p>","p":"p279–280"},{"tag":"必背","h":"睡眠衛生六招，先從這裡開始","b":"<ol><li>發展就寢前的例行儀式（閱讀、音樂、泡澡）</li><li>臥室只用來睡覺和親密</li><li>避免經常小睡</li><li>上床超過 20–30 分鐘睡不著就起床，做不刺激的事</li><li>創造最佳睡眠環境（安靜、遮光、涼爽通風、藏起鬧鐘）</li><li>避開干擾物質：咖啡因每天不超過 2–3 杯、下午 5–6 點後不喝；酒精最晚睡前 3 小時；戒菸；睡前不吃太多也不要過度喝水</li></ol>","p":"p280"},{"tag":"臨床做法","h":"刺激控制法：重新教床和睡眠連在一起","b":"<ol><li>想睡才上床</li><li>床只用來睡覺和性生活</li><li>沒很快睡著就起床放鬆，想睡再回床</li><li>還是睡不著就重複第 3 步</li><li>不論睡多久，每天固定時間起床</li><li>白天不要小睡</li></ol>","p":"p280"},{"tag":"臨床做法","h":"放鬆、冥想與生理回饋：效果不一","b":"<ul><li><b>放鬆技巧</b>：漸進式肌肉放鬆（收縮再放鬆，抑制焦慮）、腹式呼吸（緩慢深沉）、視覺化想像（意象導引）。</li><li><b>冥想</b>：舒適坐姿、閉眼、深呼吸，反覆默唸一個簡單的字。</li><li><b>生理回饋</b>：把心跳、肌電、呼吸等轉成訊號回饋給病人。對慢性失眠療效還需要更多研究，各研究差異大，和其他認知療法相比沒有特別顯著。</li></ul>","p":"p280–281"},{"tag":"必背","h":"慢性失眠首選：多面向認知行為治療（CBT）","b":"<p>認知治療要改掉病人對睡眠的負面想法，設定實際的目標。通常和一種以上行為治療合併，就是 CBT。研究顯示用於慢性原發性失眠，六週後睡眠維持困難者有顯著改善。</p><p>矛盾意象法也屬 CBT，教病人躺床上故意保持清醒，降低入睡焦慮。</p><p>美國睡眠醫學會強烈推薦多面向 CBT；睡眠衛生、刺激控制、生理回饋則合併使用比單用好，並鼓勵持續練習。</p>","p":"p281–282"},{"tag":"臨床做法","h":"安眠藥用藥前，先看這些高風險族群","b":"<div class=\"tbl\"><table><tr><th>族群</th><th>風險</th></tr><tr><td>懷孕</td><td>第一孕期可能增加致畸胎風險</td></tr><tr><td>喝酒</td><td>過度鎮靜、呼吸抑制</td></tr><tr><td>肝腎疾病</td><td>代謝清除下降，藥量累積</td></tr><tr><td>肺部疾病、睡眠呼吸中止</td><td>呼吸抑制，缺氧更嚴重</td></tr><tr><td>夜間決策者（待命醫護、獨自顧幼兒）</td><td>鎮靜影響決策</td></tr><tr><td>75 歲以上</td><td>共病加神經老化，副作用風險高</td></tr></table></div>","p":"p282"},{"tag":"必背","h":"安眠藥原則：最低安全劑量、間斷使用、穩定後減量","b":"<p>常用藥分兩大類：苯重氮基鹽類（BZDs）和非苯重氮基鹽類（non-BZDs）。抗憂鬱劑、褪黑激素促進劑、巴比妥酸鹽也會用，但較適合有相關合併疾病時。</p><p>流程：說明利弊，詢問病人意願，病人自認需要也同意才開立，並交代正確用法，每次回診追蹤，目標是用最少的藥控制病情。</p>","p":"p282–283"}],"recap":{"points":["失眠要看類別、時間和頻率：每週 3 天以上、超過 3 個月是慢性，不到 1 個月是急性；入睡困難、中途醒、早醒分別提示焦慮與憂鬱的可能。","基層以問診為核心，搭配 PSQI、ISI、STOP-BANG、睡眠日誌；無症狀成人篩檢阻塞性睡眠呼吸中止的證據為 I 級。","慢性失眠首選多面向 CBT 加睡眠衛生；安眠藥以最低安全劑量、間斷使用為原則，並先評估高風險族群。"],"quiz":[{"q":"早醒型失眠最常提示哪一類問題？入睡困難型呢？","a":"早醒型常與憂鬱相關；入睡困難型常與焦慮相關。"},{"q":"睡眠衛生建議，上床多久還睡不著就該起床？","a":"超過 20 到 30 分鐘，就起床做其他不刺激的事。"}]}},"18":{"posts":[{"tag":"台灣數字","h":"台灣近一半的人「幾乎一直上網」，手機上網時數世界第一","b":"<div class=\"stat\"><div><strong>47.82%</strong><span>幾乎一直上網（一天次數多到無法計算）</span></div><div><strong>31.99%</strong><span>一天上網 2 次以上</span></div><div><strong>197 分</strong><span>每日手機上網時數，全球平均 142 分</span></div></div><p>青少年更明顯：2015 年調查顯示，8–12 歲每日花超過 4.5 小時、13–18 歲超過 6.5 小時在各種螢幕媒體上。</p>","p":"p286"},{"tag":"定義","h":"四個名詞別搞混：IA、IGD、GD、IVGA","b":"<div class=\"tbl\"><table><tr><th>名稱</th><th>範圍</th></tr><tr><td>網路成癮 IA</td><td>廣義概念，有強迫性使用、戒斷、耐受、不良後果</td></tr><tr><td>網路遊戲失調症 IGD</td><td>DSM-5 的進一步研究條件，九項標準</td></tr><tr><td>遊戲失調症 GD</td><td>ICD-11 的正式診斷，重點是對遊戲失控、優先於其他活動、有害仍持續</td></tr><tr><td>網路與電玩成癮 IVGA</td><td>涵蓋 IGD，也包括社群媒體、手機、串流影片等線上活動</td></tr></table></div>","p":"p287"},{"tag":"台灣數字","h":"各地盛行率差很多，亞洲明顯高於歐美","b":"<div class=\"stat\"><div><strong>1.5–8.2%</strong><span>美國與歐洲 IA 盛行率</span></div><div><strong>17.9%</strong><span>中國高中生</span></div><div><strong>18.8%</strong><span>台灣青少年（陳氏量表），後續研究 10.8%</span></div><div><strong>6.7%</strong><span>香港（Young 標準）</span></div></div><p>差異來自方法學、診斷共識和文化。韓國研究為 10.7%。</p>","p":"p286–287"},{"tag":"趨勢","h":"新冠疫情把螢幕時間推高，焦慮也跟著上來","b":"<p>疫情期間約三分之一的參與者每天用社群媒體超過 5 小時，有人高達 10 小時。社群使用增加 3 小時的年輕人，心理困擾程度增加 3 倍。</p><p>疫情資訊過載、負面情緒、錯誤訊息和錯失恐懼症（FOMO）會降低幸福感。但一對一交流、接觸有趣正向內容的使用方式，反而能改善社交與心理健康。</p>","p":"p287"},{"tag":"必背","h":"DSM-5 的 IGD 標準：12 個月內符合 5 項以上","b":"<ol><li>專注於網路遊戲</li><li>沒玩時有戒斷（易怒、焦慮、悲傷）</li><li>耐受性，要玩越來越久</li><li>無法成功控制</li><li>對其他愛好失去興趣</li><li>知道有心理社會問題仍過度玩</li><li>對家人或治療師隱瞞玩的量</li><li>用遊戲逃避負面情緒</li><li>因遊戲危及或失去關係、工作、教育機會</li></ol><p>僅限非賭博的網路遊戲，不含職業所需的上網，也不含其他娛樂或色情網站。嚴重度分輕、中、重度。</p>","p":"p288, p291"},{"tag":"核心觀念","h":"為什麼 MMORPG 特別容易上癮？逃避現實最危險","b":"<p>MMORPG（大型多人線上角色扮演遊戲）沒有終點、沒有地域限制，投入越多，資源和地位越高。玩家的動機有成就感、社交和沉浸感。</p><p>三者之中，逃避現實的沉浸感和成癮的關連性最高。</p><p>WHO 在 2018 年 6 月底把遊戲失調症（GD）納入 ICD-11。</p>","p":"p288–289"},{"tag":"研究","h":"網路成癮者的共病：ADHD、失眠、自殺風險都升高","b":"<div class=\"stat\"><div><strong>OR 2.51</strong><span>ADHD 比例（IA vs 無 IA）</span></div><div><strong>OR 2.20</strong><span>睡眠問題，且睡眠時間較短</span></div><div><strong>OR 2.95</strong><span>自殺意向，自殺計畫 3.17、企圖 2.81</span></div></div><p>18 歲以下的自殺意向 OR 為 3.71，高於成人的 1.96。另外和憂鬱、焦慮、強迫症狀、攻擊性、家庭衝突、社交退縮也相關。</p>","p":"p289"},{"tag":"危險因子","h":"誰比較容易陷進去？男性、憂鬱、家庭功能差","b":"<ul><li>男性較多，偏向遊戲成癮；女性偏向非遊戲型。</li><li>憂鬱越重越易成癮，不安全依附、低學業成就也是風險。</li><li>每天上網超過 2 小時的青少年，菸草與物質使用比例較高。</li><li>過重與過輕的青少年風險都較高。</li><li>家庭功能差、不與父母同住、缺乏照顧。</li></ul><p>保護因子有自我效能、正向思考、回復力、父母關愛並知道孩子夜間行蹤，以及正念意識。</p>","p":"p289–290"},{"tag":"研究","h":"腦造影發現：前額葉變薄，多巴胺轉運蛋白減少","b":"<p>青少年前額葉還在發育，IA 者眼眶前額皮質（OFC）較薄，代表抑制控制較不成熟。IGD 青少年的 OFC、腦島、內嗅皮質變薄，前後扣帶回與背外側前額葉灰質較少，可能對應注意力較差。</p><p>紋狀體的多巴胺轉運蛋白（DAT）表現量和多巴胺攝取率顯著降低，和藥物成癮機制類似。所以對物質濫用有效的 CBT，應可用在網路成癮。</p>","p":"p290"},{"tag":"工具","h":"評估工具：Young、Moreno 三題篩檢、陳氏量表","b":"<div class=\"tbl\"><table><tr><th>工具</th><th>重點</th></tr><tr><td>Young 診斷問卷</td><td>8 題，符合超過 5 項定義為 IA</td></tr><tr><td>Internet Addiction Test</td><td>20 題，0–6 分，超過 80 分表示有問題</td></tr><tr><td>Moreno 篩檢</td><td>3 題，每題 0–4 分，3 分以上要進一步評估；敏感性 100%、特異性僅 59%</td></tr><tr><td>陳氏網路成癮量表</td><td>26 題，26–104 分；建議國高中生 64 分以上、大學生 68 分以上為成癮</td></tr></table></div>","p":"p290–292"},{"tag":"臨床做法","h":"問診要同時問家長和青少年，留意這些警訊","b":"<p>青少年常把「其實在線上玩樂」的時間，報成睡覺或做功課，所以時間要交叉確認。</p><p>要問的有：家長監督程度、上網地點（客廳或臥室）、有沒有規範、因上網產生的衝突、對課業的影響。</p><p>警訊（red flags）：總睡眠時間減少、入睡延遲、睡眠品質下降、不明原因白天嗜睡，以及少與現實朋友互動。</p>","p":"p291"},{"tag":"臨床做法","h":"治療以 CBT 為主，動機要先處理","b":"<p>治療尚未標準化。就算輔助用藥，也要以心理治療和心理教育為主。</p><p>短期 CBT（STICA）後，治療組緩解率 69.4%，對照組只有 23.9%。</p><p>多數個案沒有動機，所以早期要先提高治療準備度。準備階段共六期：前期、沉思、準備、行動、維持、復發。</p><p>要完全禁絕很難，可嘗試適度使用，並由外部移除造成問題的部分。</p>","p":"p292"},{"tag":"工具","h":"Greenfield 的 IVGA 治療步驟與藥物角色","b":"<ol><li><b>個案參與</b>：建立協作關係</li><li><b>Pattern Disruption</b>：中斷誘發循環，有時需短期禁絕</li><li><b>辨識誘發因子</b>：可近性、無聊、焦慮（尤其社交焦慮）、學業或工作逃避</li><li><b>管理衝動與渴望</b>：可用藥物，但只是輔助</li><li><b>阻隔、監控、過濾</b>：封鎖特定網站，IT 專家可設監控軟體回報醫師，類似物質濫用的尿檢</li></ol><p>研究最廣的藥是 bupropion，合併 CBT 最有效。ADHD 合併者用 methylphenidate 8 週，成癮分數和上網時間都下降。</p>","p":"p292–293"},{"tag":"趨勢","h":"預防：從兒童青少年和學校開始，也要照顧高風險族群","b":"<ul><li><b>全面性預防</b>：以兒童青少年為重點，從學校介入，韓國從學齡前就開始。</li><li><b>選擇性預防</b>：針對 ADHD、憂鬱、焦慮、社交恐懼、衝動、低自控、孤獨、男性、家庭經濟劣勢等高風險者，訓練自我控制、壓力與情緒調節、人際技巧。</li></ul><p>家長要增進親子溝通與陪伴，並制定使用規則、檢討過度使用，而非單純嚴格限時。同儕教育團體（10 小時）效果優於課堂演講（40 分鐘），但演講也能降低遊戲頻率與時間。這些策略仍待更多實證。</p>","p":"p294–295"},{"tag":"必背","h":"網路成癮的三段五級預防","b":"<div class=\"tbl\"><table><tr><th>段／級</th><th>目標</th><th>策略舉例</th></tr><tr><td>初段 健康促進</td><td>避免發生</td><td>正確觀念、學校教育、運動與規律睡眠</td></tr><tr><td>初段 特定保護</td><td>降低高風險暴露</td><td>親子溝通、使用規範、職場監測</td></tr><tr><td>次段 早期診斷</td><td>找出高風險或問題使用者</td><td>篩檢 ADHD、憂鬱、焦慮，用陳氏量表或 Young 問卷</td></tr><tr><td>次段 早期治療</td><td>防止惡化為成癮</td><td>個別或團體輔導、替代活動</td></tr><tr><td>三段 復健</td><td>降低傷害、預防復發</td><td>CBT 加藥物、重建作息、復發預防</td></tr></table></div>","p":"p295"}],"recap":{"points":["網路成癮是廣義概念，IGD 是 DSM-5 的進一步研究條件（12 個月內符合 5 項以上），GD 是 ICD-11 的正式診斷。","成癮者常合併 ADHD、憂鬱、睡眠問題與自殺意向，評估時要同時問家長和青少年，並留意睡眠相關警訊。","治療以 CBT 與心理教育為主，藥物為輔；完全禁絕不實際，預防要從兒童青少年、學校與家庭做起。"],"quiz":[{"q":"陳氏網路成癮量表建議的成癮切點是多少？","a":"國高中生 64 分以上，大學生 68 分以上。量表共 26 題，分數範圍 26 到 104 分。"},{"q":"為什麼網路成癮不容易用完全禁絕來治療？","a":"智慧型手機和網路是日常工作與社交的必需品，所以多採適度使用，並由外部阻隔特定網站或遊戲。"}]}},"19":{"posts":[{"tag":"核心觀念","h":"非傳染病佔全球近 75% 疾病負擔，身體活動不足是關鍵危險因子","b":"<p>WHO 統計，非傳染性疾病（NCDs）每年造成 4,300 萬人死亡，主要是心血管疾病、癌症、呼吸道疾病和糖尿病。</p><p>身體活動不足或久坐，在兒童青少年會增加脂肪堆積、心血管代謝異常，使體能和利社會行為較差、睡眠減少。成人則是全因、心血管和癌症死亡率上升，心血管疾病、癌症和第 2 型糖尿病的發生率也上升。</p>","p":"p298"},{"tag":"定義","h":"身體活動、運動、靜態行為，三個詞不一樣","b":"<ul><li><b>身體活動</b>（physical activity）：任何需要骨骼肌耗能的動作，含工作、家事、交通、休閒。</li><li><b>運動</b>（exercise）：身體活動的一種，有設計、有結構、重複，目的是增進或維護體適能。</li><li><b>靜態行為</b>（sedentary behavior）：坐著、靠著或躺著，如看電視、打電玩、用電腦（三者合稱螢幕時間）、開車、閱讀。</li></ul>","p":"p298–299"},{"tag":"工具","h":"身體活動分四個範疇，測量用 GPAQ","b":"<p>四個範疇：<b>休閒</b>（LTPA）、<b>工作相關</b>、<b>居家</b>、<b>交通相關</b>。藍領和發展中國家民眾，工作相關活動佔熱量消耗的大部分；退休或家管者以居家活動為主。</p><p>WHO 的全球身體活動問卷（GPAQ）有信效度，問強度、時間、頻率，涵蓋休閒、工作（含居家）、交通三種活動，並加問久坐習慣。</p>","p":"p299"},{"tag":"台灣數字","h":"八成三的人有運動，但只有三成五達到規律運動","b":"<div class=\"stat\"><div><strong>83.3%</strong><span>平常有做運動（2025 年調查）</span></div><div><strong>35.6%</strong><span>達規律運動標準</span></div><div><strong>38.9% vs 32.4%</strong><span>男性與女性規律運動比例</span></div><div><strong>22.9%</strong><span>40–44 歲，比例最低</span></div></div><p>規律運動即「7333 原則」：每週 3 次以上、每次 30 分鐘以上、心跳達每分鐘 130 下或會流汗也會喘。運動盛行率呈 U 字形，青少年和老年人最高。</p>","p":"p299–300"},{"tag":"現場難題","h":"為什麼不運動？最大原因是工作沒時間","b":"<ol><li>因工作沒有時間 24.1%</li><li>工作太累 21.8%</li><li>懶得運動 21.4%</li><li>健康狀況不能運動 10.3%</li></ol><p>規律運動比例較低的族群：女性、40–44 歲（22.9%）、大學學歷（30.5%）、藍領（24.1%）。</p>","p":"p300"},{"tag":"台灣數字","h":"全球身體活動不足盛行率，二十年來不減反增","b":"<div class=\"stat\"><div><strong>31.3%</strong><span>2022 年全球盛行率</span></div><div><strong>23.4%</strong><span>2000 年</span></div><div><strong>26.4%</strong><span>2010 年</span></div><div><strong>33.8% vs 28.7%</strong><span>女性與男性</span></div></div><p>各區域、各性別中，60 歲以上都較高。WHO 目標是 2030 年降低 15%。身體活動不足的定義是每週低於 150 分鐘中等強度活動。</p>","p":"p299–300"},{"tag":"研究","h":"動一點就有賺：休閒運動不到建議量也降低 20% 死亡風險","b":"<p>Arem 等人 2015 年整合 6 個研究、661,137 人。相較完全沒有休閒運動者：</p><ul><li>低於最低建議量：死亡風險降 20%</li><li>1–2 倍建議量：HR 0.69</li><li>2–3 倍：HR 0.63</li><li>3–5 倍：HR 0.61</li><li>10 倍以上：風險略回升，但仍低 31%，沒有增加風險</li></ul><p>結論是要鼓勵不運動的人動起來，也不必勸阻運動量已經很高的人。</p>","p":"p300"},{"tag":"研究","h":"久坐越久，失智和癌症死亡風險越高","b":"<p><b>失智</b>（UK Biobank，60 歲以上 49,481 人）：與每日久坐中位數 9.27 小時相比，久坐 10、12、15 小時者，失智風險分別增加 8%、63%、321%。</p><p><b>癌症死亡</b>（REGARDS，45 歲以上 8,002 人，穿戴裝置）：久坐時間較長的兩組風險高出 45% 和 52%。每多坐 1 小時增加 16%；把 30 分鐘久坐換成中高強度活動，可降低 31%。</p>","p":"p300–301"},{"tag":"必背","h":"運動強度怎麼分：MET、HRR、講話測試","b":"<div class=\"tbl\"><table><tr><th>強度</th><th>MET</th><th>%HRR</th></tr><tr><td>輕度（散步、撞球）</td><td class=\"num\">1.6–2.9</td><td class=\"num\">30–39%</td></tr><tr><td>中等（快走、洗車、高爾夫）</td><td class=\"num\">3–5.9</td><td class=\"num\">40–59%</td></tr><tr><td>高強度（爬山、慢跑、跳繩、競賽球類）</td><td class=\"num\">≥ 6</td><td class=\"num\">60–89%</td></tr></table></div><p>講話測試：中等強度可以講話但無法唱歌；高強度講幾個字就要停下來喘。FITT 原則則是頻率、強度、時間、類型。</p>","p":"p301–302"},{"tag":"工具","h":"目標心率怎麼算：HRR 與最大心率公式","b":"<ul><li><b>HRR</b> = HRmax − HRrest</li><li><b>THR</b> = 強度% × HRR + HRrest</li><li><b>HRmax</b> 常用 220 − 年齡，但較可能估錯；Gellish 公式為 207 − (0.7 × 年齡)</li></ul><p>因為老年人和年輕人在相同 MET 下，相對強度不同，個人化強度用相對強度（HRR）較合適，對體能差的人尤其如此。</p>","p":"p302"},{"tag":"必背","h":"WHO 2020 指引：成人每週 150–300 分鐘中等強度","b":"<div class=\"tbl\"><table><tr><th>族群</th><th>建議</th></tr><tr><td>5–17 歲</td><td>每天累計至少 60 分鐘中到高強度，多為有氧；每週至少 3 次高強度與肌骨強化；限制螢幕時間</td></tr><tr><td>18–64 歲</td><td>每週 150–300 分鐘中等強度，或 75–150 分鐘高強度；每週至少 2 天肌力訓練；限制久坐</td></tr><tr><td>65 歲以上</td><td>同成人；另加每週至少 3 次平衡與力量訓練，預防跌倒</td></tr><tr><td>孕婦與產後</td><td>每週至少 150 分鐘中等強度有氧；孕前已運動者可繼續</td></tr></table></div><p>慢性病與身心障礙者建議同一般人，從少量開始，逐漸增加。</p>","p":"p302–303"},{"tag":"趨勢","h":"指引一路演進：每一點活動都算數","b":"<ul><li><b>類型</b>：只有氧，後加肌力，2020 年對老年人加平衡。</li><li><b>強度</b>：從強調高強度，到中等強度也有益，2020 年提醒把久坐換成低強度以上活動。</li><li><b>頻率</b>：從每週至少 3 天，到強調每週累積總量比頻率重要。</li><li><b>時間</b>：從連續 15–60 分鐘，到每次至少 10 分鐘，2020 年移除 10 分鐘門檻，改為 every little bit counts。</li></ul>","p":"p303–304"},{"tag":"臨床做法","h":"門診促進運動：先提高病人的自我效能","b":"<p>醫師端的障礙有時間不足、缺乏知識與工具、沒有團隊支持。病人端則是沒時間、缺家人朋友支持、環境不足。</p><p>提高自我效能的四個來源：</p><ul><li><b>勝利經驗</b>：設定可逐步達成的目標、用活動日記</li><li><b>替代經驗</b>：看相似的人成功</li><li><b>口頭勸說</b>：讚美、表達信心</li><li><b>生理回饋</b>：討論活動時的感覺與不適</li></ul><p>常見障礙如沒時間、天氣、中斷，書中都列有對應策略，例如利用零碎時間、選不受天候影響的運動、中斷後盡快恢復。</p>","p":"p304–306"},{"tag":"工具","h":"身體活動金字塔：少坐、多走，每天拉筋","b":"<p>金字塔分五類活動。理想是減少第五類靜態活動（久坐、看電視、打電動），盡量增加第一類日常生活活動（走路、爬樓梯、做家事、騎車或步行通勤）。</p><p>第二類伸展，可利用工作空檔，例如睡前或起床後 5 分鐘。其他有氧、肌力、休閒運動，則依喜好和體能循序加入。</p>","p":"p306–307"},{"tag":"臨床做法","h":"運動前評估：誰需要先取得醫療許可？","b":"<div class=\"tbl\"><table><tr><th>對象</th><th>情況</th><th>建議</th></tr><tr><td>無運動習慣</td><td>無心血管、代謝、腎臟病且無症狀</td><td>輕至中強度可直接開始</td></tr><tr><td>無運動習慣</td><td>有疾病（有或無症狀）</td><td>先取得醫療許可再開始輕至中強度</td></tr><tr><td>有運動習慣</td><td>有疾病但無症狀</td><td>中等強度不需許可，高強度建議取得許可</td></tr><tr><td>有運動習慣</td><td>有疾病且有症狀</td><td>暫停運動並取得許可</td></tr></table></div><p>缺乏專業人員時可用 PAR-Q+（7 題），全部答「否」即可從事身體活動。</p>","p":"p307–308"},{"tag":"臨床做法","h":"運動處方：起手要低，再漸進","b":"<ul><li><b>有氧</b>：每週至少 3 天，中強度（40–59% HRR）累積 150 分鐘以上，或高強度（60–89% HRR）75 分鐘以上。</li><li><b>阻力</b>：新手每主要肌群每週至少 2 天，每組 8–12 次；成人從 60–70% 1-RM 開始，老年人從 40–50%。</li><li><b>柔軟度</b>：每週至少 2–3 天，成人靜態伸展 10–30 秒，老年人 30–60 秒。</li></ul><p>高血壓病人要避免憋氣的 Valsalva 動作，血壓維持在 SBP ≤ 220、DBP ≤ 105 mmHg。糖尿病病人進展要慢，注意低血糖。肥胖者選走路、原地騎車、游泳等低骨骼壓力運動。</p>","p":"p307–309"},{"tag":"研究","h":"住院也要動：早期活動讓呼吸器天數從 6.3 天降到 4.1 天","b":"<p>住院病人常出現活動功能受損，核心做法是「增加活動、提早下床」，包括預防跌倒、減少管路和約束、床上或床邊腳踏車，能下床就用助行器。研究發現可減少跌倒、壓瘡，也降低醫護搬動受傷率。</p><p>內科加護病房對急性呼吸衰竭插管病人做四階段活動，呼吸器使用天數由 6.3 天縮短為 4.1 天，且無管路滑脫或跌倒。</p>","p":"p309"},{"tag":"趨勢","h":"WHO 2018–2030 全球行動計畫：四大行動領域","b":"<ol><li><b>營造活躍社會</b>：加強宣導與專業人員訓練</li><li><b>建立有利環境</b>：改善人行道與公共交通，公共空間安全、公平</li><li><b>培養活躍族群</b>：學校全面動員、社區與長照機構規劃，優先照顧女童、婦女、老人、鄉村、低收入者</li><li><b>建立支持系統</b>：跨部門合作、整合數據、確保預算機制</li></ol>","p":"p309–310"},{"tag":"考點","h":"運動傷害：急性與慢性，預防分三個層面","b":"<p>急性傷害是單次突發（撞擊、急扭），慢性傷害是累積或重複動作造成，如網球肘、高爾夫球肘、跑者的小腿或膝蓋痛，或急性傷害沒完全復原又受傷。發生率常被低估，因為只有少數進急診。</p><p>前十字韌帶受傷，日後退化性關節炎風險增加 4 至 6 倍。</p><p>預防三層面：<b>教育與行為</b>（暖身、體能訓練、復健）、<b>裝備與環境</b>（衣、襪、鞋、場地）、<b>社會氛圍與政策</b>（規則、規範、醫療可近性）。</p>","p":"p310–311"},{"tag":"臨床做法","h":"暖身四要素，加上受傷後的處置口訣","b":"<p>暖身（warm-up）微微流汗即可，結束前做緩和運動（cool-down）。核心組成：</p><ul><li>心血管活化（慢跑、開合跳）</li><li>動態伸展（擺腿、手臂繞環、弓箭步），不像靜態伸展可能降低肌力</li><li>運動特異性動作</li><li>漸進式強度</li></ul><p>鞋子要注意腳踝和後跟支撐、鞋墊緩衝、內部空間。護具與貼紮目前沒有明確證據顯示能預防傷害。處置口訣從 ICE、RICE、PRICE、POLICE，演進到 2020 年的 PEACE &amp; LOVE，涵蓋亞急性與慢性期的組織修復；是否完全棄用冰敷與消炎藥仍無共識。</p>","p":"p311–312"}],"recap":{"points":["台灣 83.3% 有運動，但只有 35.6% 達規律運動；全球身體活動不足盛行率從 2000 年 23.4% 升到 2022 年 31.3%。","WHO 2020 建議成人每週 150–300 分鐘中等強度或 75–150 分鐘高強度，加每週 2 天肌力訓練；每一點活動都算數，並要減少久坐。","門診要先評估風險再開處方，起手低強度、漸進增加；預防運動傷害靠暖身、適當裝備與環境，以及完整的傷後處置。"],"quiz":[{"q":"「7333 原則」是什麼？","a":"每週運動 3 次以上、每次 30 分鐘以上、心跳達每分鐘 130 下（或會流汗也會喘）。"},{"q":"WHO 建議 65 歲以上老年人，除了成人建議之外還要加什麼？","a":"每週至少 3 次、以中等強度以上的功能性平衡與力量訓練，用來增強功能並預防跌倒。"}]}},"20":{"posts":[{"tag":"定義","h":"肥胖是一種慢性、復發性、進展性的疾病","b":"<p>肥胖指體內脂肪超過維持正常生理所需，或累積到危害健康的程度。WHO 在 1996 年把肥胖列為慢性疾病，近年進一步強調它是「慢性、復發性且具進展性的疾病」。</p><p>臨床重點不只是體重或 BMI 的數字，而是脂肪組織功能失調、代謝異常與器官風險的累積。評估與治療決策要以健康風險和功能受損程度為核心。</p>","p":"p314"},{"tag":"台灣數字","h":"全球 25 億成人超重，肥胖盛行率自 1990 年起翻倍","b":"<div class=\"stat\"><div><strong>25 億</strong><span>2022 年超重成人，其中 8.9 億肥胖</span></div><div><strong>2 倍</strong><span>成人肥胖盛行率較 1990 年</span></div><div><strong>約 3 倍</strong><span>青少年肥胖盛行率</span></div><div><strong>3.9 億</strong><span>5–19 歲超重，其中 1.6 億肥胖</span></div></div><p>GBD 2021 指出高 BMI 是重要的可歸因風險因子，疾病負擔 30 年來持續上升。</p>","p":"p314–315"},{"tag":"核心觀念","h":"肥胖不只是意志力：基因、環境與社會共同造成","b":"<p>表面是能量攝取與消耗長期失衡，但實際是遺傳易感性、環境與行為的交互作用。GWAS 發現肥胖是高度多基因，已找到數千個與 BMI 和脂肪分布有關的位點，涉及食慾飽足調控、脂肪細胞、胰島素、脂質代謝、腸道菌相與腸腦軸。</p><p>在高脂、高糖、高能量密度飲食加上活動不足的致胖環境（obesogenic environment）中，肥胖也和都市設計、交通、食品加工與行銷政策有關。</p>","p":"p315"},{"tag":"必背","h":"台灣的肥胖切點比歐美更嚴：BMI 24 過重、27 肥胖","b":"<div class=\"tbl\"><table><tr><th>標準</th><th>過重</th><th>肥胖</th><th>腰圍（男／女）</th></tr><tr><td>WHO</td><td class=\"num\">25–29.9</td><td class=\"num\">≥ 30</td><td class=\"num\">≥102／≥88</td></tr><tr><td>亞太</td><td class=\"num\">23–24.9</td><td class=\"num\">≥ 25</td><td class=\"num\">≥90／≥80</td></tr><tr><td>台灣</td><td class=\"num\">24–26.9</td><td class=\"num\">≥ 27</td><td class=\"num\">≥90／≥80</td></tr></table></div><p>台灣肥胖再分三度：27–29.9 輕度，30–34.9 中度，≥35 重度。</p>","p":"p315–316"},{"tag":"考點","h":"為什麼亞洲切點較低？BMI 的限制要知道","b":"<p>相同 BMI 下，亞洲人體脂肪百分比較西方人高，代謝症候群風險也較高，所以台灣以共病程度、死亡率和流病研究，定出 BMI ≥ 24 為過重、≥ 27 為肥胖。</p><p>用 BMI 時要注意年齡、性別、種族、水分與肌肉狀態，運動員或肌少症者有誤判風險。亞洲各國不同，例如日本肥胖 BMI ≥ 25，中國 ≥ 28。</p>","p":"p315–316"},{"tag":"迷思","h":"體脂率不能取代 BMI 和腰圍來診斷肥胖","b":"<p>臨床上常以男性體脂率 ≥ 25%、女性 ≥ 30% 作為過高的參考線，但切點受年齡、性別、族群影響，沒有一致的國際診斷標準。</p><p>目前缺乏以體脂率診斷的大型前瞻性研究，也沒有連結心血管代謝疾病或死亡的明確風險切點。所以體脂與身體組成分析適合作輔助評估與治療追蹤，核心診斷仍是 BMI 與腰圍。</p>","p":"p316"},{"tag":"核心觀念","h":"肥胖的共病遍及全身，從心血管到癌症","b":"<ul><li><b>心血管</b>：高血壓、動脈粥樣硬化、心衰竭、心律不整</li><li><b>代謝</b>：第 2 型糖尿病、糖尿病前期、血脂異常</li><li><b>肝膽腸胃</b>：MASLD、MASH、膽結石、胃食道逆流</li><li><b>呼吸</b>：阻塞性睡眠呼吸中止、氣喘</li><li><b>骨骼、生殖、泌尿、中樞神經、心理</b>：退化性關節炎、多囊性卵巢症、尿失禁、認知功能障礙、憂鬱</li><li><b>癌症</b>：食道腺癌、胰臟癌、大腸直腸癌、腎臟癌、子宮內膜癌、停經後乳癌</li></ul><p>篩檢肥胖要同時找共病，反過來也一樣。</p>","p":"p316–317"},{"tag":"必背","h":"肥胖的三段預防：減重目標隨層級升高","b":"<ul><li><b>第一段</b>（一般族群）：健康飲食、增加活動、減少久坐，維持體重。</li><li><b>第二段</b>（過重或早期肥胖）：結構化生活型態介入，可減 5–10%；反應不足或有代謝危險因子時加藥物。</li><li><b>第三段</b>（已有共病）：GLP-1 受體促效劑與 GIP/GLP-1 雙重促效劑可減 10–20%；中重度肥胖或多重共病可考慮代謝／減重手術。</li></ul><p>初始減重 5–10% 就有臨床意義，減得更多則共病緩解機會更高。</p>","p":"p317"},{"tag":"工具","h":"5A 肥胖照護流程：從 Edmonton 分期到定期追蹤","b":"<ol><li><b>Assess</b>：BMI、腰圍，加 Edmonton 肥胖分期（EOSS），評估生活型態、睡眠、壓力、致胖藥物與意願</li><li><b>Advise</b>：依風險個別建議，強調肥胖是慢性疾病</li><li><b>Agree</b>：共享決策，通常先訂 5–10%；有糖尿病、MASLD/MASH、OSA 可能要 ≥ 10%</li><li><b>Assist</b>：行為支持、自我監測、多專業團隊</li><li><b>Arrange</b>：初期每 2–4 週追蹤，穩定後每 1–3 個月，仍需長期</li></ol>","p":"p317–319"},{"tag":"臨床做法","h":"評估內容：飲食日記、共病、藥物、腰圍量法","b":"<ul><li><b>病史</b>：回顧一週飲食與活動（至少三天，含一天假日）；體重增加時期、過去減重經驗、家庭支持；女性看月經、產後與停經變化。</li><li><b>致胖藥物</b>：部分降血糖藥、抗憂鬱劑、抗精神病藥、抗癲癇藥、類固醇，可替代就調整。</li><li><b>腰圍</b>：皮尺繞過腸骨上緣與肋骨下緣的中間點。</li><li><b>檢驗</b>：空腹血糖或 HbA1c、ALT/AST、血脂、TSH，必要時腎功能與尿蛋白、心電圖。</li></ul>","p":"p319–320"},{"tag":"必背","h":"減重目標：3–6 個月減初始體重 5–10%","b":"<p>減重三個核心目標：體重不再增加、達到有臨床意義的下降、維持減下來的體重。</p><p>治療基礎是生活型態與行為介入，生活型態效果不足或有顯著共病者才考慮藥物。藥物達維持劑量約 3 個月後評估，體重下降未達初始體重 5% 且無其他獲益，就要重新評估依從性、睡眠、壓力、藥物交互作用，必要時停用、轉換或升級。</p>","p":"p320"},{"tag":"臨床做法","h":"飲食介入：沒有「最佳飲食」，要的是熱量赤字和長期遵循","b":"<div class=\"stat\"><div><strong>500–1,000</strong><span>每日減少 kcal，約每週減 0.5–1.0 公斤</span></div><div><strong>1,200–1,500</strong><span>多數女性每日 kcal</span></div><div><strong>1,500–1,800</strong><span>男性每日 kcal</span></div></div><p>共同原則：以全食物為主、優質蛋白、限制添加糖與精製澱粉、重視脂肪品質、每日鈉低於 2,300 mg。飲食結構與執行方式比營養素比例重要。</p>","p":"p321"},{"tag":"臨床做法","h":"各種飲食模式的定位與禁忌","b":"<ul><li><b>低脂／中脂（地中海飲食）</b>：證據最穩定，有心血管代謝額外益處。</li><li><b>低碳水或高蛋白</b>：短期較明顯，長期與其他相近；腎功能不全者不宜高蛋白。</li><li><b>間歇性斷食</b>：效果和持續熱量限制相當，要評估低血糖風險。</li><li><b>生酮</b>：缺乏長期安全性證據，只宜短期在專業監督下用，不建議用於第 1 型糖尿病、孕婦、青少年或兒童。</li></ul>","p":"p321–322"},{"tag":"臨床做法","h":"運動在減重的角色：不是主力，是維持與保護","b":"<p>減 1 公斤體脂肪約需消耗 7,700 kcal，中等強度運動每小時約耗 300–400 kcal，加上代謝補償，單靠運動很難大幅減重。運動的角色是輔助脂肪消耗、維持除脂體重、改善心肺適能和預防復胖。</p><ul><li>預防體重增加：每週至少 150 分鐘中等強度有氧</li><li>減重與預防復胖：逐步增加到每週 250–300 分鐘</li><li>阻力訓練：每週 2–3 次，每次 2–3 組、每組 8–12 次</li></ul><p>HERITAGE 研究：20 週有氧訓練後，約三分之一代謝症候群個案風險逆轉。</p>","p":"p322–323"},{"tag":"臨床做法","h":"HIIT 和計步器：好用，但別當唯一策略","b":"<p>HIIT 能改善最大攝氧量與部分代謝指標，但對體重下降未顯著優於中等強度連續運動，且關節與心血管負荷較高，不宜當肥胖初期唯一策略。</p><p>久坐者可把日行萬步當長期目標，每週增加 500–1,000 步。穿戴裝置短期可增加每日步數約 2,000–2,500 步，長期效果需搭配行為支持。</p>","p":"p323"},{"tag":"臨床做法","h":"行為治療：不是責備，是建立可持續的習慣","b":"<p>行為治療在 6–12 個月內可達約 5–10% 的體重減輕，但缺乏持續支持，長期維持會下降。</p><p>核心策略：自我監測（飲食、活動、體重、情境與情緒）、刺激控制、目標設定與問題解決、認知與自我效能強化、社會支持。要用病人為中心的溝通，不以意志力不足解釋肥胖。</p>","p":"p323"},{"tag":"必背","h":"抗肥胖藥物：適應症與五種 FDA 核可藥","b":"<p>適應症是 BMI ≥ 30，或 BMI ≥ 27 且合併至少一項體重相關共病，並作為生活型態介入的輔助，不是替代。</p><div class=\"tbl\"><table><tr><th>藥物</th><th>一年平均減重</th></tr><tr><td>Orlistat</td><td class=\"num\">約 3–6%</td></tr><tr><td>Naltrexone/Bupropion ER</td><td class=\"num\">約 5–8%</td></tr><tr><td>Liraglutide 3.0 mg</td><td class=\"num\">約 8–10%</td></tr><tr><td>Semaglutide 2.4 mg</td><td class=\"num\">約 12–15%</td></tr><tr><td>Tirzepatide</td><td class=\"num\">約 15–20%</td></tr></table></div><p>實際接受藥物治療的比例只有約 2–3%。</p>","p":"p323–325"},{"tag":"研究","h":"停藥後體重回升，是預期的生理反應，不是病人失敗","b":"<p>STEP-1 延伸試驗與 SURMOUNT-4 等顯示，停用 GLP-1 或 GIP/GLP-1 藥物後一年內，平均回升原減重的 30–60%，約 5–8 公斤，血糖、血壓、血脂也部分回彈。</p><p>機轉是中樞食慾調控、腸泌素訊號、leptin-ghrelin 軸的負回饋重新啟動。所以評估成效要和「未介入的自然病程」比，而不是只和最低體重比。處置上要在開始時就說明回升常見，並同步規劃行為維持。</p>","p":"p324–326"},{"tag":"臨床做法","h":"代謝手術：BMI ≥ 35 就可考慮，台灣健保門檻較高","b":"<div class=\"tbl\"><table><tr><th>標準</th><th>適應症</th></tr><tr><td>2022 ASMBS/IFSO</td><td>BMI ≥ 35，不論有無共病；BMI 30–34.9 合併第 2 型糖尿病或顯著代謝疾病，保守治療不足時</td></tr><tr><td>台灣健保</td><td>BMI ≥ 37.5，或 ≥ 32.5 合併至少一項肥胖共病，且內科治療至少 6 個月無效</td></tr></table></div><p>術後 1–3 年平均總體重下降約 25–35%，對第 2 型糖尿病有明顯效果。仍可能回升，需長期監測維生素 B12、鐵、鈣、維生素 D 缺乏與低血糖。內視鏡減重治療可減約 10–15%，介於藥物與手術之間，長期維持較不穩定。</p>","p":"p326–327"},{"tag":"趨勢","h":"減重成功的新定義：臨床效益，而不是正常 BMI","b":"<p>成功是減少 ≥ 5–10% 體重，且一項或多項共病改善。非手術治療多需 4–6 個月達成，之後轉入維持階段。</p><p>維持的評估也從「有沒有回升」改成「風險是否仍低於未介入的軌跡」。降低回升的策略：長期（≥ 12 個月）行為支持、每週約 200–300 分鐘中等強度有氧加阻力訓練、足量蛋白質且避免極端限制熱量、適合者持續藥物、多專業團隊與個案管理。</p>","p":"p327–328"}],"recap":{"points":["肥胖是慢性、復發性、進展性疾病；台灣以 BMI ≥ 24 為過重、≥ 27 為肥胖，腰圍男 90、女 80 公分以上為腹部肥胖。","管理採三段預防與 5A 流程，初始目標減 5–10%；生活型態與行為介入是基礎，藥物（適應症 BMI ≥ 30，或 ≥ 27 合併共病）與手術為進階選項。","停藥後回升是可預期的生理反應；成功與維持要看共病與風險是否改善，需要長期追蹤與支持。"],"quiz":[{"q":"抗肥胖藥物的適應症是什麼？","a":"BMI ≥ 30，或 BMI ≥ 27 且合併至少一項體重相關共病，並搭配生活型態介入。"},{"q":"藥物達維持劑量 3 個月後體重下降未達 5%，該怎麼做？","a":"重新評估依從性、生活型態、睡眠壓力、藥物交互作用和共病控制，視情況停用、轉換或升級治療。"}]}},"21":{"posts":[{"tag":"核心觀念","h":"疫苗靠的是主動免疫，六大類型一次看懂","b":"<p>主動免疫是接觸抗原後，T、B 細胞產生專一性抗體與記憶細胞，保護持久但形成較慢（數日至數週）。被動免疫是直接給抗體（免疫球蛋白、母體傳遞），迅速但短暫。疫苗用的是主動免疫。</p><div class=\"tbl\"><table><tr><th>類型</th><th>重點</th></tr><tr><td>活性減毒</td><td>免疫接近自然感染，持久；免疫低下者要審慎，易被外來抗體干擾</td></tr><tr><td>不活化</td><td>安全，但持久性差，常需多劑</td></tr><tr><td>次單元</td><td>病原部分成分，如 B 肝疫苗</td></tr><tr><td>結合型</td><td>莢膜多醣體接蛋白載體，如 PCV20</td></tr><tr><td>DNA/RNA</td><td>製備快，如部分 COVID-19 mRNA 疫苗</td></tr><tr><td>重組載體</td><td>如牛津 AZ COVID-19 疫苗</td></tr></table></div>","p":"p334–335"},{"tag":"必背","h":"疫苗成分與接種途徑：什麼疫苗打哪裡","b":"<p>成分有核心抗原、懸浮液、保存劑與穩定劑（硫柳汞、neomycin、streptomycin 可能引起過敏，要問過敏史）、佐劑（鋁鹽等，多用於不活化與次單元疫苗）。</p><ul><li><b>肌肉注射</b>：免疫球蛋白與含佐劑疫苗，如 B 肝</li><li><b>皮下注射</b>：活性減毒，如水痘</li><li><b>皮內注射</b>：卡介苗</li><li><b>口服</b>：輪狀病毒、霍亂</li><li><b>鼻噴</b>：活性減毒流感疫苗（LAIV）</li></ul>","p":"p335–336"},{"tag":"必背","h":"接種間隔：活性減毒要同時，不然隔 28 天","b":"<ul><li>活性減毒疫苗彼此可同時接種（不同部位），沒同時就至少間隔 28 天。</li><li>活性減毒與不活化、或不活化之間，可同時或間隔任何時間。</li><li>卡介苗與口服活性減毒疫苗，可與其他活性減毒注射疫苗同時或隔任何時間。</li><li>肌肉注射免疫球蛋白或 HBIG 後，隔 3 個月再打 MMR、水痘、JE；麻疹接觸者預防性注射後隔 6 個月以上。</li><li>輸血或靜脈血液製品後隔 6 個月；高劑量（≥ 1 g/kg）靜脈免疫球蛋白後隔 11 個月。</li><li>打完 MMR、水痘或 JE 後，至少隔 2 週才能接受免疫球蛋白等製品，不足要重打。</li></ul>","p":"p336–337"},{"tag":"考點","h":"不良事件不等於副作用，差在有沒有因果關係","b":"<p>接種後發生的任何健康相關事件都叫不良事件（adverse event），只有確定有因果關係才叫副作用（side effect）。</p><ul><li><b>局部反應</b>較常見：紅、腫、痛，輕微自限，常見於含佐劑疫苗。</li><li><b>全身反應</b>：發燒、肌痠痛、頭痛、食慾不振、皮疹，較常見於活性減毒疫苗。</li></ul>","p":"p336"},{"tag":"臨床做法","h":"卡介苗：5 至 8 個月接種，傷口 3 個月沒好要就醫","b":"<p>減毒牛型分枝桿菌製成的活性減毒疫苗，皮內注射，主要預防嬰幼兒結核性腦膜炎和播散性結核。對結核病初期症候保護約 85%。台灣自 2016 年起調整為出生後 5 至 8 個月，最遲 1 歲前。</p><p>接種後 1–2 週出現小紅結節，4–6 週可能形成膿瘍或潰瘍，2–3 個月多自行結痂。3 個月仍未癒合或腋下淋巴結腫大要就醫。</p><p>禁忌：嚴重過敏、嚴重濕疹或皮膚缺損、免疫功能不全、HIV 且免疫低下，孕婦不建議。</p>","p":"p336"},{"tag":"台灣數字","h":"A 肝與 B 肝疫苗：時程與成效","b":"<div class=\"stat\"><div><strong>95%+</strong><span>A 肝 1 劑後產生保護抗體，2 劑保護至少 20 年</span></div><div><strong>10.5% → 0.8%</strong><span>1992 年改用基因重組 B 肝疫苗後，6 歲幼兒帶原率</span></div><div><strong>90%+</strong><span>B 肝完成接種後產生保護抗體</span></div></div><ul><li><b>A 肝</b>：不活化，肌肉注射。2025 年起兒童滿 18 與 27 個月各 1 劑，間隔至少 6 個月。</li><li><b>B 肝</b>：0、1、6 個月各 1 劑。第 1、2 劑隔 4 週，第 2、3 劑隔 8 週，第 1、3 劑隔 16 週。母親表面抗原陽性，嬰兒 24 小時內打 1 劑 HBIG。</li></ul><p>透析成人用一般劑型，建議 0、1、2、6 個月共 4 次，每次 2 劑。</p>","p":"p338–340"},{"tag":"臨床做法","h":"五合一疫苗：白喉、破傷風、百日咳、Hib、小兒麻痺","b":"<p>DTaP-Hib-IPV 為不活化疫苗，肌肉注射。常見反應是注射部位紅腫痠痛，偶有哭鬧、疲倦、食慾不振或嘔吐，多於 3 日內恢復，持續哭鬧、高燒或痙攣極少見。</p><p>禁忌：先前對相關疫苗或成分有嚴重過敏、接種含百日咳疫苗後 7 日內出現腦病變且無其他原因、未滿 6 週齡嬰兒。</p>","p":"p340"},{"tag":"必背","h":"肺炎鏈球菌疫苗：結合型 vs. 多醣體","b":"<ul><li><b>PCV13</b>：13 種血清型</li><li><b>PCV15</b>：加 22F、33F</li><li><b>PCV20</b>：再加 8、10A、11A、12F、15B，共 20 種，可用於 6 週以上兒童、青少年及成人</li><li><b>PCV21</b>：重新設計，含成人常見血清型（如 23A、15A、35B），僅限 18 歲以上</li><li><b>PPV23</b>：23 種多醣體，誘發 T 細胞非依賴性免疫，記憶和幼兒反應有限，不適用 2 歲以下</li></ul><p>結合型誘發 T 細胞依賴性免疫，免疫記憶較好，也能降低鼻咽帶菌。IPD 好發於 5 歲以下和 65 歲以上，高風險族群還有脾臟缺損、免疫不全、人工耳、腦脊髓液滲漏、慢性器官疾病、糖尿病、吸菸或酒精使用障礙等。</p>","p":"p340–341"},{"tag":"趨勢","h":"成人公費肺炎鏈球菌疫苗改制：一劑 PCV20 或 PCV21","b":"<p>2026 年 1 月 15 日起，公費由 PCV13 加 PPV23 兩劑，逐步改為單劑 PCV20。2026 年 8 月 10 日起增加 PCV21，PPV23 停止公費並回收。</p><div class=\"tbl\"><table><tr><th>過往接種史</th><th>公費銜接</th></tr><tr><td>從未接種</td><td>PCV20/21</td></tr><tr><td>僅 PPV23</td><td>間隔 ≥ 1 年，PCV20/21</td></tr><tr><td>僅 PCV13/15</td><td>間隔 ≥ 1 年（高風險、機構住民、洗腎者至少 8 週），PCV20/21</td></tr><tr><td>PCV13/15 + PPV23</td><td>已完整，不需再打</td></tr></table></div><p>對象為 65 歲以上、55–64 歲原住民、19–64 歲 IPD 高風險者。</p>","p":"p341–342"},{"tag":"臨床做法","h":"MMR：兩劑時程，育齡婦女要先確認抗體","b":"<p>活性減毒疫苗，皮下注射。嬰幼兒滿 1 歲和滿 5 歲至入小學前各 1 劑。德國麻疹孕早期感染可能造成流產、死胎、胎兒畸形或先天性德國麻疹症候群，育齡婦女宜檢測抗體，沒有抗體建議接種。</p><p>15–49 歲本國籍育齡婦女，持近 3 個月內抗體陰性報告，或孕期檢驗無抗體且產後 2 年內持該胎次報告，可公費 1 劑。接種後 1 個月內不宜懷孕；若接種後才發現懷孕，不必終止妊娠。禁忌包括嚴重過敏、孕婦、嚴重免疫缺失。</p>","p":"p342–343"},{"tag":"臨床做法","h":"水痘疫苗：12 個月一劑，13 歲以上自費要兩劑","b":"<p>活性減毒疫苗，皮下注射。水痘年紀越大症狀越重，成人併發症多於兒童，病毒也會潛伏神經節，日後再活化成帶狀疱疹。</p><ul><li>12 個月至 12 歲：滿 12 個月公費 1 劑，4–6 歲可自費追加第 2 劑。</li><li>13 歲以上自費：未接種也沒得過水痘，打 2 劑，間隔 4 至 8 週。</li></ul><p>禁忌：嚴重過敏、嚴重免疫缺失、孕婦。</p>","p":"p343"},{"tag":"必背","h":"帶狀疱疹：Shingrix 保護力超過 90%，50 歲以上打兩劑","b":"<div class=\"stat\"><div><strong>10–20%</strong><span>感染者一生會發生帶狀疱疹</span></div><div><strong>近 10%</strong><span>發生帶狀疱疹後神經痛（PHN）</span></div><div><strong>&gt; 90%</strong><span>Shingrix 對 50 歲以上的保護力</span></div></div><ul><li><b>Zostavax</b>（活性減毒）：60 歲以上降低發生率約 50–51%、PHN 約 67%；5–8 年後明顯減弱。</li><li><b>Shingrix</b>（重組，gE 抗原加佐劑）：70 歲以上約 85–90%，PHN 保護超過 85%，至少維持 7–10 年。不含活病毒，免疫低下者也能用。</li></ul><p>疾管署建議 50 歲以上，及 18 歲以上免疫不全者，不論是否得過水痘或帶狀疱疹，打 2 劑，間隔 2–6 個月。</p>","p":"p343–344"},{"tag":"臨床做法","h":"日本腦炎：兒童改用細胞培養活性減毒疫苗","b":"<p>病媒蚊傳播，好發於 5 至 10 月。感染者少於 1% 出現腦炎等症狀，但重症致死率可達 30–50%，約三分之一存活者留下後遺症。</p><p>2017 年起兒童常規用細胞培養活性減毒疫苗，皮下注射，滿 15 個月第 1 劑，間隔 12 個月第 2 劑。已打過不活化疫苗者：</p><ul><li>已打 1 劑：隔 14 天以上打第 1 劑，再隔 12 個月第 2 劑</li><li>已打 2 劑：隔至少 12 個月補 1 劑，之後不必追加</li><li>已打 3 劑：滿 5 歲至入學前打 1 劑，且與前劑隔至少 12 個月</li></ul>","p":"p344"},{"tag":"必背","h":"HPV 疫苗：二價、四價、九價，9–14 歲效益最高","b":"<div class=\"tbl\"><table><tr><th>疫苗</th><th>型別</th><th>劑數</th></tr><tr><td>二價（Cervarix）</td><td>16、18</td><td>9–14 歲 2 劑隔 6 個月；15 歲以上 3 劑（0、1、6 月）</td></tr><tr><td>四價（Gardasil）</td><td>6、11、16、18</td><td>9–13 歲 2 劑；14–45 歲女性、9–26 歲男性 3 劑（0、2、6 月）</td></tr><tr><td>九價（Gardasil 9）</td><td>再加 31、33、45、52、58</td><td>9–14 歲 2 劑；15–45 歲 3 劑</td></tr></table></div><p>約 99% 子宮頸癌和 HPV 有關，HPV 16、18 造成全球 66–70%。九價對新增 5 型相關高度病變約 97% 有效，約可預防 90% 子宮頸癌。2025 年 9 月起公費擴大到國中男女學生，九價 2 劑。接種時採坐姿，接種後觀察 15–20 分鐘。</p>","p":"p344–345"},{"tag":"臨床做法","h":"流感疫苗：三類型，公費對象很廣","b":"<ul><li><b>IIV</b>（注射不活化，含雞蛋或細胞培養，另有高劑量 HD-IIV 給 65 歲以上）</li><li><b>RIV</b>（重組蛋白，不用雞蛋）</li><li><b>LAIV</b>（鼻噴活性減毒，2–18 歲健康者，孕婦與免疫不全者不適用）</li></ul><p>WHO 每年 2 月公布北半球建議株。B 型 Yamagata 自 2023–2024 流感季起已不納入。2026 年公費全面採三價（2 株 A、1 株 B）。</p><p>公費對象包含 6 個月至 18 歲、50 歲以上、慢性病者、BMI ≥ 30、孕婦、長照機構住民與工作人員、醫事與防疫人員等。滿 6 個月每年 1 劑，未滿 9 歲首次接種打 2 劑，間隔至少 4 週。</p>","p":"p345–347"},{"tag":"趨勢","h":"新冠疫苗：依當季流行株更新，目標是降低重症","b":"<p>策略已從基礎劑與追加劑，轉為依流行株更新疫苗。截至 2026 年 9 月，國內供應莫德納 LP.8.1 mRNA（6 個月以上）與 Novavax JN.1 蛋白質次單元（12 歲以上）；2026 年 10 月起先供應更新的莫德納 XFG（mNEXSpike，限 12 歲以上）。</p><p>5 歲以上原則 1 劑；6 個月至未滿 5 歲未接種過要 2 劑。心肌炎或心包膜炎極為罕見，出現胸痛、心悸、呼吸急促、暈厥要就醫。可與其他疫苗不同部位同時接種。高齡或特定免疫不全者可於前一劑隔至少 6 個月再打第 2 劑。</p>","p":"p347–348"},{"tag":"臨床做法","h":"輪狀病毒疫苗：口服活性減毒，有嚴格的時間窗","b":"<ul><li><b>Rotarix</b>（2 劑）：2、4 個月各 1 劑，最後 1 劑須在 24 週前完成。</li><li><b>RotaTeq</b>（3 劑）：2、4、6 個月各 1 劑，最後 1 劑須在 32 週前完成。</li></ul><p>第 1 劑最早滿 6 週，劑間最短 4 週。禁忌是嚴重複合型免疫不全（SCID）、曾有腸套疊或未矯正的先天腸胃道構造異常（如梅克爾憩室）。接種後腸套疊風險可能略增但極低，效益遠大於風險。台灣預計 2027 年起納入公費常規接種。</p>","p":"p348"},{"tag":"趨勢","h":"RSV 疫苗：三種上市，孕婦可打保護新生兒","b":"<div class=\"tbl\"><table><tr><th>疫苗</th><th>類型</th><th>適用</th></tr><tr><td>Arexvy</td><td>重組蛋白</td><td>60 歲以上，50–59 歲高風險</td></tr><tr><td>Abrysvo</td><td>重組蛋白</td><td>60 歲以上，18–59 歲高風險；孕 28–36 週，保護嬰兒出生後 6 個月內</td></tr><tr><td>mResvia</td><td>mRNA</td><td>60 歲以上，18–59 歲高風險</td></tr></table></div><p>皆為單劑肌肉注射。依目前建議，75 歲以上、60–74 歲有重症高風險因子、長照機構住民與符合適應症的孕婦可接種；50 歲以上可共享決策後接種，流行季前完成較佳。</p>","p":"p348–349"},{"tag":"臨床做法","h":"特殊族群：免疫不全者與醫療人員","b":"<ul><li><b>免疫不全</b>：不活化疫苗原則上照時程打；活性減毒要依感染風險與免疫抑制程度個別評估。嚴重細胞性缺損者不宜打任何活性減毒疫苗。HIV 一般不建議卡介苗與 OPV。家人與照顧者也要接種。</li><li><b>類固醇</b>：兒童每日 ≥ 2 mg/kg（或 10 公斤以上且每日 ≥ 20 mg）用不到 2 週，停藥 2 週後可打活性減毒；超過 2 週要停藥至少 1 個月。局部、吸入、關節內注射不受限。</li><li><b>醫療人員</b>：B 肝、每年流感、更新株 COVID-19；缺乏麻疹、腮腺炎、德國麻疹免疫證據者先驗抗體再補 MMR。</li></ul>","p":"p350–352"},{"tag":"臨床做法","h":"孕婦與出國：孕前補活性疫苗，出發前 4–8 週諮詢","b":"<ul><li><b>孕婦</b>：不活化疫苗孕期較安全，活性減毒原則上不在孕期打。孕前缺麻疹、德國麻疹、水痘免疫力者先補種，接種後至少避孕 4 週。孕期流感疫苗任何孕期可打；Tdap 與 RSV 疫苗在孕 28–36 週。</li><li><b>出國</b>：依目的地評估，常見 A 肝、B 肝、傷寒、日本腦炎、黃熱病、狂犬病、腦膜炎雙球菌。部分非洲與南美地區要黃熱病證明，去麥加朝覲要腦膜炎疫苗。建議出發前 4–8 週諮詢。</li></ul>","p":"p352–353"}],"recap":{"points":["疫苗用主動免疫原理，分活性減毒、不活化、次單元、結合型、DNA/RNA、重組載體；活性減毒疫苗不同時接種就要隔 28 天。","兒童常規疫苗有明確時程（卡介苗 5–8 個月、MMR 1 歲和 5 歲、JE 15 與 27 個月）；成人要留意肺炎鏈球菌改為單劑 PCV20/21、50 歲以上打 Shingrix 2 劑。","孕婦、免疫不全者、醫療人員與出國者各有原則：孕期避免活性減毒，免疫不全者活性減毒要個別評估，出國前 4–8 週諮詢。"],"quiz":[{"q":"兩種活性減毒疫苗沒有同一天接種，最短要間隔多久？","a":"至少 28 天，間隔不足的第 2 劑要重打。"},{"q":"接受肌肉注射免疫球蛋白或 HBIG 後，要隔多久才能接種 MMR、水痘或 JE？","a":"隔 3 個月。若是麻疹接觸者的預防性注射，則要隔 6 個月以上。"}]}},"22":{"posts":[{"tag":"定義","h":"化學預防：用藥物或生物製劑，在發病前先擋一手","b":"<p>化學預防（chemoprevention）是使用化合物或生物製劑，來預防疾病、降低罹病風險，或延後疾病出現。傳染病常用疫苗和預防性藥物，癌症領域也很重視。</p><p>在三段五級裡，它屬於初段預防的第二級，也就是特殊保護。腫瘤學還會用它降低治療後的復發風險，稱為二次化學預防（secondary chemoprevention）。</p>","p":"p358"},{"tag":"定義","h":"PrEP：還沒感染 HIV，但先每天吃藥築防線","b":"<p>接觸前預防（pre-exposure prophylaxis, PrEP）的對象是尚未感染、但有潛在風險的人。經醫師評估後固定服藥，遇到風險暴露時就能降低感染機率。</p><p>WHO 在 2015 年建議把 PrEP 納入全球愛滋防治，並和保險套、HIV 篩檢與風險諮詢、提供清潔針具一起使用。</p>","p":"p359"},{"tag":"研究","h":"PrEP 有效，但前提是你真的有吃","b":"<div class=\"stat\"><div><strong>44%</strong><span>男男性行為者感染機率下降</span></div><div><strong>67–75%</strong><span>高風險異性戀男女感染機率下降</span></div><div><strong>48.9%</strong><span>注射藥物者感染機率下降</span></div></div><p>服藥遵從性不佳會大幅削弱效果。真實世界研究中，30 歲以下和社經地位較低的族群特別看得到這個現象。</p>","p":"p359"},{"tag":"藥物","h":"從每天一顆到長效針劑，PrEP 的產品越來越多","b":"<p>2012 年 7 月美國 FDA 核准 FTC/TDF（Truvada）作為首選 PrEP 藥物，口服、一天一次、主要用於成人。</p><p>為了提升遵從性，後續有女性用的陰道環（DPV-VR），以及長效注射。2021 年 12 月 FDA 核准 Apretude（cabotegravir 長效注射），前兩劑間隔 1 個月，之後每 2 個月一次。</p>","p":"p359"},{"tag":"台灣指引","h":"台灣 PrEP 指引第三版：四種劑型，各有適用族群","b":"<div class=\"tbl\"><table><tr><th>劑型</th><th>族群</th><th>用法</th></tr><tr><td>TDF 300 mg + FTC 200 mg</td><td>高風險男男間性行為者與跨性別女性、血清相異伴侶的陰性方（強烈建議）；注射藥物者；高風險異性戀男女</td><td>每日 1 顆</td></tr><tr><td>TAF 25 mg + FTC 200 mg</td><td>體重 35 公斤以上的男男間性行為者與跨性別女性</td><td>每日 1 顆</td></tr><tr><td>CAB-LA 600 mg 肌肉注射</td><td>體重 35 公斤以上的男男間性行為者、跨性別女性、高風險異性戀者、血清相異伴侶的陰性方</td><td>每 8 週 1 次</td></tr><tr><td>dapivirine 25 mg 陰道環</td><td>高風險異性戀女性</td><td>每月使用</td></tr></table></div><p>2025 年 4 月修訂，PrEP 要搭配一般預防措施。</p>","p":"p359–360"},{"tag":"臨床做法","h":"需要時才吃的口服 PrEP：2 加 1 加 1","b":"<p>口服 Truvada 也可以依需要使用（event-driven / on-demand）：</p><ol><li>不安全性行為前 2 至 24 小時，服用 2 顆</li><li>服藥後 24 小時，服用 1 顆</li><li>服藥後 48 小時，再服用 1 顆</li></ol>","p":"p360"},{"tag":"必背","h":"PrEP 的禁忌與適用性，五件事先確認","b":"<ul><li>已確定感染、疑似感染或感染情況不明者，不建議使用</li><li>6 個月內沒有性行為、也沒有高風險注射行為，不建議使用</li><li>研究對象僅限成人，需年滿 18 歲</li><li>Truvada 在 CCr &lt; 60 mL/min 不建議；TAF/FTC 和 CAB-LA 在 CrCl &lt; 30 mL/min 不建議</li><li>沒有 HBV 抗原與抗體者，使用前先接種 B 型肝炎疫苗</li></ul><p>懷孕不是禁忌症，但臨床證據不足，需和病人討論風險與效益。</p>","p":"p360"},{"tag":"考點","h":"Truvada 的副作用，重點在 B 肝急性發作","b":"<p>常見副作用有頭痛、腹痛、體重減輕，通常用藥 1 個月後改善。</p><p>Truvada 對 B 型肝炎病毒有抑制作用，間斷使用或停藥可能讓慢性活動性 B 肝急性發作。B 肝帶原者要在用藥前檢測肝功能，用藥與停藥時都要追蹤肝功能，並留意急性肝炎症狀。</p>","p":"p360"},{"tag":"核心觀念","h":"潛伏結核感染：有菌但不發病、也不傳染","b":"<p>潛伏結核感染（latent tuberculosis infection, LTBI）是已感染結核菌，但免疫力夠、能把菌壓住，沒有症狀，也沒有傳染性。</p><div class=\"stat\"><div><strong>5–10%</strong><span>未治療者一生中發展成 TB 的機率</span></div><div><strong>約一半</strong><span>發病者在感染後 2 年內發病</span></div><div><strong>97%</strong><span>兒童及青少年完整治療加都治的保護力</span></div><div><strong>70%+</strong><span>成人的保護力</span></div></div><p>AIDS 等免疫功能異常者，由 LTBI 轉成 TB 的機率更高。</p>","p":"p361"},{"tag":"台灣做法","h":"高傳染性結核病患的接觸者，全年齡都可做 LTBI 檢查","b":"<p>自 2016 年 3 月 1 日起，台灣所有年齡層的高傳染性結核病患接觸者都能接受 LTBI 檢查。衛生單位依指標個案的傳染度，除了胸部 X 光，再決定是否做 LTBI 檢查，並開轉介單到指定院所。</p><p>為了避免偽陰性，要等和指標個案終止有效暴露滿 8 週後再檢查。</p>","p":"p361"},{"tag":"必背","h":"LTBI 診斷工具怎麼選：看年齡","b":"<ul><li><b>2 歲以上</b>：用 IGRA 抽血</li><li><b>未滿 2 歲</b>：用 TST</li><li><b>2 歲至未滿 5 歲</b>：無法做 IGRA 時，可改用 TST</li></ul><p>IGRA 是 2016 年 3 月 1 日引進台灣的丙型干擾素釋放試驗（interferon-gamma release assay）。</p>","p":"p361"},{"tag":"必背","h":"TST 陽性標準：硬結要摸，不要看紅斑","b":"<p>台灣用 PPD RT23 with Tween80（Mantoux test），注射後 48 至 72 小時觀察，以觸摸測量硬結大小，不要用表面紅斑判讀。</p><div class=\"tbl\"><table><tr><th>對象</th><th>陽性標準</th></tr><tr><td>曾接種卡介苗（BCG）的兒童或成人</td><td>硬結 ≥ 10 mm</td></tr><tr><td>未接種 BCG、免疫功能低下（HIV/AIDS、惡性腫瘤、器官移植）、使用免疫抑制藥物者</td><td>硬結 ≥ 5 mm</td></tr></table></div>","p":"p361–362"},{"tag":"考點","h":"TST 與 IGRA 的偽陽性、偽陰性陷阱","b":"<ul><li>BCG 接種史可能造成 TST 偽陽性</li><li>1 個月內接種活性疫苗可能造成偽陰性。PPD 可和活性疫苗同天接種，若疫苗先打，要等 4 至 6 週再做 PPD</li><li>IGRA 用結核菌特異抗原刺激淋巴球，量測丙型干擾素，抗原和 BCG、非典型結核菌不同，所以較少偽陽性</li><li>IGRA 與活性疫苗的交互作用研究不足，美國 CDC 建議可同天，先打疫苗則等 4 至 6 週</li></ul>","p":"p362"},{"tag":"臨床做法","h":"LTBI 治療處方（上）：9H 與 3HP","b":"<div class=\"tbl\"><table><tr><th>處方</th><th>用法</th><th>注意</th></tr><tr><td>9H</td><td>isoniazid 300 mg 每日，9 個月，共 270 劑</td><td>感覺異常、周邊神經炎、肝毒性。2 至 11 歲 INH 敏感者建議 9H；未滿 2 歲只建議 9H</td></tr><tr><td>3HP</td><td>isoniazid 900 mg + rifapentine 900 mg 每週，3 個月，共 12 劑</td><td>需簽同意書、加入都治由關懷員目視服藥；噁心、癢疹、腹痛、疲倦；孕婦或準備懷孕者不適合</td></tr></table></div>","p":"p362"},{"tag":"臨床做法","h":"LTBI 治療處方（下）：4R、3HR、1HP","b":"<div class=\"tbl\"><table><tr><th>處方</th><th>用法</th><th>注意</th></tr><tr><td>4R</td><td>rifampin 600 mg 每日，4 個月，共 120 劑</td><td>限 INH 抗藥但 RMP 敏感的接觸者，需加入都治；肝毒性、紅疹、疲勞</td></tr><tr><td>3HR</td><td>INH 300 mg + RMP 600 mg 每日，3 個月，共 90 劑</td><td>需加入都治；主要是肝毒性</td></tr><tr><td>1HP</td><td>INH 300 mg + RPT 600 mg 每日，共 28 次</td><td>13 歲以上 HIV 感染者及疾管署專案計畫</td></tr></table></div>","p":"p362–363"},{"tag":"臨床做法","h":"瘧疾沒有疫苗，靠防蚊加預防用藥","b":"<p>台灣目前沒有瘧疾疫苗可打，主要靠防蚊措施（如防蚊液）和預防用藥（chemoprophylaxis）。這些措施無法達到 100% 預防，從流行區回國後若不明原因發燒，要就醫並主動說明旅遊史。</p><p>建議至少出國前 1 個月到旅遊醫學門診評估。行程超過 3 個月，較不建議使用預防藥物。</p>","p":"p363"},{"tag":"必背","h":"台灣現有的瘧疾預防藥：三選一","b":"<div class=\"tbl\"><table><tr><th>藥物</th><th>用法</th><th>備註</th></tr><tr><td>Atovaquone/proguanil（Malarone）</td><td>每天 1 顆，出發前 1–2 天開始，離開流行區後再服 1 週</td><td>禁忌：嚴重腎功能缺損、孕婦哺乳婦女、未滿 5 公斤孩童</td></tr><tr><td>Mefloquine 250 mg</td><td>每週 1 顆，出發前 2 週開始，離開後再服 4 週</td><td>禁忌：癲癇、情緒性疾病史、心臟傳導異常；副作用有暈眩、失眠</td></tr><tr><td>Doxycycline 100 mg</td><td>每天 1 顆，出發前 1–2 天開始，離開後再服 4 週</td><td>易曬傷；禁忌：孕婦哺乳婦女、未滿 8 歲</td></tr></table></div>","p":"p363"},{"tag":"工具","h":"旅遊前門診：該問的事和三類疫苗","b":"<p>建議出發前至少 4 至 8 週就診。評估內容包括過去接種紀錄、目的地疫情、停留天數、旅遊型態、住宿與活動（如動物接觸）。</p><ul><li><b>例行性</b>（routine）：各國依疫情略有不同</li><li><b>選擇性或建議性</b>（selective / recommended）：依目的地與行程評估風險</li><li><b>強制性</b>（mandatory）：WHO 實際規定的只有黃熱病疫苗；沙烏地阿拉伯要求朝聖者接種腦脊髓膜炎疫苗</li></ul>","p":"p364"},{"tag":"必背","h":"化學預防的底線：益處要大於風險","b":"<p>使用預防性藥物或疫苗前，要針對不同族群和情境審慎評估傳染病風險。只有益處（benefits）大於風險（risks）時，才算真正帶來預防效益。</p>","p":"p364"}],"recap":{"points":["化學預防屬於初段第二級（特殊保護），用藥物或疫苗在發病前降低風險。","PrEP 與 LTBI 治療都要先排除已感染，再依族群、年齡、腎功能與肝炎狀態選處方，並確保服藥遵從性。","旅遊前至少提早 4 至 8 週諮詢；瘧疾靠防蚊加預防用藥，強制疫苗只有黃熱病一項。"],"quiz":[{"q":"2 歲以上的 LTBI 接觸者用什麼診斷？TST 陽性標準有哪兩種？","a":"2 歲以上用 IGRA。曾接種 BCG 者硬結 ≥ 10 mm，未接種 BCG 或免疫低下者硬結 ≥ 5 mm。"},{"q":"B 肝帶原者使用 Truvada 當 PrEP，要注意什麼？","a":"用藥前檢測肝功能，用藥與停藥時追蹤肝功能，因為間斷使用或停藥可能讓慢性活動性 B 肝急性發作。"}]}},"23":{"posts":[{"tag":"定義","h":"心血管疾病有四大面貌，共同基礎是動脈粥狀硬化","b":"<ol><li><b>冠狀動脈心臟病</b>（CHD）：心絞痛、心肌梗塞、心臟衰竭</li><li><b>腦血管疾病</b>：缺血性中風、暫時性腦缺血</li><li><b>周邊動脈疾病</b>（PAD）：間歇性跛行、下肢缺血</li><li><b>主動脈疾病</b>：主動脈硬化、胸腹主動脈瘤</li></ol><p>初級預防的目標，是避免心血管事件第一次發生，並減少隨之而來的失能。</p>","p":"p368"},{"tag":"工具","h":"什麼時候該評估心血管風險？機會性加系統性","b":"<p>初級預防要依整體心血管風險決定，10 年風險可用 ACC 的 ASCVD risk estimator 計算。</p><ul><li><b>機會性篩檢</b>（opportunistic）：病人因其他問題就醫時順便評估</li><li><b>系統性篩檢</b>（systematic）：依既定計畫定期評估</li></ul><p>多數指引建議兩者合併。有早發性冠心症家族史或家族性高膽固醇症者，要更積極系統性評估。男性小於 40 歲、女性小於 50 歲且無已知危險因子的低風險者，不建議常規系統性篩檢，用機會性評估即可。</p>","p":"p368–369"},{"tag":"核心觀念","h":"Aspirin 為什麼能防血栓：關掉血小板的 COX-1","b":"<p>血管內皮受傷或斑塊破裂後，血小板黏合、活化、聚集，並釋放 thrombin、血栓素（TXA2）與 ADP，吸引更多血小板，最後堵住血管。</p><p>Aspirin 把環氧化酶 COX-1 不可逆地乙醯化，減少 TXA2。血小板沒有細胞核，無法重新合成蛋白質，所以抑制效果持續整個血小板壽命，約 8 至 10 天。COX-2 則不會被強烈抑制。</p>","p":"p369–370"},{"tag":"必背","h":"Aspirin 劑量不同，作用不同","b":"<div class=\"tbl\"><table><tr><th>劑量</th><th>作用</th></tr><tr><td>低劑量 75–81 mg/天</td><td>主要抑制 COX-1，抗血栓</td></tr><tr><td>中劑量 650 mg–4 g/天</td><td>抑制 COX-1 與 COX-2，止痛解熱</td></tr><tr><td>高劑量 4–8 g/天</td><td>可作為抗發炎藥，治療風濕免疫疾病</td></tr></table></div>","p":"p370"},{"tag":"考點","h":"Aspirin 的副作用不只出血，老人還要看尿酸和腎功能","b":"<p>最常見是出血，尤其腸胃道出血或不適，消化不良、噁心、嘔吐約發生在 10 至 20% 的病人。</p><p>Aspirin 會降低腎功能、減少尿酸排出，增加痛風風險。這在老年人很常見，即使是低劑量，所以要追蹤尿酸與腎功能。禁忌症包括無法耐受、腸胃道出血史、消化性潰瘍，以及潛在的腸胃道或泌尿道出血。</p>","p":"p370"},{"tag":"必背","h":"Aspirin 初級預防：先算 CVD 風險，再算出血風險","b":"<p>USPSTF 用 ACC/AHA pooled cohort equations 預測 10 年內第一次心血管事件，包括非致命心肌梗塞、冠心症死亡、致命與非致命中風。比起 Framingham，多了糖尿病和種族兩項因子。</p><p>增加腸胃道出血風險的因子有：高劑量或長期使用、消化性潰瘍史、凝血異常、腎衰竭、嚴重肝病、血小板低下，以及合併抗凝血劑或 NSAID、血壓未控制、年齡增加、男性。目前沒有證據顯示腸溶錠或緩衝製劑能降低嚴重腸胃道出血。</p>","p":"p371"},{"tag":"必背","h":"USPSTF 2022：Aspirin 只剩 40–59 歲高風險者有小益處","b":"<div class=\"tbl\"><table><tr><th>年齡</th><th>建議</th><th>等級</th></tr><tr><td>40–59 歲，10 年風險 ≥ 10%</td><td>低劑量 aspirin 有小的淨益處</td><td>C</td></tr><tr><td>60 歲以上</td><td>不建議開始用於初級預防</td><td>D</td></tr></table></div><p>出血風險隨年齡上升。已在使用且沒出過血的人，約 75 歲左右可以考慮停用。</p>","p":"p371"},{"tag":"臨床做法","h":"Aspirin 的劑量與次級預防","b":"<p>初級預防的最適劑量沒有共識。每天 75 至 100 mg，或兩天一次 100 至 325 mg 都有益處，75 mg 效果與較大劑量相當，但腸胃道出血風險會隨劑量上升。建議 40 歲後開始評估，並定期重評。</p><p>已發生過心血管事件者（心肌梗塞、缺血性中風、冠狀動脈支架、ASCVD）應考慮長期低劑量 aspirin 75 至 100 mg/天作為次級預防，平均可減少約 20 至 25% 的嚴重血管事件。</p>","p":"p371–372"},{"tag":"臨床做法","h":"Clopidogrel：次級預防和 PCI 的主力，初級預防沒位置","b":"<p>Clopidogrel 不可逆地抑制血小板 ADP 受體（P2Y12），腸胃道出血風險比 aspirin 低。穩定抑制需 3 到 7 天，停藥後約需 5 天產生新血小板，大手術建議術前至少 5 天停藥。</p><ul><li>PCI 後 DAPT：慢性冠心病通常 6 個月，出血風險高可縮短為 1 至 3 個月</li><li>一般 ACS：至少 12 個月，出血風險高可縮短為 6 個月</li></ul><p>DAPT 期限要依缺血與出血風險個別調整，不是只看支架型式。</p>","p":"p372"},{"tag":"台灣數字","h":"台灣與東亞 CYP2C19 低功能變異多，clopidogrel 可能吃了不夠力","b":"<p>Clopidogrel 是前驅藥，需要 CYP2C19 活化。台灣與東亞族群 *2、*3 等低功能等位基因盛行率較高，抗血小板療效可能打折，個體差異大。</p><p>缺血風險高或需強效抗血小板的病人，可考慮做 CYP2C19 基因檢測，或改用較不受影響的 P2Y12 抑制劑，如 ticagrelor 或 prasugrel。</p>","p":"p372–373"},{"tag":"研究","h":"Statin 初級預防：40–75 歲，風險 ≥ 10% 是 B 級","b":"<p>USPSTF 的系統性回顧顯示，40 至 75 歲使用低至中劑量 statin 的相對風險：</p><div class=\"stat\"><div><strong>RR 0.86</strong><span>全死因死亡率</span></div><div><strong>RR 0.69</strong><span>心血管死亡</span></div><div><strong>RR 0.71</strong><span>缺血性中風</span></div><div><strong>RR 0.64</strong><span>心臟病發作</span></div></div><p>21 至 39 歲證據不足，無法給建議。LDL-C &gt; 190 mg/dL 或家族性高膽固醇症不適用此建議，指引強烈建議直接用 statin。</p>","p":"p373"},{"tag":"必背","h":"USPSTF Statin 建議：看風險等級與年齡","b":"<div class=\"tbl\"><table><tr><th>族群</th><th>建議</th><th>等級</th></tr><tr><td>40–75 歲，無 CVD，有一項以上危險因子，10 年風險 ≥ 10%</td><td>低至中劑量 statin</td><td>B</td></tr><tr><td>同上，10 年風險 7.5–10%</td><td>低至中劑量 statin</td><td>C</td></tr><tr><td>76 歲以上，無 CVD</td><td>證據不足</td><td>I</td></tr></table></div><p>危險因子指高血脂（LDL-C &gt; 130 或 HDL-C &lt; 40 mg/dL）、糖尿病、高血壓、吸菸。</p>","p":"p373–374"},{"tag":"必背","h":"台灣血脂共識：五級風險，五個 LDL-C 目標","b":"<div class=\"tbl\"><table><tr><th>風險</th><th>LDL-C 目標</th><th>代表族群</th></tr><tr><td>極高</td><td>&lt; 55 mg/dL</td><td>冠心病合併 1 年內心梗、≥ 2 次心梗、多支阻塞等</td></tr><tr><td>非常高</td><td>&lt; 70 mg/dL</td><td>確診 ASCVD、血管再通術後、斑塊狹窄 ≥ 50%</td></tr><tr><td>高</td><td>&lt; 100 mg/dL</td><td>糖尿病、慢性腎臟病、LDL-C ≥ 190、CAC ≥ 400</td></tr><tr><td>中</td><td>&lt; 115 mg/dL</td><td>兩項以上風險因子</td></tr><tr><td>低</td><td>&lt; 130 mg/dL</td><td>僅一項風險因子</td></tr></table></div>","p":"p374–375"},{"tag":"臨床做法","h":"依風險分級決定怎麼治療：低中風險先改生活型態","b":"<ul><li><b>初級預防，低至中風險</b>：先做 3 至 6 個月生活型態改變，未達標再經共享決策考慮中強度 statin</li><li><b>初級預防，高風險</b>：立即用藥，中至高強度 statin，或合併 ezetimibe，同時改善生活型態</li><li><b>次級預防</b>：直接積極藥物治療，預期單用 statin 達不到目標，可早期加上非 statin 藥物</li></ul><p>LDL-C 達標後，合併高三酸甘油脂、糖尿病或肥胖者，可把 Non-HDL-C 當次要目標，約為 LDL-C 目標加 30 mg/dL。</p>","p":"p375"},{"tag":"臨床做法","h":"Statin 不夠或不能用：ezetimibe、bempedoic acid、icosapent ethyl","b":"<ul><li><b>Ezetimibe</b>：抑制小腸吸收膽固醇。高風險者單用 statin 未達標可合併使用，完全不耐受 statin 時可替代</li><li><b>Bempedoic acid</b>：ATP 檸檬酸裂解酶抑制劑，在肝臟活化，較少肌肉副作用。LDL-C 降約 17 至 28%，CLEAR Outcomes 中對 statin 不耐受的高風險者，心血管事件風險下降（HR 0.87）</li><li><b>Icosapent ethyl</b>（高純度 EPA）：REDUCE-IT 顯示 2–4 g/天可減少心血管事件。適用已用 statin、TG ≥ 150 mg/dL 且 ASCVD 高風險者</li></ul>","p":"p375–376"},{"tag":"臨床做法","h":"糖尿病患者的 SGLT2i 初級預防：給高風險的人，不是人人必開","b":"<p>對尚無 ASCVD 的第二型糖尿病，指引建議高心血管風險者優先考慮有心血管保護證據的 SGLT2i 或 GLP-1 RA。高風險指標包括年齡 55 歲以上、多重危險因子，以及標的器官損傷（蛋白尿、eGFR &lt; 60、左心室肥大、視網膜病變）。</p><p>SGLT2i 預防心衰竭住院、延緩慢性腎病進展的效果，不論有沒有 ASCVD 都明確。非高風險者仍以生活型態和 metformin 為第一線。</p>","p":"p376"},{"tag":"核心觀念","h":"SGLT2i 與 GLP-1 RA：機轉不同，擅長的終點不同","b":"<ul><li><b>SGLT2i</b>：透過腎臟功能與血流動力學，減少心衰竭住院和腎病變進展</li><li><b>GLP-1 RA</b>：降血壓、改善血脂、減少血管發炎、減重，降低主要不良心血管事件（心梗、中風、心血管死亡）</li></ul><p>有心衰竭或慢性腎臟病，優先考慮 SGLT2i。預防心梗、中風等動脈粥狀硬化事件，兩者同等優先。有體重管理需求者特別適合 GLP-1 RA。</p>","p":"p377"},{"tag":"研究","h":"Colchicine：痛風老藥，用在心血管預防出現新證據","b":"<p>Colchicine 抑制微管聚合，影響單核球與巨噬細胞，降低 IL-1β 等促發炎因子，對應動脈粥狀硬化的慢性發炎。</p><div class=\"stat\"><div><strong>HR 0.77</strong><span>COLCOT：心梗後用 0.5 mg/天，事件風險下降約 23%</span></div><div><strong>HR 0.69</strong><span>LoDoCo2：慢性冠心病用 0.5 mg/天，再發風險下降</span></div></div><p>國際指引尚未列入常規初級預防。已有心血管疾病或高風險者，可考慮低劑量作為輔助選項。</p>","p":"p377–378"},{"tag":"台灣觀點","h":"亞洲人的心血管預防，要用在地的尺","b":"<ul><li>發病年齡年輕化，預防要前移，從兒童青少年就介入</li><li>Framingham、Pooled Cohort Equations 在不同族群預測力有差異，需要本土化風險模型</li><li>國健署建議成人 BMI 18.5 至 24，超過 24 為過重，27 為肥胖</li><li>BMI 正常但有高血壓、高血糖、高血脂或脂肪肝等代謝異常者，也視為高風險，及早介入</li></ul>","p":"p378"},{"tag":"趨勢","h":"AI 預測心血管風險：潛力大，但還在研究階段","b":"<p>AI 能整合基因體、電子病歷、影像與生活習慣，找出隱性風險，也能依個人條件給藥物與預防建議，搭配穿戴裝置做動態監測。</p><p>挑戰有三個：多數模型仍在研究階段、缺乏標準化與驗證；可解釋性不足，醫師難以信任；醫療人員需要更多教育訓練。</p>","p":"p378–380"}],"recap":{"points":["化學預防藥物要依整體風險、年齡、出血風險綜合決定，不能只看單一指標。","Aspirin 初級預防只對 40 至 59 歲、10 年風險 ≥ 10% 者有小益處（C 級），60 歲以上不建議開始（D 級）；Statin 是基石，台灣依五級風險設 LDL-C 目標。","SGLT2i 與 GLP-1 RA 優先給高風險糖尿病患者；colchicine 有證據但未列入常規初級預防；亞洲人需要本土化風險工具。"],"quiz":[{"q":"USPSTF 對 40–75 歲、有危險因子的人，10 年風險 ≥ 10% 與 7.5–10% 的 statin 建議等級各是什麼？","a":"風險 ≥ 10% 是 B 級，7.5 至 10% 是 C 級，都是使用低至中劑量 statin。"},{"q":"台灣血脂共識中，極高風險與高風險的 LDL-C 目標分別是多少？","a":"極高風險小於 55 mg/dL，高風險小於 100 mg/dL。"}]}},"24":{"posts":[{"tag":"核心觀念","h":"所有的茶都來自同一種植物，差別在發酵","b":"<p>茶葉全部來自山茶科山茶屬（Camellia sinensis）。製作時的發酵步驟，決定了香氣，也改變了多酚的結構與活性。</p><p>近年研究重點已從單純的抗氧化，轉向腸道菌相調節與表觀遺傳學（epigenetics）的影響。</p>","p":"p382–383"},{"tag":"定義","h":"茶的三大成分：茶多酚、茶胺酸、咖啡因","b":"<ul><li><b>茶多酚</b>：抗氧化與苦澀味的來源，兒茶素（catechin）約占其 80%，其中 EGCG 抗氧化活性最強</li><li><b>茶胺酸</b>（L-theanine）：鮮甜回甘的來源，能通過血腦屏障，增加腦內 GABA 與多巴胺，調節情緒與認知</li><li><b>咖啡因</b>：提神，但同體積含量比咖啡少</li></ul>","p":"p382–383"},{"tag":"台灣數字","h":"一杯茶有多少 EGCG 和咖啡因？","b":"<div class=\"stat\"><div><strong>50–100 mg</strong><span>1 杯綠茶的 EGCG（236.6 mL）</span></div><div><strong>64–112 mg</strong><span>1 杯紅茶的咖啡因</span></div><div><strong>29–53 mg</strong><span>1 杯烏龍茶的咖啡因</span></div><div><strong>24–39 mg</strong><span>1 杯綠茶的咖啡因</span></div></div><p>咖啡 1 杯約 72–130 mg。成人每天咖啡因不超過 300–400 mg，通常無健康危害。現泡熱茶多酚最高，速泡次之，冰茶與瓶罐茶較低，放久也會下降。</p>","p":"p383"},{"tag":"必背","h":"四大茶類，核心成分與強項各不同","b":"<div class=\"tbl\"><table><tr><th>茶類</th><th>發酵</th><th>核心成分</th><th>強項</th></tr><tr><td>綠茶</td><td>不發酵</td><td>兒茶素（EGCG）</td><td>抗氧化、減脂</td></tr><tr><td>烏龍茶</td><td>部分發酵</td><td>聚合多酚（OTPPs）</td><td>阻斷油脂吸收</td></tr><tr><td>紅茶</td><td>全發酵</td><td>茶黃素、茶紅素</td><td>保護血管、延緩澱粉分解</td></tr><tr><td>普洱茶</td><td>後發酵</td><td>茶褐素</td><td>降膽固醇、調節菌相</td></tr></table></div>","p":"p383–384"},{"tag":"臨床證據","h":"烏龍茶：抑制脂肪酶，也養腸道菌","b":"<p>OTPPs 是大分子多酚，進入血液的比例低，但在腸道內與脂肪和酵素結合的能力強，可抑制胰臟脂肪酶，減少油脂吸收。</p><p>第二型糖尿病患者以烏龍茶取代日常飲水，空腹血糖顯著下降，胰島素阻抗改善。研究也看到烏龍茶增加腸道阿克曼氏菌（Akkermansia muciniphila），與降低全身發炎和肥胖風險有關。</p>","p":"p383–384"},{"tag":"研究","h":"每天 3 杯紅茶、喝十年，中風風險約降 16–21%","b":"<p>每天飲用 3 杯以上紅茶超過十年，中風風險比不喝茶者低約 16 至 21%。紅茶的茶黃素還能抑制 α-葡萄糖苷酶，延緩澱粉分解成葡萄糖，讓餐後血糖更平穩。</p><p>普洱茶的茶褐素則能抑制具膽鹽水解酶活性的腸道細菌，活化肝臟 FXR 受體，促進膽固醇轉成膽酸排出。臨床試驗中，飲用普洱茶的腹部內臟脂肪面積比對照組顯著減少。</p>","p":"p384"},{"tag":"核心觀念","h":"茶保護心血管的三條路徑","b":"<ol><li>兒茶素與茶黃素促進一氧化氮生成，改善血管內皮功能</li><li>茶多酚減少 LDL 氧化，抑制動脈粥狀硬化</li><li>茶黃素與茶胺酸抑制血管收縮素轉化酶（ACE），幫助降血壓</li></ol><p>機轉上也推論紅茶多酚可減少血小板凝聚，並降低 CRP 等慢性發炎指標。</p>","p":"p384–385"},{"tag":"研究","h":"愛喝茶的人，心血管風險低 20%，死亡風險低 22%","b":"<div class=\"stat\"><div><strong>↓ 20%</strong><span>習慣性飲茶者心血管疾病相對風險</span></div><div><strong>↓ 22%</strong><span>習慣性飲茶者死亡相對風險</span></div><div><strong>-1.17</strong><span>綠茶使收縮壓平均下降 mmHg</span></div></div><p>綠茶效果最明顯，紅茶次之，可能與紅茶兒茶素流失及常加奶糖有關。綠茶也降低 LDL-C 與總膽固醇，對 HDL-C 無顯著影響。</p>","p":"p385"},{"tag":"考點","h":"茶與血糖：結果不一致，不能說喝茶就降糖","b":"<p>並非所有茶類都顯示降低糖尿病風險，同一茶類的研究結果也不一致。</p><ul><li><b>綠茶</b>：EGCG 活化肌肉細胞 AMPK 路徑，統合分析顯示可降空腹血糖，但短期對 HbA1c 與餐後血糖改善不一</li><li><b>紅茶</b>：強項是餐後血糖波動，靠茶黃素抑制 α-葡萄糖苷酶</li><li><b>烏龍茶</b>：OTPPs 同樣抑制 α-葡萄糖苷酶。8 週試驗中，糖尿病患者每天喝約 1500 mL，與空腹血糖改善相關</li></ul>","p":"p385"},{"tag":"核心觀念","h":"茶幫忙減重的四種機制","b":"<ol><li>抑制食慾：降低飢餓素（ghrelin），EGCG 可能促進 PYY 與 GLP-1 分泌</li><li>增加產熱：EGCG 抑制 COMT，延緩去甲腎上腺素降解，加上咖啡因協同</li><li>減少脂肪細胞增生分化，並抑制胰臟脂肪酶</li><li>改變腸道菌相：多酚促進 Akkermansia 等益生菌，經短鏈脂肪酸改善胰島素阻抗</li></ol>","p":"p385–386"},{"tag":"台灣數字","h":"EGCG 每天 300–600 mg，靜止代謝率約升 4–5%","b":"<p>2021 年統合分析指出，每天補充 300 至 600 mg EGCG（綠茶萃取物膠囊或浸泡液），可使靜止代謝率（REE）提升約 4 至 5%。搭配運動時，茶多酚能提高脂肪氧化率，有助減少腹部脂肪。</p><p>產熱是茶輔助減重證據較有力的一環。食慾抑制的體感則因人而異。</p>","p":"p386"},{"tag":"研究","h":"EGCG 抗發炎：從 NF-κB 到 CRP","b":"<p>EGCG 阻止 NF-κB 進入細胞核，減少 IL-6 轉錄，肝臟的發炎訊號變弱，CRP 隨之下降。統合分析顯示補充綠茶萃取物後：</p><div class=\"stat\"><div><strong>-0.5 ~ -1.2</strong><span>CRP 降幅 mg/L</span></div><div><strong>-0.3 ~ -0.8</strong><span>IL-6 降幅 pg/mL</span></div><div><strong>-0.4 ~ -0.6</strong><span>TNF-α 降幅 pg/mL</span></div></div><p>BMI &gt; 30 或發炎基線較高者，效果更明顯。茶多酚抗氧化與劑量呈正相關，但極高劑量可能促氧化，建議日常飲用，不要吃超高劑量補充劑。</p>","p":"p386"},{"tag":"研究","h":"綠茶與癌症：整體風險 RR 0.91，劑量有門檻","b":"<p>2025 年系統回顧納入 43 篇 RCT 與前瞻性研究，規律飲用綠茶或攝取 EGCG 補充劑，與整體癌症發病風險下降相關。</p><div class=\"stat\"><div><strong>0.91</strong><span>整體癌症 RR</span></div><div><strong>0.43</strong><span>前列腺癌</span></div><div><strong>0.44</strong><span>口腔癌與咽喉癌</span></div><div><strong>0.89</strong><span>大腸癌</span></div></div><p>乳癌為 0.82。每天約 200 至 400 mg EGCG 綠茶萃取物的預防相關性最強，但不同研究仍有差異，使用時間與劑量需更多研究。</p>","p":"p386–387"},{"tag":"研究","h":"茶與腦：失智風險與飲茶量呈負相關","b":"<p>回顧研究總結，飲茶量與失智症風險呈負相關，60 歲以上族群特別明顯。2025 年研究也推論 EGCG 可透過抑制神經發炎與腸腦軸對抗阿茲海默症。</p><p>情緒方面，L-茶胺酸促進腦部 α 波，並調節多巴胺、血清素與 GABA，有助緩解壓力與焦慮。</p>","p":"p387"},{"tag":"迷思","h":"空腹喝茶傷胃？看你的胃","b":"<p>兒茶素可能干擾胃黏膜保護層，咖啡因刺激 H2 受體增加胃酸、降低下食道括約肌壓力，單寧酸空腹時易與胃黏膜蛋白結合引起噁心。</p><p>健康族群空腹喝淡茶通常沒問題。胃敏感、胃食道逆流、有潰瘍病史者，建議避免空腹喝茶。</p>","p":"p387"},{"tag":"迷思","h":"茶會影響鐵吸收，孕婦、嬰幼兒、素食者要注意","b":"<p>單寧酸和兒茶素會和食物中的非血基質鐵結合成不溶沉澱，主要影響植物性食物和鐵劑。餐中喝 1 杯濃茶（約 150–200 mg 多酚），當餐非血基質鐵吸收率降低 60 至 70%，濃度越高抑制越強。</p><p>飲食均衡、鐵蛋白正常的健康成人，規律喝茶通常不會貧血。孕婦、嬰幼兒、素食者，以及鐵蛋白 &lt; 30 ng/mL 者，長期隨餐喝濃茶會明顯增加缺鐵性貧血風險。</p>","p":"p387–388"},{"tag":"迷思","h":"心律不整、腎臟病患者喝茶，各有注意事項","b":"<ul><li><b>心律不整</b>：多項統合分析顯示每日咖啡因約 &lt; 300 mg（約 2 至 3 杯茶）不會增加心房顫動風險。仍要注意藥物交互作用與低血鉀，避免濃茶、空腹、冰鎮或過燙茶飲</li><li><b>腎臟</b>：泡太久會釋出草酸，長期每天喝超過 1 公升濃紅茶可能造成草酸腎病。腎功能不全或反覆結石者，建議限制濃茶</li><li><b>血鉀</b>：茶湯每 100 mL 約含 15–30 mg 鉀，腎功能不全者有高血鉀風險。腎功能正常者大量喝茶反而因利尿有低血鉀可能</li></ul>","p":"p388"},{"tag":"臨床做法","h":"茶與藥物交互作用：warfarin、鐵劑、quinolone 要錯開","b":"<div class=\"tbl\"><table><tr><th>藥物</th><th>機轉</th><th>建議</th></tr><tr><td>Warfarin</td><td>茶中維生素K拮抗藥效，降低 PT/INR</td><td>穩定飲茶量，監測 INR</td></tr><tr><td>Nadolol、Atenolol</td><td>EGCG 抑制 OATP1A2，血中濃度可能降 20–50%</td><td>間隔 4 小時</td></tr><tr><td>鐵劑</td><td>單寧酸與多酚螯合成沉澱</td><td>與茶間隔至少 2 小時</td></tr><tr><td>Theophylline、Clozapine、Quinolones</td><td>咖啡因協同或代謝受抑制，易心悸、焦慮</td><td>減量，避免濃茶；戒茶或突然大量喝都要調藥量</td></tr></table></div>","p":"p388–389"},{"tag":"迷思","h":"熱茶養生？超過 65°C 是 2A 類致癌物","b":"<p>85 至 95°C 熱水沖泡，兒茶素與多酚溶出較多。但 IARC 已將超過 65°C 的熱飲列為 2A 類致癌物。2021 年研究顯示，每天喝超過 700 mL 且高於 60°C 的熱茶，與食道鱗狀細胞癌風險增加相關。</p><p>建議降到 65°C 以下再喝，避免食道風險。</p>","p":"p388–389"},{"tag":"迷思","h":"手搖飲的糖，會抵銷茶的好處","b":"<p>加入高果糖玉米糖漿或蔗糖，會抵消茶的抗氧化、減重與抗發炎益處。喝含糖茶者的 CRP 與 IL-6 明顯高於無糖茶，糖分活化 NF-κB，果糖也促進肝臟脂質新生，使內臟脂肪堆積。</p><p>減害做法是分階段降糖、改選無糖、移除配料、避免果糖。日常喝茶的關鍵就是無糖與適量。</p>","p":"p389–390"}],"recap":{"points":["茶都來自山茶屬，發酵程度決定核心活性成分：綠茶 EGCG、烏龍 OTPPs、紅茶茶黃素、普洱茶褐素。","證據支持適量喝茶有助心血管、體重、發炎與情緒，但血糖與癌症的研究結果仍不一致。","風險要點：空腹、隨餐影響鐵吸收、草酸與血鉀、藥物交互作用、超過 65°C 熱茶，以及含糖飲料。"],"quiz":[{"q":"哪些人要特別避免隨餐喝濃茶？原因是什麼？","a":"孕婦、嬰幼兒、素食者與鐵蛋白低於 30 ng/mL 者。茶中單寧酸與兒茶素會與非血基質鐵結合，增加缺鐵性貧血風險。"},{"q":"飲茶溫度建議多少以下？依據是什麼？","a":"降到 65°C 以下。IARC 將超過 65°C 的熱飲列為 2A 類致癌物。"}]}},"25":{"posts":[{"tag":"核心觀念","h":"沒有兩杯完全相同的咖啡，所以證據多來自觀察性研究","b":"<p>咖啡成分會隨品種、種植、後製、儲存、烘焙、研磨與沖煮方式而變，同一來源也難有完全相同的一杯。因此咖啡與健康的證據，主要來自觀察性研究。</p><p>全球 99% 的咖啡消費來自兩個品種：阿拉比卡（Coffea arabica）與羅布斯塔（Coffea canephora）。</p>","p":"p394–395"},{"tag":"定義","h":"咖啡的六種關鍵成分，各自受不同因素左右","b":"<ul><li><b>咖啡因</b>（caffeine）：含量隨品種與沖煮條件變動</li><li><b>綠原酸</b>（chlorogenic acid, CGA）：隨烘焙程度明顯變化</li><li><b>葫蘆巴鹼</b>（trigonelline）</li><li><b>咖啡醇</b>（cafestol）與<b>咖啡豆醇</b>（kahweol）：二萜類，杯中濃度取決於是否紙濾</li><li><b>類黑素</b>（melanoidins）</li></ul><p>這些差異可能解釋不同咖啡型態的研究結果為何不一致。</p>","p":"p395"},{"tag":"研究","h":"每天喝 2 到 4 杯，全因死亡風險較低","b":"<div class=\"stat\"><div><strong>-13%</strong><span>每日 3 杯，全因死亡風險（2019），含咖啡因與低咖啡因相近</span></div><div><strong>-24% / -28%</strong><span>亞洲男 / 女每日至少 5 杯</span></div><div><strong>-18%</strong><span>糖尿病患者最高攝取組全因死亡</span></div></div><p>2019 年另一項統合分析顯示，每日 2 至 4 杯與全因、心血管與癌症死亡風險較低相關。英國生物資料庫逾 44 萬人，每日 2 至 3 杯即溶、研磨或低咖啡因咖啡，都與全因死亡率降低相關。</p>","p":"p395–396"},{"tag":"考點","h":"咖啡與癌症：多數是無關或降低，IARC 在 2016 年改列第 3 類","b":"<p>IARC 於 2016 年把咖啡調整為第 3 類（無法歸類為對人類致癌）。但超過 65°C 的非常燙飲料可能增加食道癌風險，關鍵是反覆熱傷害，不是咖啡成分。</p><div class=\"stat\"><div><strong>-18%</strong><span>BMJ 傘狀回顧：高 vs 低攝取，癌症發生風險</span></div><div><strong>-24%</strong><span>高 vs 低攝取，癌症進展風險</span></div></div><p>每天超過 2 杯無糖咖啡者，癌症發生與死亡風險較低（英國生物資料庫）。</p>","p":"p396"},{"tag":"必背","h":"2020–2025 統合分析：哪些癌症風險降低，哪些存疑","b":"<ul><li><b>風險減少</b>：口腔癌、食道癌、甲狀腺癌、乳癌、胃癌、肝癌、大腸直腸癌、子宮內膜癌、皮膚癌、攝護腺癌、腎臟癌、神經膠質瘤</li><li><b>無關</b>：喉癌、胰臟癌、卵巢癌、淋巴癌等</li><li><b>增加</b>：肺癌、膀胱癌、白血病</li></ul><p>各癌種結果在不同研究間並不一致。肺癌的風險升高被認為多受吸菸等混雜因素影響，不是咖啡本身致癌。整體仍以「無關或降低」居多。</p>","p":"p396–397"},{"tag":"研究","h":"心血管疾病：每天 3 到 5 杯風險最低，重度飲用不增加風險","b":"<p>36 篇前瞻性世代、逾 120 萬人的統合分析顯示，咖啡與心血管疾病呈非線性關係，每日 3 至 5 杯最低。重度飲用者沒有額外保護，也沒有風險上升。</p><p>2021 年 ESC 預防指引提到，每日 3 至 4 杯可能無害，甚至有中度益處。但也有分析發現咖啡與冠心病並無顯著相關，且可能有性別差異，男性風險或較高，女性可能降低。</p>","p":"p397"},{"tag":"研究","h":"心衰竭：適量有益，每天超過 6 杯可能反轉","b":"<p>早期統合分析顯示，每日 4 杯（每杯 150 mL）心衰竭風險最低。英國生物資料庫顯示每日 1 至 4 杯風險顯著較低，但超過 6 杯風險可能不降反升。</p><p>FHS、CHS、ARIC 觀察到較高咖啡與咖啡因攝取與心衰竭風險降低相關，低咖啡因咖啡則無此關聯。針對男性醫師與中老年婦女的研究則未發現明確相關。</p>","p":"p397"},{"tag":"迷思","h":"咖啡會導致高血壓嗎？長期喝，沒有一致的關聯","b":"<p>13 項世代、逾 31 萬人的統合分析顯示，咖啡與高血壓風險沒有顯著關聯。推測咖啡因短暫升壓的效果，被綠原酸與礦物質的血管保護作用抵消。</p><p>另一項分析中，世代研究高攝取者風險降低約 7%，橫斷面研究約 21%。這個保護作用在美國研究較一致，歐洲與亞洲多無關，可能與咖啡種類、沖泡方式和 CYP1A2 基因多型性有關。</p>","p":"p397–398"},{"tag":"考點","h":"咖啡會讓血脂上升，煮沸未過濾的影響最明顯","b":"<ul><li>12 項 RCT 統合分析：咖啡與總膽固醇、三酸甘油酯、LDL-C 上升相關，有劑量反應，每日超過 6 杯更明顯，控制在每日 3 杯以下較有利</li><li>煮沸未過濾咖啡比過濾咖啡更不利，推測與咖啡豆油脂（咖啡醇）保留較多有關</li><li>英國生物資料庫逾 36 萬人：咖啡量與 LDL-C、總膽固醇、ApoB 正相關，孟德爾隨機化支持因果可能</li><li>台灣生物資料庫：咖啡飲用者 TC、LDL-C、HDL-C 較高，TG 較低；男性與停經後女性的 TC 與 LDL-C 增加更多，提示雌激素可能參與</li></ul>","p":"p398"},{"tag":"迷思","h":"咖啡因會引起心律不整？大型證據不支持","b":"<div class=\"stat\"><div><strong>無顯著</strong><span>逾 36 萬人統合分析：即使每日超過 5 杯，心房顫動風險也未上升</span></div><div><strong>-2%</strong><span>逾 72 萬人：每多 1 杯，心房顫動風險</span></div><div><strong>-3%</strong><span>英國生物資料庫：每多 1 杯，快速性心律不整風險</span></div></div><p>孟德爾隨機化也支持咖啡因代謝能力本身不會增加快速性心律不整風險。</p>","p":"p398–399"},{"tag":"研究","h":"第二型糖尿病：多喝一杯，風險約降 8%（亞洲）","b":"<p>多數流行病學研究一致顯示，咖啡與第二型糖尿病風險降低相關。亞洲 7 項長期追蹤、逾 14 萬人，每日每多 1 杯，風險約降 8%，男女皆見。</p><p>但加了東西會打折：加糖或代糖明顯削弱保護關聯，奶精有削弱趨勢但未達顯著，加鮮奶油則不影響。妊娠糖尿病與大量飲用咖啡無顯著關聯。</p>","p":"p399"},{"tag":"台灣研究","h":"台灣生物資料庫：男性喝黑咖啡，代謝症候群才較少","b":"<p>代謝症候群的統合分析未見顯著關聯，可能因研究數量少與種族異質性大。</p><p>台灣生物資料庫顯示，女性每天喝 1 杯以上，不論黑咖啡、奶精咖啡或牛奶咖啡，代謝症候群盛行率都較低。男性則只有黑咖啡有此關聯，推測添加物會抵銷保護作用，男性對添加物的負面影響可能更敏感。</p>","p":"p399"},{"tag":"迷思","h":"咖啡傷胃？潰瘍和逆流的證據沒那麼強","b":"<ul><li><b>消化性潰瘍</b>：咖啡會刺激胃泌素、增加胃酸，但多數研究顯示與潰瘍風險無顯著關聯，主因仍是 NSAIDs、幽門螺桿菌與吸菸</li><li><b>胃食道逆流</b>：理論上會降低下食道括約肌壓力。多數大型統合分析未發現顯著關聯，少數研究顯示每日 ≥ 6 杯時症狀風險約上升 10 至 40%，肥胖、高脂飲食等是更強風險因子</li><li><b>胰臟炎</b>：與較低風險相關，尤其酒精性胰臟炎</li></ul>","p":"p400"},{"tag":"研究","h":"肝臟：咖啡可能保護，對脂肪肝纖維化最一致","b":"<p>咖啡與肝功能指標（AST、ALT）的結果不一致，但可能與脂聯素上升相關。非酒精性脂肪肝（NAFLD）發生風險的研究結果不一，但咖啡與 NAFLD 患者肝纖維化風險降低有顯著關聯。肝硬化方面，僅早期統合研究提到每日 2 杯風險約降近一半。</p><p>推測機轉包括咖啡因與綠原酸活化 AMPK、抗氧化抗發炎、抑制 TGF-β 的抗纖維化效果，以及調節腸道菌相。</p>","p":"p400–401"},{"tag":"研究","h":"神經系統：失智、帕金森氏症、中風都偏向保護","b":"<ul><li><b>認知與失智</b>：每日小於 2.8 杯與認知障礙風險降低相關，小於 2.3 杯與失智風險降低相關</li><li><b>阿茲海默症</b>：每日 1 至 4 杯風險較低，超過 4 杯可能上升</li><li><b>帕金森氏症</b>：每日約 3 杯相關性最明顯，但孟德爾隨機化未支持因果</li><li><b>中風</b>：每日 3 至 4 杯風險約降 21%，缺血性中風保護較明顯</li></ul>","p":"p401"},{"tag":"研究","h":"骨骼與關節：骨質疏鬆沒問題，關節炎要留意","b":"<ul><li>20 項觀察性研究逾 50 萬人：即使停經後婦女，喝咖啡也未見骨密度降低或髖部骨折風險增加。每日 5 杯以上可能與骨密度下降相關</li><li>類風濕性關節炎：最高攝取者風險約增 30%，低咖啡因咖啡更明顯（增約 89%）</li><li>退化性關節炎：孟德爾隨機化提示可能有因果，以膝關節最明顯，低咖啡因咖啡相關性最強</li></ul>","p":"p402"},{"tag":"研究","h":"腎臟與結石：不是脫水的元兇","b":"<p>咖啡與慢性腎臟病風險降低相關。每日適量飲用咖啡（含咖啡因或低咖啡因）與尿路結石風險降低 10 至 31% 相關，孟德爾隨機化研究支持可能有因果。這些證據不支持「咖啡因造成脫水所以要避免」的舊觀念。</p><p>糖尿病患者在清晨至上午喝咖啡，與較低慢性腎臟病風險相關，中午以後或夜間喝則相關風險上升。</p>","p":"p403"},{"tag":"必背","h":"孕婦的咖啡因上限，各國不太一樣","b":"<div class=\"tbl\"><table><tr><th>機構</th><th>建議</th></tr><tr><td>世界衛生組織</td><td>每日高於 300 mg 時應降低攝取</td></tr><tr><td>英國 NHS、美國 ACOG</td><td>每日不超過 200 mg（約 1 杯 12 盎司咖啡）</td></tr><tr><td>台灣食藥署</td><td>孕婦避免攝取咖啡因</td></tr><tr><td>台灣國健署</td><td>每日不超過 200 mg，懷孕前 3 個月盡量減少</td></tr></table></div><p>觀察性研究顯示孕期每多 1 杯，流產風險約增 3%，但孟德爾隨機化未支持咖啡與流產、死產、早產相關。</p>","p":"p403"},{"tag":"必背","h":"兒童與青少年的咖啡因建議","b":"<div class=\"tbl\"><table><tr><th>機構</th><th>建議</th></tr><tr><td>美國兒童青少年精神醫學會</td><td>12 歲以下避免；12 至 18 歲每日最多 100 mg</td></tr><tr><td>加拿大衛生部</td><td>未滿 18 歲每日上限 2.5 mg/kg</td></tr><tr><td>英國、歐洲 EFSA、澳紐</td><td>3 mg/kg</td></tr><tr><td>台灣食藥署</td><td>12 至 18 歲 100 mg 以內；12 歲以下避免</td></tr></table></div><p>最明顯的負面影響是睡眠干擾：縮短總睡眠時間、延遲入睡。</p>","p":"p404"},{"tag":"臨床做法","h":"咖啡因也有代價：睡眠，以及加糖奶精後的肥胖風險","b":"<p>咖啡因會延長入睡時間、降低深度睡眠、減少快速眼動睡眠，影響睡眠品質。</p><p>肥胖方面，逾 20 萬成人的統合分析顯示咖啡量與一般性及腹部肥胖並無顯著相關，但亞裔與女性高攝取者的一般性肥胖風險較高，推測與常加糖或奶精有關。</p>","p":"p404"}],"recap":{"points":["適量咖啡與較低全因死亡風險相關，也可能對心血管疾病、第二型糖尿病、部分癌症、肝臟疾病、中風與神經退化性疾病有保護關聯。","未過濾或高量攝取可能使血脂上升，加糖或奶精可能削弱益處，睡眠敏感者與胃食道逆流患者可能不適。","衛教以咖啡因總量為核心：多數國家建議成人每日不超過 400 mg，台灣食藥署建議不超過 300 mg，孕婦與兒童要更保守，並搭配是否過濾、加糖與飲用時間個別化建議。"],"quiz":[{"q":"咖啡與血脂的關係為何？哪種沖煮方式影響較大？","a":"咖啡與總膽固醇、TG、LDL-C 上升相關，每日超過 6 杯更明顯。煮沸未過濾咖啡比過濾咖啡更不利，與咖啡醇等油脂成分有關。"},{"q":"台灣食藥署對成人與孕婦、12 至 18 歲青少年的咖啡因建議各是什麼？","a":"成人每日不超過 300 mg，孕婦避免攝取，12 至 18 歲在 100 mg 以內，12 歲以下避免。"}]}},"26":{"posts":[{"tag":"台灣數字","h":"台灣 2025 年進入超高齡社會，目標從延壽轉向延長健康壽命","b":"<p>台灣於 2025 年跨入超高齡社會門檻，65 歲以上人口比例突破 20%。但壽命變長不等於健康變好，增加的餘命常伴隨多重共病與功能失能。</p><p>醫學焦點因此從單純治療疾病，轉向優化「健康壽命」，也就是能維持功能完整、沒有重大疾病的時間。</p>","p":"p412"},{"tag":"核心觀念","h":"老年科學假說：老化本身就是多種疾病的共同上游","b":"<p>化學預防（chemoprevention）一詞由 Michael B. Sporn 於 1976 年提出，指用天然或合成物質介入病理過程，預防或延緩疾病。</p><p>老年醫學中，這個概念從針對單一器官疾病，轉為針對老化的基礎機轉，也就是老年科學假說（geroscience hypothesis）：老化是多種退化性疾病的共同根本危險因子。若能延緩生物老化，就有機會同時預防多種老年疾病。</p>","p":"p412"},{"tag":"定義","h":"生物年齡比時序年齡更會預測風險","b":"<p><b>時序年齡</b>（chronological age）只記錄出生以來的時間，是不可改變的常數。<b>生物年齡</b>（biological age）反映全身細胞、組織與器官的功能狀態及生理儲備。</p><p>生物老化速度受遺傳、環境壓力（如空氣污染、輻射）、生活型態（飲食、睡眠、運動）與長期心理壓力影響。生物年齡比時序年齡更能預測老年退化性疾病風險與全死因死亡率。臨床上要找出「加速老化」的人（如監測握力、步態、CRP），並介入可調整的風險因子。</p>","p":"p413"},{"tag":"必背","h":"老化指標 Hallmarks of Aging：三個層次、十二項","b":"<div class=\"tbl\"><table><tr><th>層次</th><th>指標</th><th>角色</th></tr><tr><td>初級</td><td>基因不穩定、端粒耗損、表觀遺傳變動、蛋白質穩態喪失、巨自噬功能障礙</td><td>老化的根源損害</td></tr><tr><td>對抗性</td><td>營養感測失調、粒線體功能障礙、細胞衰老</td><td>起初保護，長期過度激活轉為致病</td></tr><tr><td>統合性</td><td>幹細胞耗盡、慢性發炎、細胞間通訊改變、腸道菌群失調</td><td>系統性後果，驅動衰弱與共病</td></tr></table></div>","p":"p413–414"},{"tag":"核心觀念","h":"地中海飲食：研究最透徹的老年保護飲食","b":"<p>核心是大量蔬果、全穀、堅果與特級初榨橄欖油，搭配適量魚類與極少紅肉。長期研究都指向同一點：天然、完整、低加工的植物性食物，並嚴格限制紅肉、加工肉與精製糖。</p><div class=\"stat\"><div><strong>10–20%</strong><span>全因死亡率降低</span></div><div><strong>11–30%</strong><span>老年認知障礙風險降低</span></div><div><strong>HR 0.70</strong><span>阿茲海默症</span></div></div>","p":"p414"},{"tag":"台灣研究","h":"台灣萬人研究：吃健康植物性飲食，老得比較慢","b":"<p>植物導向飲食涵蓋純素、各類素食、DASH 與北歐飲食等。一項台灣逾一萬人的大型研究顯示，高度遵循健康植物性飲食指數（hPDI，強調全穀、蔬果、堅果、豆類），能顯著降低進入中度或高度加速老化軌跡的機率，減緩生物老化速度，並降低全死因死亡風險。</p>","p":"p414–415"},{"tag":"研究","h":"CALERIE：少吃 12%，兩年後老化速度真的變慢","b":"<p>CALERIE 隨機對照試驗中，非肥胖成人維持兩年適度熱量限制（約減少 12% 能量攝取），即使排除體重減輕的影響，DNA 甲基化老化鐘（如 DunedinPACE）仍顯示生物老化速度顯著減緩。</p><p>機轉是上調細胞自噬與 DNA 修復，並下調全身性發炎，與老化核心指標緊密連結。</p>","p":"p415"},{"tag":"必背","h":"斷食介入的五種模式","b":"<div class=\"tbl\"><table><tr><th>模式</th><th>做法</th></tr><tr><td>熱量限制</td><td>長期每日減少 20–40% 總能量，不改變進食頻率</td></tr><tr><td>隔日斷食</td><td>24 小時只喝水，與 24 小時自由進食交替</td></tr><tr><td>5:2 斷食</td><td>每週 5 天自由進食，另 2 天熱量限制在 500–700 大卡</td></tr><tr><td>限時進食</td><td>進食窗口 6–12 小時，斷食 12–18 小時</td></tr><tr><td>擬斷食（FMD）</td><td>每月連續 5 天低熱量計畫，為平時的 30–50%</td></tr></table></div><p>初步證據顯示可提升胰島素敏感性、減少腹部脂肪。</p>","p":"p415"},{"tag":"臨床做法","h":"高齡者限制熱量要很謹慎，蛋白質和阻力訓練不能少","b":"<p>FMD 是以植物性食物為主、低蛋白、低熱量的飲食，通常每月或更低頻率連續五天。</p><p>但高齡族群或有慢性病者實施能量限制，不當的限制可能引發營養不良、肌少症與衰弱症。臨床上必須確保足量蛋白質攝取，並搭配阻力訓練維持肌肉量。</p>","p":"p415–416"},{"tag":"研究","h":"微量營養素：缺乏者獲益最大，充足者不要亂補","b":"<p>維生素 C、D、E、B 群、硒、鋅、鎂與類胡蘿蔔素缺乏，與氧化壓力上升、DNA 修復受損、生物老化加速有關。補充抗氧化維生素、礦物質與 GlyNAC（glycine 加 N-acetylcysteine）可改善老化生物標記、粒線體功能、肌力與認知。</p><p>COSMOS 試驗顯示，每日綜合維生素可延緩認知老化約兩年，有心血管病史者特別明顯。營養充足者例行補充的效益不明，劑量不當（如維生素 A、E、硒過量）可能有風險，要個別化。</p>","p":"p416"},{"tag":"趨勢","h":"老年保護劑：metformin 與 rapamycin 領跑","b":"<ul><li><b>Metformin</b>：活化 AMPK、抑制 mTORC1，減輕發炎與細胞衰老。第二型糖尿病患者觀察性研究與降低全死因死亡、心血管風險相關。TAME 試驗正在測試非糖尿病長者能否延緩多重共病</li><li><b>Rapamycin</b>：即使在生命晚期介入，也能延長多種生物的壽命與健康壽命。低劑量間歇給藥早期研究顯示可改善高齡者免疫反應，仍需大型第三期試驗確立劑量與安全性</li></ul><p>目前已有超過 40 項針對老化指標的臨床試驗進行中。</p>","p":"p416–417"},{"tag":"趨勢","h":"下一步：老年診斷標記與精準組合療法","b":"<p>其他研究中的老年保護劑包括 NAD+ 前驅物、spermidine、SGLT2 抑制劑、acarbose，以及 senolytics（如 fisetin、dasatinib 加 quercetin），早期研究顯示安全性良好，可能改善血管順應性並降低衰老細胞負荷。</p><p>轉入臨床常規的最大障礙是缺乏可靠的生物老化標記，因此正在開發老年診斷標記（gerodiagnostics）。未來會走向經老年診斷驗證的精準組合療法。</p>","p":"p417"},{"tag":"臨床做法","h":"失智症預防：多領域介入最有效，MIND 飲食是核心","b":"<p>FINGER 研究證實，整合飲食、規律運動、認知訓練與血管風險因子管理，能顯著降低高風險高齡者的認知衰退率。多重風險因子或早期認知障礙者獲益更大，介入強度與依從性是關鍵。</p><p>MIND 飲食（地中海加 DASH）要求每週至少 6 份綠葉蔬菜、2 份以上莓果與堅果，限制紅肉與甜食。高度遵循者認知老化速度顯著減緩，相當於大腦年輕 7.5 歲。但 PREDIMED 等 RCT 顯示，短期或低風險族群效果可能不顯著，長期或高風險族群才能最大化。</p>","p":"p417"},{"tag":"考點","h":"失智症的營養補充：不是人人都有效","b":"<ul><li><b>Omega-3（DHA、EPA）</b>：僅在輕度認知障礙有效，可改善情節記憶與執行功能，對確診阿茲海默症幾乎無效</li><li><b>維生素 B6、B12、葉酸</b>：針對血中同半胱胺酸偏高者，VITACOG 研究顯示可減緩腦部萎縮速度</li></ul><p>臨床諮詢應以 MIND 飲食加規律運動與認知訓練的多領域策略為主，不要仰賴單一補腦藥品。</p>","p":"p417–418"},{"tag":"必背","h":"老年性黃斑部病變：戒菸第一，AREDS2 只給中晚期","b":"<p>吸菸讓 AMD 風險增為三倍，戒菸可部分逆轉。地中海飲食與降低進展為晚期 AMD 的風險相關。</p><p>中期 AMD（單眼或雙眼），或單眼已進展到晚期者，建議每日口服 AREDS2 配方，降低惡化為晚期與嚴重視力喪失的風險。</p><div class=\"tbl\"><table><tr><th>成分</th><th>劑量</th></tr><tr><td>維生素 C</td><td>500 mg</td></tr><tr><td>維生素 E</td><td>400 IU</td></tr><tr><td>鋅</td><td>80 mg</td></tr><tr><td>銅</td><td>2 mg</td></tr><tr><td>葉黃素 / 玉米黃素</td><td>10 mg / 2 mg</td></tr></table></div>","p":"p418"},{"tag":"考點","h":"AREDS2 為何拿掉 β-胡蘿蔔素？以及何時不該補","b":"<p>β-胡蘿蔔素可能增加吸菸者罹患肺癌的風險，所以 AREDS2 移除，改用葉黃素與玉米黃素。這兩者累積在黃斑部形成黃斑色素，過濾高能量藍光，並作為局部抗氧化劑。</p><p>尚未罹患 AMD 或僅早期者，沒有證據支持用補充劑做初級預防。Omega-3 補充劑與其他營養素在 RCT 與統合分析中，也未顯示對 AMD 預防或進展有長期益處。建議多吃魚、蔬菜與全穀，不要對一般大眾無差別推薦。</p>","p":"p418"},{"tag":"臨床做法","h":"骨質疏鬆預防：先靠運動，鈣與維生素 D 要抓區間","b":"<ul><li>負重與阻力運動、預防跌倒、戒菸、限制酒精</li><li><b>鈣</b>：以飲食為首選，每日總量（飲食加補充劑）1,000 至 1,200 mg。超過 1,200 至 1,500 mg 沒有額外益處，反而可能增加腎結石或心血管疾病風險</li><li><b>維生素 D</b>：每日 600 至 1,000 IU（部分指引 800 至 1,000 IU），維持血清 25(OH)D 在 30 至 50 ng/mL，也有助預防跌倒與骨折</li></ul>","p":"p418–419"},{"tag":"臨床做法","h":"退化性關節炎：控制體重和保護關節，是證據最強的預防","b":"<p>目前證據等級最高、最有效的預防手段，是避免關節過度使用及維持理想體重。多數治療（消炎止痛藥或手術）只在緩解症狀。</p><p>AAOS 指出，薑黃、生薑萃取物、維生素D、葡萄糖胺與軟骨素可能減輕輕至中度膝關節炎的疼痛並改善功能，但證據不一致、品質僅低至中度，尚無任何藥物被推薦用於預防或修正病程。</p>","p":"p419"},{"tag":"臨床證據","h":"關節炎補充劑：薑黃效果接近 NSAIDs，但都不是修正病程","b":"<ul><li><b>薑黃素</b> 每日 500–1500 mg：改善疼痛、功能與僵硬，效力與 NSAIDs 相當，副作用風險更低</li><li><b>生薑萃取物</b> 每日 0.5–3 g：止痛有小幅但具統計意義的效益</li><li><b>葡萄糖胺 1500 mg 或軟骨素 1200 mg</b> 每日：關節腔狹窄等結構指標有微幅進展，可能 2 至 8 週見效，副作用風險低</li><li><b>維生素 D</b> 每日超過 2000 IU：能改善疼痛，但對結構與病程進展無一致證據</li></ul><p>這些只當症狀管理輔助，不建議作為第一線或病程修正療法。</p>","p":"p419–420"},{"tag":"工具","h":"階梯式預防策略，三步走","b":"<ol><li>以地中海、MIND 等植物導向飲食、適度熱量限制與規律運動，作為維持健康壽命的基礎</li><li>針對高風險族群提供證據明確的營養藥理介入，例如防止 AMD 惡化的 AREDS2，或針對認知與骨質代謝精準補強</li><li>審慎觀察 metformin、rapamycin 等潛在老年保護劑的臨床轉化</li></ol>","p":"p420"}],"recap":{"points":["老年科學假說認為老化本身是多種退化性疾病的共同上游，12 項老化指標分初級、對抗性、統合性三層，可作為跨疾病的預防標靶。","飲食（地中海、MIND、植物導向）與適度熱量限制是證據最廣的基礎策略，高齡者要顧好蛋白質與阻力訓練；metformin、rapamycin 等老年保護劑仍在研究中。","各疾病的補充劑都要精準：失智症針對 MCI 或高同半胱胺酸者，AMD 只對中晚期用 AREDS2，骨質疏鬆控制鈣與維生素 D，退化性關節炎目前沒有可預防的藥物。"],"quiz":[{"q":"AREDS2 配方適用於誰？為何移除 β-胡蘿蔔素？","a":"適用於單眼或雙眼中期 AMD，或單眼已進展為晚期者。因 β-胡蘿蔔素可能增加吸菸者罹患肺癌的風險，改用葉黃素與玉米黃素。"},{"q":"骨質疏鬆預防中，鈣與維生素 D 的每日建議量是多少？","a":"鈣每日總量 1,000 至 1,200 mg，超過 1,200 至 1,500 mg 無額外益處。維生素 D 每日 600 至 1,000 IU，血清 25(OH)D 維持 30 至 50 ng/mL。"}]}},"27":{"posts":[{"tag":"核心觀念","h":"維生素 A：動物性來源會過量，植物性來源幾乎不會","b":"<ul><li><b>動物性</b>（蛋黃、乳製品、魚肝油、肝臟）：是既成維生素 A（preformed vitamin A），吸收不受體內濃度的負回饋調控，吃多了可能過量。</li><li><b>植物性</b>（胡蘿蔔、菠菜、蕃薯）：是類胡蘿蔔素，屬前體維生素 A（provitamin A），轉換受負回饋調控，沒有過量問題。</li></ul><p>哺乳動物中只有 β-胡蘿蔔素能轉成維生素 A。肝臟儲存了人體約 50–80% 的視網醇。</p>","p":"p422–423"},{"tag":"檢測","h":"抽血驗視網醇，只有極低值才有意義","b":"<div class=\"stat\"><div><strong>&lt;0.70</strong><span>µmol/L 血漿視網醇，WHO 2009 定為缺乏</span></div><div><strong>≥1.05</strong><span>µmol/L 為充足</span></div></div><p>肝臟會釋出儲存的維生素 A 來穩定血中濃度，所以中間範圍和實際儲量相關性差。蛋白質或鋅缺乏、急性感染時，結合蛋白下降，驗出來也不準。</p><p>過量要看視網酯：血漿視網酯超過 0.2 µmol/L，或佔總維生素 A 超過 10%，可作參考。</p>","p":"p423"},{"tag":"臨床做法","h":"維生素 A 缺乏：夜盲、乾眼，還拖累兒童存活率","b":"<p>缺乏最常因攝取不足，兒童、孕婦、哺乳婦女最容易受影響。感染（例如腹瀉）會讓情況更糟。</p><ul><li><b>眼睛</b>：夜盲症（night blindness）、乾眼病（xerophthalmia），嚴重可致盲。</li><li><b>骨骼</b>：缺乏時生長緩慢，影響身高。</li><li><b>免疫</b>：在缺乏盛行率高的國家，補充可使 6 個月至 5 歲兒童死亡率降低約 30%。</li></ul><p>全反式視網酸（ATRA）治療急性前骨髓性白血病（APL），約 90% 病人可達完全緩解。</p>","p":"p423–424"},{"tag":"必背","h":"維生素 A 的單位換算與三種中毒","b":"<ul><li>1 µg 視網醇當量（RE）= 1 µg 視網醇 = 6 µg β-胡蘿蔔素</li><li>1 IU 視網醇 = 0.3 µg RE</li></ul><div class=\"tbl\"><table><tr><th>類型</th><th>條件</th><th>表現</th></tr><tr><td>急性</td><td>成人一次超過 660,000 IU；嬰兒短期超過 20,000 IU</td><td>噁心嘔吐、暈眩、視力模糊</td></tr><tr><td>慢性</td><td>長期超過建議量十倍以上（約 33,000 IU）</td><td>禿頭、肝毒性、高血脂、頭痛、皮膚乾</td></tr><tr><td>致畸胎</td><td>第一孕期過量視網酸（A 酸）</td><td>流產、心臟與腦部異常</td></tr></table></div><p>成人 RDA 為男 600、女 500 µg RE，UL 為 3,000 µg RE。吃太多胡蘿蔔素只會造成皮膚變黃（胡蘿蔔素血症），停吃後會恢復。</p>","p":"p425–426"},{"tag":"考點","h":"資源豐富的國家，不需要為了預防疾病補維生素 A","b":"<p>WHO 2011 指引建議，在缺乏高盛行國家（2 歲至未滿 6 歲兒童夜盲盛行率達 1%
